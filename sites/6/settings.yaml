  name: 德恩基
  short_name: 德恩基
  description: 德恩基（Dengtec）成立於2014年，我們提供用於展示道具的LED燈和控制器產品，更多信息請訪問 dengtec.com。在產品方面，我們提供小規模生產和組裝服務。在開發方面，我們可以提供結構設計、電路板設計和編程。我們喜歡開源項目，RIMU
    項目也是開源的。
