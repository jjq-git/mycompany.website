company_zh-CN:
  name: 德恩基
  short_name: 德恩基
  description: "德恩基（Dengtec）成立于2014年，我们提供用于展示道具的LED灯和控制器产品，更多信息请访问 dengtec.com。在产品方面，我们提供小规模生产和组装服务。在开发方面，我们可以提供结构设计、电路板设计和编程。\r\
    \n我们喜欢开源项目，RIMU 项目也是开源的。"
