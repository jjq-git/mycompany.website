  logo: /assets/uploads/company-logo-20260618023034-297b7767.webp
  name: Dengtec
  short_name: Dengtec
  favicon: /assets/uploads/company-favicon-20260618020002-ac594537.webp
  description: Dengtec was established in 2014. We provide LED lighting, controllers,
    electronics development, circuit board design, programming, and small-scale assembly
    services for display props and interactive products.
company_zh-CN:
  name: 德恩基
  short_name: 德恩基
  description: "德恩基（Dengtec）成立于2014年，我们提供用于展示道具的LED灯和控制器产品，更多信息请访问 dengtec.com。\r\n\
    \r\n在产品方面，我们提供小规模生产和组装服务。\r\n\r\n在开发方面，我们可以提供结构设计、电路板设计和编程。\r\n\r\n我们喜欢开源项目，RIMU\
    \ 项目也是开源的。"
company_zh-TW:
  name: 德恩基
  short_name: 德恩基
  description: 德恩基（Dengtec）成立於2014年，我們提供用於展示道具的LED燈和控制器產品，更多信息請訪問 dengtec.com。在產品方面，我們提供小規模生產和組裝服務。在開發方面，我們可以提供結構設計、電路板設計和編程。我們喜歡開源項目，RIMU 項目也是開源的。
