  detail_columns: &id001
    heading: Normal Operation
    items:
    - text: 'Power On — Input Voltage: 220V'
      image: /assets/uploads/richtext-20260618034521-2b1a4e04.webp
      alt: Inspection Jig User Manual
    - text: Place the inspection workpiece, ensuring the bottom is flat and the back
        is against the positioning block.
      image: /assets/uploads/richtext-20260618034535-ff934b86.webp
      alt: Inspection Jig User Manual
    - text: 'Press the green button to inspect. Two possible results: Pass or NG.
        The corresponding count will update.'
      image: /assets/uploads/richtext-20260618034541-2009542d.webp
      alt: Inspection Jig User Manual
  tags_auto: false
  detail_columns_groups:
  - *id001
  - heading: Reading Files from SD Card
    items:
    - text: Open the back cover of the jig; use a flathead screwdriver to pop out
        the SD card.
      image: /assets/uploads/richtext-20260618034807-f3315097.webp
      alt: Inspection Jig User Manual
    - text: Read data from the SD card, open the CSV file with Excel. Refer to the
        yellow rows in Excel for sensor position and column mapping.
      image: /assets/uploads/richtext-20260618034815-8fea4478.webp
      alt: Inspection Jig User Manual
    - text: Reinsert the SD card and verify it is working properly. Diagnostics ->
        Hardware -> SD Card
      image: /assets/uploads/richtext-20260618034820-698fec40.webp
      alt: Inspection Jig User Manual
  - heading: Function Keys
    items:
    - title: F1
      text: 'Display test counts: PASSED: xx, NOGOOD: xx, TOTAL: xx.'
      image: /assets/uploads/richtext-20260618035539-152e3c18.webp
      alt: Inspection Jig User Manual
    - title: F2
      text: 'Display current sensor value, range: 0-1000. If no workpiece is placed,
        value is 1000.'
      image: /assets/uploads/richtext-20260618035552-6a84dcc2.webp
      alt: Inspection Jig User Manual
    - title: F3
      text: 'Set range value, +/-0.15 distance, recommended value: 90'
      image: /assets/uploads/richtext-20260618035603-450959fc.webp
      alt: Inspection Jig User Manual
    - title: F4
      text: 'Minimum threshold value, range: 500-700'
      image: /assets/uploads/richtext-20260618035607-361e827f.webp
      alt: Inspection Jig User Manual
  - heading: Setting Values
    items:
    - text: '1. Enter Settings: press up/down keys until Time: Sat. 22 20 and Date:
        2023-08-09 appears.'
      image: /assets/uploads/richtext-20260618035807-376a254b.webp
      alt: Inspection Jig User Manual
    - text: 2. Press ESC to enter settings. Do not change unspecified items.
      image: /assets/uploads/richtext-20260618035817-0b6b2c07.webp
      alt: Inspection Jig User Manual
    - text: 3. Set Sensors LOGO! Settings -> Programming -> Set Parameters
      image: /assets/uploads/richtext-20260618035824-b1cce4cb.webp
      alt: Inspection Jig User Manual
    - text: '4. Setting Values: only set the On and ∆ values for SENSOR A/B/C/D/E/F.
        Do not change other values.'
      image: /assets/uploads/richtext-20260618035830-d3769b2b.webp
      alt: Inspection Jig User Manual
  - heading: Defining Standard Values
    items:
    - text: '1. Find Minimum Value: place the standard block, align to MinValue, press
        F2.'
      image: /assets/uploads/richtext-20260618051709-734284ac.webp
      alt: Inspection Jig User Manual
    - text: '2. Find Maximum Value: place the standard block, align to MaxValue, press
        F2.'
      image: /assets/uploads/richtext-20260618051651-72a6c1f1.webp
      alt: Inspection Jig User Manual
    - text: '3. Calculate ∆: ∆ = MaxValue – MinValue'
      image: /assets/uploads/richtext-20260618051726-3018f8c8.webp
      alt: Inspection Jig User Manual
    - text: '4. Setting Values: refer to the steps above to set each sensor''s On
        (MinValue) and Delta (∆).'
      image: /assets/uploads/richtext-20260618051743-8af016cd.webp
      alt: Inspection Jig User Manual
