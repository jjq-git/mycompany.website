- id: 4
  title: Lancôme Model Prop User Manual
  slug: manual-of-lancome-genifique
  date: '2026-06-18'
  description: Operating instructions for the Lancôme Genifique prop — includes daily
    operation, bottle replacement, battery replacement, and other detailed steps.
  tags:
  - Temporary Projects
  body: "<div><h3><b>Product Identification</b></h3></div><div><img src=\"/assets/uploads/richtext-20260618053518-62c56962.webp\"\
    ></div><div><p></p></div><img src=\"/assets/uploads/richtext-20260618052844-389bb019.webp\"\
    ><div><br><div><img src=\"/assets/uploads/richtext-20260618052833-40f66d6e.webp\"\
    ></div><div><img src=\"/assets/uploads/richtext-20260618052901-0ed808e7.webp\"\
    ></div><div><img src=\"/assets/uploads/richtext-20260618052910-2f0e1cf7.webp\"\
    ></div><div><img src=\"/assets/uploads/richtext-20260618052918-05b21678.webp\"\
    ></div><div><p>\r\n<br></p><h3><b>Daily Operation</b></h3><p></p><table data-rte-border=\"\
    1\" data-rte-widths=\"1\"><colgroup><col style=\"width:50%\"><col style=\"width:50%\"\
    ></colgroup><tbody><tr><td style=\"width:50%;\"><p></p><h4><b>Normal Use\r\n</b></h4>In\
    \ non-triggered state, the side panel whiteLightingcycling: fade-in → fade-out\
    \ → fade-in continuously.\r\n<br>\r\n<br>Place your hand under the sensor near\
    \ the stone countertop. Wait 1 second for a lotion drop.\r\n<br>\r\n<br>During\
    \ dispensing, the side panel light stays solid white. After dropping, it returns\
    \ to breathing gradient.\r\n<br>\r\n<br>After one drop, wait 5 seconds before\
    \ triggering again.<p></p></td><td style=\"width:50%;\"><p><video width=\"100%\"\
    \ controls=\"\" muted=\"\">\r\n<br>  <source src=\"https://cdn.dengtec.com/homePage/lancome/drop_liquid.mp4\"\
    \ type=\"video/mp4\">\r\n<br></video></p></td></tr></tbody></table><div><h3><b>Replacing\
    \ the Genifique Bottle</b></h3></div></div></div><div><table data-rte-border=\"\
    1\" data-rte-widths=\"1\"><colgroup><col style=\"width:50%\"><col style=\"width:50%\"\
    ></colgroup><tbody><tr><td style=\"width:50%;\"><img src=\"/assets/uploads/richtext-20260618053207-1484a9d8.webp\"\
    ></td><td style=\"width:50%;\"><p></p><h4><b>Replacing the Genifique Bottle\r\n\
    </b></h4>When the lotion bottle is empty, replace with a new bottle. Steps:\r\n\
    <br>\r\n<br>A – Remove the logo cap and bottle cap upwards.\r\n<br>\r\n<br>B –\
    \ Pull the curved tube out from the empty bottle.\r\n<br>\r\n<br>C – UnscrewWhite”Customcap”,\
    \ andscrew it onto the new Genifique bottle.\r\n<br>\r\n<br>D – Insert the curved\
    \ tube into the Genifique bottle. The glass tube should rest on the cap edge.\r\
    \n<br>\r\n<br>E – Return the Genifique bottle to its top position.\r\n<br>\r\n\
    <br>F – Put the bottle cap back on.\r\n<br>\r\n<br>G – Place the logo cap on top.\
    \ Note the logo angle. 3 sets of magnets allow fine angle adjustment.\r\n<br>\r\
    \n<br>H – Press the manual switch to completely expel air from the tube.\r\n<br>\r\
    \n<br>I – Clean the dropper opening.\r\n<br>\r\n<br><font color=\"#ff5252\">If\
    \ the unit will be unused for an extended period, fill an empty bottle with water\
    \ and repeat the steps above to flush all lotion from the tubing. Otherwise, dried\
    \ lotion will clog the tube and render the machine inoperable.</font><p></p></td></tr></tbody></table><h3><b>Replacing\
    \ the Battery&nbsp;</b></h3></div><div><table data-rte-border=\"1\" data-rte-widths=\"\
    1\"><colgroup><col style=\"width:50%\"><col style=\"width:50%\"></colgroup><tbody><tr><td\
    \ style=\"width:50%;\"><p></p><h4><b>Replacing the Battery\r\n</b></h4>After a\
    \ full charge, lasts about 2 days. Actual duration depends on usage frequency.\
    \ If side panel light is off with no sensor response, battery is depleted. Each\
    \ unit has 3 batteries. Remove battery and, charge it promptly.  Battery replacement\
    \ steps:\r\n<br>\r\n<br>A – Press the power switch to turn off the unit. (Popped\
    \ out = off)\r\n<br>\r\n<br>B – Remove the logo cap and bottle cap\r\n<br>\r\n\
    <br>C – Unplug the connector from the device, remove the battery, and replace\
    \ with a fully charged one.\r\n<br>\r\n<br>D – Place the charging port plug in\
    \ the recess.\r\n<br>\r\n<br>E – Place the logo cap on top. Note the logo angle.\
    \ 3 sets of magnets allow fine adjustment.\r\n<br>\r\n<br>F – Press the power\
    \ switch.\r\n<br>\r\n<br>G – Charge the depleted battery for backup.\r\n<br>\r\
    \n<br><font color=\"#fe4d4d\">The battery voltage is 12V. Only use a 12.6V charger.<br><strike>Do\
    \ NOT use chargers with other voltages.</strike></font><p></p></td><td style=\"\
    width:50%;\"><img src=\"/assets/uploads/richtext-20260618053353-669c96ed.webp\"\
    ></td></tr></tbody></table><h3><b>Other Issues&nbsp;</b></h3></div><div><p><font\
    \ color=\"#55b479\">For other issues, contact Dengtec Project Manager Mr. Wang:\
    \ 139 1377 5186</font></p></div><div><br></div><div><br></div>"
  cover: /assets/uploads/blog-cover-20260618053521-b348493b.webp
  style_bg-color: ''
