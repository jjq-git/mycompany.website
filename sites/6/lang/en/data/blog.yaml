- id: 1
  title: Inspection Jig User Manual
  slug: manual-jig
  date: '2026-06-18'
  description: Detailed user manual for the inspection jig, covering normal operation, data reading, function key settings, and sensor calibration.
  tags:
  - Design Related
  body: ''
  cover: /assets/uploads/blog-cover-20260618033335-2ed06668.webp
  style_bg-color: ''
  detail_content_blocks:
  - type: video
    video: https://cdn.dengtec.com/videos/Jig_Manual.mp4
    text: ''
  - type: heading
    title: Normal Operation
  - type: table
    table:
    - - 'Power On — Input Voltage: 220V'
      - Place the inspection workpiece — ensure the bottom is flat and the back is against the positioning block.
      - 'Press the green button to inspect. Two possible results: Pass or NG. The corresponding count will update.'
  - type: image
    image: /assets/uploads/richtext-20260618034521-2b1a4e04.webp
    alt: ''
  - type: image
    image: /assets/uploads/richtext-20260618034535-ff934b86.webp
    alt: ''
  - type: image
    image: /assets/uploads/richtext-20260618034541-2009542d.webp
    alt: ''
  - type: heading
    title: Reading Files from SD Card
  - type: table
    table:
    - - Open the back cover of the jig; use a flathead screwdriver to pop out the SD card.
      - Read data from the SD card, open the CSV file with Excel. Refer to the yellow rows in Excel for sensor position and column mapping.
      - Reinsert the SD card and verify it is working properly Diagnostics → Hardware → SD Card
  - type: image
    image: /assets/uploads/richtext-20260618034807-f3315097.webp
    alt: ''
  - type: image
    image: /assets/uploads/richtext-20260618034815-8fea4478.webp
    alt: ''
  - type: image
    image: /assets/uploads/richtext-20260618034820-698fec40.webp
    alt: ''
  - type: heading
    title: Function Keys
  - type: table
    table:
    - - 'F1 Display test counts: PASSED: xx, NOGOOD: xx, TOTAL: xx.'
      - 'F2 Display current sensor values, range: 0–1000. If no workpiece is placed, value is 1000.'
      - 'F3 Set range value, ±0.15 distance, recommended value: 90'
      - 'F4 Minimum threshold value, range: 500–700'
  - type: image
    image: /assets/uploads/richtext-20260618035539-152e3c18.webp
    alt: ''
  - type: image
    image: /assets/uploads/richtext-20260618035552-6a84dcc2.webp
    alt: ''
  - type: image
    image: /assets/uploads/richtext-20260618035603-450959fc.webp
    alt: ''
  - type: image
    image: /assets/uploads/richtext-20260618035607-361e827f.webp
    alt: ''
  - type: heading
    title: Setting Values
  - type: table
    table:
    - - '1. Enter Settings Press up/down keys until Time: Sat. 22 20 and Date: 2023-08-09 appears'
      - 2. Press ESC to enter Enter settings. Do not change unspecified items.
      - 3. Set Sensors LOGO! Settings → Programming → Set Parameters
      - 4.Setting Values Only set the On and ∆ values for SENSOR A/B/C/D/E/F. Do not change other values.
  - type: image
    image: /assets/uploads/richtext-20260618035807-376a254b.webp
    alt: ''
  - type: image
    image: /assets/uploads/richtext-20260618035817-0b6b2c07.webp
    alt: ''
  - type: image
    image: /assets/uploads/richtext-20260618035824-b1cce4cb.webp
    alt: ''
  - type: image
    image: /assets/uploads/richtext-20260618035830-d3769b2b.webp
    alt: ''
  - type: heading
    title: Defining Standard Values
  - type: table
    table:
    - - 1. Find Minimum Value Place the standard block, align to MinValue, press F2
      - 2. Find Maximum Value Place the standard block, align to MaxValue, press F2
      - 3. Calculate ∆ ∆ = MaxValue – MinValue
      - 4.Setting Values Refer to the steps above to set each sensor's On (MinValue) and Delta (∆).
  - type: image
    image: /assets/uploads/richtext-20260618051651-72a6c1f1.webp
    alt: ''
  - type: image
    image: /assets/uploads/richtext-20260618051709-734284ac.webp
    alt: ''
  - type: image
    image: /assets/uploads/richtext-20260618051726-3018f8c8.webp
    alt: ''
  - type: image
    image: /assets/uploads/richtext-20260618051743-8af016cd.webp
    alt: ''
  - type: heading
    title: Modifying Count Values
  - type: text
    text: 'Good: LOGO! Settings → Programming → Set Parameters -> PASS_WP_NUM -> Cnt (set desired value) Defective: LOGO! Settings → Programming → Set Parameters -> NG_WP_NUM -> Cnt (set desired value)'
