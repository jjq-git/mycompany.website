- id: 4
  title: Lancôme Model Prop User Manual
  slug: manual-of-lancome-genifique
  date: '2026-06-18'
  description: Operating instructions for the Lancôme Genifique prop — includes daily
    operation, bottle replacement, battery replacement, and other detailed steps.
  tags:
  - Temporary Projects
  body: ''
  cover: /assets/uploads/blog-cover-20260618053521-b348493b.webp
  style_bg-color: ''
  detail_content_blocks:
  - type: heading
    title: Product Identification
  - type: image
    image: /assets/uploads/richtext-20260618053518-62c56962.webp
    alt: ''
  - type: image
    image: /assets/uploads/richtext-20260618052844-389bb019.webp
    alt: ''
  - type: image
    image: /assets/uploads/richtext-20260618052833-40f66d6e.webp
    alt: ''
  - type: image
    image: /assets/uploads/richtext-20260618052901-0ed808e7.webp
    alt: ''
  - type: image
    image: /assets/uploads/richtext-20260618052910-2f0e1cf7.webp
    alt: ''
  - type: image
    image: /assets/uploads/richtext-20260618052918-05b21678.webp
    alt: ''
  - type: heading
    title: Daily Operation
  - type: table
    table:
    - - 'Normal Use In non-triggered state, the side panel whiteLightingcycling: fade-in
        → fade-out → fade-in continuously. Place your hand under the sensor near the
        stone countertop. Wait 1 second for a lotion drop. During dispensing, the
        side panel light stays solid white. After dropping, it returns to breathing
        gradient. After one drop, wait 5 seconds before triggering again.'
      - ''
  - type: video
    video: https://cdn.dengtec.com/homePage/lancome/drop_liquid.mp4
    text: ''
  - type: heading
    title: Replacing the Genifique Bottle
  - type: table
    table:
    - - ''
      - 'Replacing the Genifique Bottle When the lotion bottle is empty, replace with
        a new bottle. Steps: A – Remove the logo cap and bottle cap upwards. B – Pull
        the curved tube out from the empty bottle. C – UnscrewWhite”Customcap”, andscrew
        it onto the new Genifique bottle. D – Insert the curved tube into the Genifique
        bottle. The glass tube should rest on the cap edge. E – Return the Genifique
        bottle to its top position. F – Put the bottle cap back on. G – Place the
        logo cap on top. Note the logo angle. 3 sets of magnets allow fine angle adjustment.
        H – Press the manual switch to completely expel air from the tube. I – Clean
        the dropper opening. If the unit will be unused for an extended period, fill
        an empty bottle with water and repeat the steps above to flush all lotion
        from the tubing. Otherwise, dried lotion will clog the tube and render the
        machine inoperable.'
  - type: image
    image: /assets/uploads/richtext-20260618053207-1484a9d8.webp
    alt: ''
  - type: heading
    title: Replacing the Battery
  - type: table
    table:
    - - 'Replacing the Battery After a full charge, lasts about 2 days. Actual duration
        depends on usage frequency. If side panel light is off with no sensor response,
        battery is depleted. Each unit has 3 batteries. Remove battery and, charge
        it promptly. Battery replacement steps: A – Press the power switch to turn
        off the unit. (Popped out = off) B – Remove the logo cap and bottle cap C
        – Unplug the connector from the device, remove the battery, and replace with
        a fully charged one. D – Place the charging port plug in the recess. E – Place
        the logo cap on top. Note the logo angle. 3 sets of magnets allow fine adjustment.
        F – Press the power switch. G – Charge the depleted battery for backup. The
        battery voltage is 12V. Only use a 12.6V charger. Do NOT use chargers with
        other voltages.'
      - ''
  - type: image
    image: /assets/uploads/richtext-20260618053353-669c96ed.webp
    alt: ''
  - type: heading
    title: Other Issues
  - type: note
    text: 'For other issues, contact Dengtec Project Manager Mr. Wang: 139 1377 5186'
    style: info
