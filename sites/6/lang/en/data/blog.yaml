- id: 1
  title: Inspection Jig User Manual
  slug: manual-jig
  date: '2026-06-18'
  description: Detailed user manual for the inspection jig, covering normal operation,
    data reading, function key settings, and sensor calibration.
  tags:
  - Design Related
  body: "<div><p><video width=\"100%\" controls=\"\"><br>  <source src=\"https://cdn.dengtec.com/videos/Jig_Manual.mp4\"\
    \ type=\"video/mp4\"><br></video></p></div><div><h3><b>Normal Operation<br><br></b></h3></div><div><table\
    \ data-rte-border=\"1\" data-rte-widths=\"1\" style=\"width: 100%; table-layout:\
    \ fixed; border-collapse: collapse;\"><colgroup><col style=\"width:33%\"><col\
    \ style=\"width:33%\"><col style=\"width:33%\"></colgroup><tbody><tr><td style=\"\
    width: 33%;\"><p>Power On — Input Voltage: 220V</p></td><td style=\"width: 33%;\"\
    ><p>Place the inspection workpiece — ensure the bottom is flat and the back is\
    \ against the positioning block.</p></td><td style=\"width: 33%;\"><p>Press the\
    \ green button to inspect. Two possible results: Pass or NG. The corresponding\
    \ count will update.</p></td></tr><tr><td style=\"width: 33%;\"><img src=\"/assets/uploads/richtext-20260618034521-2b1a4e04.webp\"\
    ></td><td style=\"width: 33%;\"><img src=\"/assets/uploads/richtext-20260618034535-ff934b86.webp\"\
    ></td><td style=\"width: 33%;\"><img src=\"/assets/uploads/richtext-20260618034541-2009542d.webp\"\
    ></td></tr></tbody></table><h3><b>Reading Files from SD Card&nbsp;</b></h3></div><div><table\
    \ data-rte-border=\"1\" data-rte-widths=\"1\"><colgroup><col style=\"width:33%\"\
    ><col style=\"width:33%\"><col style=\"width:33%\"></colgroup><tbody><tr><td style=\"\
    width:33%;\"><p>Open the back cover of the jig; use a flathead screwdriver to\
    \ pop out the SD card.</p></td><td style=\"width:33%;\"><p>Read data from the\
    \ SD card, open the CSV file with Excel. Refer to the yellow rows in Excel for\
    \ sensor position and column mapping.</p></td><td style=\"width:33%;\"><p>Reinsert\
    \ the SD card and verify it is working properly\r\n<br>\r\n<br>Diagnostics → Hardware\
    \ → SD Card&nbsp;</p></td></tr><tr><td style=\"width:33%;\"><img src=\"/assets/uploads/richtext-20260618034807-f3315097.webp\"\
    ></td><td style=\"width:33%;\"><img src=\"/assets/uploads/richtext-20260618034815-8fea4478.webp\"\
    ></td><td style=\"width:33%;\"><img src=\"/assets/uploads/richtext-20260618034820-698fec40.webp\"\
    ></td></tr></tbody></table><h3><b>Function Keys</b></h3></div><table data-rte-border=\"\
    1\" data-rte-widths=\"1\"><colgroup><col style=\"width:25%\"><col style=\"width:25%\"\
    ><col style=\"width:25%\"><col style=\"width:25%\"></colgroup><tbody><tr><td style=\"\
    width:25%;\"><h4><b>F1</b></h4><p>Display test counts: PASSED: xx, NOGOOD: xx,\
    \ TOTAL: xx.</p></td><td style=\"width:25%;\"><h4><b>F2</b></h4><p>Display current\
    \ sensor values, range: 0–1000. If no workpiece is placed, value is 1000.</p></td><td\
    \ style=\"width:25%;\"><h4><b>F3</b></h4><p>Set range value, ±0.15 distance, recommended\
    \ value: 90</p></td><td style=\"width:25%;\"><h4><b>F4</b></h4><p>Minimum threshold\
    \ value, range: 500–700</p></td></tr><tr><td style=\"width:25%;\"><img src=\"\
    /assets/uploads/richtext-20260618035539-152e3c18.webp\"></td><td style=\"width:25%;\"\
    ><img src=\"/assets/uploads/richtext-20260618035552-6a84dcc2.webp\"></td><td style=\"\
    width:25%;\"><img src=\"/assets/uploads/richtext-20260618035603-450959fc.webp\"\
    ></td><td style=\"width:25%;\"><img src=\"/assets/uploads/richtext-20260618035607-361e827f.webp\"\
    ></td></tr></tbody></table><h3><b>Setting Values&nbsp;</b></h3><div><table data-rte-border=\"\
    1\" data-rte-widths=\"1\"><colgroup><col style=\"width:25%\"><col style=\"width:25%\"\
    ><col style=\"width:25%\"><col style=\"width:25%\"></colgroup><tbody><tr><td style=\"\
    width:25%;\"><h4><b>1. Enter Settings</b></h4><p>Press up/down keys until Time:\
    \ Sat. 22 20 and Date: 2023-08-09 appears</p></td><td style=\"width:25%;\"><h4><b>2.\
    \ Press ESC to enter</b></h4><p>Enter settings. Do not change unspecified items.</p></td><td\
    \ style=\"width:25%;\"><h4><b>3. Set Sensors</b></h4><p>LOGO! Settings → Programming\
    \ → Set Parameters</p></td><td style=\"width:25%;\"><h4><b>4.Setting Values</b></h4><p>Only\
    \ set the On and ∆ values for SENSOR A/B/C/D/E/F. Do not change other values.</p></td></tr><tr><td\
    \ style=\"width:25%;\"><img src=\"/assets/uploads/richtext-20260618035807-376a254b.webp\"\
    ></td><td style=\"width:25%;\"><img src=\"/assets/uploads/richtext-20260618035817-0b6b2c07.webp\"\
    ></td><td style=\"width:25%;\"><img src=\"/assets/uploads/richtext-20260618035824-b1cce4cb.webp\"\
    ></td><td style=\"width:25%;\"><img src=\"/assets/uploads/richtext-20260618035830-d3769b2b.webp\"\
    ></td></tr></tbody></table><h3><b>Defining Standard Values</b>&nbsp;</h3></div><div><table\
    \ data-rte-border=\"1\" data-rte-widths=\"1\"><colgroup><col style=\"width:25%\"\
    ><col style=\"width:25%\"><col style=\"width:25%\"><col style=\"width:25%\"></colgroup><tbody><tr><td\
    \ style=\"width:25%;\"><p>1. Find Minimum Value</p><p>Place the standard block,\
    \ align to MinValue, press F2</p></td><td style=\"width:25%;\"><p>2. Find Maximum\
    \ Value</p><p>Place the standard block, align to MaxValue, press F2</p></td><td\
    \ style=\"width:25%;\"><p>3. Calculate ∆</p><p>∆ = MaxValue – MinValue</p></td><td\
    \ style=\"width:25%;\"><p>4.Setting Values</p><p>Refer to the steps above to set\
    \ each sensor's On (MinValue) and Delta (∆).</p></td></tr><tr><td style=\"width:25%;\"\
    ><img src=\"/assets/uploads/richtext-20260618051651-72a6c1f1.webp\"></td><td style=\"\
    width:25%;\"><img src=\"/assets/uploads/richtext-20260618051709-734284ac.webp\"\
    ></td><td style=\"width:25%;\"><img src=\"/assets/uploads/richtext-20260618051726-3018f8c8.webp\"\
    ></td><td style=\"width:25%;\"><img src=\"/assets/uploads/richtext-20260618051743-8af016cd.webp\"\
    ></td></tr></tbody></table><h3><b>Modifying Count Values&nbsp;</b></h3></div><div><p>Good:\
    \ LOGO! Settings → Programming → Set Parameters -&gt; PASS_WP_NUM -&gt; Cnt (set\
    \ desired value)<br>Defective: LOGO! Settings → Programming → Set Parameters -&gt;\
    \ NG_WP_NUM -&gt; Cnt (set desired value)</p></div><div><br></div><div><br></div><div><br></div><div><br></div><div><br></div><div><br></div><div><br></div><div><br></div><div><br></div><div><br></div>"
