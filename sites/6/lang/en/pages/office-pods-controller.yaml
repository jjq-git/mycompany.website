description: Dengtec Smart Silent Booth control system — a single 86 panel unifying
  touch, on-device voice, and Doubao AI voice, built on a host-slave dual-chip architecture.
  Its in-house "AI device control" lets you adjust cabin lighting, fans, color temperature,
  and environment while you talk.
