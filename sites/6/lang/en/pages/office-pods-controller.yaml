    tag: Smart Management Backend
    title: One Screen to Manage All Silent Booths
    desc: "<p>Manage more than just one device. The cloud backend centrally manages\
      \ every silent booth—online status, usage duration, and today's alerts are all\
      \ visible on one screen, with real-time chart updates. <br>Device models, host\
      \ nodes, firmware OTA, and MQTT message flows are centrally managed, with multi-company,\
      \ multi-role delegated collaboration, and batch deployment stays organized.<br></p><p>The\
      \ system supports IoT connectivity, allowing users to remotely control silent\
      \ booths, book meetings, and manage usage schedules, making device management\
      \ and space utilization more convenient and efficient.\r\n<br>\r\n<br>- Domestic:\
      \ DingTalk, Feishu, Tencent Meeting\r\n<br>- Overseas: Microsoft 365, Google\
      \ Workspace\r\n<br>- Future Expansion: Zoom, Webex</p>"
    primaryBtn: Management Backend
