    tag: Stable Architecture
    title: Dual-Chip Host & Slave, Each to Its Task
    desc: <p>The ESP32-S3 host focuses on the UI and AI orchestration, while the CH32V003
      slave drives the actuators — lighting, fans, radar, and more. <br> <br>The two
      chips cooperate over a custom I2C register protocol, offloading timing-sensitive
      execution to the slave for steadier operation.</p>
