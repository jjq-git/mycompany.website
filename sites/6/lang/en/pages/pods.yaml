    tag: Stable Architecture
    title: Dual-Chip Master-Slave, Each with Its Own Role
    desc: <p>The ESP32-S3 master focuses on interface and AI orchestration, while
      the CH32V003 slave handles actuator drivers for lighting, fans, and radar. <br>The
      two chips collaborate via a custom I2C register protocol, offloading time-sensitive
      execution to the slave for independent completion, ensuring more stable operation.</p>
