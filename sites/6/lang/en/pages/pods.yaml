    tag: Core Technology
    title: '"AI Device Control" - Control While Chatting'
    desc: <p>During natural language conversations with AI large models, device control
      markers like @{command} are extracted in real-time from the streaming reply
      and executed on the spot. <br>Say "turn the light warmer" and the lighting,
      fan, and color temperature adjust simultaneously - this is Degenji's self-developed
      core capability.</p>
