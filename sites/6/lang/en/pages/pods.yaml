    tag: Smart Management Console
    title: One Screen in Hand, All Silent Pods Under Control
    desc: <p>Manage more than just one device. The cloud console unifies management
      of every silent pod - online status, usage duration, and today's alerts at a
      glance, with real-time chart updates. <br>Device models, host nodes, firmware
      OTA, and MQTT message flows are centrally managed, with multi-company, multi-role
      collaborative permissions, and batch deployment stays organized.</p>
