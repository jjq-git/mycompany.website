- id: 1
  title: 檢测治具使用說明
  slug: manual-jig
  date: '2026-06-18'
  description: 檢测治具的詳細使用說明，包含正常操作、数据讀取、功能鍵設置和傳感器校準等
  tags:
  - 設計相關
  body: "<div><p><video width=\"100%\" controls=\"\"><br>  <source src=\"https://cdn.dengtec.com/videos/Jig_Manual.mp4\"\
    \ type=\"video/mp4\"><br></video></p></div><div><h3><b>正常操作<br><br></b></h3></div><div><table\
    \ data-rte-border=\"1\" data-rte-widths=\"1\" style=\"width: 100%; table-layout:\
    \ fixed; border-collapse: collapse;\"><colgroup><col style=\"width:33%\"><col\
    \ style=\"width:33%\"><col style=\"width:33%\"></colgroup><tbody><tr><td style=\"\
    width: 33%;\"><p>開机-上電, 輸入電壓:220V</p></td><td style=\"width: 33%;\"><p>放置檢测工件,\
    \ 需要確保底部放平, 背後靠到定位塊.</p></td><td style=\"width: 33%;\"><p>按下綠色按鈕, 進行檢测, 隻有2個結果,\
    \ Pass 或 NG. 對应的計数值也會更新.</p></td></tr><tr><td style=\"width: 33%;\"><img src=\"\
    /assets/uploads/richtext-20260618034521-2b1a4e04.webp\"></td><td style=\"width:\
    \ 33%;\"><img src=\"/assets/uploads/richtext-20260618034535-ff934b86.webp\"></td><td\
    \ style=\"width: 33%;\"><img src=\"/assets/uploads/richtext-20260618034541-2009542d.webp\"\
    ></td></tr></tbody></table><h3><b>讀取SD卡中文件&nbsp;</b></h3></div><div><table data-rte-border=\"\
    1\" data-rte-widths=\"1\"><colgroup><col style=\"width:33%\"><col style=\"width:33%\"\
    ><col style=\"width:33%\"></colgroup><tbody><tr><td style=\"width:33%;\"><p>拆開檢具後蓋,\
    \ 用一字螺絲刀敲出SD卡.</p></td><td style=\"width:33%;\"><p>從SD中讀取数据, 用 EXCEL 打開 csv 文件.\
    \ 傳感器的位置与列的對应關於請參考Excel中黃色行.</p></td><td style=\"width:33%;\"><p>放回SD卡, 檢查SD卡是否正常工作\r\
    \n<br>\r\n<br>診斷 -&gt; 硬件 -&gt; SD卡&nbsp;</p></td></tr><tr><td style=\"width:33%;\"\
    ><img src=\"/assets/uploads/richtext-20260618034807-f3315097.webp\"></td><td style=\"\
    width:33%;\"><img src=\"/assets/uploads/richtext-20260618034815-8fea4478.webp\"\
    ></td><td style=\"width:33%;\"><img src=\"/assets/uploads/richtext-20260618034820-698fec40.webp\"\
    ></td></tr></tbody></table><h3><b>功能鍵</b></h3></div><table data-rte-border=\"\
    1\" data-rte-widths=\"1\"><colgroup><col style=\"width:25%\"><col style=\"width:25%\"\
    ><col style=\"width:25%\"><col style=\"width:25%\"></colgroup><tbody><tr><td style=\"\
    width:25%;\"><h4><b>F1</b></h4><p>顯示测試的数量, PASSED(合格品):xx, NOGOOD(不良品):xx, TOTAL:xx.</p></td><td\
    \ style=\"width:25%;\"><h4><b>F2</b></h4><p>顯示當前傳感器的值, 范圍:0-1000, 若沒有放置工件, 数組為1000.</p></td><td\
    \ style=\"width:25%;\"><h4><b>F3</b></h4><p>設置的范圍值, +/-0.15 的距离, 建議值為90</p></td><td\
    \ style=\"width:25%;\"><h4><b>F4</b></h4><p>阈值最小值, 范圍在500-700</p></td></tr><tr><td\
    \ style=\"width:25%;\"><img src=\"/assets/uploads/richtext-20260618035539-152e3c18.webp\"\
    ></td><td style=\"width:25%;\"><img src=\"/assets/uploads/richtext-20260618035552-6a84dcc2.webp\"\
    ></td><td style=\"width:25%;\"><img src=\"/assets/uploads/richtext-20260618035603-450959fc.webp\"\
    ></td><td style=\"width:25%;\"><img src=\"/assets/uploads/richtext-20260618035607-361e827f.webp\"\
    ></td></tr></tbody></table><h3><b>設置值&nbsp;</b></h3><div><table data-rte-border=\"\
    1\" data-rte-widths=\"1\"><colgroup><col style=\"width:25%\"><col style=\"width:25%\"\
    ><col style=\"width:25%\"><col style=\"width:25%\"></colgroup><tbody><tr><td style=\"\
    width:25%;\"><h4><b>1. 進入設置界麵</b></h4><p>按上下鍵, 直到出现 時間: Sat. 22 20 和 日期: 2023-08-09</p></td><td\
    \ style=\"width:25%;\"><h4><b>2. 按ESC進入</b></h4><p>進入設置內容, 非指定的內容, 請勿隨意設置.</p></td><td\
    \ style=\"width:25%;\"><h4><b>3. 設置傳感器</b></h4><p>LOGO! 設置 -&gt; 編程 -&gt; 設置參数</p></td><td\
    \ style=\"width:25%;\"><h4><b>4.設置值</b></h4><p>隻需要設置 SENSOR – A/B/C/D/E/F 的On,\
    \  ∆, 不要設置其他的值.</p></td></tr><tr><td style=\"width:25%;\"><img src=\"/assets/uploads/richtext-20260618035807-376a254b.webp\"\
    ></td><td style=\"width:25%;\"><img src=\"/assets/uploads/richtext-20260618035817-0b6b2c07.webp\"\
    ></td><td style=\"width:25%;\"><img src=\"/assets/uploads/richtext-20260618035824-b1cce4cb.webp\"\
    ></td><td style=\"width:25%;\"><img src=\"/assets/uploads/richtext-20260618035830-d3769b2b.webp\"\
    ></td></tr></tbody></table><h3><b>定義標準值</b>&nbsp;</h3></div><div><table data-rte-border=\"\
    1\" data-rte-widths=\"1\"><colgroup><col style=\"width:25%\"><col style=\"width:25%\"\
    ><col style=\"width:25%\"><col style=\"width:25%\"></colgroup><tbody><tr><td style=\"\
    width:25%;\"><p>1. 查找最小值</p><p>放置好標準塊, 對其MinValue, 按下F2</p></td><td style=\"width:25%;\"\
    ><p>2. 查找最大值</p><p>放置好標準塊, 對其MaxValue, 按下F2</p></td><td style=\"width:25%;\"><p>3.\
    \ 計算 ∆</p><p>∆ = MaxValue – MinValue</p></td><td style=\"width:25%;\"><p>4.設置值</p><p>參考上麵的步驟,\
    \ 設置各個Sensor 的On(MinValue), Delta(∆).</p></td></tr><tr><td style=\"width:25%;\"\
    ><img src=\"/assets/uploads/richtext-20260618051651-72a6c1f1.webp\"></td><td style=\"\
    width:25%;\"><img src=\"/assets/uploads/richtext-20260618051709-734284ac.webp\"\
    ></td><td style=\"width:25%;\"><img src=\"/assets/uploads/richtext-20260618051726-3018f8c8.webp\"\
    ></td><td style=\"width:25%;\"><img src=\"/assets/uploads/richtext-20260618051743-8af016cd.webp\"\
    ></td></tr></tbody></table><h3><b>修改計数值&nbsp;</b></h3></div><div><p>良品: LOGO!\
    \ 設置 -&gt; 編程 -&gt; 設置參数 -&gt; PASS_WP_NUM -&gt; Cnt (設置需要的值)<br>不良品: LOGO! 設置\
    \ -&gt; 編程 -&gt; 設置參数 -&gt; NG_WP_NUM -&gt; Cnt (設置需要的值)</p></div><div><br></div><div><br></div><div><br></div><div><br></div><div><br></div><div><br></div><div><br></div><div><br></div><div><br></div><div><br></div>"
