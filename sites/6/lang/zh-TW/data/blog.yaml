- id: 4
  title: 蘭蔻模型道具的使用說明
  slug: manual-of-lancome-genifique
  date: '2026-06-18'
  description: 蘭蔻小黑瓶道具的操作說明，包含日常操作、更换瓶子、更换電池等詳細步驟
  tags:
  - 臨時項目
  body: "<div><h3><b>產品標識</b></h3></div><div><img src=\"/assets/uploads/richtext-20260618053518-62c56962.webp\"\
    ></div><div><p></p></div><img src=\"/assets/uploads/richtext-20260618052844-389bb019.webp\"\
    ><div><br><div><img src=\"/assets/uploads/richtext-20260618052833-40f66d6e.webp\"\
    ></div><div><img src=\"/assets/uploads/richtext-20260618052901-0ed808e7.webp\"\
    ></div><div><img src=\"/assets/uploads/richtext-20260618052910-2f0e1cf7.webp\"\
    ></div><div><img src=\"/assets/uploads/richtext-20260618052918-05b21678.webp\"\
    ></div><div><p>\r\n<br></p><h3><b>日常操作</b></h3><p></p><table data-rte-border=\"\
    1\" data-rte-widths=\"1\"><colgroup><col style=\"width:50%\"><col style=\"width:50%\"\
    ></colgroup><tbody><tr><td style=\"width:50%;\"><p></p><h4><b>正常使用\r\n</b></h4>非觸發状態,\
    \ 側板的白色燈光有呈 渐亮-&gt;渐暗-&gt;渐亮 不斷循环.\r\n<br>\r\n<br>手放在傳感器下方, 貼近人造石臺麵的位置, 等待1秒钟,\
    \ 就會有乳液滴到手背上.\r\n<br>\r\n<br>滴液體的過程中, 側板的燈光為 白色常亮. 乳液滴出後, 燈光回復呼吸渐變的效果\r\n<br>\r\
    \n<br>滴完一滴後, 需要間隔5秒钟, 才可以再次觸發.<p></p></td><td style=\"width:50%;\"><p><video width=\"\
    100%\" controls=\"\" muted=\"\">\r\n<br>  <source src=\"https://cdn.dengtec.com/homePage/lancome/drop_liquid.mp4\"\
    \ type=\"video/mp4\">\r\n<br></video></p></td></tr></tbody></table><div><h3><b>更换小黑瓶</b></h3></div></div></div><div><table\
    \ data-rte-border=\"1\" data-rte-widths=\"1\"><colgroup><col style=\"width:50%\"\
    ><col style=\"width:50%\"></colgroup><tbody><tr><td style=\"width:50%;\"><img\
    \ src=\"/assets/uploads/richtext-20260618053207-1484a9d8.webp\"></td><td style=\"\
    width:50%;\"><p></p><h4><b>更换小黑瓶\r\n</b></h4>瓶子中的乳液用完後, 需要更换新的瓶子. 具體步驟如下:\r\n\
    <br>\r\n<br>A – Logo 蓋和瓶帽向上取下來.\r\n<br>\r\n<br>B – 將彎管從空瓶內抽出來.\r\n<br>\r\n<br>C\
    \ – 擰下白色”定製瓶蓋”, 並將其擰到新的小黑瓶上.\r\n<br>\r\n<br>D – 將彎管插到小黑瓶內. 需要讓玻璃管插到瓶蓋的边緣上.\r\n\
    <br>\r\n<br>E – 將小黑瓶返回頂部的位置.\r\n<br>\r\n<br>F – 將瓶帽套回去.\r\n<br>\r\n<br>G – 將LOGO蓋放在頂部.\
    \ 請注意 LOGO 的角度. 有3組磁铁, 可以微調角度.\r\n<br>\r\n<br>H – 按壓手動開關, 將管中的空氣完全排除.\r\n<br>\r\
    \n<br>I – 清潔滴管口处.\r\n<br>\r\n<br><font color=\"#ff5252\">若遇到需要長時間關机的情形, 請用空瓶並將其裝满水,\
    \ 重復上麵的步驟, 將軟管內的乳液全部排除. 否則長時間不用, 管內的乳液會凝固. 導致机器無法工作.</font><p></p></td></tr></tbody></table><h3><b>更换電池&nbsp;</b></h3></div><div><table\
    \ data-rte-border=\"1\" data-rte-widths=\"1\"><colgroup><col style=\"width:50%\"\
    ><col style=\"width:50%\"></colgroup><tbody><tr><td style=\"width:50%;\"><p></p><h4><b>更换電池\r\
    \n</b></h4>電池充满電後, 可以正常使用2天左右. 視使用的頻率, 具體的使用時長不定, 若是側板看不見燈光, 感應無反应的情況下, 就錶明電池的電量用完了.\
    \ 每套道具都配备了3塊電池. 請電池取下後, 請用充電器及時給電池充電.  更换電池的步驟如下:\r\n<br>\r\n<br>A – 按一下電源開關,\
    \ 關閉道具的電源. (彈出為關閉)\r\n<br>\r\n<br>B – 取下 LOGO 蓋 及 瓶帽\r\n<br>\r\n<br>C – 拔出插在設备的插頭,\
    \ 取下電池. 换回充满電的電池.\r\n<br>\r\n<br>D – 將充電口的插頭放在凹槽內.\r\n<br>\r\n<br>E – 將LOGO蓋放在頂部.\
    \ 請注意 LOGO 的角度. 有3組磁铁, 可以微調角度.\r\n<br>\r\n<br>F – 按下電源開關.\r\n<br>\r\n<br>G – 無電量電池充電备用.\r\
    \n<br>\r\n<br><font color=\"#fe4d4d\">電池的電壓為12V. 隻能用12.6V的充電器為其充電.<br><strike>禁止使用其他電壓的充電器為其充電.</strike></font><p></p></td><td\
    \ style=\"width:50%;\"><img src=\"/assets/uploads/richtext-20260618053353-669c96ed.webp\"\
    ></td></tr></tbody></table><h3><b>其他問題&nbsp;</b></h3></div><div><p><font color=\"\
    #55b479\">如果您遇到其他問題, 請聯系德恩基的項目王經理: 139 1377 5186</font></p></div><div><br></div><div><br></div>"
