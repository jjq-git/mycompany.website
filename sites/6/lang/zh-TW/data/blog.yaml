  body: ''
  cover: /assets/uploads/blog-cover-20260618033335-2ed06668.webp
  style_bg-color: ''
  seo_title: 檢测治具使用說明
  seo_description: 德恩基檢测治具使用說明，涵蓋正常操作、数据讀取、功能鍵設置与傳感器校準，幫助用戶快速掌握Pass/NG判定、SD卡数据導出及標準值設定流程。
  cover_alt: 檢测治具使用說明
  detail_content_blocks:
  - type: video
    slot_id: content-mrvjpq8r-bql41p
    video: /assets/uploads/Jig_Manual.mp4
    alt: 檢测治具使用說明
  - type: note
    slot_id: content-mru7k64s-jp0n8c
    title: 修改計数值
    text: "<p>良品:<b> LOGO! 設置 -&gt; 編程 -&gt; 設置參数 -&gt; PASS_WP_NUM -&gt; Cnt</b>\
      \ (設置需要的值)\r\n<br>不良品: <b>LOGO! 設置 -&gt; 編程 -&gt; 設置參数 -&gt; NG_WP_NUM -&gt;\
      \ Cnt </b>(設置需要的值)</p>"
    style: info
    alt: 檢测治具使用說明
  template_id: default
  category: ''
  summary: 檢测治具的詳細使用說明，包含正常操作、数据讀取、功能鍵設置和傳感器校準等
  media_type: image
