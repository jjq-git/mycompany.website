- id: 4
  title: 蘭蔻模型道具的使用說明
  slug: manual-of-lancome-genifique
  date: '2026-06-18'
  description: 蘭蔻小黑瓶道具的操作說明，包含日常操作、更换瓶子、更换電池等詳細步驟
  tags:
  - 臨時項目
  body: ''
  cover: /assets/uploads/blog-cover-20260618053521-b348493b.webp
  style_bg-color: ''
  detail_content_blocks:
  - type: heading
    title: 產品標識
  - type: image
    image: /assets/uploads/richtext-20260618053518-62c56962.webp
    alt: ''
  - type: image
    image: /assets/uploads/richtext-20260618052844-389bb019.webp
    alt: ''
  - type: image
    image: /assets/uploads/richtext-20260618052833-40f66d6e.webp
    alt: ''
  - type: image
    image: /assets/uploads/richtext-20260618052901-0ed808e7.webp
    alt: ''
  - type: image
    image: /assets/uploads/richtext-20260618052910-2f0e1cf7.webp
    alt: ''
  - type: image
    image: /assets/uploads/richtext-20260618052918-05b21678.webp
    alt: ''
  - type: heading
    title: 日常操作
  - type: table
    table:
    - - 正常使用 非觸發状態, 側板的白色燈光有呈 渐亮->渐暗->渐亮 不斷循环. 手放在傳感器下方, 貼近人造石臺麵的位置, 等待1秒钟, 就會有乳液滴到手背上.
        滴液體的過程中, 側板的燈光為 白色常亮. 乳液滴出後, 燈光回復呼吸渐變的效果 滴完一滴後, 需要間隔5秒钟, 才可以再次觸發.
      - ''
  - type: video
    video: /assets/uploads/drop_liquid.mp4
    text: ''
  - type: heading
    title: 更换小黑瓶
  - type: table
    table:
    - - ''
      - '更换小黑瓶 瓶子中的乳液用完後, 需要更换新的瓶子. 具體步驟如下: A – Logo 蓋和瓶帽向上取下來. B – 將彎管從空瓶內抽出來. C
        – 擰下白色”定製瓶蓋”, 並將其擰到新的小黑瓶上. D – 將彎管插到小黑瓶內. 需要讓玻璃管插到瓶蓋的边緣上. E – 將小黑瓶返回頂部的位置.
        F – 將瓶帽套回去. G – 將LOGO蓋放在頂部. 請注意 LOGO 的角度. 有3組磁铁, 可以微調角度. H – 按壓手動開關, 將管中的空氣完全排除.
        I – 清潔滴管口处. 若遇到需要長時間關机的情形, 請用空瓶並將其裝满水, 重復上麵的步驟, 將軟管內的乳液全部排除. 否則長時間不用, 管內的乳液會凝固.
        導致机器無法工作.'
  - type: image
    image: /assets/uploads/richtext-20260618053207-1484a9d8.webp
    alt: ''
  - type: heading
    title: 更换電池
  - type: table
    table:
    - - '更换電池 電池充满電後, 可以正常使用2天左右. 視使用的頻率, 具體的使用時長不定, 若是側板看不見燈光, 感應無反应的情況下, 就錶明電池的電量用完了.
        每套道具都配备了3塊電池. 請電池取下後, 請用充電器及時給電池充電. 更换電池的步驟如下: A – 按一下電源開關, 關閉道具的電源. (彈出為關閉)
        B – 取下 LOGO 蓋 及 瓶帽 C – 拔出插在設备的插頭, 取下電池. 换回充满電的電池. D – 將充電口的插頭放在凹槽內. E – 將LOGO蓋放在頂部.
        請注意 LOGO 的角度. 有3組磁铁, 可以微調角度. F – 按下電源開關. G – 無電量電池充電备用. 電池的電壓為12V. 隻能用12.6V的充電器為其充電.
        禁止使用其他電壓的充電器為其充電.'
      - ''
  - type: image
    image: /assets/uploads/richtext-20260618053353-669c96ed.webp
    alt: ''
  - type: heading
    title: 其他問題
  - type: note
    text: '如果您遇到其他問題, 請聯系德恩基的項目王經理: 139 1377 5186'
    style: info
