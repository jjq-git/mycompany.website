- id: 4
  title: 兰蔻模型道具的使用说明
  slug: manual-of-lancome-genifique
  date: '2026-06-18'
  description: 兰蔻小黑瓶道具的操作说明，包含日常操作、更换瓶子、更换电池等详细步骤
  tags:
  - 临时项目
  body: "<div><h3><b>产品标识</b></h3></div><div><img src=\"/assets/uploads/richtext-20260618053518-62c56962.webp\"\
    ></div><div><p></p></div><img src=\"/assets/uploads/richtext-20260618052844-389bb019.webp\"\
    ><div><br><div><img src=\"/assets/uploads/richtext-20260618052833-40f66d6e.webp\"\
    ></div><div><img src=\"/assets/uploads/richtext-20260618052901-0ed808e7.webp\"\
    ></div><div><img src=\"/assets/uploads/richtext-20260618052910-2f0e1cf7.webp\"\
    ></div><div><img src=\"/assets/uploads/richtext-20260618052918-05b21678.webp\"\
    ></div><div><p>\r\n<br></p><h3><b>日常操作</b></h3><p></p><table data-rte-border=\"\
    1\" data-rte-widths=\"1\"><colgroup><col style=\"width:50%\"><col style=\"width:50%\"\
    ></colgroup><tbody><tr><td style=\"width:50%;\"><p></p><h4><b>正常使用\r\n</b></h4>非触发状态,\
    \ 侧板的白色灯光有呈 渐亮-&gt;渐暗-&gt;渐亮 不断循环.\r\n<br>\r\n<br>手放在传感器下方, 贴近人造石台面的位置, 等待1秒钟,\
    \ 就会有乳液滴到手背上.\r\n<br>\r\n<br>滴液体的过程中, 侧板的灯光为 白色常亮. 乳液滴出后, 灯光回复呼吸渐变的效果\r\n<br>\r\
    \n<br>滴完一滴后, 需要间隔5秒钟, 才可以再次触发.<p></p></td><td style=\"width:50%;\"><p><video width=\"\
    100%\" controls=\"\" muted=\"\">\r\n<br>  <source src=\"https://cdn.dengtec.com/homePage/lancome/drop_liquid.mp4\"\
    \ type=\"video/mp4\">\r\n<br></video></p></td></tr></tbody></table><div><h3><b>更换小黑瓶</b></h3></div></div></div><div><table\
    \ data-rte-border=\"1\" data-rte-widths=\"1\"><colgroup><col style=\"width:50%\"\
    ><col style=\"width:50%\"></colgroup><tbody><tr><td style=\"width:50%;\"><img\
    \ src=\"/assets/uploads/richtext-20260618053207-1484a9d8.webp\"></td><td style=\"\
    width:50%;\"><p></p><h4><b>更换小黑瓶\r\n</b></h4>瓶子中的乳液用完后, 需要更换新的瓶子. 具体步骤如下:\r\n\
    <br>\r\n<br>A – Logo 盖和瓶帽向上取下来.\r\n<br>\r\n<br>B – 将弯管从空瓶内抽出来.\r\n<br>\r\n<br>C\
    \ – 拧下白色”定制瓶盖”, 并将其拧到新的小黑瓶上.\r\n<br>\r\n<br>D – 将弯管插到小黑瓶内. 需要让玻璃管插到瓶盖的边缘上.\r\n\
    <br>\r\n<br>E – 将小黑瓶返回顶部的位置.\r\n<br>\r\n<br>F – 将瓶帽套回去.\r\n<br>\r\n<br>G – 将LOGO盖放在顶部.\
    \ 请注意 LOGO 的角度. 有3组磁铁, 可以微调角度.\r\n<br>\r\n<br>H – 按压手动开关, 将管中的空气完全排除.\r\n<br>\r\
    \n<br>I – 清洁滴管口处.\r\n<br>\r\n<br><font color=\"#ff5252\">若遇到需要长时间关机的情形, 请用空瓶并将其装满水,\
    \ 重复上面的步骤, 将软管内的乳液全部排除. 否则长时间不用, 管内的乳液会凝固. 导致机器无法工作.</font><p></p></td></tr></tbody></table><h3><b>更换电池&nbsp;</b></h3></div><div><table\
    \ data-rte-border=\"1\" data-rte-widths=\"1\"><colgroup><col style=\"width:50%\"\
    ><col style=\"width:50%\"></colgroup><tbody><tr><td style=\"width:50%;\"><p></p><h4><b>更换电池\r\
    \n</b></h4>电池充满电后, 可以正常使用2天左右. 视使用的频率, 具体的使用时长不定, 若是侧板看不见灯光, 感应无反应的情况下, 就表明电池的电量用完了.\
    \ 每套道具都配备了3块电池. 请电池取下后, 请用充电器及时给电池充电.  更换电池的步骤如下:\r\n<br>\r\n<br>A – 按一下电源开关,\
    \ 关闭道具的电源. (弹出为关闭)\r\n<br>\r\n<br>B – 取下 LOGO 盖 及 瓶帽\r\n<br>\r\n<br>C – 拔出插在设备的插头,\
    \ 取下电池. 换回充满电的电池.\r\n<br>\r\n<br>D – 将充电口的插头放在凹槽内.\r\n<br>\r\n<br>E – 将LOGO盖放在顶部.\
    \ 请注意 LOGO 的角度. 有3组磁铁, 可以微调角度.\r\n<br>\r\n<br>F – 按下电源开关.\r\n<br>\r\n<br>G – 无电量电池充电备用.\r\
    \n<br>\r\n<br><font color=\"#fe4d4d\">电池的电压为12V. 只能用12.6V的充电器为其充电.<br><strike>禁止使用其他电压的充电器为其充电.</strike></font><p></p></td><td\
    \ style=\"width:50%;\"><img src=\"/assets/uploads/richtext-20260618053353-669c96ed.webp\"\
    ></td></tr></tbody></table><h3><b>其他问题&nbsp;</b></h3></div><div><p><font color=\"\
    #55b479\">如果您遇到其他问题, 请联系德恩基的项目王经理: 139 1377 5186</font></p></div><div><br></div><div><br></div>"
