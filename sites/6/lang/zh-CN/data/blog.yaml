  - type: heading
    title: 设置值
    alt: 检测治具使用说明
  - type: table
    table:
    - - '1. 进入设置界面 按上下键, 直到出现 时间: Sat. 22 20 和 日期: 2023-08-09'
      - 2. 按ESC进入 进入设置内容, 非指定的内容, 请勿随意设置.
      - 3. 设置传感器 LOGO! 设置 -> 编程 -> 设置参数
      - 4.设置值 只需要设置 SENSOR – A/B/C/D/E/F 的On, ∆, 不要设置其他的值.
    table_rows: 4
    table_cols: 4
    alt: 检测治具使用说明
