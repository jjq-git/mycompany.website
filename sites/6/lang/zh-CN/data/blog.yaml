  - type: heading
    title: 定义标准值
    alt: 检测治具使用说明
  - type: table
    table:
    - - 1. 查找最小值 放置好标准块, 对其MinValue, 按下F2
      - 2. 查找最大值 放置好标准块, 对其MaxValue, 按下F2
      - 3. 计算 ∆ ∆ = MaxValue – MinValue
      - 4.设置值 参考上面的步骤, 设置各个Sensor 的On(MinValue), Delta(∆).
    table_rows: 4
