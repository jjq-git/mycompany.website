  - 设计相关
  body: ''
  cover: /assets/uploads/blog-cover-20260618033335-2ed06668.webp
  style_bg-color: ''
  seo_title: 检测治具使用说明
  seo_description: 德恩基检测治具使用说明，涵盖正常操作、数据读取、功能键设置与传感器校准，帮助用户快速掌握Pass/NG判定、SD卡数据导出及标准值设定流程。
  cover_alt: 检测治具使用说明
  detail_content_blocks:
  - type: video
    video: https://cdn.dengtec.com/videos/Jig_Manual.mp4
    alt: 检测治具使用说明
  - type: heading
    title: 正常操作
    alt: 检测治具使用说明
  - type: table
    table:
    - - 开机-上电, 输入电压:220V
      - 放置检测工件, 需要确保底部放平, 背后靠到定位块.
      - 按下绿色按钮, 进行检测, 只有2个结果, Pass 或 NG. 对应的计数值也会更新.
      - ''
    table_rows: 4
    table_cols: 4
    alt: 检测治具使用说明
  - type: image
    image: /assets/uploads/richtext-20260618034521-2b1a4e04.webp
    alt: 检测治具使用说明
  - type: image
    image: /assets/uploads/richtext-20260618034535-ff934b86.webp
    alt: 检测治具使用说明
  - type: image
    image: /assets/uploads/richtext-20260618034541-2009542d.webp
    alt: 检测治具使用说明
  - type: heading
    title: 读取SD卡中文件
    alt: 检测治具使用说明
  - type: table
    table:
    - - 拆开检具后盖, 用一字螺丝刀敲出SD卡.
      - 从SD中读取数据, 用 EXCEL 打开 csv 文件. 传感器的位置与列的对应关于请参考Excel中黄色行.
      - 放回SD卡, 检查SD卡是否正常工作 诊断 -> 硬件 -> SD卡
      - ''
    table_rows: 4
    table_cols: 4
    alt: 检测治具使用说明
