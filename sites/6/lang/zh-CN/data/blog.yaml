  body: ''
  cover: /assets/uploads/blog-cover-20260618053521-b348493b.webp
  style_bg-color: ''
  seo_title: 兰蔻模型道具的使用说明
  seo_description: 德恩基提供兰蔻模型道具的详细使用说明，涵盖日常操作、更换小黑瓶和电池的步骤，帮助用户正确维护设备并解决常见问题。
  cover_alt: 兰蔻模型道具的使用说明
  detail_content_blocks:
  - type: heading
    title: 产品标识
  - type: image
    image: /assets/uploads/richtext-20260618053518-62c56962.webp
    alt: ''
  - type: image
    image: /assets/uploads/richtext-20260618052844-389bb019.webp
    alt: ''
  - type: image
    image: /assets/uploads/richtext-20260618052833-40f66d6e.webp
    alt: ''
  - type: image
    image: /assets/uploads/richtext-20260618052901-0ed808e7.webp
    alt: ''
  - type: image
    image: /assets/uploads/richtext-20260618052910-2f0e1cf7.webp
    alt: ''
  - type: image
    image: /assets/uploads/richtext-20260618052918-05b21678.webp
    alt: ''
  - type: heading
    title: 日常操作
  - type: table
    table:
    - - 正常使用 非触发状态, 侧板的白色灯光有呈 渐亮->渐暗->渐亮 不断循环. 手放在传感器下方, 贴近人造石台面的位置, 等待1秒钟, 就会有乳液滴到手背上.
        滴液体的过程中, 侧板的灯光为 白色常亮. 乳液滴出后, 灯光回复呼吸渐变的效果 滴完一滴后, 需要间隔5秒钟, 才可以再次触发.
      - ''
  - type: video
    video: https://cdn.dengtec.com/homePage/lancome/drop_liquid.mp4
    text: ''
  - type: heading
    title: 更换小黑瓶
  - type: table
    table:
    - - ''
      - '更换小黑瓶 瓶子中的乳液用完后, 需要更换新的瓶子. 具体步骤如下: A – Logo 盖和瓶帽向上取下来. B – 将弯管从空瓶内抽出来. C
        – 拧下白色”定制瓶盖”, 并将其拧到新的小黑瓶上. D – 将弯管插到小黑瓶内. 需要让玻璃管插到瓶盖的边缘上. E – 将小黑瓶返回顶部的位置.
        F – 将瓶帽套回去. G – 将LOGO盖放在顶部. 请注意 LOGO 的角度. 有3组磁铁, 可以微调角度. H – 按压手动开关, 将管中的空气完全排除.
        I – 清洁滴管口处. 若遇到需要长时间关机的情形, 请用空瓶并将其装满水, 重复上面的步骤, 将软管内的乳液全部排除. 否则长时间不用, 管内的乳液会凝固.
        导致机器无法工作.'
  - type: image
    image: /assets/uploads/richtext-20260618053207-1484a9d8.webp
    alt: ''
  - type: heading
    title: 更换电池
  - type: table
    table:
    - - '更换电池 电池充满电后, 可以正常使用2天左右. 视使用的频率, 具体的使用时长不定, 若是侧板看不见灯光, 感应无反应的情况下, 就表明电池的电量用完了.
        每套道具都配备了3块电池. 请电池取下后, 请用充电器及时给电池充电. 更换电池的步骤如下: A – 按一下电源开关, 关闭道具的电源. (弹出为关闭)
        B – 取下 LOGO 盖 及 瓶帽 C – 拔出插在设备的插头, 取下电池. 换回充满电的电池. D – 将充电口的插头放在凹槽内. E – 将LOGO盖放在顶部.
        请注意 LOGO 的角度. 有3组磁铁, 可以微调角度. F – 按下电源开关. G – 无电量电池充电备用. 电池的电压为12V. 只能用12.6V的充电器为其充电.
        禁止使用其他电压的充电器为其充电.'
      - ''
  - type: image
    image: /assets/uploads/richtext-20260618053353-669c96ed.webp
    alt: ''
  - type: heading
    title: 其他问题
  - type: note
    text: '如果您遇到其他问题, 请联系德恩基的项目王经理: 139 1377 5186'
    style: info
