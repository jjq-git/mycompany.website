- id: 1
  title: 检测治具使用说明
  slug: manual-jig
  date: '2026-06-18'
  description: 检测治具的详细使用说明，包含正常操作、数据读取、功能键设置和传感器校准等
  tags:
  - 设计相关
  body: "<div><p><video width=\"100%\" controls=\"\"><br>  <source src=\"https://cdn.dengtec.com/videos/Jig_Manual.mp4\"\
    \ type=\"video/mp4\"><br></video></p></div><div><h3><b>正常操作<br><br></b></h3></div><div><table\
    \ data-rte-border=\"1\" data-rte-widths=\"1\" style=\"width: 100%; table-layout:\
    \ fixed; border-collapse: collapse;\"><colgroup><col style=\"width:33%\"><col\
    \ style=\"width:33%\"><col style=\"width:33%\"></colgroup><tbody><tr><td style=\"\
    width: 33%;\"><p>开机-上电, 输入电压:220V</p></td><td style=\"width: 33%;\"><p>放置检测工件,\
    \ 需要确保底部放平, 背后靠到定位块.</p></td><td style=\"width: 33%;\"><p>按下绿色按钮, 进行检测, 只有2个结果,\
    \ Pass 或 NG. 对应的计数值也会更新.</p></td></tr><tr><td style=\"width: 33%;\"><img src=\"\
    /assets/uploads/richtext-20260618034521-2b1a4e04.webp\"></td><td style=\"width:\
    \ 33%;\"><img src=\"/assets/uploads/richtext-20260618034535-ff934b86.webp\"></td><td\
    \ style=\"width: 33%;\"><img src=\"/assets/uploads/richtext-20260618034541-2009542d.webp\"\
    ></td></tr></tbody></table><h3><b>读取SD卡中文件&nbsp;</b></h3></div><div><table data-rte-border=\"\
    1\" data-rte-widths=\"1\"><colgroup><col style=\"width:33%\"><col style=\"width:33%\"\
    ><col style=\"width:33%\"></colgroup><tbody><tr><td style=\"width:33%;\"><p>拆开检具后盖,\
    \ 用一字螺丝刀敲出SD卡.</p></td><td style=\"width:33%;\"><p>从SD中读取数据, 用 EXCEL 打开 csv 文件.\
    \ 传感器的位置与列的对应关于请参考Excel中黄色行.</p></td><td style=\"width:33%;\"><p>放回SD卡, 检查SD卡是否正常工作\r\
    \n<br>\r\n<br>诊断 -&gt; 硬件 -&gt; SD卡&nbsp;</p></td></tr><tr><td style=\"width:33%;\"\
    ><img src=\"/assets/uploads/richtext-20260618034807-f3315097.webp\"></td><td style=\"\
    width:33%;\"><img src=\"/assets/uploads/richtext-20260618034815-8fea4478.webp\"\
    ></td><td style=\"width:33%;\"><img src=\"/assets/uploads/richtext-20260618034820-698fec40.webp\"\
    ></td></tr></tbody></table><h3><b>功能键</b></h3></div><table data-rte-border=\"\
    1\" data-rte-widths=\"1\"><colgroup><col style=\"width:25%\"><col style=\"width:25%\"\
    ><col style=\"width:25%\"><col style=\"width:25%\"></colgroup><tbody><tr><td style=\"\
    width:25%;\"><h4><b>F1</b></h4><p>显示测试的数量, PASSED(合格品):xx, NOGOOD(不良品):xx, TOTAL:xx.</p></td><td\
    \ style=\"width:25%;\"><h4><b>F2</b></h4><p>显示当前传感器的值, 范围:0-1000, 若没有放置工件, 数组为1000.</p></td><td\
    \ style=\"width:25%;\"><h4><b>F3</b></h4><p>设置的范围值, +/-0.15 的距离, 建议值为90</p></td><td\
    \ style=\"width:25%;\"><h4><b>F4</b></h4><p>阈值最小值, 范围在500-700</p></td></tr><tr><td\
    \ style=\"width:25%;\"><img src=\"/assets/uploads/richtext-20260618035539-152e3c18.webp\"\
    ></td><td style=\"width:25%;\"><img src=\"/assets/uploads/richtext-20260618035552-6a84dcc2.webp\"\
    ></td><td style=\"width:25%;\"><img src=\"/assets/uploads/richtext-20260618035603-450959fc.webp\"\
    ></td><td style=\"width:25%;\"><img src=\"/assets/uploads/richtext-20260618035607-361e827f.webp\"\
    ></td></tr></tbody></table><h3><b>设置值&nbsp;</b></h3><div><table data-rte-border=\"\
    1\" data-rte-widths=\"1\"><colgroup><col style=\"width:25%\"><col style=\"width:25%\"\
    ><col style=\"width:25%\"><col style=\"width:25%\"></colgroup><tbody><tr><td style=\"\
    width:25%;\"><h4><b>1. 进入设置界面</b></h4><p>按上下键, 直到出现 时间: Sat. 22 20 和 日期: 2023-08-09</p></td><td\
    \ style=\"width:25%;\"><h4><b>2. 按ESC进入</b></h4><p>进入设置内容, 非指定的内容, 请勿随意设置.</p></td><td\
    \ style=\"width:25%;\"><h4><b>3. 设置传感器</b></h4><p>LOGO! 设置 -&gt; 编程 -&gt; 设置参数</p></td><td\
    \ style=\"width:25%;\"><h4><b>4.设置值</b></h4><p>只需要设置 SENSOR – A/B/C/D/E/F 的On,\
    \  ∆, 不要设置其他的值.</p></td></tr><tr><td style=\"width:25%;\"><img src=\"/assets/uploads/richtext-20260618035807-376a254b.webp\"\
    ></td><td style=\"width:25%;\"><img src=\"/assets/uploads/richtext-20260618035817-0b6b2c07.webp\"\
    ></td><td style=\"width:25%;\"><img src=\"/assets/uploads/richtext-20260618035824-b1cce4cb.webp\"\
    ></td><td style=\"width:25%;\"><img src=\"/assets/uploads/richtext-20260618035830-d3769b2b.webp\"\
    ></td></tr></tbody></table><h3><b>定义标准值</b>&nbsp;</h3></div><div><table data-rte-border=\"\
    1\" data-rte-widths=\"1\"><colgroup><col style=\"width:25%\"><col style=\"width:25%\"\
    ><col style=\"width:25%\"><col style=\"width:25%\"></colgroup><tbody><tr><td style=\"\
    width:25%;\"><p>1. 查找最小值</p><p>放置好标准块, 对其MinValue, 按下F2</p></td><td style=\"width:25%;\"\
    ><p>2. 查找最大值</p><p>放置好标准块, 对其MaxValue, 按下F2</p></td><td style=\"width:25%;\"><p>3.\
    \ 计算 ∆</p><p>∆ = MaxValue – MinValue</p></td><td style=\"width:25%;\"><p>4.设置值</p><p>参考上面的步骤,\
    \ 设置各个Sensor 的On(MinValue), Delta(∆).</p></td></tr><tr><td style=\"width:25%;\"\
    ><img src=\"/assets/uploads/richtext-20260618051651-72a6c1f1.webp\"></td><td style=\"\
    width:25%;\"><img src=\"/assets/uploads/richtext-20260618051709-734284ac.webp\"\
    ></td><td style=\"width:25%;\"><img src=\"/assets/uploads/richtext-20260618051726-3018f8c8.webp\"\
    ></td><td style=\"width:25%;\"><img src=\"/assets/uploads/richtext-20260618051743-8af016cd.webp\"\
    ></td></tr></tbody></table><h3><b>修改计数值&nbsp;</b></h3></div><div><p>良品: LOGO!\
    \ 设置 -&gt; 编程 -&gt; 设置参数 -&gt; PASS_WP_NUM -&gt; Cnt (设置需要的值)<br>不良品: LOGO! 设置\
    \ -&gt; 编程 -&gt; 设置参数 -&gt; NG_WP_NUM -&gt; Cnt (设置需要的值)</p></div><div><br></div><div><br></div><div><br></div><div><br></div><div><br></div><div><br></div><div><br></div><div><br></div><div><br></div><div><br></div>"
