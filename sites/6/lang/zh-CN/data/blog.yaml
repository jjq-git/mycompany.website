  - type: heading
    title: 功能键
    alt: 检测治具使用说明
  - type: table
    table:
    - - F1 显示测试的数量, PASSED(合格品):xx, NOGOOD(不良品):xx, TOTAL:xx.
      - F2 显示当前传感器的值, 范围:0-1000, 若没有放置工件, 数组为1000.
      - F3 设置的范围值, +/-0.15 的距离, 建议值为90
      - F4 阈值最小值, 范围在500-700
    table_rows: 4
    table_cols: 4
    alt: 检测治具使用说明
