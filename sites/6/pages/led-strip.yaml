modules: []
detail_templates:
- id: default
  name: 默认led-strip详情
  is_default: true
  modules:
  - type: detail_media
    order: 1
    variant: gallery_left
    data:
      _hidden: 'false'
      source: cover_and_gallery
      layout: gallery_left
      max_images: 6
      empty_behavior: hide_module
      image_ratio: 4/3
      image_radius: 2px
      section_bg: ''
  - type: detail_actions
    order: 2
    variant: primary_secondary
    data:
      _hidden: 'false'
      action_buttons: primary_secondary
      primary_label: 立即咨询
      secondary_label: 查看资料
      align: left
      empty_behavior: hide_module
      section_bg: ''
  - type: detail_content_note
    order: 3
    variant: note
    data:
      _hidden: 'false'
      slot_id: content-mrpylsdv-85994a
      title: ''
      note_style: info
      empty_behavior: hide_module
      section_bg: ''
      text_color: ''
  - type: detail_specs
    order: 4
    variant: list
    data:
      _hidden: 'false'
      title: 固定的参数
      source_field: specs
      max_rows: 10
      columns: 3
      hide_empty_rows: 'true'
      border_color: '#e5e7eb'
      section_bg: ''
  - type: detail_specs
    order: 5
    variant: list
    data:
      _hidden: 'false'
      title: 可定制的参数
      source_field: specs
      max_rows: 10
      columns: 3
      hide_empty_rows: 'true'
      border_color: '#e5e7eb'
      section_bg: ''
  - type: detail_files
    order: 6
    variant: list
    data:
      _hidden: 'false'
      title: 资料下载
      empty_behavior: hide_module
      link_color: ''
      section_bg: '#f8fafc'
  - type: detail_related
    order: 7
    variant: grid
    data:
      _hidden: 'false'
      title: 相关推荐
      match_by: category
      max_items: 8
      columns: 4
      auto_scroll: 'true'
      scroll_interval: 4
      click_scroll: 'true'
      show_dots: 'true'
      section_bg: ''
  required_fields:
  - title
  - slug
  optional_fields:
  - cover
  - summary
  - detail_images
  - specs
  - category
  - tags
  - link_url
  - body
  - detail_content_blocks
  - detail_specs
  - detail_files
  - detail_faqs
  seo:
    title: '{title} - {site_name}'
    description: '{summary}'
    image: cover
