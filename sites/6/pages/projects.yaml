modules: []
detail_templates:
- id: default
  name: 默认projects详情
  is_default: true
  modules:
  - type: detail_media
    variant: gallery_top
    data:
      source: cover_and_gallery
      layout: gallery_top
      max_images: 6
      empty_behavior: hide_module
      image_ratio: 4/3
      image_radius: 8px
  - type: detail_specs
    variant: table
    data:
      title: ''
      source_field: specs
      max_rows: 10
      hide_empty_rows: 'true'
      mobile_layout: stacked
      border_color: '#e5e7eb'
  - type: detail_link
    variant: button
    data:
      label: 了解更多
      url_field: link_url
      style: button
      hide_when_empty: 'true'
  required_fields:
  - title
  - slug
  optional_fields:
  - cover
  - summary
  - detail_images
  - specs
  - category
  - tags
  - link_url
  seo:
    title: '{title} - {site_name}'
    description: '{summary}'
    image: cover
- id: '01'
  name: 项目详情01
  is_default: false
  modules:
  - type: item_data
    order: 1
    variant: default
    data:
      show_detail_images: 'true'
      detail_images_max: 6
      show_arrows: 'true'
      show_dots: 'true'
      auto_scroll: 'false'
      scroll_interval: 3
      show_specs: 'true'
      specs_max_rows: 8
      specs_columns: 2
      hide_empty_rows: 'true'
      show_link: 'true'
      link_text: 了解更多
      auto_category: inherit
      auto_tags: suggest
      text_color: '#333333'
      link_color: '#0f66d0'
      title_color: ''
      section_bg: ''
      image_radius: ''
      block_gap: ''
      content_width: ''
      text_align: left
  - type: text_content
    order: 2
    variant: text-align_left
    data:
      title: ''
      body: ''
      text_align: left
      columns: 1
      section_bg: '#ffffff'
      outer_width: ''
      inner_width: ''
      margin_top: ''
      padding_top: ''
      title_color: '#1e293b'
      body_color: '#475569'
      title_size: ''
      body_size: ''
    responsive:
      tablet:
        text_align: left
        padding_top: 1rem
        padding_bottom: 1rem
        title_size: 1.75rem
        title_color: '#1e293b'
        body_size: 1rem
        body_color: '#475569'
      mobile:
        text_align: left
        padding_top: 1rem
        padding_bottom: 1rem
        title_size: 1.75rem
        title_color: '#1e293b'
        body_size: 1rem
        body_color: '#475569'
  required_fields:
  - title
  - slug
  optional_fields:
  - cover
  - summary
  - body
  - detail_images
  - specs
  - category
  - tags
  seo:
    title: '{title} - {site_name}'
    description: '{summary}'
    image: cover
