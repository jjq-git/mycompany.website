- id: 5
  title: The Keyboard Function of Rimu
  slug: keyboard-function-of-rimu
  description: Keyboards are essential in our daily lives. Most users position their
    left hand on the keyboard while using their right hand for the mouse.
  cover: /assets/uploads/blog-cover-20260611111327-bb0656bc.webp
  style_bg-color: ''
  modules:
  - type: item_data
    order: 1
    variant: default
    data: {}
  body: "<div><h4><img src=\"/assets/uploads/richtext-20260612033207-e81df55d.webp\"\
    ></h4></div><div><p>Keyboards are essential in our daily lives. Most users position\
    \ their left hand on the keyboard while using their right hand for the mouse.\
    \ \r\n<br>\r\n<br>But complex software like Photoshop and KiCad often demand intricate\
    \ shortcuts that span the entire keyboard. This makes one-handed operation difficult\
    \ and often requires both hands, disrupting workflow and efficiency.\r\n<br>\r\
    \n<br>For the issues mentioned above, there are already some professional and\
    \ mature solutions on the market, such as products from 3Dconnexion. Their products\
    \ are ergonomically designed but come at a higher price. For example, the SpaceMouse\
    \ is listed on its official website for $399. In contrast, the HID keyboard function\
    \ of Rimu comes as an accessory to the host and planned selling price is priced\
    \ $110.Its compact design fits perfectly above the left side of your keyboard,\
    \ making quick screen interactions effortless.If you are not a heavy user of keyboard\
    \ devices, Rimu can fully meet your needs.</p><p><img src=\"/assets/uploads/richtext-20260612032402-441b3ba9.webp\"\
    ></p><p>Rimu utilizes the ESP32-S3 as its main controller, enabling HID keyboard\
    \ functionality. We have consolidated shortcuts that typically require both hands\
    \ onto a 4.3-inch touchscreen, allowing for single-handed operation. Users can\
    \ customize specific shortcuts according to their needs. Currently, Rimu comes\
    \ preloaded with six apps tailored for KiCad, Photoshop, Bulk Entry, CNC, YouTube,\
    \ and VLC.</p><p></p><h4><b>Rimu HID Keyboard Function\r\n</b></h4>Here is a video\
    \ showcasing our HID Keyboard function on the YouTube platform.<br><br><p></p><h4><b>Applications</b></h4></div><div><p><b>01.\
    \ Kicad\r\n</b><br>Our hardware engineers often find themselves with their left\
    \ hand on the keyboard and their right hand on the mouse while designing PCBs\
    \ in KiCad. However, when a shortcut requires more key presses than their left\
    \ hand can handle, they have to let go of the mouse to complete the operation.\
    \ For example:</p><p>Shortcuts in the PCB environment:\r\n<br>\r\n<br></p><ul><li>Recalculate\
    \ path: Ctrl + X\r\n</li><li>End wire drawing: Esc or End\r\n</li><li>Component\
    \ lock/unlock: L (to lock/unlock)\r\n</li><li>Delete: Delete or Backspace\r\n\
    </li></ul>Shortcuts in the schematic environment:<br>\r\n<br><ul><li>Add power\
    \ symbol: P (then select the power type)\r\n</li><li>Add net label: L\r\n</li><li>Repeat\
    \ last item: Ins\r\n</li><li>Delete: Delete or Backspace\r\n</li></ul>Our engineers\
    \ have found the enhanced KiCad shortcut functionality of Rimu incredibly practical,\
    \ significantly improving their workflow efficiency and delivering a smoother\
    \ user experience.<p></p><p><img src=\"/assets/uploads/richtext-20260612032646-381d6163.webp\"\
    ></p><p></p><h4><b>02. Photoshop\r\n</b></h4>Photoshop is a powerful image editing\
    \ tool that offers a wide range of shortcut features. Most users operate PS with\
    \ their left hand on the keyboard and their right hand on the mouse. However,\
    \ after discussing with our friends who frequently use PS, we discovered that\
    \ some shortcut operations are not very convenient and often require both hands\
    \ to complete. For example:\r\n<br>\r\n<br><ol><li>Move the selected layer to\
    \ the top: Ctrl + Shift + ]\r\n</li><li>Move the selected layer to the bottom:\
    \ Ctrl + Shift + [\r\n</li><li>Create a new layer via selection: Ctrl + Shift\
    \ + N\r\n</li><li>Invert selection: Shift + Ctrl + I\r\n</li><li>Move layer up:\
    \ Ctrl + ]\r\n</li><li>Move layer down: Ctrl + [\r\n</li><li>Create a new layer:\
    \ Ctrl + J\r\n</li><li>Fill color: Alt + Delete</li></ol><div></div><p></p><p>After\
    \ testing Rimu’s optimized PS shortcuts with our friend, he shared overwhelmingly\
    \ positive feedback, highlighting significant boosts in efficiency and user experience.</p><p><img\
    \ src=\"/assets/uploads/richtext-20260612032735-98b75b74.webp\"></p><p></p><h4><b>03.\
    \ Bulk input\r\n</b></h4>Tired of typing repetitive text or copy-pasting? Rimu’s\
    \ custom bulk entry function allows you to insert long passages or fixed phrases\
    \ with a single tap, boosting your efficiency in scenarios like messaging, documentation,\
    \ or comments.<p></p><p><img src=\"/assets/uploads/richtext-20260612032802-d6c732b0.webp\"\
    ></p><p>While Rimu is capable of performing all Bad USB functions, our primary\
    \ focus is on helping users improve efficiency in daily life. After the product\
    \ is released, we will open-source the code and provide comprehensive tutorials,\
    \ enabling enthusiasts and geeks interested in Bad USB functionalities to get\
    \ started quickly.</p><p><img src=\"/assets/uploads/richtext-20260612032826-de0d7922.webp\"\
    ></p><p><b>04. Niche devices\r\n</b><br>In mass production environments, many\
    \ machines rely on software controlled by mouse or keyboard. However, the compact\
    \ nature of keyboards increases the risk of accidental key presses, potentially\
    \ leading to safety hazards. To mitigate this risk, we implemented prominent labels\
    \ on the control keys of our CNC machines.\r\n<br>\r\n<br>Based on this need,\
    \ Rimu streamlines CNC operations with just three intuitive buttons — Start, Pause,\
    \ and Stop. This design prevents accidental presses and ensures easy operation,\
    \ even for illiterate workers.</p><p><img src=\"/assets/uploads/richtext-20260612033411-3b546ae6.webp\"\
    ></p><p>In the future, we plan to use Rimu’s IO expansion module to enable physical\
    \ buttons to trigger commands, allowing Rimu to adapt to more use cases.</p><p><img\
    \ src=\"/assets/uploads/richtext-20260612033501-7a3ea269.webp\"></p><p><b>05.\
    \ Other Application\r\n</b><br>Watching videos on YouTube or VLC should be relaxing,\
    \ not a hassle. Particularly you want to relax in bed or recline in a chair to\
    \ watch videos but feel inconvenienced because you d on’t want to get up to find\
    \ a mouse or keyboard, it can be quite uncomfortable.Fumbling for a mouse or keyboard\
    \ to pause, adjust volume, or switch to fullscreen can ruin the experience.\r\n\
    <br>\r\n<br>With Rimu, all the essential control at your fingertips. Say goodbye\
    \ to interruptions and enjoy seamless, effortless viewing comfort like never before.</p><p><img\
    \ src=\"/assets/uploads/richtext-20260612033432-59f5720f.webp\"></p><p><b>In conclusion\r\
    \n</b><br>This is the second article in our series, following the first which\
    \ introduced the overall design and structure of RIMU. As our inaugural blog post,\
    \ we’re also sharing it on Medium and Instructables in multiple languages, We\
    \ also update another article for the keyboard function of RIMU. \r\n<br>\r\n\
    <br>If you have any questions, please feel free to leave us a message or join\
    \ our community for discussion.</p><p><br></p></div>"
  seo_title: The Keyboard Function of Rimu
  seo_description: RIMU's HID keyboard function turns complex shortcuts into one-handed
    touchscreen commands, offering a compact, affordable accessory for KiCad, Photoshop,
    and more.
  category: RIMU
