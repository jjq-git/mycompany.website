    \ anode strips typically have only one + pad and multiple - pads.\r\n<br>\r\n\
    <br>To control multi-color LED strips with the PWM_SW_5 module, the strips must\
    \ be common anode or a combination of multiple single-color common anode strips.\r\
    \n<br>\r\n<br>As shown in the figure, these pads are all connected to common anode\
    \ LED strips.<br><img src=\"/assets/uploads/richtext-20260612015037-10f628b6.webp\"\
    ><br><br></p>"
