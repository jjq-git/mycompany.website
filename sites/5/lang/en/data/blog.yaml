- id: 5
  title: The Keyboard Function of Rimu
  slug: keyboard-function-of-rimu
  description: Keyboards are essential in our daily lives. Most users position their left hand on the keyboard while using their right hand for the mouse.
  cover: /assets/uploads/blog-cover-20260611111327-bb0656bc.webp
  style_bg-color: ''
  body: ''
  seo_title: The Keyboard Function of Rimu
  seo_description: RIMU's HID keyboard function turns complex shortcuts into one-handed touchscreen commands, offering a compact, affordable accessory for KiCad, Photoshop, and more.
  category: RIMU
  tags: []
  detail_content_blocks:
  - type: image
    image: /assets/uploads/richtext-20260612033207-e81df55d.webp
    alt: ''
  - type: text
    text: Keyboards are essential in our daily lives. Most users position their left hand on the keyboard while using their right hand for the mouse. But complex software like Photoshop and KiCad often demand intricate shortcuts that span the entire keyboard. This makes one-handed operation difficult and often requires both hands, disrupting workflow and efficiency. For the issues mentioned above, there are already some professional and mature solutions on the market, such as products from 3Dconnexion. Their products are ergonomically designed but come at a higher price. For example, the SpaceMouse is listed on its official website for $399. In contrast, the HID keyboard function of Rimu comes as an accessory to the host and planned selling price is priced $110.Its compact design fits perfectly above the left side of your keyboard, making quick screen interactions effortless.If you are not a heavy user of keyboard devices, Rimu can fully meet your needs.
  - type: image
    image: /assets/uploads/richtext-20260612032402-441b3ba9.webp
    alt: ''
  - type: text
    text: Rimu utilizes the ESP32-S3 as its main controller, enabling HID keyboard functionality. We have consolidated shortcuts that typically require both hands onto a 4.3-inch touchscreen, allowing for single-handed operation. Users can customize specific shortcuts according to their needs. Currently, Rimu comes preloaded with six apps tailored for KiCad, Photoshop, Bulk Entry, CNC, YouTube, and VLC.
  - type: heading
    title: Rimu HID Keyboard Function
  - type: text
    text: Here is a video showcasing our HID Keyboard function on the YouTube platform.
  - type: heading
    title: Applications
  - type: text
    text: '01. Kicad Our hardware engineers often find themselves with their left hand on the keyboard and their right hand on the mouse while designing PCBs in KiCad. However, when a shortcut requires more key presses than their left hand can handle, they have to let go of the mouse to complete the operation. For example: Shortcuts in the PCB environment: • Recalculate path: Ctrl + X • End wire drawing: Esc or End • Component lock/unlock: L (to lock/unlock) • Delete: Delete or Backspace Shortcuts in the schematic environment: • Add power symbol: P (then select the power type) • Add net label: L • Repeat last item: Ins • Delete: Delete or Backspace Our engineers have found the enhanced KiCad shortcut functionality of Rimu incredibly practical, significantly improving their workflow efficiency and delivering a smoother user experience.'
  - type: image
    image: /assets/uploads/richtext-20260612032646-381d6163.webp
    alt: ''
  - type: heading
    title: 02. Photoshop
  - type: text
    text: 'Photoshop is a powerful image editing tool that offers a wide range of shortcut features. Most users operate PS with their left hand on the keyboard and their right hand on the mouse. However, after discussing with our friends who frequently use PS, we discovered that some shortcut operations are not very convenient and often require both hands to complete. For example: • Move the selected layer to the top: Ctrl + Shift + ] • Move the selected layer to the bottom: Ctrl + Shift + [ • Create a new layer via selection: Ctrl + Shift + N • Invert selection: Shift + Ctrl + I • Move layer up: Ctrl + ] • Move layer down: Ctrl + [ • Create a new layer: Ctrl + J • Fill color: Alt + Delete After testing Rimu’s optimized PS shortcuts with our friend, he shared overwhelmingly positive feedback, highlighting significant boosts in efficiency and user experience.'
  - type: image
    image: /assets/uploads/richtext-20260612032735-98b75b74.webp
    alt: ''
  - type: heading
    title: 03. Bulk input
  - type: text
    text: Tired of typing repetitive text or copy-pasting? Rimu’s custom bulk entry function allows you to insert long passages or fixed phrases with a single tap, boosting your efficiency in scenarios like messaging, documentation, or comments.
  - type: image
    image: /assets/uploads/richtext-20260612032802-d6c732b0.webp
    alt: ''
  - type: text
    text: While Rimu is capable of performing all Bad USB functions, our primary focus is on helping users improve efficiency in daily life. After the product is released, we will open-source the code and provide comprehensive tutorials, enabling enthusiasts and geeks interested in Bad USB functionalities to get started quickly.
  - type: image
    image: /assets/uploads/richtext-20260612032826-de0d7922.webp
    alt: ''
  - type: text
    text: 04. Niche devices In mass production environments, many machines rely on software controlled by mouse or keyboard. However, the compact nature of keyboards increases the risk of accidental key presses, potentially leading to safety hazards. To mitigate this risk, we implemented prominent labels on the control keys of our CNC machines. Based on this need, Rimu streamlines CNC operations with just three intuitive buttons — Start, Pause, and Stop. This design prevents accidental presses and ensures easy operation, even for illiterate workers.
  - type: image
    image: /assets/uploads/richtext-20260612033411-3b546ae6.webp
    alt: ''
  - type: text
    text: In the future, we plan to use Rimu’s IO expansion module to enable physical buttons to trigger commands, allowing Rimu to adapt to more use cases.
  - type: image
    image: /assets/uploads/richtext-20260612033501-7a3ea269.webp
    alt: ''
  - type: text
    text: 05. Other Application Watching videos on YouTube or VLC should be relaxing, not a hassle. Particularly you want to relax in bed or recline in a chair to watch videos but feel inconvenienced because you d on’t want to get up to find a mouse or keyboard, it can be quite uncomfortable.Fumbling for a mouse or keyboard to pause, adjust volume, or switch to fullscreen can ruin the experience. With Rimu, all the essential control at your fingertips. Say goodbye to interruptions and enjoy seamless, effortless viewing comfort like never before.
  - type: image
    image: /assets/uploads/richtext-20260612033432-59f5720f.webp
    alt: ''
  - type: text
    text: In conclusion This is the second article in our series, following the first which introduced the overall design and structure of RIMU. As our inaugural blog post, we’re also sharing it on Medium and Instructables in multiple languages, We also update another article for the keyboard function of RIMU. If you have any questions, please feel free to leave us a message or join our community for discussion.
- id: 6
  title: 'RIMU: Bridging the gap between humans and technology'
  slug: between-humans-and-technology
  description: Design Philosophy In our increasingly connected world, we often encounter situations where off-the-shelf solutions don’t meet our needs.
  cover: /assets/uploads/blog-cover-20260611111450-6a2fa2f0.webp
  style_bg-color: ''
  body: ''
  tags: []
  seo_title: 'RIMU: Bridging the gap between humans and technology'
  seo_description: RIMU provides integrated hardware and software solutions for custom device creation, helping developers and manufacturers bridge the gap between humans and technology with user-fri
  date: '2026-06-16'
  category: RIMU
  detail_content_blocks:
  - type: image
    image: /assets/uploads/richtext-20260612034038-559c86ce.webp
    alt: ''
  - type: text
    text: Design Philosophy In our increasingly connected world, we often encounter situations where off-the-shelf solutions don’t meet our needs. Whether it’s automating your home, optimizing your workspace, or creating unique interactive experiences, the need to design and build custom devices arises. Imagine making a device that can easily control the lighting in your home, customized precisely to your preferences. This process requires delving into the intricacies of circuit board design, mastering complex programming languages, and carefully crafting a protective enclosure.
  - type: image
    image: /assets/uploads/richtext-20260612033627-b41023e3.webp
    alt: ''
  - type: text
    text: This process is not only time-consuming, but also requires high expertise and technical skills, which is a huge challenge for most non-professionals. Even experienced developers can become frustrated and overwhelmed by repetitive tasks. In addition, there is often a large overlap in technical requirements and solutions, resulting in many people investing time and resources to solve similar problems, resulting in duplication of work. For the reasons above, we conceived RIMU to help developers and manufacturers realize their creative visions efficiently. RIMU provides integrated, user-friendly solutions that save users time and effort in hardware design, software development, and manufacturing. Our mission is to empower innovators by providing a supportive, integrated platform so that they can focus on their strengths.
  - type: image
    image: /assets/uploads/richtext-20260612033647-64c06cba.webp
    alt: ''
  - type: text
    text: Hardware Rimu is a versatile device equipped with a powerful ESP32 chip with 384 KB ROM, 512 KB SRAM, 16 KB RTCSRAM and 16 MB PSRAM, 8 GB storage space. Its 4.3-inch TFT touchscreen display offers a vivid 480 x 800 pixel resolution, supports 262K colors, and is driven by an ILI9806 or HX8369 display controller.
  - type: image
    image: /assets/uploads/richtext-20260612033706-026ade89.webp
    alt: ''
  - type: text
    text: Structure 01. Dimensions Information RIMU is compact (118 x 73 x 15.9 mm) and features a sleek 4.3-inch screen that provides an impressive resolution of 880 x 480 pixels. With Wi-Fi, Bluetooth, and GPIO pins, it boasts unparalleled expandability to integrate seamlessly with various sensors, actuators, and peripherals.
  - type: image
    image: /assets/uploads/richtext-20260612033731-e3de2de7.webp
    alt: ''
  - type: text
    text: 02. Magnetic Suction Structure Forget traditional screws — RIMU uses an innovative magnetic connection method, allowing you to snap the host and modules together in an instant. The gold-plated pogo pins ensure durability and smooth operation, making it easy for anyone to use without hassle. 03. External Antenna Structure Our devices offer unmatched flexibility for a variety of environments. Whether you need to enclose it in a metal enclosure or place it away from a wireless access point, we have you covered. A dedicated external antenna interface ensures optimal signal reception, even in challenging conditions . With improved signal quality and extended coverage, you can enjoy a more reliable connection. When not needed, the interface doubles as a lanyard attachment point for easy carrying.
  - type: image
    image: /assets/uploads/richtext-20260612033801-659986d9.webp
    alt: ''
  - type: text
    text: 04. Tripod Structure With specially designed screw holes, RIMU can easily be mounted on a standard tripod, giving it the stability and versatility to tackle complex tasks in industrial automation, scientific research, and education. The tripod offers improved working accuracy and makes RIMU more adaptable than ever.
  - type: image
    image: /assets/uploads/richtext-20260612033821-46a99fce.webp
    alt: ''
  - type: text
    text: 05. DIN35 Structure Whether it’s for electrical control or automation systems, RIMU supports DIN35 rails, enabling easy connection with sensors, switchboards, and more — perfect for industrial and electrical environments.
  - type: image
    image: /assets/uploads/richtext-20260612033847-845bb56b.webp
    alt: ''
  - type: text
    text: Function We call the many interesting functions that can be achieved without additional modules as Function. With Rimu’s 4.3-inch touch screen, you can enjoy a personalized experience with features such as calculator, world clock, alarm clock, ruler, unit converter, Bluetooth, etc . We are constantly exploring new features to enhance your daily life.
  - type: image
    image: /assets/uploads/richtext-20260612033911-cba331d0.webp
    alt: ''
  - type: text
    text: Moudles RIMU’s modular design reduces hardware costs and promotes sustainability. You only pay for what you need, with no unnecessary extras. This design also makes upgrading, maintaining, and extending the product easy, all while extending its lifecycle and minimizing waste. We’ve already developed powerful modules, including RFID, DMX512, stepper motors, GPIO, relay, and light matrices, and we’re continuously expanding our library to enhance RIMU’s intelligence and adaptability.
  - type: image
    image: /assets/uploads/richtext-20260612033939-ef123d6c.webp
    alt: ''
  - type: text
    text: In conclusion Given that RIMU is a relatively new product, we’ve created this beginner’s guide to help our users better understand its design philosophy. As our inaugural blog post, we’re also sharing it on Medium and Instructables in multiple languages, We also update another article for the keyboard function of RIMU. If you have any questions, please feel free to leave us a message or join our community for discussion.
