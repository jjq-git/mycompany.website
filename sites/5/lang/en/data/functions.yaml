- id: 7
  title: Screen Ruler
  slug: screen-ruler
  media_type: embed
  cover: ''
  cover_convert_webp: 'false'
  cover_alt: Screen Ruler
  video: ''
  embed_url: /media-packages/wf1f_ruler-20260630085552-0e20501b/
  date: ''
  name: ''
  category: ''
  description: "<p>Turn your screen into a physical ruler. A full-screen grid of tick\
    \ marks lets you measure lengths directly, supporting both centimeters (CM) and\
    \ inches (IN).</p><p>\r\n</p><p></p><ul><li>Full-screen tick grid: thin lines\
    \ are small ticks, bright lines are integer marks.\r\n</li><li>Numbers on the\
    \ left/bottom axes: vertical axis increases upward, horizontal axis increases\
    \ to the right.\r\n</li><li>Top-right unit button: shows the current unit CM /\
    \ IN — tap to toggle.</li></ul><p></p>"
  tags_visible: true
  tags: ''
  price: ''
  body: "<p></p><h3><b>How to Use</b></h3><p></p><hr id=\"null\"><p><b>Step 1 — Open\
    \ the ruler\r\n</b><br>On entry the default is centimeter (CM) grid: horizontal\
    \ axis 0–80, vertical axis 0–40, with bright lines every 10 for quick reading.</p><p><img\
    \ src=\"/assets/uploads/richtext-20260630072632-2b024c1e.svg\"></p><p><b>Step\
    \ 2 — Measure an object's length\r\n</b><br>Place the object against the screen,\
    \ align one end with the 0 mark, and look where the other end falls — that's the\
    \ length.</p><p><img src=\"/assets/uploads/richtext-20260701060924-712cf39e.svg\"\
    ></p><p><b>Step 3 — Switch units (CM / IN)\r\n</b><br>Tap the unit button in the\
    \ top-right corner to toggle between centimeters and inches. The text on the button\
    \ indicates the current unit: showing CM means centimeter mode; switching to inches\
    \ shows IN.</p><p><img src=\"/assets/uploads/richtext-20260701060934-b1cfb92b.svg\"\
    ></p><p>After switching to inches, the grid changes to 1 large division per inch\
    \ (with small ticks inside), horizontal axis labeled 0–3, vertical axis 0–2:</p><p><img\
    \ src=\"/assets/uploads/richtext-20260630072714-50d1c892.svg\"></p><hr id=\"null\"\
    ><p><b>Tips\r\n</b><br></p><ul><li>Measurement accuracy depends on screen size\
    \ and display scaling — suitable for rough measurements; use a physical measuring\
    \ tool for precision.\r\n</li><li>When measuring long objects, hold one end firmly\
    \ at 0 and shift your gaze to read the other end to avoid angular misreading.\r\
    \n</li><li>The centimeter grid is denser (down to millimeter ticks); the inch\
    \ grid is coarser — switch as needed.</li></ul><p></p>"
