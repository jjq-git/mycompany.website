  price: ''
  body: "<h3><b>How to Use</b></h3><hr id=\"null\"><p><b>Step 1 — Open QR code</b></p><p>On\
    \ entry, the center displays the QR code for the current content, with the title\
    \ text at the top. The default encoding is https://rimu.me.</p><p><img src=\"\
    /assets/uploads/richtext-20260630070953-71ef0ad1.svg\" alt=\"richtext-20260630070953-71ef0ad1.svg\"\
    ></p><p><b>Step 2 — Edit QR code content\r\n</b><br>Tap the center QR code area.\
    \ The screen switches to the editing interface.</p><p><img src=\"/assets/uploads/richtext-20260701060758-3179db54.svg\"\
    ></p><p><b>Step 3 — Enter and confirm\r\n</b><br>Type a new URL or text on the\
    \ pop-up keyboard, then tap the confirm key (⏎). The QR code immediately regenerates\
    \ with the new content and returns to the viewing interface.</p><p><img src=\"\
    /assets/uploads/richtext-20260630071029-82ed0d85.svg\" alt=\"richtext-20260630071029-82ed0d85.svg\"\
    ></p><p><b>Step 4 — Edit title text (optional)\r\n</b><br>Tap the top title bar,\
    \ which also brings up the keyboard. Enter a new title and tap confirm — the title\
    \ updates immediately.</p><p><img src=\"/assets/uploads/richtext-20260701060810-18237faa.svg\"\
    ></p><div><hr id=\"null\"><p><b>Tips\r\n</b><br></p><ul><li>While editing, tap\
    \ the cancel (close) key on the keyboard to discard changes and keep the original\
    \ content.\r\n</li><li>If content is left empty and confirmed, it automatically\
    \ reverts to the default URL https://rimu.me; leaving the title empty reverts\
    \ to \"Tap to edit\".\r\n</li><li>Longer content produces a denser QR code — using\
    \ short URLs is recommended for easier phone scanning.</li></ul><p></p></div><div><b><br></b></div>"
