- id: 1
  title: Resistor Decoder
  slug: resistor-decoder
  cover: ''
  cover_convert_webp: 'false'
  cover_alt: Resistor Decoder
  date: ''
  name: ''
  category: ''
  description: "<p style=\"text-align: left;\">This app lets you quickly decode resistor\
    \ color bands, visualize their corresponding ohm values, and compare multiple\
    \ resistors side by side. Whether you're a student, hobbyist, or professional,\
    \ it helps you avoid manual lookups and reduces errors in circuit design.<br></p><p></p><ul><li>Top\
    \ three buttons: 4 Band / 5 Band / 6 Band — select the number of color bands on\
    \ the resistor. The currently selected option has a yellow outline.\r\n</li><li>Middle\
    \ gray resistor body: the bands to be colored are arranged on it. Gray means not\
    \ yet colored.\r\n</li><li>Bottom row of color blocks: the color picker. Tap a\
    \ color block to color the current band and fill in the corresponding digit.\r\
    \n</li><li>Above the resistor body: once all bands are selected, the resistance\
    \ result is displayed (e.g. 200MR 2%, R = ohm Ω).</li></ul><p></p>"
  tags_visible: true
  tags: ''
  price: ''
  body: "<h3><b>How to Use</b></h3><div><p><b>Step 1 — Select resistor type and pick\
    \ the first band color</b></p><p>First tap 4 / 5 / 6 Band at the top to choose\
    \ the number of bands (image shows 5 Band), then tap the first band. Color blocks\
    \ with digits appear at the bottom — tap the matching color (e.g. Red = 2), and\
    \ the first band turns red.</p><p><img src=\"/assets/uploads/richtext-20260701055859-8fbabed4.svg\"\
    ></p></div><div><p><b>Step 2 — Pick the second band color</b></p><p>The first\
    \ band has turned red and shows 2. Tap the second band, choose its color from\
    \ the bottom (e.g. Black = 0), and the second band colors accordingly. Repeat\
    \ for remaining significant digit bands (3rd band for 5/6 Band types).</p></div><div><img\
    \ src=\"/assets/uploads/richtext-20260701055935-bf5bedb2.svg\"></div><div><p><b>Step\
    \ 3 — Select the multiplier band color</b></p><p>After the significant digit bands,\
    \ tap the multiplier band. The bottom color blocks automatically switch to the\
    \ multiplier legend (Silver ×0.01 … White ×1G). Tap the matching color (e.g. Blue\
    \ = ×1M), and the multiplier band shows x 1M.</p><p><img src=\"/assets/uploads/richtext-20260701055946-950470c7.svg\"\
    ></p><p><b>Step 4 — Read the resistance result</b></p><p>Once the final tolerance\
    \ band is also selected and all bands are complete, the final resistance value\
    \ and tolerance are automatically displayed above the resistor body, e.g. 200MR\
    \ 2% (i.e. 200 MΩ ±2%).</p><p><img src=\"/assets/uploads/richtext-20260701055959-43056e16.svg\"\
    ></p><hr id=\"null\"><p>Tips</p><p></p><ul><li>All bands required for the current\
    \ type must be selected before the result appears at the top; skipping any band\
    \ hides the result.\r\n</li><li>Switching between 4 / 5 / 6 Band clears all selected\
    \ colors — you start fresh.\r\n</li><li>The bottom color blocks change automatically\
    \ based on the current band's role: significant digit bands show 0–9, multiplier\
    \ band shows multipliers, tolerance/tempco band shows percentages/ppm.\r\n</li><li>In\
    \ the result, R represents ohm Ω; K / M / G represent kilo / mega / giga ohms.</li></ul><p></p></div>"
