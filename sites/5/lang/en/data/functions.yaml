    alt: ''
  - type: text
    text: Step 6 — Read the parallel result The upper-left number is the parallel result. The unit (R / KR / MR) is automatically selected based on the value magnitude, showing two decimal places.
  - type: image
    image: /assets/uploads/richtext-20260701060645-38b2e31f.svg
