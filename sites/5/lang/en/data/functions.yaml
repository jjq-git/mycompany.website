  description: "<p>A millisecond-precision stopwatch with start / pause / reset, plus\
    \ lap recording while timing.</p><p></p><ul><li>Left large digits: current elapsed\
    \ time, formatted as HH:MM:SS.hundredths (cyan two digits = hundredths of a second).\r\
    \n</li><li>Above the digits: status — READY / RUNNING / PAUSED.\r\n</li><li>Top-right\
    \ circular button: start / pause.\r\n</li><li>Bottom-right circular button: \U0001F6A9\
    \ lap while running, ↺ reset while stopped.</li></ul><p></p>"
  tags_visible: true
  tags: ''
  price: ''
  body: "<h3><b>How to Use</b></h3><hr id=\"null\"><p><b>Step 1 — Open the stopwatch\r\
    \n</b><br>On entry it shows 00:00:00.00, status is READY, and below it says \"\
    No laps yet\".</p><p><img src=\"/assets/uploads/richtext-20260630073545-9ba27d84.svg\"\
    ></p><p><b>Step 2 — Start timing\r\n</b><br>Tap the ▶ Start button at the top\
    \ right. The digits start ticking, and the status changes to RUNNING.</p><p><img\
    \ src=\"/assets/uploads/richtext-20260701061406-a60ce497.svg\"></p><p><b>Step\
    \ 3 — Record a lap (optional)\r\n</b><br>While timing, tap the \U0001F6A9 Lap\
    \ button at the bottom right to record the current elapsed time as an entry in\
    \ the list below — newest at the top.</p><p><img src=\"/assets/uploads/richtext-20260701061418-7f7ba4f7.svg\"\
    ></p><p><b>Step 4 — Pause\r\n</b><br>Tap the ⏸ Pause button at the top right.\
    \ The digits stop, and the status changes to PAUSED. Tap ▶ again to resume from\
    \ the current time.</p><p><img src=\"/assets/uploads/richtext-20260701061427-057f480d.svg\"\
    ></p><p><b>Step 5 — Reset to zero\r\n</b><br>While paused, tap the ↺ Reset button\
    \ at the bottom right. The time resets to zero, all laps are cleared, and the\
    \ status returns to READY.</p><p><img src=\"/assets/uploads/richtext-20260701061434-ee71d6a8.svg\"\
    ></p><hr id=\"null\"><p><b>Tips\r\n</b><br></p><ul><li>After pausing, the next\
    \ action is \"resume\", not \"clear\" — to start over, pause first, then reset.\r\
    \n</li><li>Up to 64 laps can be recorded; no more are added beyond that.\r\n</li><li>Hundredths\
    \ of a second refresh every 30 milliseconds for smooth display.</li></ul><p></p><p>\r\
    \n<br></p>"
