  description: "<p>Display the real-time time of two time zones side by side, updated\
    \ automatically every second — just open and view, no interaction needed.</p><p></p><ul><li>Landscape\
    \ mode: two cards side by side — left Shanghai (Beijing Time UTC+8), right New\
    \ York (Eastern Time UTC−5).\r\n</li><li>Card top: city name.\r\n</li><li>Card\
    \ center large digits: local time, formatted as HH:MM:SS (24-hour).\r\n</li><li>Card\
    \ bottom two lines: day of week (e.g. Thu) and date (YYYY-MM-DD).</li></ul><p></p>"
  tags_visible: true
  tags: ''
  price: ''
  body: "<h3><b>How to Use</b></h3><hr id=\"null\"><p><b>Step 1 — Open World Clock\r\
    \n</b><br>On entry, both locations' times are displayed immediately, with the\
    \ seconds ticking every second — no tapping needed. The two cards refresh synchronously.</p><p><img\
    \ src=\"/assets/uploads/richtext-20260630074132-5006bed5.svg\"></p><p><b>Step\
    \ 2 — Compare the two times\r\n</b><br>The left card is the local time zone, and\
    \ the right card is the target time zone. Read the large center digits for the\
    \ time, and check the bottom for the day of the week and date — across time zones\
    \ the right card may show a different date than the left.</p><p><img src=\"/assets/uploads/richtext-20260701061530-2166c708.svg\"\
    ></p><hr id=\"null\"><p><b>Tips\r\n</b><br></p><ul><li>The time follows the system\
    \ clock — make sure the device's time is correctly set in system settings first\
    \ so both locations are accurate.\r\n</li><li>Time zones are fixed as built-in\
    \ (Shanghai / New York). This page does not support adding, removing, or switching\
    \ cities on the fly.\r\n</li><li>Times are displayed with monospaced digits, so\
    \ the whole string doesn't jitter left or right as the seconds tick.</li></ul><p></p><p>\r\
    \n<br></p>"
