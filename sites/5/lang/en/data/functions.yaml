    alt: ''
  - type: text
    text: Step 4 — Fill in remaining resistors Repeat steps 2 and 3 to fill in the remaining resistors row by row (each row can have a different unit). Unfilled rows are not included in the calculation.
  - type: image
    image: /assets/uploads/richtext-20260701060627-23c4cc96.svg
