  description: "<p>A local alarm clock. On startup it shows the current time (analog\
    \ dial + digital time + date). You can add multiple alarms, set hours and minutes,\
    \ and toggle each one individually; alarms alert at the set time.</p><p></p><ul><li>Left\
    \ large dial: current time, with white hour/minute hands, a cyan second hand,\
    \ and a cyan center dot.\r\n</li><li>Below the dial: digital time (HH:MM:SS) and\
    \ date.\r\n</li><li>Right circular bell button \U0001F514: opens alarm settings\
    \ (expands the right-side list).\r\n</li><li>Settings mode right side: alarm list,\
    \ each entry = bell icon + time + once/daily + toggle switch; bottom floating\
    \ ➕ to add new.</li></ul><p></p>"
  tags_visible: true
  tags: ''
  price: ''
  body: "<h3><b>How to Use</b></h3><hr id=\"null\"><p><b>Step 1 — View current time\r\
    \n</b><br>On entry you see a full-screen clock — the dial runs in real time, and\
    \ the digital time and date are shown below. No action needed.</p><p><img src=\"\
    /assets/uploads/richtext-20260630073159-78c7cbb8.svg\"></p><p><b>Step 2 — Enter\
    \ alarm settings\r\n</b><br>Tap the \U0001F514 bell button on the right. The dial\
    \ shrinks to the left half, and the alarm list expands on the right.</p><p><img\
    \ src=\"/assets/uploads/richtext-20260701061049-259986bb.svg\"></p><p><b>Step\
    \ 3 — Add a new alarm\r\n</b><br>Tap the ➕ button at the bottom of the list. A\
    \ time picker pops up (max 8 alarms; ➕ grays out when full).</p><p><img src=\"\
    /assets/uploads/richtext-20260701061101-2f8ef009.svg\"></p><p><b>Step 4 — Set\
    \ the time and confirm\r\n</b><br>Scroll the hour and minute wheels to select\
    \ the desired time, then tap ✓ to save; tap ✕ to cancel. The new alarm is enabled\
    \ by default.</p><p><img src=\"/assets/uploads/richtext-20260701061110-4e307a78.svg\"\
    ></p><p><b>Step 5 — Enable / disable alarms\r\n</b><br>Tap the toggle switch on\
    \ the right side of an alarm entry: on (cyan) = will alert at the set time; off\
    \ (gray) = kept but silent.</p><p><img src=\"/assets/uploads/richtext-20260701061121-d83dd679.svg\"\
    ></p><p><b>Step 6 — Delete an alarm\r\n</b><br>Swipe the alarm entry to the left\
    \ — a red delete area appears on the right. Tap \U0001F5D1 to delete it.</p><p><img\
    \ src=\"/assets/uploads/richtext-20260701061144-cdfc16e3.svg\"></p><hr id=\"null\"\
    ><p><b>Tips\r\n</b><br></p><ul><li>Tap the time digits on an alarm entry to re-enter\
    \ the picker and modify it.\r\n</li><li>In settings mode, tap the left dial to\
    \ collapse back to the full-screen clock.\r\n</li><li>Alarms are stored in memory\
    \ and cleared on restart — re-add them after a reboot.</li></ul><p></p>"
