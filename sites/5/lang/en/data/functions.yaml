  detail_content_blocks:
  - type: heading
    title: How to Use
  - type: text
    text: Step 1 — Open the app On entry, the result shows 0 R, and all 5 input rows are empty, waiting for input.
  - type: image
    image: /assets/uploads/richtext-20260630070352-94eca15a.svg
    alt: ''
  - type: text
    text: Step 2 — Enter the first resistor First tap an input box to select it (cursor appears), then use the right-side keypad to type the resistor value.
  - type: image
