- id: 2
  title: Base Convertor
  slug: base-convertor
  media_type: embed
  cover: ''
  cover_convert_webp: 'false'
  cover_alt: Base Convertor
  video: ''
  embed_url: /media-packages/wf1f_base_converter-20260630085501-b67b5a83/
  date: ''
  name: ''
  category: ''
  description: "A simple and practical real-time base conversion tool that supports\
    \ quick conversions between binary, octal, decimal, and hexadecimal, making it\
    \ easy to view numbers in different numeral systems.<div><p></p><ul><li>Four rows\
    \ from top to bottom: BIN (16-bit binary), HEX (4-digit hexadecimal), OCT (6-digit\
    \ octal), DEC (5-digit decimal).\r\n</li><li>Each row has the base name on the\
    \ left and a row of digit cells on the right.\r\n</li><li>All four rows always\
    \ represent the same number, with a maximum supported value of decimal 65535.</li></ul><p></p></div>"
  tags_visible: true
  tags: ''
  price: ''
  body: '<h3><b>How to Use</b></h3><hr id="null"><p><b>Step 1 — Open the app</b></p><p>On
    entry all four rows show 0, indicating the current value is 0.</p><p><img src="/assets/uploads/richtext-20260630054920-61b86e62.svg"></p><p><b>Step
    2 — Flip binary bits</b></p><p>Each cell in the BIN row has only two states: 0
    or 1. Tap a cell to flip between 0 and 1. In the image below, tapping the rightmost
    bit flips it to 1, the value becomes 1, and the other three rows update synchronously.</p><p><img
    src="/assets/uploads/richtext-20260701060207-86be71c5.svg"></p><p><b>Step 3 —
    Increment hex/decimal digits</b></p><p>Each cell in the HEX, OCT, and DEC rows
    increments by 1 per tap, wrapping back to 0 at the maximum (HEX wraps F→0, DEC
    wraps 9→0). In the image below, tapping the HEX units digit from 1 to 2 changes
    the value to 2.</p><p><img src="/assets/uploads/richtext-20260701060228-458acd65.svg"></p><p><b>Step
    4 — Swipe to adjust digits</b></p><p>Each cell in the HEX, OCT, and DEC rows also
    supports vertical swiping for continuous value adjustment — great for quickly
    spanning multiple numbers. In the image below, swiping the DEC tens digit to 5
    changes the value to 52, with all four rows updating synchronously.</p><p><img
    src="/assets/uploads/richtext-20260701060243-06f72b75.svg"></p>'
  rte_clicked_editor_idx: ''
