  date: ''
  name: ''
  category: ''
  description: "<p>A basic four-function calculator: digit/operator keypad + large display, automatically recording each calculation result into the history on the left.</p><p><ul><li>Top-left display area: current input or calculation result, right-aligned large white text.\r\n</li><li>Bottom-left history area: list of completed expressions (a op b = result), newest at the bottom.\r\n</li><li>Right-side keypad matrix: 4 columns × 5 rows.\r\n</li></ul></p><blockquote style=\"margin: 0 0 0 40px; border: none; padding: 0px;\"><p>Digit keys: 0–9 and decimal point .\r\n</p><p>Operator keys: / (divide), * (multiply), - (subtract), + (add).\r\n</p><p>Function keys: CE (clear entry), C (clear all), +/- (negate), = (equals).</p></blockquote>"
  tags_visible: true
  tags: ''
  price: ''
  body: ''
  rte_clicked_editor_idx: ''
  detail_gallery:
    visible: true
    images: []
  style_bg-color: ''
  detail_content_blocks:
  - type: text
    text: 'Tips Difference between C and CE: C clears the entire expression (including the history current line) and resets to zero; CE only clears the entry currently being typed. +/- negates the current number; . enters a decimal point. Dividing by 0 displays "divider can''t be zero!". Long-press the bottom-left history area to open settings: toggle "Record History" on/off, one-tap "Clear History". History keeps roughly the 10 most recent expressions; the oldest is pushed out when the limit is exceeded. History and the "Record History" toggle are saved even after power-off on real hardware; in the simulator (WASM) an NVS stub is used, which only persists within the current session and does not survive across sessions.'
