  description: "<p>Enter multiple resistor values, press once to calculate their parallel equivalent, supporting R / KR / MR units.</p><p></p><ul><li>Top-left large number: parallel result, formatted as value + unit (e.g. 6.85 KR).\r\n</li><li>Left side 5 rows: resistor inputs, one resistor per row.\r\n</li><li>Left dark box per row: enter the value (right-aligned).\r\n</li><li>Right cyan button per row: the row's unit (R / KR / MR), tap to cycle through.\r\n</li><li>Right-side numeric keypad: enter digits and decimal point, ‹ › to move cursor, ⌫ to backspace, ✓ to calculate.</li></ul><p></p><p></p>"
