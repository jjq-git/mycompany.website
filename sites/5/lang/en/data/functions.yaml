  - type: text
    text: Step 2 — Compare the two times The left card is the local time zone, and the right card is the target time zone. Read the large center digits for the time, and check the bottom for the day of the week and date — across time zones the right card may show a different date than the left.
  - type: image
    image: /assets/uploads/richtext-20260701061530-2166c708.svg
    alt: ''
  - type: text
    text: Tips • The time follows the system clock — make sure the device's time is correctly set in system settings first so both locations are accurate. • Time zones are fixed as built-in (Shanghai / New York). This page does not support adding, removing, or switching cities on the fly. • Times are displayed with monospaced digits, so the whole string doesn't jitter left or right as the seconds tick.
