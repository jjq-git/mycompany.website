  tags: ''
  price: ''
  body: "<h3><b>Applications</b></h3><div><table data-rte-border=\"1\" data-rte-widths=\"1\"><colgroup><col style=\"width:50%\"><col style=\"width:50%\"></colgroup><tbody><tr><td style=\"width:50%\"><p>This addressable LED controller module is equipped with three independent output channels, enabling precise control of WS2812 and other addressable LEDs. Users can intuitively set the color of any individual LED through the touchscreen interface, and the module can drive custom-length LED strips.\r\n<br>It features an efficient power management system, supporting 5V, 12V, and 24V input voltages, providing stable power to the LEDs while also charging the host device. For larger or more complex lighting setups, multiple controller modules can be seamlessly cascaded, making it ideal for scalable lighting solutions in DIY electronics, smart displays, or creative installations.</p></td><td style=\"width:50%\"><p></p><ul><li>5V/12/24V LED strips\r\n</li><li>5V LED modules</li><li>12V/24V RGB pixel\
    \ lights</li></ul><p></p></td></tr></tbody></table><h3><b>Specifications</b></h3></div><div><table data-rte-border=\"1\" data-rte-widths=\"1\"><colgroup><col style=\"width:50%\"><col style=\"width:50%\"></colgroup><tbody><tr><td style=\"width:50%\"><img src=\"/assets/uploads/richtext-20260612103149-13b66dd9.svg\"></td><td style=\"width:50%\"><p>Input\r\n<br>     Voltage: 5-24V\r\n<br>     Maximum current: 20A\r\n<br>\r\n<br>Output\r\n<br>     Maximum current: 7A per channel\r\n<br>\r\n<br>Datasheet\r\n<br>     addressable_led_3_sch.pdf\r\n<br>     addressable_led_3_dwg.pdf\r\n<br>     addressable_led_3_dwg.dxf</p></td></tr></tbody></table><h3><b>Ports</b></h3></div><div><table data-rte-border=\"1\" data-rte-widths=\"1\"><colgroup><col style=\"width:50%\"><col style=\"width:50%\"></colgroup><tbody><tr><td style=\"width:50%\"><img src=\"/assets/uploads/richtext-20260612103448-40bdc0a7.svg\"></td><td style=\"width:50%\"><p>Channel A/B/C\r\n<br>     Connect to addressable LEDs\r\n<br>\r\n\
    <br>Input (5-24V)\r\n<br>     Charges the host\r\n<br>     Powers channels A/B/C\r\n<br>\r\n<br>Address\r\n<br>     Module address</p></td></tr></tbody></table><h3><br></h3></div><br>"
