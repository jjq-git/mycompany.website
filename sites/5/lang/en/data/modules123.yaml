  date: '2025-06-04'
  name: ''
  category: ''
  description: <p>This 8-channel I/O module is a powerful data acquisition and control device, integrating 4 digital I/O channels and 4 analog input channels. It can flexibly connect various sensors, actuators, and other external devices to achieve data acquisition, signal processing, control output, and more.</p>
