    ></td><td style=\"width:50%\"><p>Specifications\r\n<br>Input\r\n<br>     5-24VDC, 5A per channel, total current 20A\r\n<br>\r\n<br>Frequency\r\n<br>     Mode A (R, G, B, W, Y channels)\r\n<br>     32kHz, 4kHz, 500Hz, 125Hz.\r\n<br>     Mode B (R, G, B channels only)\r\n<br>     Adjustable range 1 to 80 kHz.\r\n<br>\r\n<br>Datasheet\r\n<br>     wf1_pwm_sw_5_sch.pdf\r\n<br>     wf1_pwm_sw_5_dwg.pdf\r\n<br>     wf1_pwm_sw_5_dwg.dxf</p></td></tr></tbody></table><h3><b>Ports</b></h3></div><div><table data-rte-border=\"1\" data-rte-widths=\"1\"><colgroup><col style=\"width:50%\"><col style=\"width:50%\"></colgroup><tbody><tr><td style=\"width:50%\"><img src=\"/assets/uploads/richtext-20260612104412-8e0ef580.svg\"></td><td style=\"width:50%\"><p>R/G/B/W/Y\r\n<br>     Connect load\r\n<br>\r\n<br>Input (5-24V)\r\n<br>     Charges the host\r\n<br>     Powers the load\r\n<br>\r\n<br>Address\r\n<br>     Module address</p></td></tr></tbody></table><h3><b>User Interface</b></h3></div><div><table data-rte-border=\"\
