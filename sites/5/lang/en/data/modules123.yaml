- id: 5
  title: Current Monitor 4
  slug: item-5
  cover: /assets/uploads/highlight_card-image-20260611101824-f9f4a751.svg
  cover_convert_webp: 'false'
  date: '2025-07-03'
  name: ''
  category: ''
  description: <p>The Current module is an analog input module that can simultaneously measure analog voltage/current signals from four AC/DC probes. The module provides three 3.5mm headphone jack inputs and one Phoenix 3.5*2 terminal block input. The voltage or current input of each probe can be matched via DIP switches, and the measurement results are returned to the host. Additionally, multiple modules can be installed on a single host.</p>
  tags_visible: true
  tags: ''
  price: ''
  body: "<h3><b>Applications</b></h3><div><p><p>The WF1-Current module is an analog input module that can simultaneously measure analog voltage/current signals from four AC and DC probes. The module provides three 3.5mm headphone jack inputs and one Phoenix 3.5*2 terminal block input. The voltage or current input of each probe can be matched via DIP switches, and the measurement results are returned to the host. Additionally, multiple modules can be installed on the same host.</p><b>Specifications</b></p></div><div><table data-rte-border=\"1\" data-rte-widths=\"1\"><colgroup><col style=\"width:50%\"><col style=\"width:50%\"></colgroup><tbody><tr><td style=\"width:50%\"><img src=\"/assets/uploads/richtext-20260612095001-f8a2ff8f.svg\" alt=\"richtext-20260612095001-f8a2ff8f.svg\"></td><td style=\"width:50%\"><p>Power\r\n<br>     5-24VDC\r\n<br>\r\n<br>Datasheet\r\n<br>     current_monitor_4_dwg.pdf\r\n<br>     current_monitor_4_sch.pdf\r\n<br>     current_monitor_4_dwg.dxf</p></td></tr></tbody></table><h3><b>Ports</b></h3></div><div><table\
