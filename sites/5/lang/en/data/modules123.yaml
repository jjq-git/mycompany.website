- id: 3
  title: PWM SW 5
  slug: pwm-sw-5
  cover: /assets/uploads/highlight_card-image-20260611101440-9d2453be.svg
  cover_convert_webp: 'false'
  date: '2025-06-26'
  name: ''
  category: ''
  description: <p>This module features 5 independent PWM output channels with integrated MOSFETs, providing a versatile high-performance solution for LED dimming and motor control. It supports various LED types, including single-color, dual-color, RGB, RGBW, and RGBWY, and can also be used to control small DC motors.</p>
