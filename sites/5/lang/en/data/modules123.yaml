  date: '2025-06-26'
  name: ''
  category: ''
  description: <p>This addressable LED control module is specifically designed for controlling WS2812, WS2811, and other addressable LED strips, offering powerful functionality and ease of use. With 3 independent output channels, it can simultaneously control 3 sets of LED panels or strips, making it easy for users to create various lighting effects.</p>
