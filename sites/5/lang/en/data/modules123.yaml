    ></td><td style=\"width:50%\"><p>Output C\r\n<br>Built-in 3.3V (max: 200mA)\r\n<br>D 0/1/2/3\r\n<br>Digital pins\r\n<br>A 0/1/2/3\r\n<br>Analog pins\r\n<br>Output B\r\n<br>Built-in 5V (max: 200mA)\r\n<br>Output A\r\n<br> External power, voltage equals input voltage\r\n<br>Input (5-24V)\r\n<br>Charges the host\r\n<br>Power output A\r\n<br>Address\r\n<br>Module address</p></td></tr></tbody></table><table data-rte-border=\"1\" data-rte-widths=\"1\"><colgroup><col style=\"width:50%\"><col style=\"width:50%\"></colgroup><tbody><tr><td style=\"width:50%\"><img src=\"/assets/uploads/richtext-20260612110624-fd76b7fd.svg\"></td><td style=\"width:50%\"><p>User Interface</p></td></tr></tbody></table><p><br></p></div>"
