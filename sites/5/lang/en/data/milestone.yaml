  slug: prototype-v00
  date: '2026-06-12'
  description: Prototype V0.0 In the early days, we decided to use acrylic to make
    the outer frame of this product, but this would result in the
  body: "<p>In the early days, we decided to use acrylic to make the outer frame of\
    \ this product, but this would result in the appearance of the product appearing\
    \ relatively cheap, and we did not consider the addition of batteries and other\
    \ modules in the later stage.</p><p><img src=\"/assets/uploads/richtext-20260612064336-2a6c45cf.webp\"\
    ></p><p>\r\n<br>We made two verison pcb, the 1st one use esp32s3 wroom module,\
    \ and the 2nd one, we re-layout the esp32s3 for save space.\r\n<br>\r\n<br>Replace\
    \ tf card by sd nand.</p><p><img src=\"/assets/uploads/richtext-20260612064349-62fd11d0.webp\"\
    ></p><p>The mcu can do many things, and get the information from the screen, also\
    \ can input information throught touch panel.\r\n<br>\r\n<br></p><ul><li>4.3inch\
    \ LCD screen as output\r\n</li><li>capacitive touch as input\r\n</li><li>storage\
    \ the data in tf card\r\n</li><li>15 more IO ports are available for expansion\r\
    \n</li></ul>for further information, please check v0.1 prototype.<p></p><p><img\
    \ src=\"/assets/uploads/richtext-20260612064408-be1e33e2.webp\"></p><p></p><p><video\
