- id: 4
  title: Prototype v0.2
  slug: prototype-v02
  date: '2026-06-12'
  description: Prototype v0.2 In V0.1, we established the rough prototype of the product,
    but there were some problems which we not satified, and after intense discussions,
  body: "<img src=\"/assets/uploads/richtext-20260612063147-807651fb.webp\"><div><p>In\
    \ V0.1, we established the rough prototype of the product, but there were some\
    \ problems which we not satified, and after intense discussions, we developed\
    \ V0.2\r\n<br>\r\n<br></p><ul><li>The infrared head-up volume is too large, which\
    \ affects the overall appearance on the host, and the angle is fixed, it’s not\
    \ easy to use. so cancel it.\r\n</li><li>Power switches, USB and other interfaces\
    \ on the right side of the host will cause problems with the layout of the circuit\
    \ board\r\n</li></ul><b>v0.1 -&gt; v0.2\r\n</b><br><ul><li>Move IR to an extension\
    \ module.\r\n</li><li>changed pogo pin from 14pin to 20pin\r\n</li><li>Add copper\
    \ nuts on the back\r\n</li><li>rearranged the position and number of magnets\r\
    \n</li><li>Add a 1/4 standard connector on the top for mounting expansion devices,\
    \ such as IR remoter, camra module.</li></ul><div><img src=\"/assets/uploads/richtext-20260612063228-72aaeda7.webp\"\
    ></div><div></div><p></p><p><b>PCB\r\n</b><br>We made two additional pcb for testing\
    \ the IO extender, and power manage.\r\n<br>\r\n<br><b>ATTiny 1616\r\n</b><br>use\
    \ attiny 1616 as extender mcu, handle indicator, beep, motor and interrupt.\r\n\
    <br>\r\n<br><b>AP2101\r\n</b><br>The small for testing power ic functions.</p><p></p><p><video\
    \ class=\"elementor-video\" width=\"100%\" src=\"https://rimu.me/wp-content/uploads/2024/05/v02_discussion_03.mp4\"\
    \ controls=\"\" preload=\"metadata\" controlslist=\"nodownload\"></video></p></div>"
