  seo_title: Prototype v0.5
  seo_description: RIMU's Prototype v0.5 finalizes host-module communication using I2C protocol for stable, efficient connections. Each module adds a $2 component for enhanced freedom and multi-modul
  detail_content_blocks:
  - type: image
    image: /assets/uploads/richtext-20260612062422-870aeb60.webp
    alt: ''
  - type: text
    text: After several iterations and optimizations, we have finally finalized the communication scheme between the host and the modules. This scheme prioritizes the use of the I2C protocol to ensure efficient and stable communication between the host and each module. Each module needs to add a single component to support I2C communication, which increases the cost by approximately $2. However, this significantly improves the freedom of the modules and supports a host connecting to multiple modules simultaneously. Improvement • Replacing the back clip connector with a mini HDMI • Move all the interfaces on the module to the top. • Preferentially use I2C to communicate with the module. • Remove the temperature sensor from the host. The I2C. • standard for all modules.
