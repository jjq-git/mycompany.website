  body: "<img src=\"/assets/uploads/richtext-20260612062733-17a11b5e.webp\"><div><p><b>Improvement\r\
    \n</b><br>In version V0.4, we solved the extension issue in version V0.3 and optimized\
    \ the connection between the product and the extension\r\n<br>\r\n<br><ul><li>Change\
    \ the straight edge of the screw hole in the triangle to a slanted edge for smoother\
    \ connection.\r\n</li><li>Added extension of camera module.\r\n</li><li>Added\
    \ antenna interface,\r\n</li><li>Added two rows of wiring terminals\r\n</li></ul><b>Issues\r\
    \n</b><br><ul><li>When the straight triangular grooves are connected, they may\
    \ not be coherent.\r\n</li><li>The reserved space for a wiring terminal may not\
    \ be sufficient\r\n</li><li>Poor signal in indoor or enclosed spaces.\r\n</li><li>Issues\
    \ with device expansion</li></ul><div><img src=\"/assets/uploads/richtext-20260612062832-8bcbae9c.webp\"\
    ></div></p></div>"
