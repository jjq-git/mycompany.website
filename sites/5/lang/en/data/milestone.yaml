  description: Prototype v0.2 In V0.1, we established the rough prototype of the product, but there were some problems which we not satified, and after intense discussions,
  body: ''
  cover: /assets/uploads/milestone-cover-20260612063310-165ed70b.webp
  style_bg-color: ''
  seo_title: Prototype v0.2
  seo_description: RIMU presents Prototype v0.2, refining the product design by removing the infrared head-up module, relocating interfaces, and adding a 1/4 standard connector for expansion devices
  detail_content_blocks:
  - type: image
    image: /assets/uploads/richtext-20260612063147-807651fb.webp
    alt: ''
  - type: text
    text: In V0.1, we established the rough prototype of the product, but there were some problems which we not satified, and after intense discussions, we developed V0.2 • The infrared head-up volume is too large, which affects the overall appearance on the host, and the angle is fixed, it’s not easy to use. so cancel it. • Power switches, USB and other interfaces on the right side of the host will cause problems with the layout of the circuit board v0.1 -> v0.2 • Move IR to an extension module. • changed pogo pin from 14pin to 20pin • Add copper nuts on the back • rearranged the position and number of magnets • Add a 1/4 standard connector on the top for mounting expansion devices, such as IR remoter, camra module.
  - type: image
    image: /assets/uploads/richtext-20260612063228-72aaeda7.webp
    alt: ''
  - type: text
    text: PCB We made two additional pcb for testing the IO extender, and power manage. ATTiny 1616 use attiny 1616 as extender mcu, handle indicator, beep, motor and interrupt. AP2101 The small for testing power ic functions.
