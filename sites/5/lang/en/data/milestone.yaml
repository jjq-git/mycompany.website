  seo_title: Prototype V0.0
  seo_description: RIMU's Prototype V0.0 uses an acrylic frame with an ESP32S3 MCU, 4.3-inch LCD, capacitive touch, and SD NAND storage, offering expandable IO for early-stage product development.
  detail_content_blocks:
  - type: text
    text: In the early days, we decided to use acrylic to make the outer frame of this product, but this would result in the appearance of the product appearing relatively cheap, and we did not consider the addition of batteries and other modules in the later stage.
  - type: image
    image: /assets/uploads/richtext-20260612064336-2a6c45cf.webp
    alt: ''
  - type: text
    text: We made two verison pcb, the 1st one use esp32s3 wroom module, and the 2nd one, we re-layout the esp32s3 for save space. Replace tf card by sd nand.
  - type: image
    image: /assets/uploads/richtext-20260612064349-62fd11d0.webp
    alt: ''
  - type: text
    text: The mcu can do many things, and get the information from the screen, also can input information throught touch panel. • 4.3inch LCD screen as output • capacitive touch as input • storage the data in tf card • 15 more IO ports are available for expansion for further information, please check v0.1 prototype.
