- id: 3
  title: Prototype v0.3
  slug: prototype-v03
  date: '2026-06-12'
  description: Prototype V0.3 Improvement Add photoelectric sensor to protect electronic
    components on the host PCB Change the shape of the screw hole to a triangle to
  body: "<img src=\"/assets/uploads/richtext-20260612062939-5b3e9332.webp\"><div><p><b>Improvement\r\
    \n</b><br><ul><li>Add photoelectric sensor to protect electronic components on\
    \ the host PCB\r\n</li><li>Change the shape of the screw hole to a triangle to\
    \ better coordinate with the added photoelectric switch hole\r\n</li><li>Add buckles\
    \ to the host and expansion box to prevent detachment\r\n</li><li>Add expansion\
    \ connectors on the side\r\n</li></ul><b>PCB\r\n</b><br><ul><li>power chip shortage,\
    \ we have to change it.\r\n</li><li>Can not manage the battery throught I2C.\r\
    \n</li></ul><b>Issues\r\n</b><br>In the previous V0.2 version, we resolved the\
    \ defects that existed in the previous two versions, but after the designers’\
    \ consideration, there are still some areas that need improvement, so we redesigned\
    \ the V0.3 version\r\n<br>\r\n<br><ul><li>Simply relying on magnetic suction to\
    \ fix each module may damage the electronic components on the host PCB\r\n</li><li>Unstable\
    \ connection of single screw hole shape The magnetic suction structure is not\
    \ stable enough Post expansion connection issues</li></ul><div><img src=\"/assets/uploads/richtext-20260612063040-8c74470e.webp\"\
    ></div><div><img src=\"/assets/uploads/richtext-20260612063054-9d63aeda.webp\"\
    ></div></p></div>"
  cover: /assets/uploads/milestone-cover-20260612063055-7cff464f.webp
