- id: 1
  title: Prototype v0.5
  slug: prototype-v05
  description: Prototype V0.5(Final) After several iterations and optimizations, we
    have finally finalized the communication scheme between the host and the modules.  This
    scheme prioritizes the use
  body: "<img src=\"/assets/uploads/richtext-20260612062422-870aeb60.webp\"><div><p>After\
    \ several iterations and optimizations, we have finally finalized the communication\
    \ scheme between the host and the modules. \r\n<br>\r\n<br>This scheme prioritizes\
    \ the use of the I2C protocol to ensure efficient and stable communication between\
    \ the host and each module. \r\n<br>\r\n<br>Each module needs to add a single\
    \ component to support I2C communication, which increases the cost by approximately\
    \ $2. \r\n<br>\r\n<br>However, this significantly improves the freedom of the\
    \ modules and supports a host connecting to multiple modules simultaneously.</p><p><b>Improvement\r\
    \n</b><br></p><ul><li>Replacing the back clip connector with a mini HDMI\r\n</li><li>Move\
    \ all the interfaces on the module to the top.\r\n</li><li>Preferentially use\
    \ I2C to communicate with the module.\r\n</li><li>Remove the temperature sensor\
    \ from the host. The I2C.\r\n</li><li>standard for all modules. </li></ul><p></p><div><br></div></div>"
  cover: /assets/uploads/milestone-cover-20260612063539-c370ca0e.webp
