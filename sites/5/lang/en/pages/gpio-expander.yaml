    body: <table data-rte-border="1" data-rte-widths="1"><colgroup><col style="width:50%"><col
      style="width:50%"></colgroup><tbody><tr><td style="width:50%;"><div>This module
      is primarily designed for engineers with a certain level of electronic knowledge.
      The module is equipped with 8 I/O channels, of which 4 are digital input/output
      and 4 are analog input/output. It also provides multiple power interfaces, making
      it easy to drive other devices and read different types of sensors. If the operating
      voltage of the peripheral devices is 5V or 3.3V, they can be powered directly
      by the host, but please note that the current limit is 200mA. Additionally,
      you can use an external power supply to power both the module and your devices.
      While providing power, the external power supply will also charge the host.</div></td><td
      style="width:50%;"><div><ul><li>Relay module (up to 8 channels) </li><li>MOSFET
      module </li><li>Generate PWM waveforms </li><li>Read sensor values </li></ul></div><div>&nbsp;
