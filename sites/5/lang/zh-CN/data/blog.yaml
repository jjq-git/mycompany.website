- id: 5
  title: Rimu 的键盘功能
  slug: keyboard-function-of-rimu
  description: 键盘在我们的日常生活中至关重要。大多数用户将左手放在键盘上，右手使用鼠标。
  cover: /assets/uploads/blog-cover-20260611111327-bb0656bc.webp
  style_bg-color: ''
  modules:
  - type: item_data
    order: 1
    variant: default
    data: {}
  body: "<div><h4><img src=\"/assets/uploads/richtext-20260612033207-e81df55d.webp\"\
    ></h4></div><div><p>键盘在我们的日常生活中至关重要。大多数用户将左手放在键盘上，右手使用鼠标。\r\n<br>\r\n<br>但像 Photoshop\
    \ 和 KiCad 这样的复杂软件通常需要跨越整个键盘的复杂快捷键。这使得单手操作变得困难，往往需要双手配合，从而打乱工作流程并降低效率。\r\n<br>\r\
    \n<br>针对上述问题，市场上已有一些专业且成熟的解决方案，例如 3Dconnexion 的产品。这些产品符合人体工程学设计，但价格较高。例如，SpaceMouse\
    \ 在其官网上的售价为 399 美元。相比之下，Rimu 的 HID 键盘功能作为主机的配件，计划售价为 110 美元。其紧凑的设计完美贴合在键盘左侧上方，让快速屏幕交互变得轻松自如。如果你不是键盘设备的重度用户，Rimu\
    \ 完全可以满足你的需求。</p><p><img src=\"/assets/uploads/richtext-20260612032402-441b3ba9.webp\"\
    ></p><p>Rimu 采用 ESP32-S3 作为主控制器，实现了 HID 键盘功能。我们将通常需要双手操作的快捷键整合到一个 4.3 英寸的触摸屏上，实现单手操作。用户可以根据需要自定义特定快捷键。目前，Rimu\
    \ 预装了六个应用程序，分别针对 KiCad、Photoshop、批量输入、CNC、YouTube 和 VLC。</p><p></p><h4><b>Rimu\
    \ HID 键盘功能\r\n</b></h4>以下视频展示了我们在 YouTube 平台上的 HID 键盘功能。<br><br><p></p><h4><b>应用</b></h4></div><div><p><b>01.\
    \ KiCad\r\n</b><br>我们的硬件工程师在 KiCad 中设计 PCB 时，经常左手放在键盘上，右手放在鼠标上。然而，当快捷键需要的按键次数超出左手能力时，他们不得不松开鼠标来完成操作。例如：</p><p>PCB\
    \ 环境中的快捷键：\r\n<br>\r\n<br></p><ul><li>重新计算路径：Ctrl + X\r\n</li><li>结束画线：Esc 或 End\r\
    \n</li><li>组件锁定/解锁：L（锁定/解锁）\r\n</li><li>删除：Delete 或 Backspace\r\n</li></ul>原理图环境中的快捷键：<br>\r\
    \n<br><ul><li>添加电源符号：P（然后选择电源类型）\r\n</li><li>添加网络标签：L\r\n</li><li>重复上一项：Ins\r\n\
    </li><li>删除：Delete 或 Backspace\r\n</li></ul>我们的工程师发现 Rimu 增强的 KiCad 快捷键功能非常实用，显著提高了他们的工作流程效率，带来了更流畅的用户体验。<p></p><p><img\
    \ src=\"/assets/uploads/richtext-20260612032646-381d6163.webp\"></p><p></p><h4><b>02.\
    \ Photoshop\r\n</b></h4>Photoshop 是一款功能强大的图像编辑工具，提供了丰富的快捷键功能。大多数用户在使用 PS 时左手放在键盘上，右手放在鼠标上。然而，在与经常使用\
    \ PS 的朋友讨论后，我们发现一些快捷键操作不太方便，往往需要双手完成。例如：\r\n<br>\r\n<br><ol><li>将所选图层移到顶部：Ctrl\
    \ + Shift + ]\r\n</li><li>将所选图层移到底部：Ctrl + Shift + [\r\n</li><li>通过选区创建新图层：Ctrl\
    \ + Shift + N\r\n</li><li>反选：Shift + Ctrl + I\r\n</li><li>上移图层：Ctrl + ]\r\n</li><li>下移图层：Ctrl\
    \ + [\r\n</li><li>创建新图层：Ctrl + J\r\n</li><li>填充颜色：Alt + Delete</li></ol><div></div><p></p><p>在朋友测试了\
    \ Rimu 优化的 PS 快捷键后，他给予了非常积极的反馈，强调效率和用户体验显著提升。</p><p><img src=\"/assets/uploads/richtext-20260612032735-98b75b74.webp\"\
    ></p><p></p><h4><b>03. 批量输入\r\n</b></h4>厌倦了重复输入文本或复制粘贴？Rimu 的自定义批量输入功能允许你一键插入长段落或固定短语，在消息、文档或评论等场景中提高效率。<p></p><p><img\
    \ src=\"/assets/uploads/richtext-20260612032802-d6c732b0.webp\"></p><p>虽然 Rimu\
    \ 能够执行所有 Bad USB 功能，但我们的主要重点是帮助用户提高日常生活中的效率。产品发布后，我们将开源代码并提供全面的教程，让对 Bad USB 功能感兴趣的爱好者和极客能够快速上手。</p><p><img\
    \ src=\"/assets/uploads/richtext-20260612032826-de0d7922.webp\"></p><p><b>04.\
    \ 小众设备\r\n</b><br>在大规模生产环境中，许多机器依赖鼠标或键盘控制的软件。然而，键盘的紧凑性增加了意外按键的风险，可能导致安全隐患。为了降低这种风险，我们在\
    \ CNC 机器的控制键上实施了醒目的标签。\r\n<br>\r\n<br>基于这一需求，Rimu 通过三个直观的按钮——开始、暂停和停止——简化了 CNC\
    \ 操作。这种设计防止了意外按压，并确保即使是不识字的工人也能轻松操作。</p><p><img src=\"/assets/uploads/richtext-20260612033411-3b546ae6.webp\"\
    ></p><p>未来，我们计划利用 Rimu 的 IO 扩展模块，使物理按钮能够触发命令，让 Rimu 适应更多使用场景。</p><p><img src=\"\
    /assets/uploads/richtext-20260612033501-7a3ea269.webp\"></p><p><b>05. 其他应用\r\n\
    </b><br>在 YouTube 或 VLC 上观看视频应该是一种放松，而不是麻烦。特别是当你想躺在床上或靠在椅子上看视频，却因为不想起身找鼠标或键盘而感到不便时，这可能会非常不舒服。摸索鼠标或键盘来暂停、调节音量或切换全屏会破坏体验。\r\
    \n<br>\r\n<br>有了 Rimu，所有基本控制尽在指尖。告别中断，享受前所未有的无缝、轻松观看体验。</p><p><img src=\"/assets/uploads/richtext-20260612033432-59f5720f.webp\"\
    ></p><p><b>结论\r\n</b><br>这是我们系列的第二篇文章，继第一篇介绍了 RIMU 的整体设计和结构之后。作为我们的首篇博客文章，我们也在\
    \ Medium 和 Instructables 上以多种语言分享，我们还更新了另一篇关于 RIMU 键盘功能的文章。\r\n<br>\r\n<br>如果您有任何问题，请随时给我们留言或加入我们的社区进行讨论。</p><p><br></p></div>"
  seo_title: Rimu 的键盘功能
  seo_description: RIMU 是一款紧凑型 HID 键盘配件，通过4.3英寸触摸屏将复杂快捷键整合为单手操作，支持KiCad、Photoshop等软件，提升工作效率。
  category: RIMU
  tags: []
- id: 6
  title: RIMU：弥合人与技术之间的鸿沟
  slug: between-humans-and-technology
  description: 设计理念 在这个日益互联的世界里，我们经常遇到现成解决方案无法满足需求的情况。
  cover: /assets/uploads/blog-cover-20260611111450-6a2fa2f0.webp
  style_bg-color: ''
  modules:
  - type: item_data
    order: 1
    variant: default
    data: {}
  body: "<div><p><img src=\"/assets/uploads/richtext-20260612034038-559c86ce.webp\"\
    ><b></b></p><p><b>设计理念\r\n</b><br>在这个日益互联的世界里，我们经常遇到现成解决方案无法满足需求的情况。\r\n<br>\r\
    \n<br>无论是自动化你的家、优化你的工作空间，还是创造独特的互动体验，设计和构建定制设备的需求随之而来。想象一下，制作一个能轻松控制家中照明、精确符合你偏好的设备。这个过程需要深入电路板设计的复杂性，掌握复杂的编程语言，并精心制作保护外壳。</p><p><img\
    \ src=\"/assets/uploads/richtext-20260612033627-b41023e3.webp\"></p><p>这个过程不仅耗时，还需要高度的专业知识和技能，对大多数非专业人士来说是一个巨大的挑战。即使是经验丰富的开发者，也可能因重复性任务而感到沮丧和不堪重负。此外，技术要求和解决方案往往存在大量重叠，导致许多人投入时间和资源解决类似问题，造成重复劳动。\r\
    \n<br>\r\n<br>基于以上原因，我们构思了RIMU，以帮助开发者和制造商高效实现他们的创意愿景。RIMU提供集成、用户友好的解决方案，节省用户在硬件设计、软件开发和制造上的时间和精力。我们的使命是通过提供一个支持性的集成平台来赋能创新者，使他们能够专注于自己的优势。</p><p><img\
    \ src=\"/assets/uploads/richtext-20260612033647-64c06cba.webp\"></p><p><b>硬件\r\
    \n</b><br>Rimu是一款多功能设备，搭载强大的ESP32芯片，拥有384 KB ROM、512 KB SRAM、16 KB RTCSRAM和16\
    \ MB PSRAM，以及8 GB存储空间。其4.3英寸TFT触摸屏显示器提供生动的480 x 800像素分辨率，支持262K颜色，并由ILI9806或HX8369显示控制器驱动。</p><p><img\
    \ src=\"/assets/uploads/richtext-20260612033706-026ade89.webp\"></p><p><b>结构\r\
    \n</b><br><b>01. 尺寸信息\r\n</b><br>RIMU紧凑（118 x 73 x 15.9毫米），配备时尚的4.3英寸屏幕，提供令人印象深刻的880\
    \ x 480像素分辨率。凭借Wi-Fi、蓝牙和GPIO引脚，它拥有无与伦比的可扩展性，可无缝集成各种传感器、执行器和外设。</p><p><img src=\"\
    /assets/uploads/richtext-20260612033731-e3de2de7.webp\"></p><p><b>02. 磁吸结构\r\n\
    </b><br>忘记传统螺丝吧——RIMU采用创新的磁吸连接方法，让你瞬间将主机和模块扣在一起。镀金弹簧针确保耐用性和顺畅操作，使任何人都能轻松使用，无需麻烦。\r\
    \n<br>\r\n<br><b>03. 外部天线结构\r\n</b><br>我们的设备为各种环境提供无与伦比的灵活性。无论你需要将其封装在金属外壳中，还是放置在远离无线接入点的地方，我们都能满足你的需求。专用的外部天线接口确保即使在挑战性条件下也能获得最佳信号接收。凭借改进的信号质量和扩展的覆盖范围，你可以享受更可靠的连接。不需要时，该接口还可作为挂绳连接点，方便携带。</p><p><img\
    \ src=\"/assets/uploads/richtext-20260612033801-659986d9.webp\"></p><p><b>04.\
    \ 三脚架结构\r\n</b><br>凭借特殊设计的螺丝孔，RIMU可以轻松安装到标准三脚架上，赋予其在工业自动化、科学研究和教育中处理复杂任务的稳定性和多功能性。三脚架提高了工作精度，使RIMU比以往更具适应性。</p><div><img\
    \ src=\"/assets/uploads/richtext-20260612033821-46a99fce.webp\"></div></div><div><p><b>05.\
    \ DIN35结构\r\n</b><br>无论是用于电气控制还是自动化系统，RIMU支持DIN35导轨，可轻松连接传感器、配电盘等——非常适合工业和电气环境。</p><p><img\
    \ src=\"/assets/uploads/richtext-20260612033847-845bb56b.webp\"></p><p><b>功能\r\
    \n</b><br>我们将无需额外模块即可实现的许多有趣功能称为功能。借助Rimu的4.3英寸触摸屏，你可以享受个性化体验，功能包括计算器、世界时钟、闹钟、尺子、单位转换器、蓝牙等。我们不断探索新功能，以提升你的日常生活。</p><p><img\
    \ src=\"/assets/uploads/richtext-20260612033911-cba331d0.webp\"></p><p><b>模块\r\
    \n</b><br>RIMU的模块化设计降低了硬件成本并促进了可持续性。你只需为所需部分付费，没有不必要的额外费用。这种设计还使升级、维护和扩展产品变得容易，同时延长其生命周期并减少浪费。\r\
    \n<br>\r\n<br>我们已经开发了强大的模块，包括RFID、DMX512、步进电机、GPIO、继电器和光矩阵，并且我们正在不断扩展我们的库，以增强RIMU的智能性和适应性。 </p><p><img\
    \ src=\"/assets/uploads/richtext-20260612033939-ef123d6c.webp\"></p><p><b>总结\r\
    \n</b><br>鉴于RIMU是一个相对较新的产品，我们创建了这个初学者指南，以帮助用户更好地理解其设计理念。作为我们的首篇博客文章，我们也在Medium和Instructables上以多种语言分享它。我们还会更新另一篇关于RIMU键盘功能的文章。\r\
    \n<br>\r\n<br>如果你有任何问题，请随时给我们留言或加入我们的社区进行讨论。</p></div>"
