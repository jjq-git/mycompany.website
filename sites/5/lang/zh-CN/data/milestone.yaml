- id: 1
  title: 原型 v0.5
  slug: prototype-v05
  description: 原型 V0.5（最终版）经过多次迭代和优化，我们最终确定了主机与模块之间的通信方案。该方案优先使用
  body: "<img src=\"/assets/uploads/richtext-20260612062422-870aeb60.webp\"><div><p>经过多次迭代和优化，我们最终确定了主机与模块之间的通信方案。\r\
    \n<br>\r\n<br>该方案优先使用 I2C 协议，以确保主机与每个模块之间高效稳定的通信。\r\n<br>\r\n<br>每个模块需要增加一个组件来支持\
    \ I2C 通信，这将使成本增加约 2 美元。\r\n<br>\r\n<br>然而，这显著提高了模块的自由度，并支持一台主机同时连接多个模块。</p><p><b>改进\r\
    \n</b><br></p><ul><li>将背夹连接器替换为 mini HDMI\r\n</li><li>将所有模块上的接口移至顶部。\r\n</li><li>优先使用\
    \ I2C 与模块通信。\r\n</li><li>移除主机上的温度传感器。I2C。\r\n</li><li>所有模块的标准。 </li></ul><p></p><div><br></div></div>"
  cover: /assets/uploads/milestone-cover-20260612063539-c370ca0e.webp
  style_bg-color: ''
  modules:
  - type: item_data
    order: 1
    variant: default
    data: {}
  seo_title: 原型 v0.5
  seo_description: RIMU原型v0.5最终版采用I2C协议实现主机与模块高效稳定通信，支持多模块同时连接，成本仅增加约2美元，并优化了接口布局与连接器设计。
- id: 2
  title: 原型 v0.4
  slug: prototype-v04
  date: '2026-06-12'
  description: 原型 V0.4 改进 在 V0.4 版本中，我们解决了 V0.3 版本的扩展问题，并优化了产品与扩展之间的连接变更
  body: "<img src=\"/assets/uploads/richtext-20260612062733-17a11b5e.webp\"><div><p><b>改进\r\
    \n</b><br>在 V0.4 版本中，我们解决了 V0.3 版本的扩展问题，并优化了产品与扩展之间的连接\r\n<br>\r\n<br><ul><li>将三角形中螺丝孔的直边改为斜边，以实现更平滑的连接。\r\
    \n</li><li>新增摄像头模块的扩展。\r\n</li><li>新增天线接口。\r\n</li><li>新增两排接线端子\r\n</li></ul><b>问题\r\
    \n</b><br><ul><li>当直三角形凹槽连接时，可能不连贯。\r\n</li><li>接线端子的预留空间可能不足\r\n</li><li>室内或封闭空间信号差。\r\
    \n</li><li>设备扩展问题</li></ul><div><img src=\"/assets/uploads/richtext-20260612062832-8bcbae9c.webp\"\
    ></div></p></div>"
  cover: /assets/uploads/milestone-cover-20260612063518-702faacb.webp
  style_bg-color: ''
  modules:
  - type: item_data
    order: 1
    variant: default
    data: {}
  seo_title: 原型 v0.4
  seo_description: RIMU 原型 v0.4 优化了产品与扩展连接，将螺丝孔直边改为斜边，新增摄像头模块、天线接口和两排接线端子，解决扩展问题并提升连接平滑度。
- id: 3
  title: 原型 v0.3
  slug: prototype-v03
  date: '2026-06-12'
  description: 原型 V0.3 改进 添加光电传感器以保护主机 PCB 上的电子元件 将螺丝孔形状改为三角形以
  body: "<img src=\"/assets/uploads/richtext-20260612062939-5b3e9332.webp\"><div><p><b>改进\r\
    \n</b><br><ul><li>添加光电传感器以保护主机 PCB 上的电子元件\r\n</li><li>将螺丝孔形状改为三角形，以更好地配合新增的光电开关孔\r\
    \n</li><li>在主机和扩展盒上添加卡扣以防止脱落\r\n</li><li>在侧面添加扩展连接器\r\n</li></ul><b>PCB\r\n</b><br><ul><li>电源芯片短缺，我们不得不更换它。\r\
    \n</li><li>无法通过 I2C 管理电池。\r\n</li></ul><b>问题\r\n</b><br>在之前的 V0.2 版本中，我们解决了前两个版本中存在的缺陷，但经过设计师的考虑，仍有一些需要改进的地方，因此我们重新设计了\
    \ V0.3 版本\r\n<br>\r\n<br><ul><li>仅依靠磁吸固定每个模块可能会损坏主机 PCB 上的电子元件\r\n</li><li>单个螺丝孔形状连接不稳定\
    \ 磁吸结构不够稳固 扩展后连接问题</li></ul><div><img src=\"/assets/uploads/richtext-20260612063040-8c74470e.webp\"\
    ></div><div><img src=\"/assets/uploads/richtext-20260612063054-9d63aeda.webp\"\
    ></div></p></div>"
  cover: /assets/uploads/milestone-cover-20260612063055-7cff464f.webp
  style_bg-color: ''
  modules:
  - type: item_data
    order: 1
    variant: default
    data: {}
  seo_title: 原型 v0.3
  seo_description: RIMU原型v0.3版本在主机与扩展盒上新增光电传感器保护PCB元件，优化三角形螺丝孔与卡扣结构，解决磁吸不稳与连接问题，提升模块化设备可靠性。
- id: 4
  title: 原型 v0.2
  slug: prototype-v02
  date: '2026-06-12'
  description: 原型 v0.2 在 v0.1 中，我们建立了产品的粗略原型，但存在一些我们不满意的问题，经过激烈讨论后，
  body: "<img src=\"/assets/uploads/richtext-20260612063147-807651fb.webp\"><div><p>在\
    \ V0.1 中，我们确立了产品的粗略原型，但存在一些不尽如人意的问题，经过激烈讨论后，我们开发了 V0.2\r\n<br>\r\n<br></p><ul><li>红外抬头显示体积过大，影响主机整体外观，且角度固定，不易使用，因此取消。\r\
    \n</li><li>主机右侧的电源开关、USB 等接口会导致电路板布局出现问题。\r\n</li></ul><b>v0.1 -> v0.2\r\n</b><br><ul><li>将红外移至扩展模块。\r\
    \n</li><li>将 pogo pin 从 14pin 改为 20pin\r\n</li><li>在背面增加铜螺母\r\n</li><li>重新调整磁铁的位置和数量\r\
    \n</li><li>在顶部增加一个 1/4 标准接口，用于安装扩展设备，如红外遥控器、摄像头模块。</li></ul><div><img src=\"/assets/uploads/richtext-20260612063228-72aaeda7.webp\"\
    ></div><div></div><p></p><p><b>PCB\r\n</b><br>我们额外制作了两块 PCB 用于测试 IO 扩展器和电源管理。\r\
    \n<br>\r\n<br><b>ATTiny 1616\r\n</b><br>使用 attiny 1616 作为扩展 MCU，处理指示灯、蜂鸣器、电机和中断。\r\
    \n<br>\r\n<br><b>AP2101\r\n</b><br>用于测试电源 IC 功能的小型芯片。</p><p></p><p><video class=\"\
    elementor-video\" width=\"100%\" src=\"https://rimu.me/wp-content/uploads/2024/05/v02_discussion_03.mp4\"\
    \ controls=\"\" preload=\"metadata\" controlslist=\"nodownload\"></video></p></div>"
  cover: /assets/uploads/milestone-cover-20260612063310-165ed70b.webp
  style_bg-color: ''
  modules:
  - type: item_data
    order: 1
    variant: default
    data: {}
  seo_title: 原型 v0.2
  seo_description: RIMU 原型 v0.2 优化了产品结构，将红外模块移至扩展组件，新增1/4标准接口与铜螺母，并引入ATTiny 1616与AP2101芯片以提升电源与IO管理性能。
- id: 5
  title: 原型 V0.1
  slug: prototype-v01
  date: '2026-06-12'
  description: 原型 V0.1 构思 第一个版本实现了一些功能，但也发现了一些其他问题。这些问题需要在后期改进
  body: "<p><b>构思\r\n</b><br>第一个版本实现了一些功能，但也发现了一些其他问题。这些问题需要在后期设计中改进。请查看 V0.2 了解更多信息。\r\
    \n<br>\r\n<br><ul><li>模块化产品结构\r\n</li><li>定制 POGO 引脚\r\n</li><li>磁铁吸附\r\n</li><li>带红外收发窗口\r\
    \n</li><li>尺寸设定为 132x32mm</li></ul><div><img src=\"/assets/uploads/richtext-20260612063653-5bd1f692.webp\"\
    ></div><div></div></p><p><b>硬件\r\n</b><br><ul><li>开关和指示灯连接到 I/O 端口\r\n</li><li>时钟功能\r\
    \n</li><li>电池与充电\r\n</li></ul><b>概述\r\n</b><br>拿到原型后，我们的团队进行了多次头脑风暴，发现了许多需要改进的地方。更多信息请查看\
    \ v0.2 帖子。</p><p><img src=\"/assets/uploads/richtext-20260612063722-a749e2ba.webp\"\
    ></p><p><b>PCB\r\n</b><br>由于上述问题，我们只设计了 PCB，没有焊接元件。</p><p><img src=\"/assets/uploads/richtext-20260612063742-41c4a1a5.webp\"\
    ></p>"
  cover: /assets/uploads/milestone-cover-20260612063745-d5f2b0ca.webp
  style_bg-color: ''
  modules:
  - type: item_data
    order: 1
    variant: default
    data: {}
  seo_title: 原型 V0.1
  seo_description: RIMU 原型 V0.1 展示了模块化产品结构、定制 POGO 引脚、磁铁吸附及红外收发窗口等硬件设计，团队通过测试发现多项待改进问题，为后续版本优化奠定基础。
- id: 6
  title: 原型 V0.0
  slug: prototype-v00
  date: '2026-06-12'
  description: 原型 V0.0 在早期，我们决定使用亚克力制作该产品的外框，但这会导致
  body: "<p>在早期，我们决定使用亚克力制作该产品的外框，但这会导致产品外观显得较为廉价，且我们未考虑后期电池及其他模块的添加。</p><p><img src=\"\
    /assets/uploads/richtext-20260612064336-2a6c45cf.webp\"></p><p>\r\n<br>我们制作了两个版本的PCB，第一个版本使用esp32s3\
    \ wroom模块，第二个版本则重新布局esp32s3以节省空间。\r\n<br>\r\n<br>将TF卡替换为SD NAND。</p><p><img src=\"\
    /assets/uploads/richtext-20260612064349-62fd11d0.webp\"></p><p>MCU可执行多种功能，从屏幕获取信息，也可通过触摸面板输入信息。\r\
    \n<br>\r\n<br></p><ul><li>4.3英寸LCD屏幕作为输出\r\n</li><li>电容式触摸作为输入\r\n</li><li>数据存储在TF卡中\r\
    \n</li><li>提供15个以上IO端口用于扩展\r\n</li></ul>更多信息，请查看v0.1原型。<p></p><p><img src=\"/assets/uploads/richtext-20260612064408-be1e33e2.webp\"\
    ></p><p></p><p><video class=\"elementor-video\" width=\"100%\" src=\"https://rimu.me/wp-content/uploads/2024/06/DIS_3774_1-1.mp4\"\
    \ controls=\"\" preload=\"metadata\" controlslist=\"nodownload\"></video></p>"
  cover: /assets/uploads/milestone-cover-20260612064409-8b66f229.webp
  style_bg-color: ''
  modules:
  - type: item_data
    order: 1
    variant: default
    data: {}
  seo_title: 原型 V0.0
  seo_description: RIMU产品原型V0.0采用亚克力外框与ESP32S3芯片，配备4.3英寸LCD屏幕和电容式触摸输入，支持TF卡存储及15个以上IO扩展端口，为智能硬件开发提供灵活的基础平台。
