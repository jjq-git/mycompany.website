  description: "<p>基础四则运算计算器：数字 / 运算符键盘 + 大字显示，自动把每次运算结果记入左侧历史。</p><p><ul><li>左上显示区：当前输入或计算结果，右对齐大号白字。\r\n</li><li>左下历史区：已完成的算式列表（a 运算符 b = 结果），最新一条在最下方。\r\n</li><li>右侧按键矩阵：4 列 x 5 行。\r\n</li></ul></p><blockquote style=\"margin: 0 0 0 40px; border: none; padding: 0px;\"><p>数字键：0~9 和小数点 .。\r\n</p><p>运算符键：/（除）、*（乘）、-（减）、+（加）。\r\n</p><p>功能键：CE（清除当前项）、C（全部清零）、+/-（正负号）、=（等号求值）。</p></blockquote>"
