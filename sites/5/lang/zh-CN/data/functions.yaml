  - type: text
    text: 小贴士 C 与 CE 区别：C 把整个算式（含历史当前行）清空归零，CE 只清掉当前正在输入的那一项。 +/- 给当前数字取反；. 输入小数，除数为 0 时显示 divider can't be zero!。 长按左下历史区可弹出设置：开关“记录历史”、一键“清除历史”。 历史最多约保留 10 条算式，超出后从最早的开始顶替。 历史与“记录历史”开关在真机上断电也会保存；模拟器（WASM）用 NVS 桩，仅当次会话有效，不跨会话保存。
