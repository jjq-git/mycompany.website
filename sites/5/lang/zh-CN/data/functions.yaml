  embed_url: /media-packages/wf1f_color_code_res-20260630085447-4382a3df/
  detail_content_blocks:
  - type: heading
    title: 操作步骤
  - type: text
    text: 第 1 步 选电阻类型并点第 1 道色环颜色 先点顶部 4 / 5 / 6 Band 选好色环数（图中为 5 Band），再点第 1 道色环，底部出现数字色块，点对应颜色（如 Red = 2），第 1 道即染成红色。
  - type: image
    image: /assets/uploads/richtext-20260630035557-dbcb3057.svg
    alt: ''
  - type: text
    text: 第 2 步 点第 2 道色环颜色 第 1 道已变红并显示 2。点第 2 道色环，在底部选它的颜色（如 Black = 0），第 2 道随之上色。后续有效数字道（5 / 6 Band 的第 3 道）同样操作。
  - type: image
    image: /assets/uploads/richtext-20260630035629-a66fa533.svg
    alt: ''
  - type: text
    text: 第 3 步 选乘数环颜色 有效数字道选完后，点乘数环，底部色块自动切换为乘数图例（Silver ×0.01 … White ×1G）。点对应颜色（如 Blue = ×1M），乘数环显示 x 1M。
  - type: image
    image: /assets/uploads/richtext-20260630035701-cd4dbdba.svg
    alt: ''
  - type: text
    text: 第 4 步 读阻值结果 最后一道公差环也选好后，所有色环集齐，电阻体上方自动显示最终阻值与公差，例如 200MR 2%（即 200 MΩ ±2%）。
  - type: image
    image: /assets/uploads/richtext-20260630035727-410a7689.svg
    alt: ''
  - type: text
    text: 小贴士 • 必须把当前类型要求的每一道色环都选齐，顶部才会显示结果；少选一道则不显示。 • 切换 4 / 5 / 6 Band 会清空已选颜色，从头再来。 • 底部色块会随当前所选色环的用途自动变化：有效数字道显示 0–9，乘数环显示倍率，公差/温漂环显示百分比 / ppm。 • 结果里的 R 代表欧姆 Ω，K / M / G 为千 / 兆 / 吉欧。
