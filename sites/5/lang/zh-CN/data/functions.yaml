  - type: text
    text: 第 1 步 打开秒表 进入后显示 00:00:00.00，状态为 READY，下方提示 No laps yet（暂无分段）。
  - type: image
    image: /assets/uploads/richtext-20260630073545-9ba27d84.svg
    alt: ''
  - type: text
    text: 第 2 步 开始计时 点右上角的 ▶ 开始 按钮，数字开始跳动，状态变为 RUNNING。
  - type: image
    image: /assets/uploads/richtext-20260630073551-7f4521b6.svg
    alt: ''
  - type: text
    text: 第 3 步 记录分段（可选） 计时过程中点右下角的 🚩 分段 按钮，把当前用时记一条到下方列表，最新的在最上面。
