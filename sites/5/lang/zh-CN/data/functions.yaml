    text: 第 1 步 查看当前时间 进入后即是全屏时钟，表盘按当前时间走针，下方显示数字时间与日期，无需任何操作。
  - type: image
    image: /assets/uploads/richtext-20260630073159-78c7cbb8.svg
    alt: ''
  - type: text
    text: 第 2 步 进入闹钟设置 点右侧的 🔔 铃铛钮，表盘缩到左半，右半展开闹钟列表。
  - type: image
    image: /assets/uploads/richtext-20260630073211-d007ad31.svg
    alt: ''
  - type: text
    text: 第 3 步 新增闹钟 点列表底部的 ➕ 按钮，弹出时间选择器（最多 8 条，满 8 条后 ➕ 置灰）。
  - type: image
    image: /assets/uploads/richtext-20260630073218-f61b8bb1.svg
    alt: ''
  - type: text
    text: 第 4 步 设定时间并确认 上下拨动 时 / 分 两个滚轮选好时间，点 ✓ 确认保存；点 ✕ 取消。新增的闹钟默认开启。
  - type: image
    image: /assets/uploads/richtext-20260630073224-742760cb.svg
    alt: ''
  - type: text
    text: 第 5 步 开启 / 关闭闹钟 点闹钟条右侧的 开关：开（青色）才会到点提示，关（灰色）则保留这条但不响。
  - type: image
    image: /assets/uploads/richtext-20260630073229-7322d9e0.svg
    alt: ''
  - type: text
    text: 第 6 步 删除闹钟 把闹钟条 向左滑，右侧露出红色删除区，点 🗑 删除该条。
  - type: image
    image: /assets/uploads/richtext-20260630073235-6e545b6b.svg
    alt: ''
  - type: text
    text: 小贴士 点闹钟条上的 时间 数字可重新进入选择器修改它。 在设置态点左侧表盘，可收回到全屏时钟。 闹钟存在内存里，重启后清空，需重新设置。
