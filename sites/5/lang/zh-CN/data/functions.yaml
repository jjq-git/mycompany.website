  description: "<p style=\"text-align: left;\">此应用可让您快速解码电阻色环，可视化对应的欧姆值，并并排比较多个电阻。无论您是学生、爱好者还是专业人士，它都能帮助您避免手动查表，减少电路设计中的错误。<br></p><p></p><ul><li>顶部三个按钮：4 Band / 5 Band / 6 Band，选择电阻有几道色环，当前选中项为黄色描边。\r\n</li><li>中间灰色电阻体：上面排列着待选的色环，灰色表示尚未上色。\r\n</li><li>底部横排色块：颜色选择器，点哪个色块，当前色环就染成那个颜色并填入对应数字。\r\n</li><li>电阻体上方：全部色环选齐后显示阻值结果（如 200MR 2%，R 即欧姆 Ω）。</li></ul><p></p>"
