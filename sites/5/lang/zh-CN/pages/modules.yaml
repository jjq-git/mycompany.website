description: RIMU提供多种模块，包括GPIO扩展器、PWM、可寻址LED、电流监测器、RFID、DMX512、步进电机、音频、红外、射频及LoRa等，均通过I2C接口通信，适用于硬件扩展、数据采集与照明控制。
