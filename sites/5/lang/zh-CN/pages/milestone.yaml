    title: RIMU 的起源
    desc: 一个关于奉献与愿景的故事。定义一款产品，尤其是像 RIMU 这样注重长期支持的产品，是一段充满挑战的旅程。我们经历了无数次修改和完善，始终致力于打下坚实的基础，以便未来能够扩展并确保
      RIMU 的持续发展。这个过程耗费了大量的精力和心血，但我们坚信，每一步、每一次修改都是值得的。模块的最新版本已更新并上线。此外，我们收到了许多宝贵的建议，主要来自
      Reddit 和 Facebook 等社区。我们已将收集到的所有建议整理到社区中，并将逐一评估和实施。
