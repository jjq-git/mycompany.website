title: About
description: 德恩基自2014年起专注为展示道具提供LED灯与控制器，支持小规模生产、结构设计、电路板设计及编程。RIMU项目为开源模块堆叠系统，造型灵感源自汉字“日目”，兼顾实用与耐用。
