    title: 为什么选择RIMU
    desc: 我们是先有产品，后有名字。该产品允许你堆叠模块，使组合看起来像汉字‘日’和‘目’，而rimu是‘日目’的拼音。起初，我们想用内部项目编号wf1作为项目名称，但后来觉得太随意了。此外，我们希望这款产品能经久耐用，这个无意义的代号似乎不太合适。在内部，我们仍会将其命名为wf1。Logo也源自‘日目’。
