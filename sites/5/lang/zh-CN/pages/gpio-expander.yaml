    body: <table data-rte-border="1" data-rte-widths="1"><colgroup><col style="width:50%"><col
      style="width:50%"></colgroup><tbody><tr><td style="width:50%;"><div>本模块主要面向具备一定电子知识的工程师设计。模块配备8个I/O通道，其中4个为数字输入/输出，4个为模拟输入/输出。同时提供多种电源接口，便于驱动其他设备及读取不同类型传感器。若外设工作电压为5V或3.3V，可直接由主机供电，但请注意电流限制为200mA。此外，您可使用外部电源同时为模块和设备供电，外部电源在供电的同时还会为主机充电。</div></td><td
      style="width:50%;"><div><ul><li>继电器模块（最多8通道） </li><li>MOSFET模块 </li><li>生成PWM波形
      </li><li>读取传感器值 </li></ul></div><div>&nbsp; &nbsp; &nbsp;角度传感器 </div><div>&nbsp;
      &nbsp; &nbsp;0-10V接近开关 </div><div>&nbsp; &nbsp; &nbsp;光照强度传感器 </div><div>&nbsp;
      &nbsp; &nbsp;声音传感器 </div><div>&nbsp; &nbsp; &nbsp;其他传感器</div></td></tr></tbody></table><table
