title: pwm-sw-5
description: RIMU PWM SW 5 模块是一款脉冲宽度调制开关模块，支持5-24VDC输入，每通道5A，总电流20A，适用于LED灯带、直流电机、泵、电磁铁及硅胶加热器等负载的精确控制与开关。
