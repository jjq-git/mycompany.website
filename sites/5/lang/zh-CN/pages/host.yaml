title: Host
description: RIMU主机搭载ESP32S3芯片与4.3英寸彩色触摸屏，提供UART、I2C、SPI等丰富接口，支持模块扩展与快速磁吸组装，助力集中控制电子设备与传感器，专注机械工程与功能优化。
