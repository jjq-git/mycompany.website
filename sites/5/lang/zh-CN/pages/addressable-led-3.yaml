  data:
    title: 应用
    subtitle: ''
    body: "<table data-rte-border=\"0\" data-rte-widths=\"1\" style=\"width: 100%;\
      \ table-layout: fixed; border-collapse: collapse;\"><colgroup><col style=\"\
      width:50%\"><col style=\"width:50%\"></colgroup><tbody><tr><td style=\"width:\
      \ 50%; border-width: medium; border-style: none; border-color: currentcolor;\
      \ border-image: initial;\"><div>此可寻址LED控制器模块配备三个独立输出通道，可精确控制WS2812及其他可寻址LED灯。用户可通过触摸屏界面直观设置任意单个LED的颜色，该模块可驱动自定义长度的LED灯带。\r\
      \n</div><div>\r\n</div><div>它采用高效电源管理系统，支持5V、12V和24V输入电压，在为LED稳定供电的同时，还能为主机设备充电。对于更大或更复杂的照明设置，多个控制器模块可无缝级联，非常适合DIY电子、智能显示或创意装置中的可扩展照明解决方案。</div></td><td\
      \ style=\"width: 50%; border-width: medium; border-style: none; border-color:\
      \ currentcolor; border-image: initial;\"><div><ul><li>5v/12/24v LED灯带\r\n</li><li>5v\
      \ LED模块\r\n</li><li>12v/24v RGB像素灯</li></ul></div></td></tr></tbody></table><table\
      \ data-rte-border=\"1\" data-rte-widths=\"1\"><colgroup><col style=\"width:50%\"\
      ><col style=\"width:50%\"></colgroup><tbody><tr><td style=\"width:50%;\"><img\
      \ src=\"/assets/uploads/richtext-20260612103149-13b66dd9.svg\"></td><td style=\"\
      width:50%;\"><div><div><h3><b>规格</b></h3></div><ul><li>输入\r\n</li></ul></div><div>&nbsp;\
      \ &nbsp; &nbsp;电压：5-24v\r\n</div><div>&nbsp; &nbsp; &nbsp;最大电流：20A\r\n</div><div><br></div><div><ul><li>输出\r\
      \n</li></ul></div><div>&nbsp; &nbsp; &nbsp; 最大电流：每通道7A\r\n</div><div><br></div><div><ul><li>数据手册\r\
      \n</li></ul></div><div>&nbsp; &nbsp; &nbsp;<a href=\"https://rimu.me/wp-content/uploads/2025/03/Addressable_LED_3.pdf\"\
      \ target=\"_blank\" rel=\"noopener\">addressable_led_3_sch.pdf</a>\r\n</div><div>&nbsp;\
      \ &nbsp; &nbsp;<a href=\"https://rimu.me/wp-content/uploads/2025/03/Addressable_LED_3.pdf\"\
      \ target=\"_blank\" rel=\"noopener\">addressable_led_3_dwg.pdf</a>\r\n</div><div>&nbsp;\
      \ &nbsp; <a href=\"https://rimu.me/wp-content/uploads/2025/03/Addressable_LED_3.zip\"\
      \ target=\"_blank\" rel=\"noopener\">&nbsp;addressable_led_3_dwg.dxf</a></div></td></tr></tbody></table><table\
      \ data-rte-border=\"1\" data-rte-widths=\"1\"><colgroup><col style=\"width:50%\"\
      ><col style=\"width:50%\"></colgroup><tbody><tr><td style=\"width:50%;\"><img\
      \ src=\"/assets/uploads/richtext-20260612103448-40bdc0a7.svg\"></td><td style=\"\
      width:50%;\"><h3><b>端口</b></h3><div><div><ul><li>通道A/B/C\r\n</li></ul></div><div>&nbsp;\
      \ &nbsp; &nbsp;连接至可寻址LED\r\n</div><div><br></div><div><ul><li>输入（5-24v）\r\n\
      </li></ul></div><div>&nbsp; &nbsp; &nbsp;为主机充电\r\n</div><div>&nbsp; &nbsp; &nbsp;为通道A/B/C供电\r\
      \n</div><div><br></div><div><ul><li>地址\r\n</li></ul></div><div>&nbsp; &nbsp;\
      \ &nbsp;模块地址</div></div></td></tr></tbody></table>"
