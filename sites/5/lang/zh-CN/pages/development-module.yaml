title: development-module
description: RIMU开发模块配备16个通用I/O端口，其中8个支持5V与3.3V电压切换，集成UART、I2C、SPI及PWM信号输出，并提供5-24V宽压输入与5A电流输出，满足多样化硬件扩展与调试需求。
