    title: 应用
    subtitle: ''
    body: WF1-Current 模块是一个模拟输入模块，可同时测量来自四个交流和直流探头的模拟电压/电流信号。该模块提供三个 3.5mm 耳机插孔输入和一个
      Phoenix 3.5*2 端子排输入。每个探头的电压或电流输入可通过 DIP 开关匹配，测量结果返回给主机。此外，多个模块可安装在同一主机上。
