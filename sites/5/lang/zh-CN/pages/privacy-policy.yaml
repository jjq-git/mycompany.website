  data:
    title: RIMU 隐私政策
    subtitle: ''
    body: <div><b>最后更新</b>：2025年8月12日</div><div><br></div><div><div>欢迎访问 https://rimu.me（“本网站”）。我们非常重视您的隐私，并致力于保护您的个人信息。本隐私政策解释了我们如何收集、使用和保护您的数据，以及您对您的信息所拥有的权利。</div></div><div><br></div><div><h3><b>1.
      我们是谁 </b></h3><div>我们的网站地址是：https://rimu.me </div><div> </div><h3><b>2. 评论 </b></h3><div>当访客在我们的网站留下评论时，我们会收集评论表单中显示的数据，以及访客的IP地址和浏览器用户代理字符串，用于垃圾邮件检测。
      </div><div> </div><div>由您的电子邮件地址创建的匿名化字符串（哈希值）可能会提供给Gravatar服务，以检查您是否在使用该服务。Gravatar的隐私政策可在此处查看：https://automattic.com/privacy/。
      </div><div> </div><div>在您的评论获得批准后，您的个人资料图片将在您的评论上下文中公开可见。 </div><div> </div><h3><b>3.
      媒体 </b></h3><div>如果您向网站上传图片，请避免包含嵌入式位置数据（EXIF GPS）。访客可能从图片中下载并提取位置数据。 </div><div>
      </div><h3><b>4. Cookies </b></h3><div><ul><li>当您发表评论时，您可以选择将您的姓名、电子邮件和网站保存在cookies中，以方便使用。这些cookies持续一年。
      </li><li>在登录页面上，我们设置一个临时cookie来检查您的浏览器是否接受cookies。此cookie不包含任何个人数据，并在关闭浏览器后丢弃。
      </li><li>与登录相关的cookies保存您的登录信息和屏幕显示偏好。登录cookies持续两天，屏幕选项cookies持续一年，选择“记住我”可使您保持登录状态两周。注销将删除登录cookies。
      </li><li>编辑或发布文章会在您的浏览器中设置一个额外的cookie，其中包含文章ID。此cookie在一天后过期，且不包含任何个人数据。 </li></ul></div><div>
      </div><div> </div><div> </div><div> </div><h3><b>5. 来自其他网站的嵌入内容 </b></h3><div>本网站上的文章可能包含嵌入内容（例如，视频、图片、文章）。嵌入内容的行为就像访客直接访问了其他网站。
      </div><div> </div><div>这些第三方网站可能会收集关于您的数据、使用cookies、嵌入额外的跟踪，并监控您与内容的互动。这包括如果您在该网站有账户并已登录时的跟踪。
      </div><div> </div><h3><b>6. 我们与谁共享您的数据 </b></h3><div>如果您请求重置密码，您的IP地址将包含在重置电子邮件中。
      </div><div> </div><h3><b>7. 我们保留您的数据多长时间 </b></h3><div><ul><li>评论及其元数据会无限期保留，以便自动识别和批准后续评论。
      </li><li>注册用户的个人信息存储在其用户个人资料中。用户可以随时查看、编辑或删除个人数据（用户名除外）。管理员也可以管理这些信息。 </li></ul></div><div>
      </div><div> </div><h3><b>8. 您对您的数据的权利 </b></h3><div><ul><li>如果您有账户或曾留下评论，您可以请求导出您的个人数据副本。
      </li><li>您也可以请求删除您的个人数据，但出于行政、法律或安全目的我们必须保留的信息除外。 </li></ul></div><div> </div><h3><b>9.
      您的数据发送到哪里 </b></h3><div>访客评论可能会通过自动垃圾邮件检测服务进行检查。</div></div>
    _hidden: 'false'
    style_text-align: left
