    body: <h3><b>问：我如何信任团队和项目？ </b></h3><div>RIMU 项目由 DENGTEC 开发，DENGTEC 的中文名称为“德恩基”。
      </div><div> </div><div><ul><li>“德”代表道德 </li><li>“恩”代表恩惠 </li><li>“基”代表基础 </li></ul></div><div>该公司已运营
      10 年，没有任何争议或法律问题。</div><div><br></div><div><h3><b>问：RIMU 是什么意思？ </b></h3><div>RIMU
      是“日目”的中文拼音。 </div><div> </div><div><ul><li>“日”代表太阳，看起来像主机加 1 个模块。 </li><li>“目”代表眼睛，看起来像主机加
      2 个模块。 </li></ul></div><div>不是树名 🙂</div></div><div><br></div><div><h3><b>问：这个想法是怎么来的？
      </b></h3><div>人们通常需要控制设备来满足他们的特定需求。 </div><div> </div><div>如果他们找不到现成的解决方案，就必须自己设计和制造电路板、编写程序，甚至自己设计外壳。
      </div><div> </div><div>这是一个耗时费力的过程。然而，所涉及的技术往往相似，许多人面临相同的挑战。这就是我们想要创建 RIMU 来解决这个问题的原因。</div></div><div><br></div><div><h3><b>问：为什么我们想在
      Kickstarter 上推出 RIMU？ </b></h3><div>在 Kickstarter 平台上，聚集了大量对创新产品充满热情的早期用户。选择在这个平台上推出产品可以更有效地触达这些目标用户，并建立直接联系。</div></div><div><br></div><div><h3><b>问：RIMU
      使用哪种微控制器？ </b></h3><div>主 MCU 是 ESP32S3，另一个是 ATmega328p。 </div><div> </div><div><ul><li>ESP32S3
      使用 ESP-IDF </li><li>ATmega328p 使用 Arduino </li></ul></div><div>大多数模块将使用 Atmega328p。&nbsp;</div></div><div><br></div><div><h3><b>问：RIMU
      是开源的吗？ </b></h3><div>是的！项目完成后，我们将开源所有代码、硬件以及图纸。 </div><div> </div><div>我们创建了一个友好且引人入胜的社区，您可以在这里与志同道合的人交流，分享见解，并开启共同探索的旅程。</div></div><div><br></div><div><h3><b>问：它支持
      Arduino 吗？ </b></h3><div>RIMU 目前正在使用 ESP-IDF 框架进行开发。为了满足广大 Arduino 用户的需求，我们将在初始软件版本完成后开始适配
      Arduino 平台。</div></div><div><br></div><div><h3><b>问：是否可以自定义 RIMU 的功能和模块？ </b></h3><div>是的！这正是
      RIMU 的初衷，我们也希望收到不同类型的建议，以便更全面地满足我们的需求。</div></div><div><br></div><div><h3><b>问：RIMU
      提供什么保修？ </b></h3><div>提供 2 年保修。</div></div><div><br></div><div><h3><b>问：在哪里购买
      RIMU？</b></h3><div> </div><div>该项目已在 <a href="https://www.kickstarter.com/projects/rimu-yg/rimu-open-source-esp32-s3-project-43-touch-modular"
      target="_blank" rel="noopener">Kickstarter</a> 上预发布，预计于 2025 年 3 月开始发货。具体购买渠道仍在确定中，但我们已有预购计划。&nbsp;</div></div><div><br></div><div><h3><b>问：其他问题
      </b></h3><div>如果您还有其他问题，请通过我们的“联系我们”页面与我们联系。</div></div>
    _hidden: 'false'
    style_text-align: left
