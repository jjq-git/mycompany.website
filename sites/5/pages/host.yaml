    title: Key features
    desc: The host utilizes the high-performance ESP32S3 chip, supporting dual-core
      processing and integrated Wi-Fi/Bluetooth connectivity. It boasts a 4.3-inch
      capacitive touchscreen with a resolution of 480×800 pixels, offering a vibrant
      display and precise touch response. The device provides a rich set of interfaces,
      including UART, I2C, SPI, and GPIO pins, enabling seamless integration with
      various sensors, actuators, and other peripherals. We are currently developing
      on the ESP-IDF platform. Our goal is to expand support to include Arduino and
      MicroPython in the future.
