    body: "<h3><b>Q: How can I trust the team and project?\r\n</b></h3><div>The RIMU\
      \ project developed by DENGTEC, DENGTEC’s Chinese name is “德恩基”.\r\n</div><div>\r\
      \n</div><div><ul><li>“德” means morality\r\n</li><li>“恩” means grace\r\n</li><li>“基”\
      \ means foundation\r\n</li></ul></div><div>The company has operated for 10 years\
      \ without any disputes or legal issues.</div><div><br></div><div><h3><b>Q: What\
      \ does RIMU mean?\r\n</b></h3><div>RIMU is the Chinese pinyin for “日目”.\r\n\
      </div><div>\r\n</div><div><ul><li>“日” means sun, looks like host + 1 module.\r\
      \n</li><li>“目” means eye, looks like host + 2 modules.\r\n</li></ul></div><div>not\
      \ the tree name \U0001F642</div></div><div><br></div><div><h3><b>Q: How does\
      \ the idea come from?\r\n</b></h3><div>People often need control devices to\
      \ meet their specific needs.\r\n</div><div>\r\n</div><div>If they can’t find\
      \ ready-made solutions, they have to design and manufacture circuit boards,\
      \ write programs, and even design enclosures themselves.\r\n</div><div>\r\n\
      </div><div>This is a time-consuming and laborious process. However, the technologies\
      \ involved are often similar, and many people face the same challenges. That’s\
      \ why we want to create RIMU to solve this problem.</div></div><div><br></div><div><h3><b>Q:\
      \ Why did we want to launch RIMU on Kickstarter?\r\n</b></h3><div>On the Kickstarter\
      \ platform, a large number of early adopters who are passionate about innovative\
      \ products are gathered. Choosing to launch a product on this platform allows\
      \ for more effective reach to these target users and the establishment of direct\
      \ connections.</div></div><div><br></div><div><h3><b>Q: Which microcontroller\
      \ are you using for RIMU?\r\n</b></h3><div>The main MCU is ESP32S3, and other\
      \ one is ATmega328p.\r\n</div><div>\r\n</div><div><ul><li>ESP32S3 using ESP-IDF\r\
      \n</li><li>ATmega328p using Arduino\r\n</li></ul></div><div>Most Modules will\
      \ use Atmega328p.&nbsp;</div></div><div><br></div><div><h3><b>Q: Is RIMU open\
      \ source?\r\n</b></h3><div>YES! Once the project is completed, we will open\
      \ source all the code, hardware, as well as the drawing.\r\n</div><div>\r\n\
      </div><div>We’ve created a friendly and engaging community where you can connect\
      \ with like-minded individuals, exchange insights, and embark on a journey of\
      \ shared discovery.</div></div><div><br></div><div><h3><b>Q: Does it support\
      \ Arduino?\r\n</b></h3><div>Rimu is presently under development using the ESP-IDF\
      \ framework. In order to address the needs of the broad Arduino user base, we\
      \ will commence adaptation to the Arduino platform upon completion of the initial\
      \ software release.</div></div><div><br></div><div><h3><b>Q: Is it possible\
      \ to customize the function and module of RIMU?\r\n</b></h3><div>YES! This is\
      \ the original intention of RIMU, and we also hope to receive different types\
      \ of advice so that we can more comprehensively meet our needs.</div></div><div><br></div><div><h3><b>Q:\
      \ What warranty does the RIMU include?\r\n</b></h3><div>Offer a 2 year warranty.</div></div><div><br></div><div><h3><b>Q:\
      \ Where to buy RIMU?</b></h3><div>\r\n</div><div>The project was pre-launched\
      \ on <a href=\"https://www.kickstarter.com/projects/rimu-yg/rimu-open-source-esp32-s3-project-43-touch-modular\"\
      \ target=\"_blank\" rel=\"noopener\">kickstarter</a>, with deliveries expected\
      \ to begin in Mar 2025. Specific purchase channels are still being finalized,\
      \ but we have a pre-order plan in place.&nbsp;</div></div><div><br></div><div><h3><b>Q:\
      \ Other Questions\r\n</b></h3><div>If you have any further questions, please\
      \ contact us through our “Contact Us” page.</div></div>"
    _hidden: 'false'
    style_text-align: left
