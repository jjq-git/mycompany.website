  data:
    title: RIMU Privacy Policy
    subtitle: ''
    body: "<div><b>Last updated</b>: August 12, 2025</div><div><br></div><div><div>Welcome\
      \ to https://rimu.me (“this website”). We take your privacy seriously and are\
      \ committed to protecting your personal information. This Privacy Policy explains\
      \ how we collect, use, and protect your data, and what rights you have regarding\
      \ your information.</div></div><div><br></div><div><h3><b>1. Who We Are\r\n\
      </b></h3><div>Our website address is: https://rimu.me\r\n</div><div>\r\n</div><h3><b>2.\
      \ Comments\r\n</b></h3><div>When visitors leave comments on our site, we collect\
      \ the data shown in the comment form, along with the visitor’s IP address and\
      \ browser user agent string for spam detection.\r\n</div><div>\r\n</div><div>An\
      \ anonymized string (hash) created from your email address may be provided to\
      \ the Gravatar service to check if you are using it. The Gravatar privacy policy\
      \ can be found here: https://automattic.com/privacy/.\r\n</div><div>\r\n</div><div>After\
      \ approval of your comment, your profile picture is visible publicly in the\
      \ context of your comment.\r\n</div><div>\r\n</div><h3><b>3. Media\r\n</b></h3><div>If\
      \ you upload images to the website, avoid including embedded location data (EXIF\
      \ GPS). Visitors may download and extract location data from images.\r\n</div><div>\r\
      \n</div><h3><b>4. Cookies\r\n</b></h3><div><ul><li>When you leave a comment,\
      \ you may opt to save your name, email, and website in cookies for convenience.\
      \ These cookies last one year.\r\n</li><li>On the login page, we set a temporary\
      \ cookie to check if your browser accepts cookies. This cookie contains no personal\
      \ data and is discarded after closing the browser.\r\n</li><li>Login-related\
      \ cookies save your login info and screen display preferences. Login cookies\
      \ last two days, screen options cookies last one year, and selecting “Remember\
      \ Me” keeps you logged in for two weeks. Logging out removes login cookies.\r\
      \n</li><li>Editing or publishing an article sets an additional cookie in your\
      \ browser containing the post ID. This expires after one day and contains no\
      \ personal data.\r\n</li></ul></div><div>\r\n</div><div>\r\n</div><div>\r\n\
      </div><div>\r\n</div><h3><b>5. Embedded Content from Other Websites\r\n</b></h3><div>Articles\
      \ on this site may include embedded content (e.g., videos, images, articles).\
      \ Embedded content behaves as if the visitor has visited the other website directly.\r\
      \n</div><div>\r\n</div><div>These third-party websites may collect data about\
      \ you, use cookies, embed additional tracking, and monitor your interaction\
      \ with the content. This includes tracking if you have an account and are logged\
      \ in to that site.\r\n</div><div>\r\n</div><h3><b>6. Who We Share Your Data\
      \ With\r\n</b></h3><div>If you request a password reset, your IP address will\
      \ be included in the reset email.\r\n</div><div>\r\n</div><h3><b>7. How Long\
      \ We Retain Your Data\r\n</b></h3><div><ul><li>Comments and their metadata are\
      \ retained indefinitely to automatically recognize and approve follow-up comments.\r\
      \n</li><li>Registered users’ personal information is stored in their user profiles.\
      \ Users can view, edit, or delete personal data anytime (except usernames).\
      \ Administrators can also manage this information.\r\n</li></ul></div><div>\r\
      \n</div><div>\r\n</div><h3><b>8. Your Rights Over Your Data\r\n</b></h3><div><ul><li>If\
      \ you have an account or have left comments, you can request an exported copy\
      \ of your personal data.\r\n</li><li>You can also request deletion of your personal\
      \ data, except for information we must retain for administrative, legal, or\
      \ security purposes.\r\n</li></ul></div><div>\r\n</div><h3><b>9. Where Your\
      \ Data Is Sent\r\n</b></h3><div>Visitor comments may be checked through automated\
      \ spam detection services.</div></div>"
    _hidden: 'false'
    style_text-align: left
  responsive:
    tablet:
      _hidden: 'false'
    mobile:
      _hidden: 'false'
title: Privacy Policy
