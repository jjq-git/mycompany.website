    title: Host
    desc: The host device features the ESP32-S3 chip, equipped with Wi-Fi, Bluetooth,
      and OTG functionality, offering strong connectivity and flexible expandability.
      In terms of hardware, the host comes with 4GB of storage, providing ample space
      for various data and applications. Additionally, it is equipped with an RGB
      indicator light, a buzzer, and a vibration motor, enabling a variety of status
      indicators and interactive feedback, offering users a more intuitive and dynamic
      experience.
