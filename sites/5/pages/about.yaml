    title: Why RIMU
    desc: We had the product first, then the name. The product allows you to stack
      modules so that the combination is like the Chinese words ‘日’ and ‘目’, with
      rimu being the pinyin for ‘日目’. In the beginning, we wanted to use our internal
      project number wf1 as the name of the project, but then we felt it was too random.
      Also, we wanted to make this a very long-lasting product, and this meaningless
      moniker just didn’t seem right for it. For internal purposes, we will still
      name it wf1.The logo is also derived from ‘日目’
