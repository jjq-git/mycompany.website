modules:
- type: section_title
  order: 1
  variant: text-align_center
  data:
    tag: ''
    title: RIMU's Beginnings
    desc: A Story of Dedication and Vision. Defining a product, especially one like
      RIMU with long-term support in mind, has been a truly challenging journey. We’ve
      gone through countless revisions and refinements, always striving to lay a solid
      foundation that allows for future scalability and ensures RIMU’s continued growth.
      This process has demanded immense effort and dedication, but we firmly believe
      that every step, every revision, has been worth it. The latest version of the
      module has been updated and is now live. In addition, we have received many
      valuable suggestions, mainly from communities such as Reddit and Facebook. We
      have compiled all the collected suggestions on the community and will evaluate
      and implement them one by one.
    btn: ''
    btn_url: ''
