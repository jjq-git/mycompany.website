    tag: ''
    title: Modules List
    desc: Here you will find information on the modules currently available. We also
      want to express our sincere gratitude for the valuable feedback provided by
      our community across various platforms. This input has been instrumental in
      our ongoing efforts to refine and enhance the module details. We are in the
      process of completing the development and updates for these modules, and we
      look forward to collaborating with you all to build an even better product.
      All modules communicate with the host via the I2C interface. For general information
      about the modules, please refer to the the General Information of RIMU Modules
      page.
