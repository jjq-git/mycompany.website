title: Modules
description: RIMU offers a growing collection of I2C modules for developers and integrators,
  including GPIO expanders, PWM controllers, and addressable LED drivers, designed
  for flexible hardwa
detail_templates:
- id: default
  name: 默认模块详情
  is_default: true
  modules:
  - type: detail_media
    variant: gallery_top
    data:
      source: cover_and_gallery
      layout: gallery_top
      max_images: 6
      empty_behavior: hide_module
      image_ratio: 4/3
      image_radius: 8px
  - type: detail_intro
    variant: default
    data:
      title_field: title
      summary_field: summary
      show_category: 'true'
      show_tags: 'true'
      show_price: 'false'
      text_align: left
  - type: detail_specs
    variant: list
    data:
      title: ''
      source_field: specs
      max_rows: 10
      columns: '1'
      hide_empty_rows: 'true'
      mobile_layout: stacked
      border_color: '#e5e7eb'
  - type: detail_link
    variant: button
    data:
      title: ''
      label: 了解更多
      url_field: link_url
      style: button
      hide_when_empty: 'true'
  required_fields:
  - title
  - slug
  optional_fields:
  - cover
  - summary
  - detail_images
  - specs
  - category
  - tags
  - link_url
  seo:
    title: '{title} - {site_name}'
    description: '{summary}'
    image: cover
