    title: Current Monitor 4
    desc: The current module is an analog input module that can simultaneously measure
      analog voltage/current signals from four AC and DC probes. The module provides
      three 3.5mm headphone jack inputs and one Phoenix 3.5*2 terminal block input.
      Voltage or current input for each probe can be matched via DIP switches, and
      the measurement results are returned to the host. Furthermore, multiple modules
      can be mounted on a single host.
