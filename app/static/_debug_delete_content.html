<div class="fw-semibold mb-3">账号管理</div>
<div class="card mb-3">
  <div class="card-body">
    <h6 class="card-title">test@test.com</h6>
    <p class="text-muted small">当前站点：web01 (slug: <b>company01</b>)</p>
    <button class="btn btn-outline-danger btn-sm" type="button" onclick="showDeleteSiteModal()">删除站点</button>
  </div>
</div>

<div class="modal fade" id="deleteSiteModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">确认删除站点</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <p class="text-danger fw-semibold">此操作不可撤销！</p>
        <p>请输入站点 slug <code>company01</code> 确认删除：</p>
        <input type="text" class="form-control form-control-sm" id="deleteConfirmSlug" placeholder="company01"
               oninput="var btn=document.getElementById('confirmDeleteBtn'); var v=this.value.trim(); if(v===''){btn.disabled=true;btn.title='请先输入 slug'}else if(v==='company01'){btn.disabled=false;btn.title=''}else{btn.disabled=true;btn.title='Slug 不匹配'}">
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">取消</button>
        <button type="button" class="btn btn-danger btn-sm" id="confirmDeleteBtn"
                onclick="alert('删除成功(模拟)')">确认删除</button>
      </div>
    </div>
  </div>
</div>

<script>
function showDeleteSiteModal() {
  console.log('showDeleteSiteModal called');
  var modalEl = document.getElementById('deleteSiteModal');
  console.log('modalEl:', modalEl);
  var modal = bootstrap.Modal.getOrCreateInstance(modalEl);
  console.log('modal:', modal);
  modal.show();
}
</script>
