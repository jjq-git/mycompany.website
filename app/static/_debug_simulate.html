<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>模拟 Dashboard 删除测试</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
<style>
body { margin: 0; display: flex; height: 100vh; }
#rightPanelBody { flex: 1; overflow: auto; padding: 16px; background: #f8fafc; border: 2px solid red; }
</style>
</head>
<body>

<div id="rightPanelBody">
  <p>面板加载中...</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"></script>
<script>
// 完全复制 dashboard 的 loadPanel 和 runPanelScripts
function runPanelScripts(container) {
  container.querySelectorAll('script').forEach(oldScript => {
    var script = document.createElement('script');
    Array.from(oldScript.attributes).forEach(attr => script.setAttribute(attr.name, attr.value));
    script.textContent = oldScript.textContent;
    oldScript.replaceWith(script);
  });
}

function loadPanel(url) {
  var body = document.getElementById('rightPanelBody');
  body.innerHTML = '<div>加载中...</div>';
  return fetch(url).then(r => r.text())
    .then(html => {
      body.innerHTML = html;
      runPanelScripts(body);
      console.log('Panel loaded, scripts executed');
    });
}

// 加载实际的面板 HTML
loadPanel('http://127.0.0.1:5000/static/_debug_delete_content.html');
</script>
</body>
</html>
