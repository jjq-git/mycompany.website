{% macro auth_icon(name, class_name='auth-icon') -%}
<svg class="{{ class_name }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  {% if name == 'account' %}<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>
  {% elif name == 'mail' %}<rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/>
  {% elif name == 'lock' %}<rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/>
  {% elif name == 'shield' %}<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z"/><path d="m9 12 2 2 4-4"/>
  {% elif name == 'send' %}<path d="m22 2-7 20-4-9-9-4z"/><path d="M22 2 11 13"/>
  {% elif name == 'login' %}<path d="M10 17l5-5-5-5M15 12H3"/><path d="M15 3h6v18h-6"/>
  {% elif name == 'user-plus' %}<path d="M15 19a6 6 0 0 0-12 0M9 11a4 4 0 1 0 0-8M19 8v6M16 11h6"/>
  {% elif name == 'arrow-left' %}<path d="m15 18-6-6 6-6"/><path d="M21 12H9"/>
  {% elif name == 'key' %}<circle cx="8" cy="15" r="5"/><path d="m12 12 9-9m-3 3 3 3m-6 0 3 3"/>
  {% elif name == 'check' %}<path d="M20 6 9 17l-5-5"/>
  {% elif name == 'eye' %}<path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="2.5"/>
  {% elif name == 'eye-off' %}<path d="m3 3 18 18"/><path d="M10.6 6.2A10.6 10.6 0 0 1 12 6c6.5 0 10 6 10 6a18 18 0 0 1-3 3.8M6.3 6.3C3.5 8.1 2 12 2 12s3.5 6 10 6a10 10 0 0 0 4.1-.8"/>
  {% endif %}
</svg>
{%- endmacro %}

{% macro password_toggle() -%}
<button class="auth-password-toggle" type="button" title="显示密码" aria-label="显示密码">
  {{ auth_icon('eye', 'auth-icon eye-open') }}{{ auth_icon('eye-off', 'auth-icon eye-closed') }}
</button>
{%- endmacro %}
