{% from 'auth/_icons.html' import auth_icon %}
<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>设置密码 — {{ platform_domain }}</title><link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}?v=20260720-auth-ui"></head>
<body><main class="auth-wrap">
  <div class="auth-brand"><img src="http://192.168.1.88:3000/attachments/74eb0913-3298-4a00-82f8-fe1c02db27ec" alt="{{ platform_domain }}"></div>
  <section class="auth-card">
    <div class="auth-heading"><span class="auth-heading-icon">{{ auth_icon('key') }}</span><h1>设置或找回密码</h1></div>
    <p class="auth-lead">输入已注册的邮箱或手机号，通过验证码确认身份。</p>
    {% include 'auth/_messages.html' %}
    <form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>邮箱或手机号<div class="auth-input-wrap">{{ auth_icon('mail') }}<input name="identifier" value="{{ identifier or '' }}" required autofocus></div></label><button class="auth-primary" type="submit">{{ auth_icon('send') }}<span>获取验证码</span></button></form>
    <div class="auth-links single"><a href="{{ url_for('core.login') }}">{{ auth_icon('arrow-left') }}<span>返回登录</span></a></div>
  </section>
</main></body></html>
