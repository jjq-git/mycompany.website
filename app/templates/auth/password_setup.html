<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>设置密码 — {{ platform_domain }}</title><link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}?v=20260716-1"></head><body><main class="auth-wrap"><div class="auth-brand">{{ platform_domain }}</div><section class="auth-card"><h1>设置或找回密码</h1><p class="auth-lead">输入已注册的邮箱或手机号，通过验证码确认身份。</p>{% include 'auth/_messages.html' %}<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>邮箱或手机号<input name="identifier" value="{{ identifier or '' }}" required autofocus></label><button class="auth-primary" type="submit">获取验证码</button></form><div class="auth-links"><a href="{{ url_for('core.login') }}">返回登录</a></div></section></main></body></html>
