<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>注册 — {{ platform_domain }}</title><link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}?v=20260716-1"></head><body><main class="auth-wrap"><div class="auth-brand">{{ platform_domain }}</div><section class="auth-card"><h1>{{ '接受团队邀请' if invitation else '注册账号' }}</h1><p class="auth-lead">{% if invitation %}注册后将以 {{ invitation.role }} 身份加入“{{ invitation.organization.name }}”，不会自动获得个人建站权限。{% else %}可使用邮箱或手机号创建独立建站账号。{% endif %}</p>{% include 'auth/_messages.html' %}<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>邮箱或手机号<input name="identifier" value="{{ form.identifier }}" autocomplete="username" required autofocus {{ 'readonly' if invitation else '' }}></label><label>昵称（选填）<input name="display_name" maxlength="80" value="{{ form.display_name }}"></label><label>密码<input name="password" type="password" autocomplete="new-password" minlength="8" required><small>至少 8 位，同时包含字母和数字。</small></label><label>确认密码<input name="password_confirm" type="password" autocomplete="new-password" minlength="8" required></label><button class="auth-primary" type="submit">获取验证码</button></form><div class="auth-links"><a href="{{ url_for('core.login', next=url_for('core.organization_invitation_resume')) if invitation else url_for('core.login') }}">已有账号，去登录</a></div></section></main></body></html>
