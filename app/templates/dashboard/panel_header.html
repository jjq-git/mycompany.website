{# 网站头部变体选择面板 #}
<div class="d-flex align-items-center justify-content-between mb-3">
  <span class="fw-semibold">网站头部</span>
  <span class="small text-muted">模板: {{ site.template_name }}</span>
</div>
{% with messages = get_flashed_messages() %}
  {% for m in messages %}
    <div class="alert alert-success py-1 px-2 small mb-2">{{ m }}</div>
  {% endfor %}
{% endwith %}

<form method="post" action="{{ url_for('core.header_edit', _fragment='1') }}">
  {# Header 变体选择 #}
  <div class="mb-3">
    <label class="form-label small mb-1 fw-semibold">头部布局</label>
    <div class="d-flex flex-column gap-2">
      {% for variant in header_variants %}
      <label class="d-flex align-items-center p-2 border rounded variant-option"
             style="cursor:pointer; {% if current_header.get('variant', header_variants[0].key) == variant.key %}border-color:#0d6efd;background:#e8f0fe;{% endif %}">
        <input type="radio" name="header_variant" value="{{ variant.key }}"
               {% if current_header.get('variant', header_variants[0].key) == variant.key %}checked{% endif %}
               class="me-2" onchange="this.closest('form').querySelectorAll('.variant-option').forEach(l=>{l.style.borderColor='';l.style.background=''});this.closest('.variant-option').style.borderColor='#0d6efd';this.closest('.variant-option').style.background='#e8f0fe';">
        <div>
          <div class="small fw-semibold">{{ variant.label }}</div>
          <div class="text-muted" style="font-size:10px">{{ variant.description }}</div>
        </div>
      </label>
      {% endfor %}
    </div>
  </div>

  <hr>

  {# 语言切换按钮配置 #}
  <div class="mb-3">
    <label class="form-label small mb-1 fw-semibold">语言切换按钮</label>
    <div class="form-check form-switch mb-2">
      <input class="form-check-input" type="checkbox" name="lang_switcher_enabled" value="1"
             id="langSwitcherToggle"
             {% if current_header.get('language_switcher', {}).get('enabled', True) %}checked{% endif %}>
      <label class="form-check-label small" for="langSwitcherToggle">显示语言切换按钮</label>
    </div>

    <div id="langSwitcherOptions" {% if not current_header.get('language_switcher', {}).get('enabled', True) %}style="display:none"{% endif %}>
      <label class="form-label small mb-1 text-muted">按钮样式</label>
      <select class="form-select form-select-sm mb-2" name="lang_switcher_style">
        {% set current_style = current_header.get('language_switcher', {}).get('style', 'vertical_dropdown') %}
        {% for s in lang_switcher_styles %}
        <option value="{{ s.key }}" {% if current_style == s.key %}selected{% endif %}>{{ s.label }}</option>
        {% endfor %}
      </select>
    </div>
  </div>

  <button class="btn btn-primary btn-sm mt-2" type="submit">保存</button>
</form>

<script>
document.getElementById('langSwitcherToggle').addEventListener('change', function(){
  document.getElementById('langSwitcherOptions').style.display = this.checked ? '' : 'none';
});
</script>
