{# 页脚链接面板 #}
<div class="d-flex align-items-center justify-content-between mb-3">
  <span class="fw-semibold">页脚链接</span>
</div>
{% with messages = get_flashed_messages() %}
  {% for m in messages %}
    <div class="alert alert-success py-1 px-2 small mb-2">{{ m }}</div>
  {% endfor %}
{% endwith %}
<form method="post" action="{{ url_for('core.footer_edit', _fragment='1', site=site.id) }}">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div id="linkList">
    {% for item in items %}
    <div class="d-flex gap-1 mb-2">
      <input class="form-control form-control-sm" name="label[]" value="{{ item.label }}" placeholder="名称">
      <input class="form-control form-control-sm" name="url[]" value="{{ item.url }}" placeholder="URL">
      <button type="button" class="btn btn-sm btn-outline-danger" onclick="this.parentElement.remove()">✕</button>
    </div>
    {% endfor %}
  </div>
  <button type="button" class="btn btn-sm btn-outline-secondary mb-2" onclick="addLink()">+ 添加链接</button>
  <div class="panel-save-bar">
    <button class="btn btn-primary btn-sm w-100" type="submit">保存</button>
  </div>
</form>
<script>
function addLink(){
  var d=document.createElement('div');
  d.className='d-flex gap-1 mb-2';
  d.innerHTML='<input class="form-control form-control-sm" name="label[]" placeholder="名称"><input class="form-control form-control-sm" name="url[]" placeholder="URL"><button type="button" class="btn btn-sm btn-outline-danger" onclick="this.parentElement.remove()">✕</button>';
  document.getElementById('linkList').appendChild(d);
}
</script>
