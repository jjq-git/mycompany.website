{% extends "base.html" %}
{% block title %}模板库{% endblock %}

{% block content %}
<h1 class="page-title">模板库</h1>
<p class="page-subtitle">挑一套模板，预览效果，然后用它新建站点。</p>

<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; max-width: 1100px;">
  {% for t in templates %}
  <div class="card" style="padding: 0; overflow: hidden;">
    <div style="aspect-ratio: 16/10; background: #1a1a2e; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 14px;">
      {% if t.cover_image %}
      <img src="{{ t.cover_image }}" alt="{{ t.display_name }}" style="width: 100%; height: 100%; object-fit: cover;">
      {% else %}
      <span class="muted">{{ t.industry }}</span>
      {% endif %}
    </div>
    <div style="padding: 16px 20px;">
      <div style="display: flex; align-items: baseline; justify-content: space-between;">
        <strong>{{ t.display_name }}</strong>
        <span class="muted" style="font-size: 12px;">{{ t.industry }}</span>
      </div>
      <p class="muted" style="font-size: 13px; margin: 8px 0 16px;">{{ t.description }}</p>
      <div style="display: flex; gap: 8px;">
        <a class="btn" href="{{ url_for('core.template_preview', template_name=t.name) }}" target="_blank">预览</a>
        <a class="btn btn-primary" href="{{ url_for('core.site_new', template=t.name) }}">用这个</a>
      </div>
    </div>
  </div>
  {% endfor %}
</div>
{% endblock %}
