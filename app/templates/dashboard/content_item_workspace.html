<!doctype html>
<html lang="{{ (current_lang or 'zh-CN')[:2] }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <title>{{ page_label }} · 编辑 #{{ edit_item_id }}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}?v=20260715-content-editor">
  <style>
    :root{--bs-primary:{{ admin_primary }};--bs-primary-rgb:{{ admin_primary_rgb }};--theme-primary:{{ admin_primary }};--theme-primary-hover:{{ admin_primary_hover }}}
    *{box-sizing:border-box}
    body{margin:0;background:#eee;color:#172033;font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}
    .content-edit-workspace{min-height:100vh;padding:28px 24px 44px}
    .content-edit-shell{max-width:1540px;margin:0 auto;position:relative}
    .content-edit-hero{margin:0 0 20px;padding-right:48px}
    .content-edit-hero h1{font-size:24px;line-height:1.2;margin:0 0 7px;letter-spacing:-.02em;font-weight:720}
    .content-edit-hero p{margin:0;color:#64748b}
    .content-edit-panel{background:transparent;border:0;box-shadow:none;padding:0}
    .content-edit-layout{display:grid;grid-template-columns:210px minmax(0,1fr);gap:18px;align-items:start}
    .content-edit-outline{position:sticky;top:18px;border:1px solid #dfe6eb;background:#fff;box-shadow:0 4px 16px rgba(15,23,42,.055)}
    .content-edit-outline-title{padding:12px 14px;border-bottom:1px solid #e8edf1;background:#fafcfd;font-size:13px;font-weight:700;color:#172033}
    .content-edit-outline-list{padding:7px;max-height:calc(100vh - 82px);overflow-y:auto;overscroll-behavior:contain}
    .content-edit-outline-button{width:100%;min-height:34px;padding:7px 9px;border:0;background:transparent;color:#526172;text-align:left;font-size:12px;display:flex;align-items:center;gap:8px;cursor:pointer}
    .content-edit-outline-button:before{content:"";width:4px;height:4px;flex:0 0 4px;background:#aab5bf}
    .content-edit-outline-button:hover{background:#f1f5f6;color:{{ admin_primary }}}
    .content-edit-outline-button.is-active{background:{{ admin_primary_light }};color:{{ admin_primary }};font-weight:700}
    .content-edit-outline-button.is-active:before{background:{{ admin_primary }}}
    .content-edit-outline-button.is-child{padding-left:22px;color:#6b7785}
    .content-edit-outline-button.is-child:before{width:10px;height:1px;flex-basis:10px;background:#c5ced6}
    .content-edit-outline-button.is-child.is-active{color:{{ admin_primary }}}
    .content-edit-outline-button.is-child.is-active:before{background:{{ admin_primary }}}
    .content-edit-main{min-width:0}
    .content-edit-panel .ds-edit-head{position:absolute;top:0;right:0;width:auto;margin:0;padding:0;z-index:5;justify-content:flex-end}
    .content-edit-panel .ds-edit-title{display:none}
    .content-edit-panel .dataset-edit-form{width:100%;margin:0;padding:0;background:transparent}
    .content-edit-panel .dataset-edit-form>.ds-card,
    .content-edit-panel .dataset-edit-form>.detail-field-section{
      background:#fff!important;
      border:0!important;
      border-radius:0!important;
      box-shadow:0 5px 18px rgba(15,23,42,.065);
      margin-bottom:18px!important;
      overflow:hidden;
    }
    .content-edit-panel .dataset-edit-form>.ds-card:last-of-type,
    .content-edit-panel .dataset-edit-form>.detail-field-section:last-of-type{margin-bottom:0!important}
    .content-edit-panel .dataset-edit-form .ds-side-card,
    .content-edit-panel .dataset-edit-form .detail-field-section{
      grid-template-columns:minmax(0,1fr)!important;
    }
    .content-edit-panel .dataset-edit-form .ds-side-card>.ds-card-head,
    .content-edit-panel .dataset-edit-form .detail-field-section>.small.fw-semibold,
    .content-edit-panel .dataset-edit-form .detail-field-section>.d-flex:first-child{
      grid-column:1!important;
      grid-row:auto!important;
      padding:12px 16px!important;
      border-right:0!important;
      border-bottom:1px solid #edf1f4!important;
      background:linear-gradient(180deg,#fff,#fafcfd);
      font-weight:700;
    }
    .content-edit-panel .dataset-edit-form .detail-field-section>.d-flex:first-child{flex-direction:row;align-items:center!important;justify-content:space-between!important;gap:10px}
    .content-edit-panel .dataset-edit-form .detail-field-section>*:not(:first-child){grid-column:1!important}
    .content-edit-panel .dataset-edit-form .detail-table-item,
    .content-edit-panel .dataset-edit-form .detail-link-item,
    .content-edit-panel .dataset-edit-form .detail-spec-group-item{
      grid-template-columns:minmax(0,1fr)!important;
      border:1px solid #e7ecf0!important;
      border-radius:0!important;
      background:#fff;
      box-shadow:0 2px 8px rgba(15,23,42,.045);
      overflow:hidden;
    }
    .content-edit-panel .dataset-edit-form .detail-table-item>.small.fw-semibold,
    .content-edit-panel .dataset-edit-form .detail-link-item>.small.fw-semibold,
    .content-edit-panel .dataset-edit-form .detail-spec-group-item>.d-flex:first-child{
      grid-column:1!important;
      grid-row:auto!important;
      padding:12px 16px!important;
      border-right:0!important;
      border-bottom:1px solid #edf1f4!important;
      background:linear-gradient(180deg,#fff,#fafcfd);
    }
    .content-edit-panel .dataset-edit-form .detail-spec-group-item>.d-flex:first-child{flex-direction:row;align-items:center!important;justify-content:space-between!important;gap:10px}
    .content-edit-panel .dataset-edit-form .detail-table-input-grid,
    .content-edit-panel .dataset-edit-form .detail-spec-rows,
    .content-edit-panel .dataset-edit-form .detail-link-item>.mb-2,
    .content-edit-panel .dataset-edit-form .detail-link-item>div:not(.small){
      grid-column:1!important;
      margin:0!important;
    }
    .content-edit-panel .dataset-edit-form .detail-content-block-item{grid-template-columns:minmax(0,1fr)!important;gap:12px;border:1px solid #e7ecf0!important;border-radius:0!important;box-shadow:0 2px 8px rgba(15,23,42,.045)}
    .content-edit-panel .dataset-edit-form .detail-content-block-side{
      display:grid;
      grid-template-columns:minmax(130px,auto) minmax(140px,220px) minmax(160px,240px);
      align-items:center;
      gap:10px;
      padding-bottom:10px;
      border-bottom:1px solid #edf1f4;
    }
    .content-edit-panel .dataset-edit-form .detail-content-block-side>.d-flex:first-child{min-width:130px}
    .content-edit-panel #detailContentBlocksList,
    .content-edit-panel #detailSpecsList,
    .content-edit-panel #detailTablesList,
    .content-edit-panel #detailLinksList,
    .content-edit-panel #detailFeaturesList,
    .content-edit-panel #detailFaqsList{
      display:grid!important;
      grid-template-columns:minmax(0,1fr)!important;
      gap:14px!important;
      margin:0!important;
    }
    .content-edit-panel #detailContentBlocksList>.detail-content-block-item,
    .content-edit-panel #detailSpecsList>.detail-spec-group-item,
    .content-edit-panel #detailTablesList>.detail-table-item,
    .content-edit-panel #detailLinksList>.detail-link-item,
    .content-edit-panel #detailFeaturesList>.detail-feature-item,
    .content-edit-panel #detailFaqsList>.detail-faq-edit-item{margin:0!important;min-width:0}
    .content-edit-panel .dataset-edit-form .ds-card-body{width:100%;margin:0;padding:14px 16px}
    .content-edit-panel .dataset-edit-form textarea.form-control{min-height:56px}
    .content-edit-panel .form-control,.content-edit-panel .form-select{border-color:#d9e1e8;border-radius:0;background-color:#fff}
    .content-edit-panel .rounded,.content-edit-panel .card{border-radius:0!important}
    .content-edit-panel .form-control:focus,.content-edit-panel .form-select:focus{border-color:{{ admin_primary }};box-shadow:0 0 0 3px rgba({{ admin_primary_rgb }},.10)}
    .content-edit-panel .btn{border-radius:0}
    .content-edit-panel .btn-outline-primary{color:{{ admin_primary }};border-color:{{ admin_primary }};background:#fff}
    .content-edit-panel .btn-outline-primary:hover,
    .content-edit-panel .btn-outline-primary:focus{color:#fff;border-color:{{ admin_primary_hover }};background:{{ admin_primary_hover }};box-shadow:none}
    .content-edit-panel .btn-primary{color:#fff;border-color:{{ admin_primary }};background:{{ admin_primary }}}
    .content-edit-panel #detailGalleryList{grid-template-columns:repeat(3,minmax(260px,1fr));gap:12px}
    .content-edit-panel .dataset-edit-form #detailGalleryList .detail-gallery-item,
    .content-edit-panel .dataset-edit-form .detail-feature-item,
    .content-edit-panel .dataset-edit-form .detail-file-edit-item,
    .content-edit-panel .dataset-edit-form .detail-faq-edit-item{
      background:#fff;
      /* border:0!important; */
      border-radius:0!important;
      box-shadow:0 3px 12px rgba(15,23,42,.065);
    }
    .content-edit-panel #detailGalleryList .detail-gallery-item{grid-template-columns:80px minmax(0,1fr);}
    .content-edit-panel #detailGalleryList .module-media-picker{width:82px;height:72px;min-height:72px}
    .content-edit-panel #detailGalleryList .module-media-url-row,
    .content-edit-panel #detailGalleryList .module-media-alt-input{min-width:0}
    .content-edit-panel .panel-save-bar{position:sticky;bottom:14px;z-index:20;display:flex;justify-content:flex-end;width:max-content;margin:20px 0 0 auto;padding:7px;background:rgba(255,255,255,.94);border:1px solid #dce3e8;border-radius:0;box-shadow:0 8px 24px rgba(15,23,42,.13);backdrop-filter:blur(8px)}
    .content-edit-panel .panel-save-bar .btn{width:auto!important;min-width:112px;height:36px;padding:0 20px;font-size:13px;font-weight:700}
    .content-edit-panel .panel-save-bar .btn svg{width:15px;height:15px}
    /* 所有组件统一为：标题栏 + 25px 编辑内容区；不再用子元素 margin 模拟内距。 */
    .content-edit-panel .dataset-edit-form>.ds-card>.ds-card-body{padding:25px!important}
    .content-edit-panel .dataset-edit-form>.detail-field-section{
      padding:0 25px 25px!important;
    }
    .content-edit-panel .dataset-edit-form>.detail-field-section>.small.fw-semibold,
    .content-edit-panel .dataset-edit-form>.detail-field-section>.d-flex:first-child{
      margin:0 -25px 25px!important;
      padding:12px 25px!important;
    }
    .content-edit-panel .dataset-edit-form .detail-table-item,
    .content-edit-panel .dataset-edit-form .detail-link-item,
    .content-edit-panel .dataset-edit-form .detail-spec-group-item,
    .content-edit-panel .dataset-edit-form .detail-content-block-item{
      padding:0 25px 25px!important;
    }
    .content-edit-panel .dataset-edit-form .detail-table-item>.small.fw-semibold,
    .content-edit-panel .dataset-edit-form .detail-link-item>.small.fw-semibold,
    .content-edit-panel .dataset-edit-form .detail-spec-group-item>.d-flex:first-child,
    .content-edit-panel .dataset-edit-form .detail-content-block-item>.detail-content-block-side{
      margin:0 -25px 25px!important;
      padding:12px 25px!important;
    }
    .content-edit-panel .dataset-edit-form .detail-gallery-item,
    .content-edit-panel .dataset-edit-form .detail-feature-item,
    .content-edit-panel .dataset-edit-form .detail-file-edit-item,
    .content-edit-panel .dataset-edit-form .detail-faq-edit-item{
      padding:0 25px 25px!important;
    }
    .content-edit-panel .dataset-edit-form .detail-gallery-item>.d-flex:first-child,
    .content-edit-panel .dataset-edit-form .detail-feature-item>.d-flex:first-child,
    .content-edit-panel .dataset-edit-form .detail-file-edit-item>.d-flex:first-child,
    .content-edit-panel .dataset-edit-form .detail-faq-edit-item>.d-flex:first-child{
      margin:0 -25px 25px!important;
      padding:12px 25px!important;
      border-bottom:1px solid #edf1f4;
      background:#fafcfd;
    }
    .content-edit-panel .dataset-edit-form .detail-table-input-grid,
    .content-edit-panel .dataset-edit-form .detail-spec-rows,
    .content-edit-panel .dataset-edit-form .detail-link-item>.mb-2,
    .content-edit-panel .dataset-edit-form .detail-link-item>div:not(.small){padding:0!important;margin:0!important}
    .content-edit-panel .dataset-edit-form .detail-link-item{display:grid;gap:12px}
    /* 不同数据类型采用各自适合的紧凑布局。 */
    .content-edit-panel #detailGalleryList{
      grid-template-columns:repeat(3,minmax(0,1fr));
      justify-content:stretch;
      align-items:start;
    }
    .content-edit-panel #detailFeaturesList,
    .content-edit-panel #detailFaqsList,
    .content-edit-panel #detailLinksList{
      display:grid!important;
      grid-template-columns:repeat(2,minmax(0,1fr))!important;
      gap:14px!important;
    }
    .content-edit-panel #detailFeaturesList>.detail-feature-item,
    .content-edit-panel #detailFaqsList>.detail-faq-edit-item,
    .content-edit-panel #detailLinksList>.detail-link-item{margin:0!important;min-width:0}
    .content-edit-panel .detail-feature-item>.row{
      display:grid;
      grid-template-columns:minmax(120px,160px) minmax(150px,200px) minmax(0,1fr);
      gap:10px;
      margin:0;
    }
    .content-edit-panel .detail-feature-item>.row>[class*="col-"]{width:auto;max-width:none;padding:0}
    .content-edit-panel .detail-faq-edit-item{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
    .content-edit-panel .detail-faq-edit-item>.d-flex:first-child{margin-bottom:15px!important}
    .content-edit-panel #detailFilesList{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
    .content-edit-panel #detailFilesList>.detail-file-edit-item{margin:0!important}
    /* 缁勪欢鍐呭鍖虹粺涓€淇濈暀 25px 鐪熷疄鍐呰窛锛屼笉鍐嶇敤璐熷杈硅窛鎷変几鏍囬銆?*/
    .content-edit-panel .dataset-edit-form>.detail-field-section,
    .content-edit-panel .dataset-edit-form .detail-table-item,
    .content-edit-panel .dataset-edit-form .detail-link-item,
    .content-edit-panel .dataset-edit-form .detail-spec-group-item,
    .content-edit-panel .dataset-edit-form .detail-content-block-item,
    .content-edit-panel .dataset-edit-form .detail-gallery-item,
    .content-edit-panel .dataset-edit-form .detail-feature-item,
    .content-edit-panel .dataset-edit-form .detail-file-edit-item,
    .content-edit-panel .dataset-edit-form .detail-faq-edit-item{
      padding:25px!important;
    }
    .content-edit-panel .dataset-edit-form>.detail-field-section>.small.fw-semibold,
    .content-edit-panel .dataset-edit-form>.detail-field-section>.d-flex:first-child,
    .content-edit-panel .dataset-edit-form .detail-table-item>.small.fw-semibold,
    .content-edit-panel .dataset-edit-form .detail-link-item>.small.fw-semibold,
    .content-edit-panel .dataset-edit-form .detail-spec-group-item>.d-flex:first-child,
    .content-edit-panel .dataset-edit-form .detail-content-block-item>.detail-content-block-side,
    .content-edit-panel .dataset-edit-form .detail-gallery-item>.d-flex:first-child,
    .content-edit-panel .dataset-edit-form .detail-feature-item>.d-flex:first-child,
    .content-edit-panel .dataset-edit-form .detail-file-edit-item>.d-flex:first-child,
    .content-edit-panel .dataset-edit-form .detail-faq-edit-item>.d-flex:first-child{
      margin:0 0 18px!important;
      padding:5px 0 5px!important;
      border-bottom:1px solid #edf1f4!important;
      background:#fff!important;
    }
    /* 姝ｆ枃鍧楋細鐢诲竷淇濇寔瀹藉害锛屼絾瀹為檯缂栬緫瀛楁鎺у埗鍦ㄨ垝閫傞槄璇诲搴︺€?*/
    .content-edit-panel .dataset-edit-form .detail-content-block-item{gap:0!important}
    .content-edit-panel .dataset-edit-form .detail-content-block-side{
      grid-template-columns:minmax(140px,1fr) 180px 210px;
      gap:12px;
    }
    .content-edit-panel .dataset-edit-form .detail-content-block-main{
      width:100%;
      max-width:none;
      gap:10px;
      min-width:0;
    }
    .content-edit-panel .dataset-edit-form .detail-content-block-main textarea{min-height:84px}
    .content-edit-panel .dataset-edit-form .detail-content-media-fields.module-media-field{
      grid-template-columns:112px minmax(0,1fr)!important;
      gap:12px!important;
      max-width:1040px;
    }
    .content-edit-panel .dataset-edit-form .detail-content-media-fields .module-media-picker{
      width:112px!important;
      min-height:96px!important;
      height:96px!important;
    }
    .content-edit-panel .dataset-edit-form .detail-content-gallery-fields,
    .content-edit-panel .dataset-edit-form .detail-content-table-fields{max-width:1080px}
    /* 鎻愮ず锛氭枃瀛楀湪宸︺€佹彁绀虹被鍨嬭缃湪鍙筹紝涓嶅啀鐣欎竴澶х墖绌虹櫧銆?*/
    .content-edit-panel .detail-content-block-item[data-block-type="note"] .detail-content-block-main{
      display:grid;
      grid-template-columns:minmax(0,1fr) 220px;
      gap:10px 18px;
      align-items:start;
    }
    .content-edit-panel .detail-content-block-item[data-block-type="note"] .detail-content-block-main>input:first-child{grid-column:1 / -1}
    .content-edit-panel .detail-content-block-item[data-block-type="note"] .detail-content-textarea-field{grid-column:1;grid-row:2}
    .content-edit-panel .detail-content-block-item[data-block-type="note"] .detail-content-note-fields{grid-column:2;grid-row:2;align-self:start}
    /* 鍥炬枃锛氭爣棰樻í璺ㄦ暣琛岋紝鏂囧瓧涓庡獟浣撳苟鎺掔紪杈戙€?*/
    .content-edit-panel .detail-content-block-item[data-block-type="media_text"] .detail-content-block-main{
      display:grid;
      grid-template-columns:minmax(360px,1.08fr) minmax(380px,.92fr);
      gap:12px 22px;
      align-items:start;
    }
    .content-edit-panel .detail-content-block-item[data-block-type="media_text"] .detail-content-block-main>input:first-child{grid-column:1 / -1}
    .content-edit-panel .detail-content-block-item[data-block-type="media_text"] .detail-content-textarea-field{grid-column:1;grid-row:2}
    .content-edit-panel .detail-content-block-item[data-block-type="media_text"] .detail-content-image-fields{grid-column:2;grid-row:2}
    .content-edit-panel .detail-content-block-item[data-block-type="media_text"] .detail-content-media-fields.module-media-field{max-width:none}
    .content-edit-panel .detail-content-block-item[data-block-type="image"] .detail-content-image-fields,
    .content-edit-panel .detail-content-block-item[data-block-type="video"] .detail-content-video-fields{max-width:980px}
    .content-edit-panel [data-field-section="detail_content_blocks"]>.d-flex:first-child{align-items:center!important}
    .content-edit-panel [data-field-section="detail_content_blocks"]>.d-flex:first-child>.d-flex{justify-content:flex-end;gap:5px!important;flex-wrap:wrap}
    /* 濯掍綋鍖猴細绫诲瀷鍗曠嫭涓€琛岋紝涓嬫柟鎵嶆槸棰勮涓庡瓧娈碉紝閬垮厤涓夋鍓茬銆?*/
    .content-edit-panel [data-field-section="media"]>.ds-card-body{padding:0!important}
    .content-edit-panel [data-field-section="media"] .ds-media-grid{
      display:grid;
      grid-template-columns:minmax(0,1fr);
      gap:20px;
      max-width:1080px;
    }
    .content-edit-panel [data-field-section="media"] .ds-media-preview-col{
      display:grid;
      grid-template-columns:80px max-content;
      align-items:center;
      justify-content:start;
      gap:12px;
      padding-bottom:16px;
      border-bottom:1px solid #edf1f4;
    }
    .content-edit-panel [data-field-section="media"] .ds-media-preview-col>.form-label{margin:0}
    .content-edit-panel [data-field-section="media"] .ds-media-preview-col>.seg-radio{
      flex-wrap:nowrap;
      align-items:center;
      white-space:nowrap;
    }
    .content-edit-panel [data-field-section="media"] .ds-media-preview-col>.seg-radio .seg-radio-option{margin:0}
    .content-edit-panel [data-field-section="media"] .ds-media-fields-col{width:100%;max-width:980px;gap:0}
    .content-edit-panel [data-field-section="media"] .dataset-media-field{
      grid-template-columns:120px minmax(0,1fr);
      gap:8px 16px;
      align-items:start;
    }
    .content-edit-panel [data-field-section="media"] .dataset-media-field>.form-label{padding-top:2px}
    .content-edit-panel [data-field-section="media"] .module-media-picker{width:120px;height:100px;min-height:100px}
    /* 姝ｆ枃闈㈡澘涓庡唴閮ㄥ唴瀹瑰潡鍒嗗眰锛氬唴瀹瑰潡涓嶅啀璐村妗嗐€?*/
    .content-edit-panel .dataset-edit-form>[data-field-section="detail_content_blocks"]{
      padding:0!important;
      background:#f3f6f8!important;
    }
    .content-edit-panel .dataset-edit-form>[data-field-section="detail_content_blocks"]>.d-flex:first-child{
      margin:0!important;
      padding:14px 25px!important;
      background:#fff!important;
      border-bottom:1px solid #e5ebef!important;
    }
    .content-edit-panel .dataset-edit-form>[data-field-section="detail_content_blocks"]>#detailContentBlocksList{
      padding:25px!important;
      gap:16px!important;
      background:#f3f6f8;
    }
    .content-edit-panel #detailContentBlocksList>.detail-content-block-item{
      /* border:0!important; */
      box-shadow:0 3px 12px rgba(15,23,42,.07)!important;
    }
    .content-edit-panel .dataset-edit-form .detail-content-block-item>.detail-content-block-side{
      display:flex;

    @media(max-width:900px){.content-edit-workspace{padding:14px}.content-edit-panel{padding:12px}.content-edit-hero{padding-right:44px}.content-edit-layout{display:block}.content-edit-outline{display:none}.content-edit-panel #detailGalleryList{grid-template-columns:1fr}.content-edit-panel .dataset-edit-form .detail-content-block-side{display:grid;grid-template-columns:1fr}.content-edit-panel .dataset-edit-form .detail-content-block-side .detail-content-type-select,.content-edit-panel .dataset-edit-form .detail-content-block-side .detail-content-layout-wrap{width:100%;flex-basis:auto}.content-edit-panel .detail-content-block-item[data-block-type="note"] .detail-content-block-main,.content-edit-panel .detail-content-block-item[data-block-type="media_text"] .detail-content-block-main{grid-template-columns:1fr}.content-edit-panel .detail-content-block-item[data-block-type="note"] .detail-content-block-main>*,.content-edit-panel .detail-content-block-item[data-block-type="media_text"] .detail-content-block-main>*{grid-column:1!important;grid-row:auto!important}}

<body>
  <main class="content-edit-workspace"><div class="content-edit-shell">
    <header class="content-edit-hero">
      <h1>{{ page_label }} · 编辑 #{{ edit_item_id }}</h1>
      <p>编辑内容字段、媒体和详情组件，保存后会更新对应详情页。</p>
    </header>
    <section class="content-edit-panel">
      <div class="content-edit-layout">
        <aside class="content-edit-outline" aria-label="内容编辑导航">
          <div class="content-edit-outline-title">内容导航</div>
          <nav class="content-edit-outline-list" id="contentEditOutline"></nav>
        </aside>
        <div class="content-edit-main">{% include 'dashboard/panel_data_list.html' %}</div>
      </div>
    </section>
  </div></main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script>
  (function(){
    var form=document.getElementById('datasetEditForm');
    var outline=document.getElementById('contentEditOutline');
    if(!form||!outline)return;
    var collectionSelector='#detailGalleryList,#detailFeaturesList,#detailFilesList,#detailFaqsList,#detailContentBlocksList,#detailTablesList,#detailLinksList';
    var itemSelector='.detail-gallery-item,.detail-feature-item,.detail-file-edit-item,.detail-faq-edit-item,.detail-content-block-item,.detail-table-item,.detail-link-item';
    function markEditorCollection(collection){
      collection.classList.add('editor-component__collection');
      Array.from(collection.children).forEach(function(item){if(item.matches(itemSelector))item.classList.add('editor-component__item');});
    }
    Array.from(form.querySelectorAll(':scope>.ds-card:not(.ds-template-card),:scope>.detail-field-section,:scope>.detail-multi-section')).forEach(function(component){
      component.classList.add('editor-component');
      var header=component.querySelector(':scope>.ds-card-head,:scope>.small.fw-semibold,:scope>.d-flex:first-child');
      if(header)header.classList.add('editor-component__header');
      var body=component.querySelector(':scope>.editor-component__body,:scope>.ds-card-body');
      if(!body){
        body=document.createElement('div');
        body.className='editor-component__body';
        Array.from(component.childNodes).forEach(function(node){if(node!==header)body.appendChild(node);});
        component.appendChild(body);
      }else{
        body.classList.add('editor-component__body');
      }
      var collections=body.matches(collectionSelector)?[body]:Array.from(body.querySelectorAll(collectionSelector));
      collections.forEach(markEditorCollection);
      if(collections.length)body.classList.add('has-editor-collection');
    });
    var collectionObserver=new MutationObserver(function(records){
      records.forEach(function(record){
        if(record.target instanceof Element&&record.target.matches(collectionSelector))markEditorCollection(record.target);
      });
    });
    form.querySelectorAll(collectionSelector).forEach(function(collection){collectionObserver.observe(collection,{childList:true});});
    var sectionSelector='.ds-card,.detail-field-section,.detail-multi-section,.ds-settings-card,.detail-content-block-item,.detail-spec-group-item,.detail-table-item,.detail-link-item';
    var sections=Array.from(form.querySelectorAll(sectionSelector)).filter(function(node){return node.offsetParent!==null;});
    var navEntries=[];
    sections.forEach(function(section,index){
      var label=section.querySelector(':scope>.ds-card-head .ds-card-title,:scope>.ds-card-head,:scope>.small.fw-semibold,:scope>.d-flex:first-child .small.fw-semibold,:scope>.detail-content-block-side>.d-flex:first-child .small.fw-semibold');
      var text=(label&&label.textContent||'').trim().replace(/\s+/g,' ');
      if(!text)return;
      section.id=section.id||'content-edit-section-'+index;
      var button=document.createElement('button');
      button.type='button';button.className='content-edit-outline-button';button.textContent=text;
      var parentSection=section.parentElement&&section.parentElement.closest(sectionSelector);
      if(parentSection)button.classList.add('is-child');
      button.addEventListener('click',function(){section.scrollIntoView({behavior:'smooth',block:'start'});});
      outline.appendChild(button);
      navEntries.push({section:section,button:button});
    });
    var buttons=navEntries.map(function(entry){return entry.button;});
    if(buttons[0])buttons[0].classList.add('is-active');
    if('IntersectionObserver'in window){
      var observer=new IntersectionObserver(function(entries){
        entries.filter(function(entry){return entry.isIntersecting;}).sort(function(a,b){return b.intersectionRatio-a.intersectionRatio;}).slice(0,1).forEach(function(entry){
          var index=navEntries.findIndex(function(item){return item.section===entry.target;});buttons.forEach(function(btn,i){btn.classList.toggle('is-active',i===index);});
        });
      },{rootMargin:'-15% 0px -70% 0px',threshold:[0,.1,.5]});
      navEntries.forEach(function(entry){observer.observe(entry.section);});
    }
  })();
  </script>
