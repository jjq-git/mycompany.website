{% extends "base.html" %}
{% block title %}{{ item.title }} — 文章编辑{% endblock %}

{% block content %}
<a class="muted" href="{{ url_for('core.blog') }}">← 返回博客列表</a>
<h1 class="page-title" style="margin-top: 12px;">编辑文章</h1>
<p class="page-subtitle">ID #{{ item.id }}</p>

{% with messages = get_flashed_messages() %}
  {% for m in messages %}
    <div class="card" style="max-width: 720px; background: #ecfdf5; border-color: #a7f3d0; color: #065f46;">{{ m }}</div>
  {% endfor %}
{% endwith %}

<form method="post" action="{{ url_for('core.post_edit', item_id=item.id) }}">
<div class="card" style="max-width: 720px;">
  <div class="form-row">
    <label>标题</label>
    <input type="text" name="title" value="{{ item.title or '' }}" required>
  </div>
  <div class="form-row">
    <label>Slug（URL 用，英文）</label>
    <input type="text" name="slug" value="{{ item.slug or '' }}" required>
  </div>
  <div class="form-row">
    <label>发布日期</label>
    <input type="date" name="date" value="{{ item.date or '' }}">
  </div>
  <div class="form-row">
    <label>封面图 URL</label>
    <input type="text" name="cover" value="{{ item.cover or '' }}" placeholder="/assets/post.jpg">
  </div>
  <div class="form-row">
    <label>摘要（一两句话，列表里显示）</label>
    <textarea name="excerpt">{{ item.excerpt or '' }}</textarea>
  </div>
  <div class="form-row">
    <label>正文（支持换行）</label>
    <textarea name="body" style="min-height: 300px; font-family: inherit;">{{ item.body or '' }}</textarea>
  </div>
  <div class="form-actions">
    <button class="btn btn-primary" type="submit">保存</button>
    <a class="btn" href="{{ url_for('core.blog') }}">取消</a>
  </div>
</div>
</form>
{% endblock %}
