{% extends "base.html" %}
{% block title %}{{ item.title }} — 功能编辑{% endblock %}

{% block content %}
<a class="muted" href="{{ url_for('core.features') }}">← 返回功能列表</a>
<h1 class="page-title" style="margin-top: 12px;">编辑功能</h1>
<p class="page-subtitle">ID #{{ item.id }}</p>

{% with messages = get_flashed_messages() %}
  {% for m in messages %}
    <div class="card" style="max-width: 720px; background: #ecfdf5; border-color: #a7f3d0; color: #065f46;">{{ m }}</div>
  {% endfor %}
{% endwith %}

<form method="post" action="{{ url_for('core.feature_edit', item_id=item.id) }}">
<div class="card" style="max-width: 720px;">
  <div class="form-row">
    <label>图标（短关键词或 emoji）</label>
    <input type="text" name="icon" value="{{ item.icon or '' }}" placeholder="qr / clock / 🔍">
  </div>
  <div class="form-row">
    <label>标题</label>
    <input type="text" name="title" value="{{ item.title or '' }}" required>
  </div>
  <div class="form-row">
    <label>描述</label>
    <textarea name="desc">{{ item.desc or '' }}</textarea>
  </div>
  <div class="form-actions">
    <button class="btn btn-primary" type="submit">保存</button>
    <a class="btn" href="{{ url_for('core.features') }}">取消</a>
  </div>
</div>
</form>
{% endblock %}
