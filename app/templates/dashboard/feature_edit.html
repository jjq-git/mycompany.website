{% extends "base.html" %}
{% block title %}{{ item.title }} — 功能编辑{% endblock %}

{% block content %}
<a class="muted" href="{{ url_for('core.features') }}">← 返回功能列表</a>
<h1 class="page-title" style="margin-top: 12px;">编辑功能</h1>
<p class="page-subtitle">ID #{{ item.id }}</p>

{% with messages = get_flashed_messages() %}
  {% for m in messages %}
    <div class="card" style="max-width: 720px; background: #ecfdf5; border-color: #a7f3d0; color: #065f46;">{{ m }}</div>
  {% endfor %}
{% endwith %}

<form method="post" action="{{ url_for('core.feature_edit', item_id=item.id, site=site.id) }}">
<div class="card" style="max-width: 720px;">
  <div class="form-row">
    <label>图标</label>
    <select name="icon" style="width:100%; padding: 8px 12px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--text); font-size: 14px;">
      {% set icon_options = [
        ('circuit',   '⚡ 电路板'),
        ('code',      '💻 代码开发'),
        ('structure', '📐 层次结构'),
        ('sensor',    '📡 传感器'),
        ('interactive','🖱️ 互动系统'),
        ('audio',     '🎵 音视频'),
        ('cpu',       '🔲 处理器/芯片'),
        ('settings',  '⚙️ 设置/配置'),
        ('shield',    '🛡️ 安全防护'),
        ('zap',       '⚡ 闪电/高效'),
        ('wifi',      '📶 无线连接'),
        ('globe',     '🌐 全球/网络'),
        ('package',   '📦 产品包装'),
        ('tool',      '🔧 工具/制作'),
        ('bar-chart', '📊 数据图表'),
        ('monitor',   '🖥️ 显示屏'),
        ('camera',    '📷 摄像/视频'),
        ('light',     '💡 灯光照明'),
        ('bluetooth', '🔷 蓝牙'),
        ('touch',     '✋ 触控交互'),
      ] %}
      {% for val, label in icon_options %}
      <option value="{{ val }}" {% if item.icon == val %}selected{% endif %}>{{ label }}</option>
      {% endfor %}
    </select>
    <small class="muted" style="margin-top:4px; display:block;">选择代表该功能的图标</small>
  </div>
  <div class="form-row">
    <label>标题</label>
    <input type="text" name="title" value="{{ item.title or '' }}" required placeholder="如：电路设计">
  </div>
  <div class="form-row">
    <label>描述</label>
    <textarea name="desc" placeholder="简短描述该功能，一两句话即可">{{ item.desc or '' }}</textarea>
  </div>
  <div class="form-actions">
    <button class="btn btn-primary" type="submit">保存</button>
    <a class="btn" href="{{ url_for('core.features') }}">取消</a>
  </div>
</div>
</form>
{% endblock %}
