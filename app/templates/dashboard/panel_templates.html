{# 模板库面板 #}
<div class="d-flex align-items-center justify-content-between mb-3">
  <span class="fw-semibold">模板库</span>
  <button class="btn btn-sm btn-primary use-template-btn" data-href="{{ url_for('core.site_new', _fragment='1') }}" style="font-size:11px">+ 新建站点</button>
</div>
<div class="d-flex flex-column gap-3">
  {% for tpl in templates %}
  <div class="card" style="overflow: hidden;">
    <div style="aspect-ratio: 16/10; background: #1a1a2e; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 13px;">
      {% if tpl.cover_image %}
      <img src="{{ tpl.cover_image }}" alt="{{ tpl.display_name }}" style="width: 100%; height: 100%; object-fit: cover;">
      {% else %}
      <span class="text-white-50">{{ tpl.industry }}</span>
      {% endif %}
    </div>
    <div class="card-body p-2">
      <div class="d-flex align-items-baseline justify-content-between mb-1">
        <strong class="small">{{ tpl.display_name }}</strong>
        <span class="badge bg-secondary" style="font-size:9px">{{ tpl.industry }}</span>
      </div>
      <p class="text-muted mb-2" style="font-size:10px; line-height: 1.4;">{{ tpl.description }}</p>
      <div class="d-flex gap-1">
        <a class="btn btn-sm btn-outline-secondary" href="{{ url_for('core.template_preview', template_name=tpl.name) }}" target="_blank" style="font-size:11px">预览</a>
        <button class="btn btn-sm btn-primary use-this-btn" data-href="{{ url_for('core.site_new', template=tpl.name, _fragment='1') }}" style="font-size:11px">用这个</button>
      </div>
    </div>
  </div>
  {% endfor %}
</div>

<script>
(function(){
  document.querySelectorAll('.use-template-btn, .use-this-btn').forEach(function(btn){
    btn.addEventListener('click', function(){
      loadPanel(this.dataset.href);
    });
  });
})();
</script>
