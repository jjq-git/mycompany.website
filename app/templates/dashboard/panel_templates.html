{# 模板库面板 #}
<div class="fw-semibold mb-3">模板库</div>
<div class="row g-2">
  {% for tpl in templates %}
  <div class="col-6">
    <div class="card h-100">
      <div class="card-body p-2">
        <h6 class="card-title small mb-1">{{ tpl.display_name }}</h6>
        <p class="text-muted" style="font-size:10px">{{ tpl.description }}</p>
        <a class="btn btn-sm btn-outline-primary" href="{{ url_for('core.site_new', template=tpl.name) }}">使用此模板</a>
      </div>
    </div>
  </div>
  {% endfor %}
</div>
