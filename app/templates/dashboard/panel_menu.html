{# 菜单配置面板 #}
<div class="d-flex align-items-center justify-content-between mb-3">
  <span class="fw-semibold">菜单配置</span>
  <span class="small text-muted">首页固定在第一项</span>
</div>
{% with messages = get_flashed_messages() %}
  {% for m in messages %}
    <div class="alert alert-success py-1 px-2 small mb-2">{{ m }}</div>
  {% endfor %}
{% endwith %}

<form method="post" action="{{ url_for('core.menu_edit', _fragment='1') }}" id="menuTreeForm">
  <input type="hidden" name="menu_json" id="menuJson">
  <div id="menuTree" class="menu-tree"></div>
  <div class="d-flex gap-2 mt-3">
    <button type="button" class="btn btn-outline-secondary btn-sm" id="addRootMenu">+ 添加一级菜单</button>
    <button class="btn btn-primary btn-sm" type="submit">保存菜单</button>
  </div>
</form>

<script>
(function(){
  const initialMenu = {{ items | tojson }};
  const typeLabels = {home: '首页', list: '列表', page: '单页', link: '链接'};
  const styleLabels = {vertical: '垂直列表', horizontal: '水平平铺', grid: '网格排列', cards: '图文卡片'};
  const tree = document.getElementById('menuTree');
  const form = document.getElementById('menuTreeForm');
  const jsonInput = document.getElementById('menuJson');

  function newItem() {
    return {label: '新菜单', type: 'page', target: '', children: []};
  }

  function escapeAttr(value) {
    return String(value || '').replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
  }

  function render(items, container, depth) {
    container.innerHTML = '';
    items.forEach(function(item) {
      if (!Array.isArray(item.children)) item.children = [];
      const isHome = item.type === 'home';
      const row = document.createElement('div');
      row.className = 'menu-tree-row';
      row.dataset.depth = depth;
      row._item = item;
      row.innerHTML =
        '<div class="menu-tree-card">' +
          '<div class="d-flex gap-1 align-items-center">' +
            '<input class="form-control form-control-sm menu-label" placeholder="名称" value="' + escapeAttr(item.label) + '"' + (isHome ? ' readonly' : '') + '>' +
            '<select class="form-select form-select-sm menu-type"' + (isHome ? ' disabled' : '') + '>' +
              Object.keys(typeLabels).filter(function(t){ return isHome || t !== 'home'; }).map(function(t){ return '<option value="' + t + '"' + (item.type === t ? ' selected' : '') + '>' + typeLabels[t] + '</option>'; }).join('') +
            '</select>' +
            '<button type="button" class="btn btn-sm btn-outline-secondary move-up"' + (isHome ? ' disabled' : '') + '>↑</button>' +
            '<button type="button" class="btn btn-sm btn-outline-secondary move-down"' + (isHome ? ' disabled' : '') + '>↓</button>' +
            '<button type="button" class="btn btn-sm btn-outline-danger delete-item"' + (isHome ? ' disabled' : '') + '>✕</button>' +
          '</div>' +
          '<input class="form-control form-control-sm mt-1 menu-target" placeholder="products / about" value="' + escapeAttr(item.target) + '">' +
          '<input class="form-control form-control-sm mt-1 menu-url" placeholder="https:// 或 /products/xxx" value="' + escapeAttr(item.url) + '">' +
          '<div class="d-flex gap-1 mt-1">' +
            '<select class="form-select form-select-sm menu-dropdown-style">' +
              Object.keys(styleLabels).map(function(s){ return '<option value="' + s + '"' + ((item.dropdown_style || 'vertical') === s ? ' selected' : '') + '>' + styleLabels[s] + '</option>'; }).join('') +
            '</select>' +
            '<button type="button" class="btn btn-sm btn-outline-secondary add-child">+ 子菜单</button>' +
          '</div>' +
          '<div class="menu-tree-children mt-2"></div>' +
        '</div>';
      container.appendChild(row);
      updateFields(row);
      render(item.children, row.querySelector('.menu-tree-children'), depth + 1);
    });
  }

  function updateFields(row) {
    const type = row.querySelector('.menu-type').value;
    const target = row.querySelector('.menu-target');
    const url = row.querySelector('.menu-url');
    const style = row.querySelector('.menu-dropdown-style');
    const item = row._item;
    target.style.display = (type === 'list' || type === 'page') ? '' : 'none';
    url.style.display = type === 'link' ? '' : 'none';
    style.style.display = item.children && item.children.length ? '' : 'none';
  }

  function rowsIn(container) {
    return Array.from(container.children).filter(function(el){ return el.classList.contains('menu-tree-row'); });
  }

  function collect(container) {
    return rowsIn(container).map(function(row) {
      const type = row.querySelector('.menu-type').value;
      const item = {
        label: row.querySelector('.menu-label').value.trim(),
        type: type,
        children: collect(row.querySelector('.menu-tree-children'))
      };
      if (type === 'list' || type === 'page') item.target = row.querySelector('.menu-target').value.trim();
      if (type === 'link') item.url = row.querySelector('.menu-url').value.trim();
      if (item.children.length) item.dropdown_style = row.querySelector('.menu-dropdown-style').value;
      return item;
    });
  }

  tree.addEventListener('input', function(e) {
    const row = e.target.closest('.menu-tree-row');
    if (row) updateFields(row);
  });

  tree.addEventListener('change', function(e) {
    const row = e.target.closest('.menu-tree-row');
    if (row) updateFields(row);
  });

  tree.addEventListener('click', function(e) {
    const row = e.target.closest('.menu-tree-row');
    if (!row) return;
    const parentContainer = row.parentElement;
    const parentRow = parentContainer.closest('.menu-tree-row');
    const parentItems = parentRow ? parentRow._item.children : initialMenu;
    const index = rowsIn(parentContainer).indexOf(row);
    if (e.target.classList.contains('delete-item')) {
      if (row._item.type !== 'home') parentItems.splice(index, 1);
    } else if (e.target.classList.contains('add-child')) {
      row._item.children.push(newItem());
    } else if (e.target.classList.contains('move-up') && index > 0) {
      const item = parentItems.splice(index, 1)[0];
      parentItems.splice(index - 1, 0, item);
    } else if (e.target.classList.contains('move-down') && index < parentItems.length - 1) {
      const item = parentItems.splice(index, 1)[0];
      parentItems.splice(index + 1, 0, item);
    } else {
      return;
    }
    render(initialMenu, tree, 0);
  });

  document.getElementById('addRootMenu').addEventListener('click', function() {
    initialMenu.push(newItem());
    render(initialMenu, tree, 0);
  });

  form.addEventListener('submit', function() {
    jsonInput.value = JSON.stringify(collect(tree));
  });

  render(initialMenu, tree, 0);
})();
</script>
