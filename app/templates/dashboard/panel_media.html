<link rel="stylesheet" href="{{ url_for('static', filename='css/admin-media.css') }}?v=2">

<div class="media-panel" id="mediaPanel">
  <div class="d-flex align-items-center justify-content-between mb-3">
    <span class="fw-semibold">濯掍綋绠＄悊</span>
    <span class="media-count">{{ files|length }} 涓祫婧?/span>
  </div>

  <div class="media-tabs" role="tablist" aria-label="濯掍綋鍒嗙被">
    <button class="media-tab active" type="button" data-media-filter="all">鍏ㄩ儴</button>
    <button class="media-tab" type="button" data-media-filter="unreferenced">鏈紩鐢?/button>
    <button class="media-tab" type="button" data-media-filter="image">鍥剧墖</button>
    <button class="media-tab" type="button" data-media-filter="video">瑙嗛</button>
    <button class="media-tab" type="button" data-media-filter="package">缃戦〉鍖?/button>
    <button class="media-tab" type="button" data-media-filter="document">鏂囨。</button>
    <button class="media-tab" type="button" data-media-filter="other">鍏朵粬</button>
  </div>

  <label class="media-upload-zone" id="mediaUploadZone">
    <input type="file" id="mediaUploadInput" hidden>
    <span class="media-upload-icon">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M17 8l-5-5-5 5"/><path d="M12 3v12"/></svg>
    </span>
    <span class="media-upload-text">鎷栨嫿鏂囦欢鍒版澶勬垨鐐瑰嚮涓婁紶</span>
    <span class="media-upload-hint">鏀寔鍥剧墖銆佽棰戙€佹枃妗ｏ紱鍖呭惈 index.html 鐨?zip 浼氫綔涓虹綉椤靛寘澶勭悊</span>
  </label>
  <div class="media-status" id="mediaStatus" hidden></div>

  <div class="media-manager-layout">
    <div class="media-list-pane">
      <div class="media-grid" id="mediaGrid">
        {% for file in files %}
          <article class="media-card" data-category="{{ file.category }}" data-name="{{ file.api_name }}" data-display-name="{{ file.display_name }}" data-url="{{ file.url }}" data-ext="{{ file.ext }}" data-is-package="{{ '1' if file.is_package else '0' }}" data-size="{{ file.size_display }}" data-category-label="{{ file.category_label }}" data-reference-count="{{ file.reference_count|default(0) }}">
            <button class="media-thumb" type="button" data-action="preview" title="棰勮">
              {% if file.category == 'image' %}
                <img src="{{ file.url }}" alt="{{ file.display_name }}" loading="lazy">
              {% elif file.category == 'video' %}
                <svg viewBox="0 0 24 24" aria-hidden="true"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>
              {% elif file.category == 'package' %}
                <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 8h18"/><path d="M8 13l-2 2 2 2"/><path d="M16 13l2 2-2 2"/><path d="M13 12l-2 6"/></svg>
              {% elif file.category == 'document' %}
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M8 13h8"/><path d="M8 17h6"/></svg>
              {% else %}
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg>
              {% endif %}
            </button>
            <div class="media-card-body">
              <div class="media-name" title="{{ file.display_name }}">{{ file.display_name }}</div>
              <div class="media-meta">
                <span>{{ file.category_label }}</span>
                <span>{{ file.size_display }}</span>
              </div>
            </div>
            <div class="media-actions">
              <a class="media-action" href="{{ file.url }}" download title="涓嬭浇" aria-label="涓嬭浇">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>
              </a>
              {% if file.can_delete %}
              <button type="button" class="media-action media-action-danger" data-action="delete" title="鍒犻櫎" aria-label="鍒犻櫎">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>
              </button>
              {% endif %}
            </div>
          </article>
        {% endfor %}
      </div>

      <div class="media-empty" id="mediaEmpty" {% if files %}hidden{% endif %}>鏆傛棤濯掍綋鏂囦欢</div>
    </div>

    <aside class="media-preview-card" aria-label="濯掍綋棰勮">
      <div class="media-preview-resizer" data-preview-resizer role="separator" aria-orientation="vertical" tabindex="0" title="鎷栨嫿璋冩暣棰勮瀹藉害"></div>
      <div class="media-preview-head">
        <div>
          <div class="media-preview-label">棰勮</div>
          <div class="media-preview-title" id="mediaPreviewTitle">閫夋嫨涓€涓祫婧?/div>
        </div>
      </div>
      <div class="media-preview-body" id="mediaPreviewBody">
        <div class="media-preview-placeholder">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
          <div>鐐瑰嚮宸︿晶璧勬簮杩涜棰勮</div>
        </div>
      </div>
      <div class="media-preview-info" id="mediaPreviewInfo" hidden>
        <div><span>绫诲瀷</span><strong data-preview-type></strong></div>
        <div><span>澶у皬</span><strong data-preview-size></strong></div>
        <div><span>璺緞</span><code data-preview-url title="点击文件名修改"></code></div>
      </div>
    </aside>
  </div>
</div>

<script>
(function() {
  var panel = document.getElementById('mediaPanel');
  if (!panel) return;
  var grid = document.getElementById('mediaGrid');
  var empty = document.getElementById('mediaEmpty');
  var status = document.getElementById('mediaStatus');
  var uploadZone = document.getElementById('mediaUploadZone');
  var uploadInput = document.getElementById('mediaUploadInput');
  var mediaCount = panel.querySelector('.media-count');
  var previewTitle = document.getElementById('mediaPreviewTitle');
  var previewBody = document.getElementById('mediaPreviewBody');
  var previewInfo = document.getElementById('mediaPreviewInfo');
  var previewUrlCode = previewInfo ? previewInfo.querySelector('[data-preview-url]') : null;
  var managerLayout = panel.querySelector('.media-manager-layout');
  var previewCard = panel.querySelector('.media-preview-card');
  var previewResizer = panel.querySelector('[data-preview-resizer]');

  function setStatus(text, type) {
    if (!status) return;
    status.hidden = !text;
    status.textContent = text || '';
    status.className = 'media-status ' + (type ? 'media-status-' + type : '');
  }

  function siteQuery() {
    var params = new URLSearchParams(window.location.search);
    var site = params.get('site') || '{{ site.id }}';
    return site ? '?site=' + encodeURIComponent(site) : '';
  }

  function refreshPanel() {
    if (typeof loadPanel === 'function') {
      return loadPanel('{{ url_for("core.media") }}?_fragment=1&site={{ site.id }}');
    }
    window.location.reload();
  }

  function references(name) {
    return fetch('/api/media/references?filename=' + encodeURIComponent(name) + '&site={{ site.id }}')
      .then(function(r) { return r.json().then(function(data) { return { ok: r.ok, data: data }; }); });
  }

  function updateMediaCount(count) {
    if (mediaCount) mediaCount.textContent = count + ' items';
  }

  function updateVisibleMediaCount() {
    if (!mediaCount) return;
    var visible = grid.querySelectorAll('.media-card:not([hidden])').length;
    updateMediaCount(visible);
  }

  function refsHtml(refs) {
    return '<div class="mb-1">璇ヨ祫婧愭鍦ㄨ寮曠敤锛涢噸鍛藉悕浼氳嚜鍔ㄦ洿鏂拌繖浜?YAML 寮曠敤锛屽垹闄や粛浼氳闃绘銆?/div><ul>' +
      refs.map(function(ref) { return '<li>' + String(ref).replace(/[&<>"']/g, function(c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }) + '</li>'; }).join('') +
      '</ul>';
  }

  function splitFilename(name) {
    var match = String(name || '').match(/^(.*?)(\.[^.]*)$/);
    if (!match) return { stem: name || '', ext: '' };
    return { stem: match[1], ext: match[2] };
  }

  function inlineRenameFromPreview() {
    if (!previewUrlCode) return;
    var oldName = previewUrlCode.dataset.name || '';
    if (!oldName) return;
    var activeCard = grid.querySelector('.media-card.active[data-name="' + oldName.replace(/"/g, '\\"') + '"]') || grid.querySelector('.media-card[data-name="' + oldName.replace(/"/g, '\\"') + '"]');
    var parts = splitFilename(activeCard ? activeCard.dataset.displayName : oldName);
    var row = document.createElement('span');
    row.className = 'media-inline-rename-row';
    var input = document.createElement('input');
    input.className = 'form-control form-control-sm media-inline-path-input';
    input.value = parts.stem;
    var ext = document.createElement('span');
    ext.className = 'media-rename-extension';
    ext.textContent = parts.ext;
    var loading = document.createElement('span');
    loading.className = 'media-inline-loading';
    loading.textContent = '保存中...';
    loading.hidden = true;
    row.appendChild(input);
    if (parts.ext) row.appendChild(ext);
    row.appendChild(loading);
    previewUrlCode.replaceWith(row);
    input.focus();
    input.select();

    function restore(urlText, apiName) {
      var code = document.createElement('code');
      code.setAttribute('data-preview-url', '');
      code.title = '点击文件名修改';
      code.dataset.name = apiName || oldName;
      code.textContent = urlText;
      previewUrlCode = code;
      row.replaceWith(code);
      code.addEventListener('click', inlineRenameFromPreview);
    }

    function finish(save) {
      if (!save) {
        restore(activeCard ? activeCard.dataset.url : previewUrlCode.textContent, oldName);
        return;
      }
      var stem = input.value.trim();
      if (!stem || stem === parts.stem) {
        restore(activeCard ? activeCard.dataset.url : previewUrlCode.textContent, oldName);
        return;
      }
      var newName = stem + parts.ext;
      loading.hidden = false;
      input.disabled = true;
      setStatus('正在保存文件名...', 'muted');
      fetch('/api/media/rename?site={{ site.id }}', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ old_name: oldName, new_name: newName })
      }).then(function(r) {
        return r.json().then(function(data) { return { ok: r.ok, data: data }; });
      }).then(function(result) {
        if (!result.ok || result.data.ok === false) throw new Error(result.data.error || '保存失败');
        var data = result.data;
        var newApiName = data.name || data.filename || newName;
        var newUrl = data.url || ('/assets/uploads/' + newName);
        if (activeCard) {
          activeCard.dataset.name = newApiName;
          activeCard.dataset.displayName = newName;
          activeCard.dataset.url = newUrl;
          var nameEl = activeCard.querySelector('.media-name');
          if (nameEl) { nameEl.textContent = newName; nameEl.title = newName; }
          var thumbImg = activeCard.querySelector('.media-thumb img');
          if (thumbImg) thumbImg.src = newUrl;
          var download = activeCard.querySelector('a[download]');
          if (download) download.href = newUrl;
        }
        previewTitle.textContent = newName;
        previewBody.querySelectorAll('img,video,iframe').forEach(function(el) { el.src = newUrl; });
        restore(newUrl, newApiName);
        setStatus('文件名已保存', 'success');
      }).catch(function(err) {
        setStatus(err.message || '保存失败', 'danger');
        restore(activeCard ? activeCard.dataset.url : previewUrlCode.textContent, oldName);
      });
    }

    input.addEventListener('blur', function() { finish(true); });
    input.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') input.blur();
      if (e.key === 'Escape') finish(false);
    });
  }
  function preview(card) {
    // 切换激活状态，高亮当前选中的媒体卡片
    grid.querySelectorAll('.media-card.active').forEach(function(c) { c.classList.remove('active'); });
    card.classList.add('active');

    var name = card.dataset.name;
    var displayName = card.dataset.displayName;
    var url = card.dataset.url;
    var category = card.dataset.category;
    var categoryLabel = card.dataset.categoryLabel;
    var size = card.dataset.size;

    // 更新预览标题
    previewTitle.textContent = displayName;

    // 根据媒体类型渲染预览内容
    if (category === 'image') {
      previewBody.innerHTML = '<img src="' + url + '" alt="' + displayName + '" style="max-width:100%;height:auto;border-radius:4px;">';
    } else if (category === 'video') {
      previewBody.innerHTML = '<video src="' + url + '" controls style="max-width:100%;height:auto;border-radius:4px;"></video>';
    } else if (category === 'package') {
      previewBody.innerHTML = '<iframe src="' + url + '" style="width:100%;height:400px;border:1px solid var(--border-color, #e0e0e0);border-radius:4px;"></iframe>';
    } else if (category === 'document') {
      previewBody.innerHTML = '<div class="media-preview-placeholder"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M8 13h8"/><path d="M8 17h6"/></svg><div>文档文件，点击下载查看</div></div>';
    } else {
      previewBody.innerHTML = '<div class="media-preview-placeholder"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg><div>不支持预览此文件类型</div></div>';
    }

    // 更新信息面板（类型、大小、路径）
    previewInfo.hidden = false;
    var typeEl = previewInfo.querySelector('[data-preview-type]');
    var sizeEl = previewInfo.querySelector('[data-preview-size]');
    if (typeEl) typeEl.textContent = categoryLabel;
    if (sizeEl) sizeEl.textContent = size;
    if (previewUrlCode) {
      previewUrlCode.textContent = url;
      previewUrlCode.dataset.name = name;
    }
  }

  function deleteCard(card) {
    var name = card.dataset.name;
    references(name).then(function(result) {
      var refs = result.data.refs || [];
      if (refs.length) {
        setStatus('This media is referenced and cannot be deleted.', 'danger');
        previewTitle.textContent = 'Media is referenced';
        previewBody.innerHTML = '<div class="media-ref-warning">' + refsHtml(refs) + '</div>';
        previewInfo.hidden = true;
        return;
      }
      if (!confirm('Delete this media file?')) return;
      return fetch('/api/media/delete?site={{ site.id }}', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ filename: name })
      }).then(function(r) {
        return r.json().then(function(data) { return { ok: r.ok, data: data }; });
      }).then(function(result) {
        if (!result.ok || result.data.ok === false) throw new Error(result.data.error || '鍒犻櫎澶辫触');
        card.remove();
        setStatus('Deleted', 'success');
        applyCurrentFilter();
      });
    }).catch(function(err) {
      setStatus(err.message || '鍒犻櫎澶辫触', 'danger');
    });
  }

  function upload(file) {
    if (!file) return;
    var fd = new FormData();
    fd.append('file', file);
    setStatus('姝ｅ湪涓婁紶...', 'muted');
    fetch('/api/media/upload?site={{ site.id }}', { method: 'POST', body: fd })
      .then(function(r) { return r.json().then(function(data) { return { ok: r.ok, data: data }; }); })
      .then(function(result) {
        if (!result.ok || result.data.ok === false) throw new Error(result.data.error || '涓婁紶澶辫触');
        setStatus('涓婁紶鎴愬姛', 'success');
        refreshPanel();
      })
      .catch(function(err) { setStatus(err.message || '涓婁紶澶辫触', 'danger'); });
  }

  function applyCurrentFilter() {
    var active = panel.querySelector('.media-tab.active');
    var filter = active ? active.dataset.mediaFilter : 'all';
    grid.querySelectorAll('.media-card').forEach(function(card) {
      var show = filter === 'all' || card.dataset.category === filter;
      if (filter === 'unreferenced') show = Number(card.dataset.referenceCount || 0) === 0;
      card.hidden = !show;
    });
    updateVisibleMediaCount();
    empty.hidden = grid.querySelectorAll('.media-card:not([hidden])').length > 0;
  }

  function clampPreviewWidth(width) {
    if (!managerLayout) return width;
    var rect = managerLayout.getBoundingClientRect();
    var styles = window.getComputedStyle(managerLayout);
    var gap = parseFloat(styles.columnGap || styles.gap || '16') || 16;
    var maxByLayout = Math.max(360, rect.width - gap - 360);
    return Math.max(360, Math.min(width, Math.min(1200, maxByLayout)));
  }

  function setPreviewWidth(width) {
    if (!managerLayout) return;
    managerLayout.style.setProperty('--media-preview-width', clampPreviewWidth(width) + 'px');
  }

  function initPreviewResize() {
    if (!managerLayout || !previewCard || !previewResizer || !window.PointerEvent) return;
    previewResizer.addEventListener('pointerdown', function(e) {
      if (window.matchMedia('(max-width: 1280px)').matches) return;
      e.preventDefault();
      var startX = e.clientX;
      var startWidth = previewCard.getBoundingClientRect().width;
      previewResizer.setPointerCapture(e.pointerId);
      document.body.classList.add('media-resizing');

      function onMove(moveEvent) {
        setPreviewWidth(startWidth + startX - moveEvent.clientX);
      }

      function onUp(upEvent) {
        previewResizer.releasePointerCapture(upEvent.pointerId);
        previewResizer.removeEventListener('pointermove', onMove);
        previewResizer.removeEventListener('pointerup', onUp);
        previewResizer.removeEventListener('pointercancel', onUp);
        document.body.classList.remove('media-resizing');
      }

      previewResizer.addEventListener('pointermove', onMove);
      previewResizer.addEventListener('pointerup', onUp);
      previewResizer.addEventListener('pointercancel', onUp);
    });
  }

  panel.querySelectorAll('.media-tab').forEach(function(btn) {
    btn.addEventListener('click', function() {
      panel.querySelectorAll('.media-tab').forEach(function(item) { item.classList.remove('active'); });
      btn.classList.add('active');
      applyCurrentFilter();
    });
  });

  grid.addEventListener('click', function(e) {
    var actionEl = e.target.closest('[data-action]');
    if (!actionEl) return;
    var card = e.target.closest('.media-card');
    if (!card) return;
    var action = actionEl.dataset.action;
    if (action === 'preview') preview(card);
    if (action === 'delete') deleteCard(card);
  });

  uploadZone.addEventListener('dragover', function(e) {
    e.preventDefault();
    uploadZone.classList.add('is-dragover');
  });
  uploadZone.addEventListener('dragleave', function() {
    uploadZone.classList.remove('is-dragover');
  });
  uploadZone.addEventListener('drop', function(e) {
    e.preventDefault();
    uploadZone.classList.remove('is-dragover');
    upload(e.dataTransfer.files && e.dataTransfer.files[0]);
  });
  uploadInput.addEventListener('change', function() {
    upload(uploadInput.files && uploadInput.files[0]);
    uploadInput.value = '';
  });

  initPreviewResize();
  if (previewUrlCode) previewUrlCode.addEventListener('click', inlineRenameFromPreview);
})();
</script>
