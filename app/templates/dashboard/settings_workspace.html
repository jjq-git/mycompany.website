<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <title>{{ title }}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}?v=20260624-settings-workspace">
  <style>
    :root {
      --bs-primary: {{ admin_primary }};
      --bs-primary-rgb: {{ admin_primary_rgb }};
      --bs-primary-bg-subtle: {{ admin_primary_light }};
      --bs-link-color: {{ admin_primary }};
      --bs-link-hover-color: {{ admin_primary_hover }};
      --admin-primary: {{ admin_primary }};
      --admin-primary-rgb: {{ admin_primary_rgb }};
      --admin-primary-hover: {{ admin_primary_hover }};
      --admin-primary-active: {{ admin_primary_active }};
      --admin-primary-light: {{ admin_primary_light }};
      --theme-primary: {{ admin_primary }};
    }
    body {
      margin: 0;
      background: #f6f7f9;
      color: #0f172a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 14px;
    }
    .settings-workspace { min-height: 100vh; padding: 16px; }
    .settings-workspace-inner { max-width: 920px; margin: 0 auto; }
    .settings-workspace-panel {
      padding: 18px;
      border: 1px solid #dfe4ea;
      border-radius: 8px;
      background: #fff;
      box-shadow: 0 12px 36px rgba(15,23,42,.06);
    }
    .settings-workspace-panel form { max-width: none; }
    .settings-workspace-panel .panel-save-bar {
      position: sticky;
      bottom: 0;
      margin: 16px -18px -18px;
      padding: 12px 18px;
      border-top: 1px solid #e2e8f0;
      background: rgba(255,255,255,.94);
      backdrop-filter: blur(8px);
    }
  </style>
</head>
<body>
  <main class="settings-workspace">
    <div class="settings-workspace-inner">
      <section class="settings-workspace-panel">
        {% include panel_template %}
      </section>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"></script>
</body>
</html>
