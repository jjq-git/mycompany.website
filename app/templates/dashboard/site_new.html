{% extends "base.html" %}
{% block title %}新建站点{% endblock %}

{% block content %}
<a class="muted" href="{{ url_for('core.templates_gallery') }}">← 返回模板库</a>
<h1 class="page-title" style="margin-top: 12px;">新建站点</h1>
<p class="page-subtitle">基于模板 <strong>{{ template.display_name }}</strong></p>

{% if error %}
<div class="card" style="max-width: 720px; background: #fef2f2; border-color: #fecaca; color: #991b1b;">{{ error }}</div>
{% endif %}

<form method="post" action="{{ url_for('core.site_new', template=template.name) }}">
<div class="card" style="max-width: 720px;">
  <div class="form-row">
    <label>站点名（你自己看的，例如：RIMU 官网）</label>
    <input type="text" name="name" value="{{ form.name or '' }}" required>
  </div>
  <div class="form-row">
    <label>Slug（站点的英文标识，3–30 字符 [a–z 0–9 -]）</label>
    <input type="text" name="slug" value="{{ form.slug or '' }}" required
           pattern="[a-z0-9][a-z0-9-]{1,28}[a-z0-9]"
           placeholder="rimu / acme-co / my-shop">
    <p class="muted" style="font-size: 13px; margin: 4px 0 0;">将来可以绑定到 yourcompany.com，未绑定时通过 {slug}.mycompany.website 访问。</p>
  </div>
  <div class="form-actions">
    <button class="btn btn-primary" type="submit">创建</button>
    <a class="btn" href="{{ url_for('core.templates_gallery') }}">取消</a>
  </div>
</div>
</form>
{% endblock %}
