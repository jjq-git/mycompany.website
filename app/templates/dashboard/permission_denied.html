<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>权限提示</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
  <style>
    body{margin:0;background:#f8fafc;color:#0f172a;font:14px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}
    .permission-state{min-height:280px;display:flex;align-items:center;justify-content:center;padding:32px}
    .permission-card{width:min(460px,100%);padding:30px;background:#fff;border:1px solid #dbe3ec;text-align:center}
    .permission-icon{width:44px;height:44px;margin:0 auto 14px;color:#64748b}
    .permission-icon svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.5}
    h1{margin:0 0 8px;font-size:20px}p{margin:0;color:#64748b}
  </style>
</head>
<body>
  <main class="permission-state">
    <section class="permission-card" role="alert">
      <div class="permission-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10V7a5 5 0 0 1 10 0v3"/><rect x="4" y="10" width="16" height="11"/><path d="M12 14v3"/></svg></div>
      <h1>{{ '只读模式' if '只读' in message else '权限受限' }}</h1>
      <p>{{ message }}</p>
    </section>
  </main>
</body>
</html>
