name: docs-update
description: 更新或新增项目文档(docs/ 目录下的设计文档)
version: "1.0.0"

triggers:
  - 更新文档
  - 写文档
  - 添加文档
  - 修改设计文档
  - 新文档

context: |
  当用户说"更新文档"、"写个设计文档"、"修改 vision.md"时触发.
  管理 `docs/` 目录下的项目文档——每个文件独立可读,面向人而不是编译器.

  文档约定(CLAUDE.md 第八节):
  - 少写代码(代码会过时,人话不会)
  - 文档面向人(创始人、未来的协作者),不是面向编译器
  - 多用表格、列表、对比、图示
  - 每个 docs/ 下的文件都应该独立可读
  - 不写"接下来会..."这类时态依赖的句子

instructions:
  - title: 现有文档清单
    content: |
      | 文件 | 内容 | 更新频率 |
      |------|------|----------|
      | `docs/vision.md` | 产品愿景、目标用户、商业模式 | 低(产品定位级变更) |
      | `docs/architecture.md` | 系统架构、数据流、技术决策 | 中(重大架构变更时) |
      | `docs/database.md` | 数据库表结构、字段说明 | 高(每次加字段时) |
      | `docs/templates.md` | 模板/Block 系统设计 | 高(模板系统变更时) |
      | `docs/content.md` | 内容模型、数据集设计 | 中 |
      | `docs/publish.md` | 发布流程、CDN、字体、图片 | 中 |
      | `docs/domains.md` | 域名规划、SSL、URL 规则 | 低 |
      | `docs/infrastructure.md` | 阿里云 OSS/CDN/SSL 配置 | 中 |
      | `docs/seo.md` | SEO 策略 | 低 |
      | `docs/i18n.md` | 多语言设计 | 中 |
      | `docs/index.md` | 文档索引 | 跟随文档变更 |

  - title: 新增文档
    content: |
      如果需要新增文档,遵循以下约定:

      1. **文件名**:小写英文 + 短横线,如 `image-processing.md`
      2. **位置**:放在 `docs/` 目录下
      3. **格式**:Markdown,UTF-8 编码
      4. **内容结构**:
         - 标题 + 一句话说明(为什么有这个文档)
         - 分节,每节有明确主题
         - 多用表格和列表
         - 在 `docs/index.md` 中添加链接
      5. **风格**:
         - 用"我们"不用"系统"(有人味)
         - 论断在前,解释在后
         - 对比用表格
         - 数据流用 ASCII 图

  - title: 更新现有文档的规则
    content: |
      修改文档时遵循:

      1. **保持独立可读**:修改后读者不需要读其他文档就能理解
      2. **更新关联引用**:如果改了表名、字段名、函数名,同步更新引用它的文档
      3. **删除过时内容**:不要用"已废弃"标记堆砌,直接删
      4. **不要写"将来"**:不写"未来我们会…",只写"现在是这样"
      5. **交叉引用用相对链接**:`[publish.md](publish.md)` 不要用绝对路径

  - title: 文档与代码的同步
    content: |
      以下代码变更需要同步更新文档:

      | 代码变更 | 需要更新的文档 |
      |----------|---------------|
      | 修改 `models.py`(加字段/改表) | `docs/database.md` |
      | 修改 `builder.py`(构建逻辑) | `docs/publish.md` |
      | 修改 `template_loader.py` | `docs/templates.md` |
      | 修改 `routes.py`(路由变更) | 涉及功能的对应文档 |
      | 新增配置项 | `docs/infrastructure.md` 或 `docs/architecture.md` |
      | 新增数据集类型 | `docs/content.md` |

      一个简单的验证方法:改完代码后,看 `docs/` 下是否有文件提到被改的部分.
      如果有,确认那个文件的描述是否仍然准确.

  - title: 文档模板
    content: |
      新建设计文档的推荐结构:

      ```markdown
      # 标题(一句话说清楚这个文档是关于什么的)

      一句话说明为什么要看这个文档.

      ## 一、核心概念

      用最简单的语言解释核心概念.假设读者第一次接触.

      ## 二、数据结构 / 架构

      表格或 ASCII 图.

      ## 三、关键决策

      每项决策:
      - 我们做了什么选择
      - 为什么(1-2 句)
      - 代价是什么

      ## 四、与其他系统的关系

      这个模块跟其他模块之间怎么交互.

      ## 五、边界和限制

      不做什么,为什么不做.
      ```

  - title: 关联技能
    content: |
      - `architecture.md` / `templates.md` / `database.md` 等:具体文档
      - `CLAUDE.md` 第八节:文档约定

examples:
  - "更新 database.md,加了新字段"
  - "写一个关于图片处理的文档"
  - "把架构文档里过时的目录结构改一下"
  - "docs/publish.md 里字体部分需要补充"
