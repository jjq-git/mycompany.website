<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 680" width="1400" height="680">
  <style>text{font-family:"Microsoft YaHei","PingFang SC",sans-serif}</style>
  <rect x="0" y="0" width="1400" height="680" fill="#fff" rx="4"/>
  <rect x="0" y="0" width="1400" height="44" fill="#f0f2f5" rx="4"/>
  <text x="700" y="29" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a2e">builder-module — 框架外挂层级结构</text>

  <!-- builder-module -->
  <rect x="30" y="60" width="1340" height="540" fill="#374151" stroke="#1f2937" stroke-width="2" rx="6"/>
  <text x="46" y="86" font-size="17" fill="#f3f4f6" font-weight="bold">.builder-module（框架运行时自动外挂）</text>
  <text x="46" y="106" font-size="13" fill="#d1d5db">data-builder-module-index="..."  data-builder-module-type="..."</text>

  <!-- section -->
  <rect x="65" y="122" width="1270" height="460" fill="#4b5563" stroke="#374151" stroke-width="1.5" rx="5"/>
  <text x="82" y="148" font-size="16" fill="#f3f4f6" font-weight="bold">.section（一、外层）</text>
  <text x="82" y="168" font-size="13" fill="#d1d5db">section_bg / outer_width / margin_* / padding_*</text>

  <!-- container -->
  <rect x="100" y="188" width="1200" height="376" fill="#6b7280" stroke="#4b5563" stroke-width="1.2" rx="4"/>
  <text x="118" y="214" font-size="16" fill="#fff" font-weight="bold">.container（二、内层）</text>
  <text x="118" y="234" font-size="13" fill="#e5e7eb">inner_width / inner_bg / inner_margin_* / inner_padding_*</text>

  <!-- section-header -->
  <rect x="135" y="258" width="1130" height="120" fill="#9ca3af" stroke="#6b7280" stroke-width="1" rx="4"/>
  <text x="152" y="284" font-size="15" fill="#1f2937" font-weight="bold">.section-header（三、标题区）</text>
  <text x="152" y="304" font-size="13" fill="#374151">text_align / header_margin_* / header_padding_*</text>

  <!-- 标题 -->
  <rect x="170" y="320" width="520" height="24" fill="#e5e7eb" stroke="#d1d5db" stroke-width="0.6" rx="3"/>
  <text x="180" y="337" font-size="14" fill="#374151" font-weight="bold">.section-title — 主标题</text>
  <text x="702" y="337" font-size="12" fill="#6b7280">title_size / color</text>

  <!-- 副标题 -->
  <rect x="170" y="350" width="520" height="20" fill="#e5e7eb" stroke="#d1d5db" stroke-width="0.6" rx="3"/>
  <text x="180" y="364" font-size="13" fill="#6b7280">.section-description — 副标题</text>

  <!-- 内容区 -->
  <rect x="135" y="398" width="1130" height="148" fill="#d1d5db" stroke="#9ca3af" stroke-width="1" rx="4"/>
  <text x="152" y="424" font-size="15" fill="#1f2937" font-weight="bold">四、自定义内容区（视 Block 类型而定）</text>

  <!-- 示例 -->
  <rect x="170" y="440" width="1060" height="92" fill="#e5e7eb" stroke="#d1d5db" stroke-width="0.6" rx="3"/>
  <text x="186" y="462" font-size="14" fill="#374151" font-weight="bold">示例：highlight_card → .hl-grid → .hl-image + .hl-text（图文双栏）</text>
  <text x="186" y="482" font-size="13" fill="#6b7280">示例：feature_grid   → .fg-grid  → .fg-card（3 列网格）</text>
  <text x="186" y="500" font-size="13" fill="#6b7280">示例：data_grid      → .dg-grid  → .dg-card（数据集列表）</text>
  <text x="186" y="518" font-size="13" fill="#6b7280">示例：text_content   → .tc-body（富文本内容）</text>

  <!-- 右侧标注: Block 编写范围 -->
  <line x1="1275" y1="148" x2="1340" y2="148" stroke="#9ca3af" stroke-width="0.8" marker-end="url(#aR)"/>
  <text x="1355" y="152" font-size="12" fill="#6b7280">Block 编写范围</text>
  <text x="1355" y="168" font-size="12" fill="#9ca3af">（从这里开始）</text>

  <!-- 左侧标注 -->
  <line x1="30" y1="610" x2="60" y2="610" stroke="#6b7280" stroke-width="0.6"/>
  <text x="68" y="614" font-size="12" fill="#6b7280">框架自动注入</text>

  <!-- 图例 -->
  <rect x="30" y="650" width="1340" height="0" fill="none"/> <!-- spacer -->
  <rect x="30" y="656" width="1340" height="36" fill="#f0f2f5" stroke="#d5d8de" stroke-width="0.6" rx="4"/>
  <rect x="50" y="666" width="14" height="10" fill="#374151" stroke="#1f2937" stroke-width="0.5"/>
  <text x="72" y="676" font-size="12" fill="#666">builder-module</text>
  <rect x="215" y="666" width="14" height="10" fill="#4b5563" stroke="#374151" stroke-width="0.5"/>
  <text x="237" y="676" font-size="12" fill="#666">section</text>
  <rect x="340" y="666" width="14" height="10" fill="#6b7280" stroke="#4b5563" stroke-width="0.5"/>
  <text x="362" y="676" font-size="12" fill="#666">container</text>
  <rect x="485" y="666" width="14" height="10" fill="#9ca3af" stroke="#6b7280" stroke-width="0.5"/>
  <text x="507" y="676" font-size="12" fill="#666">section-header</text>
  <rect x="668" y="666" width="14" height="10" fill="#d1d5db" stroke="#9ca3af" stroke-width="0.5"/>
  <text x="690" y="676" font-size="12" fill="#666">内容区（视 Block 类型）</text>

  <defs>
    <marker id="aR" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#9ca3af"/></marker>
  </defs>
</svg>