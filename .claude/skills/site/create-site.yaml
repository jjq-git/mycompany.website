name: create-site
description: 为用户创建站点,选择模板并初始化种子数据
version: "1.1.0"

triggers:
  - 创建站点
  - 新建网站
  - 加个站点
  - 新建站

context: |
  当用户说"创建站点"、"新建网站"、"加个站点"时触发.
  为一个已存在的用户创建新站点,从模板复制种子数据到 `sites/<id>/`.

  核心代码:`app/commands.py` → `create_site_cmd()`
  数据流:选择用户 → 选择模板 → 创建 Site 记录 → init_site_folder() → copy_seed_data()

instructions:
  - title: 前置条件
    content: |
      确认以下条件:
      1. 至少有一个用户:`flask --app run list-users`
      2. 至少有一个模板已同步:`flask --app run scan-templates`(有新模板时)
      3. 目标 slug 未被占用
      4. 目标 slug 不在保留字列表中

  - title: 步骤 1:确认用户
    content: |
      ```
      flask --app run list-users
      ```

      从输出中选择目标用户的 email.如果是给当前登录用户创建,直接在后台操作即可.

  - title: 步骤 2:确认模板
    content: |
      ```
      flask --app run scan-templates
      ```

      输出列出所有可用模板.复制模板的 `name`(目录名,如 `dengtec`).

  - title: 步骤 3:确认 slug
    content: |
      slug 规则(`app/core/models.py:90-94`):
      - 字符集:`[a-z0-9-]`(小写字母、数字、连字符)
      - 长度:3 ~ 30
      - 不能以 `-` 开头或结尾
      - 不能是保留字

      保留字列表:www, mail, smtp, ftp, admin, api, auth, app, dashboard, help, docs, blog, support, status, dev, staging, test, static, assets, cdn, acme

      验证 slug 合法性:`import re; re.match(r'^[a-z0-9][a-z0-9-]{1,28}[a-z0-9]$', slug)`

      如果 slug 已被占用,`list-sites` 查看后换一个.

  - title: 步骤 4:执行创建
    content: |
      ```
      flask --app run create-site <email> <slug> --template <name> --name "站点名称"
      ```

      示例:
      ```
      flask --app run create-site admin@test.com my-company --template dengtec --name "我的公司"
      ```

      执行逻辑(`commands.py:57-113`):
      1. 校验 slug 格式
      2. 校验 slug 不在保留字中
      3. 查找 owner 用户
      4. 查找模板
      5. 创建 Site 数据库记录(status='draft')
      6. `db.session.flush()` 获取 site.id
      7. 设置 `folder_path = f'sites/{site.id}'`
      8. `init_site_folder(site.id)` 创建目录结构
      9. `copy_seed_data(site.id, template_name)` 复制种子数据

      输出示例:
      ```
      已创建站点: id=1, slug=my-company, 模板=dengtec
      文件夹: f:\dengtec\mycompany.website\sites\1
      seed_data: 已复制
      ```

  - title: 步骤 5:验证
    content: |
      创建后验证:
      1. 检查数据库记录:
         ```
         flask --app run list-sites
         ```
      2. 检查文件夹:
         ```
         ls sites/<id>/
         ```
         应包含:settings.yaml, pages/, data/, translations/, assets/
      3. 检查种子数据是否正确复制:
         ```
         cat sites/<id>/settings.yaml
         ls sites/<id>/pages/
         ls sites/<id>/data/
         ```
      4. 构建测试:
         ```
         flask --app run build-site <id>
         ```
         检查 output/ 目录输出.

  - title: 站点模型字段说明
    content: |
      `Site` 模型(`app/core/models.py:61-86`):

      | 字段 | 说明 | 默认值 |
      |------|------|--------|
      | owner_id | 所属用户 ID | - |
      | name | 站点显示名称 | - |
      | slug | URL 友好标识 | - |
      | folder_path | 站点文件路径 | 创建后自动填 |
      | template_name | 模板名 | - |
      | template_version | 创建时的模板版本 | 自动记录 |
      | default_language | 默认语言 | zh |
      | enabled_languages | 启用语言列表 | ['zh'] |
      | storage_mode | 存储模式 | shared |
      | cdn_provider | CDN 厂商 | aliyun |
      | status | draft/published/suspended | draft |
      | last_published_at | 最后发布时间 | 首次发布时设置 |
      | soft_deleted_at | 软删除时间 | 删除时设置 |

  - title: 常见问题
    content: |
      | 问题 | 原因 | 修复 |
      |------|------|------|
      | "用户不存在" | email 输入有误或该用户未创建 | `list-users` 确认 |
      | "slug 已被占用" | 该 slug 已有站点使用 | 换一个 slug |
      | "slug 是保留字" | 使用了系统保留的 slug | 换一个 slug |
      | "模板不存在" | 模板名输入有误或未扫描 | `scan-templates` 后重试 |
      | "slug 格式不合法" | 含大写字母、下划线等 | 按规则修正 |
      | "数据库里没有模板" | 从未执行过 scan-templates | 先扫描模板 |

  - title: 关联技能
    content: |
      - `create-user`:先创建用户
      - `scan-templates`:确保模板已同步
      - `build-site`:构建测试
      - `seed-data`:自定义种子数据
      - `db-manage`:查看数据库状态

examples:
  - "创建一个站点"
  - "新建网站,用 dengtec 模板"
  - "给 admin@test.com 加个站点叫 my-shop"
  - "新建站点,slug 用 company-site,模板 tech-product"
