name: publish-flow
description: 完整发布流程(构建→检查→上传 CDN→验证)
version: "1.0.0"

triggers:
  - 发布流程
  - 完整发布
  - 部署
  - deploy
  - 上线
  - 发布到 CDN
  - publish

context: |
  当用户说"完整发布"、"部署到 CDN"、"上线"时触发.
  端到端的发布流程,从本地构建到 CDN 上线.

  当前 MVP 阶段发布链路:本地构建 → output/ → 阿里云 OSS + CDN.
  详见 `docs/publish.md` 和 `docs/infrastructure.md`.

instructions:
  - title: 发布流程图
    content: |
      完整发布流程(`docs/publish.md` 第四节):

      ```
      1. 检查必填项(公司信息、至少 1 个产品等)
              ↓
      2. 读取站点文件夹(sites/<id>/ 下的所有 yaml + 资源)
              ↓
      3. 对每种启用的语言,分别渲染:
         - 静态页面(index、about、contact)
         - 数据块详情页(每个产品一个 html)
         - 数据块列表页(一个 html + data.json)
              ↓
      4. 优化资源(按语言):
         - 字体子集化(扫描该语言的所有字符)
         - 图片确认已是 WebP(上传时已处理)
         - CSS / JS 压缩
              ↓
      5. 生成附属文件:
         - sitemap.xml
         - robots.txt
         - 根 index.html(语言重定向)
              ↓
      6. 上传到 CDN(增量上传,只传变化的文件)
              ↓
      7. 更新站点"最新版本"指针
              ↓
      8. 显示访问 URL
      ```

      目标:中等规模站(30 页 + 50 产品 + 双语言)在 10-20 秒内完成.

  - title: 第一步:发布前检查
    content: |
      在发布前确认以下项目:

      **数据完整性**:
      - `settings.yaml` 中公司名称不为空
      - 至少有一页内容(pages/ 下有 yaml 文件)
      - 如果是产品站,至少有一个产品

      **模板完整性**:
      - 模板已同步到数据库:`flask --app run scan-templates`
      - 模板版本与站点记录一致

      **构建验证**:
      ```
      flask --app run build-site <site_id>
      ```
      - 检查 output/ 目录是否有预期的文件
      - 确认没有渲染错误(控制台无 ERROR 日志)
      - 用浏览器打开 output HTML 文件,确认显示正常

  - title: 第二步:执行构建
    content: |
      发布用构建(base_url 为空,适配 CDN 根路径):
      ```
      flask --app run build-site <site_id>
      ```

      构建产物在 `output/<site_id>/`.

      注意与预览构建的区别:
      - 预览构建:`base_url='/preview/<id>'`(通过 Flask 路由访问)
      - 发布构建:`base_url=''`(直接部署到 CDN 根目录)

  - title: 第三步:上传到 CDN
    content: |
      **当前状态**:CDN 上传功能尚未实现(MVP 阶段),以下是规划流程.

      目标 CDN:**阿里云 OSS + CDN**(`docs/infrastructure.md`).

      上传策略:
      - **增量上传**:只上传变化的文件(对比上次发布快照)
      - **多语言并行**:每种语言一个子目录,可同时上传
      - **原子切换**:上传到版本目录 → 全部就绪后切换指针

      手动上传(临时方案):
      ```
      # 使用阿里云 ossutil 上传
      ossutil cp -r output/<site_id>/ oss://<bucket>/<site_slug>/ --update
      ```

      或使用阿里云 OSS Python SDK:
      ```python
      import oss2
      auth = oss2.Auth(access_key_id, access_key_secret)
      bucket = oss2.Bucket(auth, endpoint, bucket_name)
      for root, dirs, files in os.walk(f'output/{site_id}'):
          for f in files:
              local = os.path.join(root, f)
              remote = os.path.relpath(local, f'output/{site_id}')
              bucket.put_object_from_file(remote, local)
      ```

  - title: 第四步:DNS 和域名验证
    content: |
      见 `docs/domains.md`:

      **免费子域名**(自动):
      - 格式:`<slug>.mycompany.website`
      - 通配符 SSL 证书 `*.mycompany.website` 自动覆盖
      - 无需额外配置

      **自定义域名**(Phase 2):
      1. 店主在后台填入自己的域名
      2. 系统调阿里云 CDN API 添加加速域名 → 给出 CNAME 配置指引
      3. 店主去自己的域名服务商配 DNS(CNAME 指向 CDN 域名)
      4. 系统检测 DNS 生效后,启动 ACME 流程签 SSL 证书
      5. 证书自动部署到 CDN

  - title: 第五步:发布后验证
    content: |
      发布后必须验证以下项目:

      **基础访问**:
      - [ ] 域名可访问(HTTP 和 HTTPS)
      - [ ] 首页正常加载
      - [ ] 所有导航链接可点击、跳转正确
      - [ ] 图片正常显示

      **多语言**(如有):
      - [ ] 语言选择页可访问
      - [ ] 每种语言首页正常
      - [ ] 语言切换链接正确
      - [ ] hreflang 标签正确

      **SEO**:
      - [ ] `<title>` 标签有内容
      - [ ] `<meta description>` 有内容
      - [ ] sitemap.xml 可访问
      - [ ] robots.txt 可访问

      **性能**:
      - [ ] 首页加载 < 1 秒(信念 #5)
      - [ ] 字体文件 < 50KB(子集化后)
      - [ ] 图片为 WebP 格式

      **安全**:
      - [ ] HTTPS 证书有效
      - [ ] 无混合内容警告(HTTP 资源在 HTTPS 页面)

  - title: 第六步:更新发布记录
    content: |
      ```python
      flask shell
      >>> from app.core.models import Site
      >>> from app.core.db import db
      >>> from datetime import datetime, timezone

      >>> site = Site.query.get(site_id)
      >>> site.status = 'published'
      >>> site.last_published_at = datetime.now(timezone.utc)
      >>> db.session.commit()
      >>> print(f'站点 #{site_id} 已标记为已发布: {site.last_published_at}')
      ```

  - title: 回滚
    content: |
      如果发布后发现问题:

      1. **本地回滚**:重新构建之前的版本
         ```
         # 如果 sites/ 数据没变,重新构建就是回滚到当���状态
         flask --app run build-site <site_id>
         ```

      2. **CDN 回滚**:切换到上一个版本目录
         阿里云 OSS 支持版本管理,可以回滚到之前的对象版本.

      3. **数据回滚**:
         `sites/<id>/` 的内容是 YAML 文件,可以通过 git 查看历史:
         ```
         git log -- sites/<id>/settings.yaml
         git checkout <commit> -- sites/<id>/settings.yaml
         ```

  - title: 当前 MVP 发布范围和限制
    content: |
      MVP 阶段已实现:
      - [x] 本地构建:`flask --app run build-site <id>`
      - [x] ZIP 导出:`/export.zip`(Web 界面)
      - [x] 预览功能:`/preview/<id>/`
      - [x] 站点状态管理:draft → published

      MVP 阶段未实现(Phase 2+):
      - [ ] 自动化 CDN 上传
      - [ ] 增量上传(对比变化)
      - [ ] 自定义域名 SSL 自动签发
      - [ ] 发布版本历史与回滚
      - [ ] 字体子集化
      - [ ] CSS/JS 压缩
      - [ ] 一键发布按钮(后台已有构建按钮,但未对接 CDN)

  - title: 关联技能
    content: |
      - `build-site`:执行本地构建
      - `export-site`:导出 ZIP(手动部署)
      - `debug-site`:排查构建问题
      - `config-manage`:CDN 相关配置
      - `list-info`:查看站点发布状态

