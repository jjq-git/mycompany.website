name: font-subset
description: 字体子集化(扫描字符 → 提取字体 → 输出子集化文件)
version: "1.0.0"

triggers:
  - 字体子集化
  - 字体优化
  - 中文字体
  - font subset
  - 字体太大
  - 字体提取

context: |
  当用户说"字体子集化"、"中文字体优化"、"字体太大"时触发.

  字体子集化是核心信念 #5(速度是产品的一部分)的关键差异化功能.
  中文字体动辄 5-10 MB,子集化后可降到 10-30 KB.

  原理(`docs/publish.md` 第五节):
  发布时扫描所有页面,统计实际用到的所有字符,从字体文件中提取这些字符
  做成一个小字体.每次发布都重新生成(店主可能加了新字符).

instructions:
  - title: 为什么需要字体子集化
    content: |
      | 方式 | 字体文件大小 | 首屏字体加载 |
      |------|-------------|-------------|
      | 直接用完整字体 | 9.4 MB | 3-8 秒 |
      | 用系统字体凑合 | 0 | 立刻(但难看) |
      | **子集化** | **15 KB** | **< 0.1 秒** |

      关键设计决策:
      - **每次发布都重新生成**(店主可能加新字符,不缓存)
      - **按语言分别子集化**(英文不需要中文字体)
      - 不做缓存(避免"新加的字显示成方块"的灵异 bug)

  - title: 可商用的字体清单
    content: |
      来自 `docs/publish.md`:

      | 字体 | 来源 | 风格 |
      |------|------|------|
      | 思源黑体 / 思源宋体 | Adobe + Google 开源 | 通用,最稳 |
      | 阿里巴巴普惠体 2.0 | 阿里巴巴 | 现代商务 |
      | OPPO Sans | OPPO | 圆润现代 |
      | 站酷系列 | 站酷 | 设计感 |
      | HarmonyOS Sans | 华为 | 简洁现代 |
      | 霞鹜文楷 | 开源 | 文艺/书法感 |

      **绝对不能上的**(有版权诉讼风险):
      - 方正、汉仪、华文、文鼎、造字工房(专门钓鱼起诉)
      - 不允许店主上传自定义字体(避免版权连带责任)

      字体文件放在项目根目录 `fonts/` 下.

  - title: 子集化工具体系
    content: |
      使用 `fonttools` 的 `pyftsubset` 工具:

      安装:
      ```
      pip install fonttools brotli
      ```

      `brotli` 是可选的,用于生成 WOFF2 格式(压缩率更高).

      基础用法:
      ```
      pyftsubset <字体文件> --text="要用到的所有字符" --output-file=<输出文件>
      ```

      常用参数:
      | 参数 | 说明 |
      |------|------|
      | `--text="..."` | 要保留的字符集 |
      | `--text-file=<file>` | 从文件读取字符集 |
      | `--output-file=<path>` | 输出文件路径 |
      | `--flavor=woff2` | 输出 WOFF2 格式 |
      | `--layout-features=''` | 移除 OpenType 特性(进一步减小) |
      | `--no-hinting` | 移除 hinting 信息 |

  - title: 扫描站点用到的所有字符
    content: |
      ```python
      # 在 flask shell 中运行
      from pathlib import Path

      def collect_chars(output_dir):
          """扫描构建输出中的所有字符"""
          chars = set()
          for html_file in Path(output_dir).rglob('*.html'):
              text = html_file.read_text(encoding='utf-8')
              chars.update(text)
          return ''.join(sorted(chars))

      site_id = 1
      output_dir = f'output/{site_id}'

      # 对每种语言分别收集
      for lang_dir in Path(output_dir).iterdir():
          if lang_dir.is_dir() and lang_dir.name not in ('static', 'assets'):
              chars = collect_chars(lang_dir)
              print(f'{lang_dir.name}: {len(chars)} 个不同字符')
              # 保存字符集供 pyftsubset 使用
              chars_file = Path(output_dir) / f'chars-{lang_dir.name}.txt'
              chars_file.write_text(chars, encoding='utf-8')
              print(f'  已保存到 {chars_file}')
      ```

  - title: 执行子集化
    content: |
      ```bash
      # 对中文站点
      pyftsubset fonts/NotoSansSC-Regular.otf \
        --text-file=output/1/chars-zh-CN.txt \
        --output-file=output/1/zh-CN/static/fonts/NotoSansSC-subset.woff2 \
        --flavor=woff2 \
        --layout-features='' \
        --no-hinting

      # 对英文站点(可能只需要几十个字符)
      pyftsubset fonts/Inter-Regular.otf \
        --text-file=output/1/chars-en.txt \
        --output-file=output/1/en/static/fonts/Inter-subset.woff2 \
        --flavor=woff2

      # 查看结果
      ls -lh output/1/*/static/fonts/
      ```

  - title: 在模板中引用子集化字体
    content: |
      在 `main.css` 中用 `@font-face` 加载子集化字体:

      ```css
      @font-face {
        font-family: 'Noto Sans SC Subset';
        src: url('../fonts/NotoSansSC-subset.woff2') format('woff2');
        font-weight: 400;
        font-style: normal;
        font-display: swap;  /* 先用系统字体,加载完再切换 */
      }

      :root {
        --font-family-base: 'Inter', 'Noto Sans SC Subset', -apple-system, 'PingFang SC',
                            'Microsoft YaHei', sans-serif;
      }
      ```

      `font-display: swap` 是关键——避免 FOIT(Flash of Invisible Text).

  - title: 按语言分别子集化
    content: |
      每种语言有独立的字符集:
      - `zh-CN`:需要简体中文字符(约 3000-6000 个,取决于内容)
      - `en`:只需要 ASCII(约 70 个字符)
      - `ja`:需要日文字符(平假名 + 片假名 + 常用汉字)

      不同语言使用不同的子集化字体文件,放在各自语言的 `static/fonts/` 下.

      这就是 `docs/publish.md` 中**全部按语言分**策略的原因——
      英文站点不需要加载中文字体文件.

  - title: 当前实现状态
    content: |
      MVP 阶段字体子集化**尚未实现**.当前状态:

      - [x] 字体文件放在 `fonts/` 目录
      - [ ] 发布时自动扫描字符
      - [ ] 自动子集化
      - [ ] 模板中 `@font-face` 引用子集化文件
      - [ ] 按语言分别处理

      在实现前,模板使用系统字体栈兜底:
      ```css
      font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', sans-serif;
      ```

  - title: 关联技能
    content: |
      - `build-site`:构建输出是字符扫描的输入
      - `publish-flow`:字体子集化是发布流程的第 4 步
      - `edit-template-style`:在 CSS 中配置 `@font-face`
      - `new-template`:为新模板配置默认字体

