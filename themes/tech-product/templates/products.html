{% extends "_base.html" %}
{% block title %}产品 — {{ settings.company.name }}{% endblock %}

{% block content %}
<section class="section">
  <div class="container">
    <h1>产品</h1>
    <div class="product-grid">
      {% for p in products %}
      <a class="product-card" href="{{ base_url }}/products/{{ p.slug }}">
        {% if p.cover %}<img src="{{ p.cover }}" alt="{{ p.name }}">{% endif %}
        <h3>{{ p.name }}</h3>
        <p class="muted">{{ p.summary }}</p>
      </a>
      {% endfor %}
    </div>
  </div>
</section>
{% endblock %}
