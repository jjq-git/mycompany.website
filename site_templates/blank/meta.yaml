display_name: "空白站点"
industry: "从零开始"
description: "保留完整模块能力的极简空白站点，适合从零开始搭建。"
# 不配预览图：模板库卡片会自动回退到占位块（显示 industry 文字），无需维护截图
cover_image: ""
version: 0.1.0
is_public: true

# 空白站点不预置任何数据集，老板需要时在后台自建
datasets: []

# 初始菜单只有首页，其余页面由老板后续添加
default_menu:
  - {label: Home, type: home}

# 沿用 claude 的视觉基调（暖奶油色画布 + 衬线标题 + 珊瑚色 CTA），
# 因为 blank 复用 claude 的 templates/ 与 main.css，主题变量必须与之一致
default_theme:
  color-primary: "#cc785c"
  color-bg: "#faf9f5"
  color-surface: "#efe9de"
  color-text: "#141413"
  color-text-secondary: "#6c6a64"
  color-border: "#e6dfd8"
  font-display: "'Cormorant Garamond', 'EB Garamond', 'Times New Roman', serif"
  font-sans: "'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
  font-mono: "'JetBrains Mono', ui-monospace, monospace"
  radius-xs: "4px"
  radius-sm: "6px"
  radius-md: "8px"
  radius-lg: "12px"
  radius-xl: "16px"
  radius-pill: "9999px"
  shadow-sm: "0 1px 2px rgba(20,20,19,0.06)"
  shadow-md: "0 1px 3px rgba(20,20,19,0.08)"
  shadow-lg: "0 2px 8px rgba(20,20,19,0.10)"

languages:
  - {code: zh-CN, name: "简体中文", flag: "CN"}
  - {code: zh-TW, name: "繁體中文", flag: "TW"}
  - {code: en, name: English, flag: "US"}
default_language: zh-CN
