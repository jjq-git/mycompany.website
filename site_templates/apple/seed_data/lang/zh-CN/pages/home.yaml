title: "Studio One"
description: "面向优雅科技产品的影像优先型产品展示模板。"
modules:
  - type: hero_banner
    order: 1
    data:
      slides:
        - media: "https://images.unsplash.com/photo-1517336714731-489689fd1ca8?auto=format&fit=crop&w=1800&q=86"
          title: "MacBook Air。灵感加速。"
          subtitle: "轻薄机身、全天续航、明亮显示与顺滑性能，让每个想法都更容易落地。"
          primaryBtn: "购买"
          primaryBtnLink: "/products/macbook-air/"
          secondaryBtn: "了解更多"
          secondaryBtnLink: "/products/macbook-air/"
        - media: "https://images.unsplash.com/photo-1496181133206-80ce9b88a853?auto=format&fit=crop&w=1800&q=86"
          title: "让画布安静地消失。"
          subtitle: "Studio Display 以宽广色彩和克制工业设计，让作品始终成为焦点。"
          primaryBtn: "探索显示器"
          primaryBtnLink: "/products/studio-display/"
          secondaryBtn: "比较"
          secondaryBtnLink: "/products/"

  - type: section_title
    order: 2
    data:
      tag: "商店"
      title: "值得被看见，也适合每天使用。"
      desc: "沉浸式产品故事、清晰动作按钮，以及让每个细节自由呼吸的安静留白。"
      btn_text: "浏览产品系列"
      btn_url: "/products/"

  - type: feature_grid
    order: 3
    data:
      title: "更好的简单。"
      subtitle: "每个组件都围绕速度、清晰度和高级质感调校。"
      features:
        - icon: "zap"
          title: "即开即用的流程"
          desc: "唤醒、解锁、从想法进入画布，一切都足够流畅。"
        - icon: "eye"
          title: "出色视觉细节"
          desc: "高清影像与平静版式，让产品摄影拥有展厅般的质感。"
        - icon: "shield"
          title: "隐私置于核心"
          desc: "安全账户、清晰权限和面向客户的可控默认设置。"
        - icon: "globe"
          title: "面向全球设计"
          desc: "多语言内容、响应式导航和贴近本地使用习惯的商店体验。"

  - type: highlight_card
    order: 4
    data:
      image_position: right
      tag: "MacBook Pro"
      title: "可以随身携带的专业工作室。"
      desc: "强劲性能、精准显示，以及适合长时间创作的散热系统。"
      image: "https://images.unsplash.com/photo-1516321318423-f06f85e504b3?auto=format&fit=crop&w=1500&q=86"
      features:
        - text: "最长 22 小时电池续航"
        - text: "类 Liquid Retina XDR 展示效果"
        - text: "适合剪辑、设计和代码工作的安静性能"
      primaryBtn: "购买"
      primaryLink: "/products/macbook-pro/"
      secondaryBtn: "了解更多"
      secondaryLink: "/products/macbook-pro/"

  - type: stat_counter
    order: 5
    data:
      title: "小数字，大不同。"
      subtitle: "区别藏在每天都能感受到的细节里。"
      stats:
        - number: 18
          suffix: "hr"
          label: "典型电池续航"
          icon: "battery"
        - number: 100
          suffix: "%"
          label: "再生铝金属机身"
          icon: "check-circle"
        - number: 1
          suffix: "B+"
          label: "可呈现色彩"
          icon: "palette"
        - number: 3
          suffix: "x"
          label: "创意流程加速"
          icon: "zap"

  - type: logo_cloud
    order: 6
    data:
      title: "适配创意团队熟悉的工具。"
      subtitle: "可用于展示合作伙伴、客户与平台集成。"
      columns: "5"
      grayscale: "true"
      logos:
        - name: "Final Cut"
          image: "https://dummyimage.com/240x120/f5f5f7/1d1d1f.png&text=Final+Cut"
          link: "#"
        - name: "Logic"
          image: "https://dummyimage.com/240x120/f5f5f7/1d1d1f.png&text=Logic"
          link: "#"
        - name: "Pixelmator"
          image: "https://dummyimage.com/240x120/f5f5f7/1d1d1f.png&text=Pixelmator"
          link: "#"
        - name: "Sketch"
          image: "https://dummyimage.com/240x120/f5f5f7/1d1d1f.png&text=Sketch"
          link: "#"
        - name: "Xcode"
          image: "https://dummyimage.com/240x120/f5f5f7/1d1d1f.png&text=Xcode"
          link: "#"

  - type: product_grid
    order: 7
    data:
      dataset: products
      max_items: 4
      title: "哪款 Mac 适合你？"
      subtitle: "比较产品系列，选择适合工作方式的那一款。"

  - type: data_grid
    order: 8
    data:
      dataset: portfolio
      max_items: 3
      card_layout: image_top
      show_pagination: "false"
      title: "展厅体验"

  - type: process_steps
    order: 9
    data:
      title: "按你的方式购买。"
      subtitle: "从发现到设置，路径保持简单。"
      direction: horizontal
      step_style: number
      steps:
        - title: "选择"
          desc: "挑选型号、颜色、内存与存储配置。"
          icon: "mouse-pointer"
        - title: "个性化"
          desc: "添加配件、保障服务与换购信息。"
          icon: "sliders"
        - title: "设置"
          desc: "迁移文件、连接应用，然后开始创作。"
          icon: "check-circle"

  - type: text_content
    order: 10
    data:
      title: "一个退到产品身后的设计系统。"
      subtitle: "产品始终是第一信号。"
      body: "<p>大幅摄影、克制字体和单一蓝色行动色，让购物体验保持冷静、精准且熟悉。</p><p>深浅产品区块像展厅一样交替出现。文案短而明确，每个链接都给用户一个清晰的下一步。</p>"
      text_align: center
      columns: "1"
      inner_width: "820px"

  - type: contact_info
    order: 11
    data:
      title: "到访 Studio One。"
      subtitle: "获得上手体验、设置支持和一对一产品建议。"
      phone: "+1 (408) 555-0198"
      email: "hello@studio-one.example.com"
      address: "1 Infinite Loop, Cupertino, CA 95014"
      show_phone: "true"
      show_email: "true"
      show_address: "true"
      show_business_hours: "true"

  - type: contact_form
    order: 12
    data:
      title: "与专员沟通。"
      subtitle: "告诉我们你想构建什么，我们会帮你选择合适配置。"
      form_action: "#"
      submit_text: "发送消息"

  - type: item_detail
    order: 13
    data:
      title: "Studio Display"
      tags: "5K Retina、12MP 摄像头、六扬声器系统"
      desc: "一块宽广的 27 英寸画布，拥有鲜活色彩、人物居中视频通话和充满空间感的音频体验。"
      images:
        - url: "https://images.unsplash.com/photo-1527443224154-c4a3942d3acf?auto=format&fit=crop&w=1400&q=86"
        - url: "https://images.unsplash.com/photo-1541807084-5c52b6b3adef?auto=format&fit=crop&w=1400&q=86"
      specs:
        - name: "显示屏"
          value: "27 英寸 5K Retina"
        - name: "摄像头"
          value: "12MP 超广角"
        - name: "音频"
          value: "六扬声器系统"

  - type: item_data
    order: 14
    data:
      title: "结构化产品数据"
      category: "产品数据集"
      summary: "用于产品详情页、比较区域和目录记录的紧凑技术信息面板。"
      meta_label: "起售价"
      price: "From $1599"
      tags:
        - "5K Retina"
        - "工作室音频"
        - "铝金属"
      specs:
        - name: "主要数据集"
          value: "products.yaml"
        - name: "详情字段"
          value: "图片、标签、规格、价格"
        - name: "语言"
          value: "英文和简体中文"
