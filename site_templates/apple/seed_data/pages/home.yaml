title: "Studio One"
description: "A photography-first product gallery for elegant technology products."
modules:
  - type: hero_banner
    order: 1
    data:
      slides:
        - media: "https://images.unsplash.com/photo-1517336714731-489689fd1ca8?auto=format&fit=crop&w=1800&q=86"
          title: "MacBook Air. Supercharged by vision."
          subtitle: "A remarkably thin notebook with all-day battery life, a brilliant display, and the performance to make every idea feel effortless."
          primaryBtn: "Buy"
          primaryBtnLink: "/products/macbook-air/"
          secondaryBtn: "Learn more"
          secondaryBtnLink: "/products/macbook-air/"
        - media: "https://images.unsplash.com/photo-1496181133206-80ce9b88a853?auto=format&fit=crop&w=1800&q=86"
          title: "Create on a canvas that disappears."
          subtitle: "Studio Display pairs expansive color with quiet industrial design, so the work stays in focus."
          primaryBtn: "Explore display"
          primaryBtnLink: "/products/studio-display/"
          secondaryBtn: "Compare"
          secondaryBtnLink: "/products/"

  - type: section_title
    order: 2
    data:
      tag: "Store"
      title: "Designed to be seen. Built to be used every day."
      desc: "Edge-to-edge product stories, simple actions, and enough quiet space for every detail to breathe."
      btn_text: "Shop the lineup"
      btn_url: "/products/"
      title_size: "56px"
      desc_size: "24px"

  - type: feature_grid
    order: 3
    data:
      title: "A better kind of simple."
      subtitle: "Every component is tuned for speed, clarity, and the kind of polish people notice before they can name it."
      features:
        - icon: "zap"
          title: "Instant-on workflows"
          desc: "Wake, unlock, and move from thought to canvas with fluid performance."
        - icon: "eye"
          title: "Brilliant visual detail"
          desc: "Retina-class imagery and calm layouts make product photography feel museum-grade."
        - icon: "shield"
          title: "Privacy at the core"
          desc: "Local-first defaults, secure accounts, and clear controls for every customer."
        - icon: "globe"
          title: "Global by design"
          desc: "Multilingual content, responsive navigation, and stores that feel native everywhere."

  - type: highlight_card
    order: 4
    data:
      image_position: right
      tag: "MacBook Pro"
      title: "A pro studio you can carry."
      desc: "Extreme performance, color-accurate display, and a thermal system built for long creative sessions."
      image: "https://images.unsplash.com/photo-1516321318423-f06f85e504b3?auto=format&fit=crop&w=1500&q=86"
      features:
        - text: "Up to 22 hours of battery life"
        - text: "Liquid Retina XDR-class presentation"
        - text: "Quiet performance for editing, design, and code"
      primaryBtn: "Buy"
      primaryLink: "/products/macbook-pro/"
      secondaryBtn: "Learn more"
      secondaryLink: "/products/macbook-pro/"

  - type: stat_counter
    order: 5
    data:
      title: "Small numbers. Big difference."
      subtitle: "Measured in the details people feel every day."
      stats:
        - number: 18
          suffix: "hr"
          label: "Typical battery life"
          icon: "battery"
        - number: 100
          suffix: "%"
          label: "Recycled aluminum enclosure"
          icon: "check-circle"
        - number: 1
          suffix: "B+"
          label: "Colors rendered"
          icon: "palette"
        - number: 3
          suffix: "x"
          label: "Faster creative workflows"
          icon: "zap"

  - type: logo_cloud
    order: 6
    data:
      title: "Ready for the tools creative teams already love."
      subtitle: "A quiet grid for partner marks, clients, and platform integrations."
      columns: "5"
      grayscale: "true"
      logos:
        - name: "Final Cut"
          image: "https://dummyimage.com/240x120/f5f5f7/1d1d1f.png&text=Final+Cut"
          link: "#"
        - name: "Logic"
          image: "https://dummyimage.com/240x120/f5f5f7/1d1d1f.png&text=Logic"
          link: "#"
        - name: "Pixelmator"
          image: "https://dummyimage.com/240x120/f5f5f7/1d1d1f.png&text=Pixelmator"
          link: "#"
        - name: "Sketch"
          image: "https://dummyimage.com/240x120/f5f5f7/1d1d1f.png&text=Sketch"
          link: "#"
        - name: "Xcode"
          image: "https://dummyimage.com/240x120/f5f5f7/1d1d1f.png&text=Xcode"
          link: "#"

  - type: product_grid
    order: 7
    data:
      dataset: products
      max_items: 4
      title: "Which Mac is right for you?"
      subtitle: "Compare the lineup and choose the one that fits your work."

  - type: data_grid
    order: 8
    data:
      dataset: portfolio
      max_items: 3
      card_layout: image_top
      show_pagination: "false"
      title: "Gallery experiences"

  - type: process_steps
    order: 9
    data:
      title: "Buy it your way."
      subtitle: "A simple path from discovery to setup."
      direction: horizontal
      step_style: number
      steps:
        - title: "Choose"
          desc: "Pick a model, finish, memory, and storage configuration."
          icon: "mouse-pointer"
        - title: "Personalize"
          desc: "Add accessories, coverage, and trade-in information."
          icon: "sliders"
        - title: "Set up"
          desc: "Move your files, connect your apps, and start creating."
          icon: "check-circle"

  - type: text_content
    order: 10
    data:
      title: "A design system that steps out of the way."
      subtitle: "The product remains the first signal."
      body: "<p>Large photography, restrained typography, and a single blue action color create a shopping experience that feels calm, precise, and immediately familiar.</p><p>Dark and light product tiles alternate like gallery rooms. Copy is short, confident, and useful. Every link gives the customer a clear next step without adding noise.</p>"
      text_align: center
      columns: "1"
      inner_width: "820px"

  - type: contact_info
    order: 11
    data:
      title: "Visit Studio One."
      subtitle: "Get hands-on help, setup support, and one-to-one product advice."
      phone: "+1 (408) 555-0198"
      email: "hello@studio-one.example.com"
      address: "1 Infinite Loop, Cupertino, CA 95014"
      show_phone: "true"
      show_email: "true"
      show_address: "true"
      show_business_hours: "true"

  - type: contact_form
    order: 12
    data:
      title: "Talk with a Specialist."
      subtitle: "Tell us what you want to build and we will help you choose the right setup."
      form_action: "#"
      submit_text: "Send message"

  - type: item_detail
    order: 13
    data:
      title: "Studio Display"
      tags: "5K Retina, 12MP camera, six-speaker sound"
      desc: "An expansive 27-inch canvas with vivid color, Center Stage video calls, and room-filling audio in a refined aluminum enclosure."
      images:
        - url: "https://images.unsplash.com/photo-1527443224154-c4a3942d3acf?auto=format&fit=crop&w=1400&q=86"
        - url: "https://images.unsplash.com/photo-1541807084-5c52b6b3adef?auto=format&fit=crop&w=1400&q=86"
      specs:
        - name: "Display"
          value: "27-inch 5K Retina"
        - name: "Camera"
          value: "12MP Ultra Wide"
        - name: "Audio"
          value: "Six-speaker system"

  - type: item_data
    order: 14
    data:
      title: "Structured product data"
      category: "Product dataset"
      summary: "A compact technical panel for product detail pages, comparison sections, and catalog records."
      meta_label: "Starting price"
      price: "From $1599"
      tags:
        - "5K Retina"
        - "Studio audio"
        - "Aluminum"
      specs:
        - name: "Primary dataset"
          value: "products.yaml"
        - name: "Detail fields"
          value: "Images, tags, specs, price"
        - name: "Languages"
          value: "English and Simplified Chinese"
