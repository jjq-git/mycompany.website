title: "About"
description: "Meet Studio One, a product-first template for premium devices, retail stories, and service experiences."
modules:
  - type: section_title
    order: 1
    data:
      tag: "About Studio One"
      title: "A template for products that deserve space."
      desc: "Studio One borrows from the quiet confidence of modern product launches: fewer distractions, sharper media, and navigation that gets out of the way."
      btn_text: "Explore products"
      btn_url: "/products/"

  - type: text_content
    order: 2
    data:
      title: "Built for launches, catalogs, and service."
      subtitle: "Every page is designed to make complex offerings feel simple."
      body: "<p>Use Studio One for consumer electronics, lifestyle devices, premium accessories, showrooms, or product-led service brands. The structure supports hero storytelling, product grids, case studies, editorial posts, contact paths, and detail pages.</p><p>The seed data includes bilingual copy, real imagery, company information, footer content, and enough sample records to preview the complete site immediately.</p>"

  - type: stat_counter
    order: 3
    data:
      title: "Designed for polished product work"
      subtitle: "A compact system with enough range for a full site."
      stats:
        - number: 14
          suffix: " blocks"
          label: "Blocks included"
          icon: "layers"
        - number: 2
          suffix: " langs"
          label: "Languages ready"
          icon: "languages"
        - number: 4
          suffix: " records"
          label: "Product records"
          icon: "package"

  - type: logo_cloud
    order: 4
    data:
      title: "Works across product teams"
      subtitle: "From launch pages to support flows."
      logos:
