name: apple
display_name: "Apple - Product Gallery"
industry: consumer-electronics
description: "Photography-first product gallery with edge-to-edge light and dark tiles, quiet navigation, SF-style typography, and one Action Blue interaction color."
cover_image: "https://images.unsplash.com/photo-1517336714731-489689fd1ca8?auto=format&fit=crop&w=1200&q=80"
version: 0.1.0
is_public: true

datasets:
  - products
  - portfolio
  - posts
  - features

default_menu:
  - {label: Store, type: home}
  - label: Mac
    type: list
    target: products
    dropdown_style: horizontal
  - {label: Studio, type: list, target: portfolio}
  - {label: Support, type: page, target: support}
  - {label: About, type: page, target: about}
  - {label: Newsroom, type: list, target: posts}

default_theme:
  color-primary: "#0066cc"
  color-bg: "#ffffff"
  color-surface: "#f5f5f7"
  color-text: "#1d1d1f"
  color-text-secondary: "#6e6e73"
  color-border: "#e0e0e0"
  font-display: "SF Pro Display, -apple-system, BlinkMacSystemFont, 'Inter', system-ui, sans-serif"
  font-sans: "SF Pro Text, -apple-system, BlinkMacSystemFont, 'Inter', system-ui, sans-serif"
  font-mono: "SF Mono, 'JetBrains Mono', ui-monospace, monospace"
  radius-xs: "5px"
  radius-sm: "8px"
  radius-md: "11px"
  radius-lg: "18px"
  radius-xl: "22px"
  radius-pill: "9999px"
  shadow-sm: "0 1px 2px rgba(29,29,31,0.04)"
  shadow-md: "0 12px 32px rgba(29,29,31,0.08)"
  shadow-lg: "0 28px 80px rgba(29,29,31,0.16)"

languages:
  - {code: en, name: English, flag: EN}
  - {code: zh-CN, name: "简体中文", flag: CN}
default_language: en

header_variants:
  - {key: logo_left_menu_right, label: "Global nav", description: "Compact black global navigation"}
  - {key: logo_center_menu_below, label: "Centered", description: "Centered brand with nav below"}
  - {key: minimal_hamburger, label: "Minimal", description: "Small logo and menu toggle"}

footer_variants:
  - {key: columns, label: "Directory columns", description: "Dense footer directory"}
  - {key: minimal, label: "Minimal", description: "Copyright and legal only"}
  - {key: columns_social, label: "Directory + social", description: "Directory columns with social links"}
