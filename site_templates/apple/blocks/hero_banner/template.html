<!-- Hero Banner -->
<section data-name="hero_banner" data-style="dir" data-type="group" data-hideable class="section hero-claude">
  <div class="container">
    <div data-name="slides" data-type="list" class="hero-claude-slides">
      <div data-name="slide" data-type="group" class="hero-claude-slide">
        <div class="hero-claude-grid">
          <div class="hero-claude-illustration">
            <img data-name="media" data-type="image" src="" alt="" loading="eager" class="hero-claude-image">
          </div>
          <div class="hero-claude-content">
            <h1 data-name="title" data-type="text" class="hero-claude-title text-display-xl"></h1>
            <p data-name="subtitle" data-type="text" class="hero-claude-subtitle text-body-md"></p>
            <div class="hero-claude-actions">
              <a data-name="primaryBtn" data-type="text" data-href="primaryBtnLink" class="btn btn-primary btn-lg"></a>
              <a data-name="secondaryBtn" data-type="text" data-href="secondaryBtnLink" class="btn btn-secondary btn-lg"></a>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="hero-claude-dots"></div>
    <button class="hero-claude-nav hero-claude-nav-prev btn-icon-circular" aria-label="Previous">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <button class="hero-claude-nav hero-claude-nav-next btn-icon-circular" aria-label="Next">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
    </button>
  </div>
  <script>
    (function() {
      var section = document.currentScript.parentElement;
      var slides = section.querySelectorAll('.hero-claude-slide');
      var dotsContainer = section.querySelector('.hero-claude-dots');
      var prevBtn = section.querySelector('.hero-claude-nav-prev');
      var nextBtn = section.querySelector('.hero-claude-nav-next');
      var current = 0, total = slides.length;
      if (!total) return;
      for (var i = 0; i < total; i++) {
        var dot = document.createElement('button');
        dot.className = 'hero-claude-dot';
        dot.setAttribute('data-slide', i);
        dot.setAttribute('aria-label', 'Slide ' + (i + 1));
        dotsContainer.appendChild(dot);
      }
      if (total === 1) { slides[0].classList.add('active'); return; }
      function showSlide(index) {
        slides.forEach(function(s, i) { s.classList.toggle('active', i === index); });
        dotsContainer.querySelectorAll('.hero-claude-dot').forEach(function(d, i) { d.classList.toggle('active', i === index); });
        current = index;
      }
      showSlide(0);
      function next() { showSlide((current + 1) % total); }
      function prev() { showSlide((current - 1 + total) % total); }
      if (prevBtn) prevBtn.addEventListener('click', prev);
      if (nextBtn) nextBtn.addEventListener('click', next);
      dotsContainer.querySelectorAll('.hero-claude-dot').forEach(function(dot) {
        dot.addEventListener('click', function() { showSlide(parseInt(dot.getAttribute('data-slide'))); });
      });
      setInterval(next, 8000);
    })();
  </script>
</section>
