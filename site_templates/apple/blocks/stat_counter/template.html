<!-- Stat Counter -->
<section data-name="stat_counter" data-type="group" data-hideable class="section surface-canvas">
  <div class="container">
    <h2 data-name="title" data-type="text" class="section-header__title text-center mb-sm"></h2>
    <p data-name="subtitle" data-type="text" class="section-header__desc mb-xl"></p>
    <div data-name="stats" data-type="list" class="stat-grid flex justify-center gap-xl flex-wrap">
      <div data-name="stat" data-type="group" class="stat-item text-center">
        <div class="stat-icon mb-sm">
          <span data-name="icon" data-type="icon"></span>
        </div>
        <div class="text-display-md text-ink stat-number">
          <span data-name="number" data-type="number">0</span>
          <span data-name="suffix" data-type="text" class="stat-suffix"></span>
        </div>
        <p data-name="label" data-type="text" class="text-body-sm text-muted"></p>
      </div>
    </div>
  </div>
</section>
