title: "About Paperlab"
description: "We believe the best tools feel like paper — warm, calm, and always there when you need them."
modules:
  - type: section_title
    order: 1
    data:
      tag: "Our story"
      title: "Built because work should feel good."
      desc: "Paperlab started in 2021 when a small team of engineers and designers got tired of tools that felt like they were fighting them. They wanted a workspace that was fast, quiet, and kind — so they built one."
      btn_text: ""
      btn_url: ""

  - type: text_content
    order: 2
    data:
      title: "Tools should help you think."
      subtitle: ""
      body: "<p>Most productivity software buries your team in chrome — menus, modals, notifications, and settings that compete for attention. Paperlab takes the opposite approach: the interface steps back so your content can step forward.</p><p>We chose warm paper tones over pure white. Near-black Inter type with tight display tracking over decorative typography. A single confident blue for the one action that matters most. Everything else is calm.</p><p>Our team is based in San Francisco and distributed across 12 countries, working with the same Paperlab workspace we ship to our customers.</p>"
      text_align: center
      columns: "1"
      inner_width: "820px"

  - type: stat_counter
    order: 3
    data:
      title: "Paperlab by the numbers"
      subtitle: ""
      stats:
        - number: 80
          suffix: ""
          label: "Team members worldwide"
          icon: "users"
        - number: 12
          suffix: ""
          label: "Countries"
          icon: "globe"
        - number: 100
          suffix: "M+"
          label: "Docs created on Paperlab"
          icon: "file-text"
        - number: 4
          suffix: ".9"
          label: "Glassdoor rating"
          icon: "star"

  - type: process_steps
    order: 4
    data:
      title: "Our values"
      subtitle: "Three principles that guide every decision we make."
      direction: horizontal
      step_style: number
      steps:
        - title: "Calm over chrome"
          desc: "We remove everything that doesn't serve the work. Every pixel, every interaction earns its place."
          icon: "feather"
        - title: "Speed as respect"
          desc: "Slow tools waste your team's attention. Every action should resolve in under 100 milliseconds."
          icon: "zap"
        - title: "Craft over scale"
          desc: "We would rather make a small number of people love the product than a large number tolerate it."
          icon: "heart"
