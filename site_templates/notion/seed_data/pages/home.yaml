title: "Paperlab — Your team's connected workspace"
description: "A warm, calm productivity system where docs, wikis, and projects work the way your team thinks. Built for speed, designed for focus."
modules:
  # 1 — Hero Banner（全屏深靛蓝 Night Band）
  - type: hero_banner
    order: 1
    data:
      slides:
        - title: "Meet the night shift."
          subtitle: "Paperlab brings your team's docs, projects, and knowledge into one warm, calm workspace. No busy chrome — just what you need, when you need it."
          primaryBtn: "Get Paperlab free"
          primaryBtnLink: "/pricing/"
          secondaryBtn: "Request a demo"
          secondaryBtnLink: "/contact/"
        - title: "Your team's second brain."
          subtitle: "Connected pages, searchable wikis, and flexible databases that adapt to how your team actually thinks. No training required."
          primaryBtn: "Start for free"
          primaryBtnLink: "/pricing/"
          secondaryBtn: "See how it works"
          secondaryBtnLink: "/portfolio/enterprise/"

  # 2 — Section Title
  - type: section_title
    order: 2
    data:
      tag: "Everything you need"
      title: "A workspace that steps out of the way."
      desc: "Paperlab combines documents, wikis, and lightweight databases in one canvas. Less switching, more doing."
      btn_text: "Explore products"
      btn_url: "/products/"
      title_size: ""
      desc_size: ""

  # 3 — Feature Grid
  - type: feature_grid
    order: 3
    data:
      title: "Built for how teams actually work."
      subtitle: "Every feature is tuned for speed, clarity, and the kind of flow state people notice before they can name it."
      features:
        - icon: "file-text"
          title: "Real-time docs"
          desc: "Collaborative pages that feel as fast as a local text editor, with comments, mentions, and version history built in."
        - icon: "book-open"
          title: "Connected wikis"
          desc: "Nested pages, backlinks, and a knowledge graph that grows with your team — no folders required."
        - icon: "database"
          title: "Flexible databases"
          desc: "Tables, boards, calendars, and galleries that adapt to any workflow, from product roadmaps to meeting notes."
        - icon: "search"
          title: "Instant search"
          desc: "Find anything across every doc, comment, and attachment in milliseconds — fuzzy, scoped, and keyboard-first."
        - icon: "users"
          title: "Team permissions"
          desc: "Granular sharing, guest accounts, and admin controls that scale from a team of two to an enterprise of thousands."
        - icon: "zap"
          title: "Integrations"
          desc: "Connect Slack, GitHub, Figma, and 50+ tools so your workspace stays the single source of truth."

  # 4 — Highlight Card
  - type: highlight_card
    order: 4
    data:
      image_position: left
      tag: "Projects"
      title: "Plan, track, and ship together."
      desc: "Timeline views, kanban boards, and lightweight task tracking that keeps everyone aligned without the overhead of heavy project management tools."
      image: "https://images.unsplash.com/photo-1611224923853-80b023f02d71?auto=format&fit=crop&w=1500&q=86"
      features:
        - text: "Timeline, board, table, and calendar views"
        - text: "Custom properties for status, priority, and assignee"
        - text: "Real-time sync with Slack and GitHub"
      primaryBtn: "Try Projects"
      primaryLink: "/products/projects/"
      secondaryBtn: "Learn more"
      secondaryLink: "/products/projects/"

  # 5 — Stat Counter
  - type: stat_counter
    order: 5
    data:
      title: "Trusted by teams everywhere."
      subtitle: "Numbers that speak to the scale, reliability, and speed teams count on every day."
      stats:
        - number: 100
          suffix: "M+"
          label: "Documents created"
          icon: "file-text"
        - number: 99.9
          suffix: "%"
          label: "Uptime SLA"
          icon: "check-circle"
        - number: 150
          suffix: "+"
          label: "Countries served"
          icon: "globe"
        - number: 20
          suffix: "ms"
          label: "Average sync latency"
          icon: "zap"

  # 6 — Logo Cloud
  - type: logo_cloud
    order: 6
    data:
      title: "Teams at these companies already work better with Paperlab."
      subtitle: "From two-person startups to public companies — the workspace scales."
      columns: "5"
      grayscale: "true"
      logos:
        - name: "Figma"
          image: "https://dummyimage.com/240x120/f6f5f4/615d59.png&text=Figma"
          link: "#"
        - name: "Stripe"
          image: "https://dummyimage.com/240x120/f6f5f4/615d59.png&text=Stripe"
          link: "#"
        - name: "Airbnb"
          image: "https://dummyimage.com/240x120/f6f5f4/615d59.png&text=Airbnb"
          link: "#"
        - name: "Spotify"
          image: "https://dummyimage.com/240x120/f6f5f4/615d59.png&text=Spotify"
          link: "#"
        - name: "Shopify"
          image: "https://dummyimage.com/240x120/f6f5f4/615d59.png&text=Shopify"
          link: "#"

  # 7 — Product Grid
  - type: product_grid
    order: 7
    data:
      dataset: products
      max_items: 4
      title: "Products that work the way you think."
      subtitle: "Every tool in Paperlab shares the same calm, fast, connected foundation."

  # 8 — Data Grid（Posts）
  - type: data_grid
    order: 8
    data:
      dataset: posts
      max_items: 3
      card_layout: image_top
      show_pagination: "false"
      title: "From the Paperlab blog"

  # 9 — Process Steps
  - type: process_steps
    order: 9
    data:
      title: "Start in minutes, not days."
      subtitle: "From your first doc to a fully connected team workspace in three steps."
      direction: horizontal
      step_style: number
      steps:
        - title: "Create a workspace"
          desc: "Pick a name, invite your team, and start writing. No setup wizard, no configuration needed."
          icon: "plus-circle"
        - title: "Add your content"
          desc: "Drag in existing docs, connect your tools, or start from a template — your workspace, your way."
          icon: "edit"
        - title: "Work together"
          desc: "Comment, assign, and track progress in real time. Everything stays in sync, everywhere."
          icon: "users"

  # 10 — Text Content
  - type: text_content
    order: 10
    data:
      title: "A design system that disappears."
      subtitle: "So your team can see the work, not the tool."
      body: "<p>Paperlab is built on a simple belief: the best productivity tool is the one you forget you're using. Warm paper tones, near-black Inter type with tight display tracking, and a single confident blue for the actions that matter.</p><p>No heavy shadows. No neon gradients. Just a calm, document-like canvas where your team's ideas can breathe — punctuated by the occasional playful sticker of color to remind you that work can feel good.</p>"
      text_align: center
      columns: "1"
      inner_width: "820px"

  # 11 — Contact Info
  - type: contact_info
    order: 11
    data:
      title: "Visit us."
      subtitle: "Drop by our San Francisco office or reach out — we would love to hear what you are building."
      phone: "+1 (415) 555-0147"
      email: "hello@paperlab.example.com"
      address: "548 Market St, San Francisco, CA 94104"
      show_phone: "true"
      show_email: "true"
      show_address: "true"
      show_business_hours: "true"

  # 12 — Contact Form
  - type: contact_form
    order: 12
    data:
      title: "Talk with our team."
      subtitle: "Tell us about your team, your workflow, and what you need — we will show you how Paperlab fits."
      form_action: "#"
      submit_text: "Send message"

  # 13 — Item Detail（Studio Display 示例产品详情）
  - type: item_detail
    order: 13
    data:
      title: "Paperlab Docs"
      tags: "Real-time, Collaborative, Version history, Comments"
      desc: "A writing surface so clean and fast it feels local — with all the power of real-time collaboration, inline comments, and instant search built in."
      images:
        - url: "https://images.unsplash.com/photo-1512758017271-d7b84c2113f1?auto=format&fit=crop&w=1400&q=86"
        - url: "https://images.unsplash.com/photo-1531403009284-440f080d1e12?auto=format&fit=crop&w=1400&q=86"
      specs:
        - name: "Real-time sync"
          value: "Under 20ms latency"
        - name: "Version history"
          value: "Unlimited, searchable"
        - name: "Import formats"
          value: "Markdown, HTML, Word, CSV"

  # 14 — Item Data（结构化数据）
  - type: item_data
    order: 14
    data:
      title: "Enterprise-grade reliability"
      category: "Infrastructure"
      summary: "SOC 2 Type II certified, with 99.9% uptime SLA, SSO, SCIM provisioning, and audit logs for every action."
      meta_label: "Plan"
      price: "From $15/user/month"
      tags:
        - "SAML SSO"
        - "SCIM"
        - "Audit logs"
        - "SOC 2"
      specs:
        - name: "Uptime SLA"
          value: "99.9%"
        - name: "Data residency"
          value: "US, EU, APAC"
        - name: "Encryption"
          value: "AES-256 at rest, TLS 1.3 in transit"
