title: "Plans and pricing"
description: "Start for free. Upgrade when your team grows. No surprises, no hidden fees."
modules:
  - type: section_title
    order: 1
    data:
      tag: "Pricing"
      title: "Plans for teams of every size."
      desc: "Free to start. Simple per-user pricing as you grow. Every plan includes unlimited pages, real-time collaboration, and version history."
      btn_text: "Compare plans"
      btn_url: "#"

  - type: feature_grid
    order: 2
    data:
      title: "Every plan includes"
      subtitle: "No feature gating on the basics. Every team gets these, free or paid."
      features:
        - icon: "file-text"
          title: "Unlimited pages"
          desc: "Create as many docs, wikis, and databases as your team needs. No page count limits, ever."
        - icon: "clock"
          title: "30-day version history"
          desc: "Roll back to any version from the past 30 days on every plan."
        - icon: "users"
          title: "Guest collaborators"
          desc: "Invite clients, contractors, and partners to specific pages — they only see what you share."
        - icon: "globe"
          title: "Multi-language support"
          desc: "Works in English, Simplified Chinese, Traditional Chinese, and growing."

  - type: process_steps
    order: 3
    data:
      title: "How pricing works"
      subtitle: "Simple, transparent, and predictable."
      direction: horizontal
      step_style: number
      steps:
        - title: "Start free"
          desc: "Create your workspace and invite your team. No credit card required, no time limit."
          icon: "smile"
        - title: "Add seats as you grow"
          desc: "Pay only for active members. Guests are free — invite as many clients as you need."
          icon: "user-plus"
        - title: "Upgrade anytime"
          desc: "Need SSO, SCIM, or advanced permissions? Switch to Plus or Enterprise in one click."
          icon: "arrow-up-circle"

  - type: text_content
    order: 4
    data:
      title: "Frequently asked questions"
      subtitle: ""
      body: "<p><strong>Can I switch plans at any time?</strong> Yes — upgrade or downgrade instantly. Unused time on annual plans is prorated as credit.</p><p><strong>What counts as a 'member'?</strong> Anyone who can create or edit pages in your workspace. Guests who can only view or comment on specific pages are free.</p><p><strong>Do you offer nonprofit or education discounts?</strong> Yes — reach out to our team and we will set you up with a discounted plan.</p>"
      text_align: left
      columns: "1"
      inner_width: "720px"
