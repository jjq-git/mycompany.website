- id: prod-001
  slug: docs
  title: "Paperlab Docs"
  category: "Product"
  summary: "Real-time collaborative documents that feel as fast as a local text editor."
  description: "Write, edit, and collaborate on documents in real time. Inline comments, @mentions, and version history make every page a living workspace. Drag in images, embed Figma files, or paste a YouTube link — it all just works."
