- id: prod-002
  slug: wikis
  title: "Paperlab Wikis"
  category: "Product"
  summary: "Connected knowledge bases that grow with your team — no folders, no setup."
  description: "Build a knowledge base your team will actually use. Nested pages, automatic backlinks, and a visual knowledge graph make it easy to find, connect, and maintain information. Perfect for onboarding docs, engineering wikis, and company handbooks."
