- id: prod-003
  slug: projects
  title: "Paperlab Projects"
  category: "Product"
  summary: "Lightweight project tracking with timeline, board, and calendar views."
  description: "Track projects without the overhead of heavy project management tools. Timeline views give you a Gantt-like picture; kanban boards keep sprints visible; and calendar views show what's due when. Custom properties let you track status, priority, assignee, and anything else your workflow needs."
