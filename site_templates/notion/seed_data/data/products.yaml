- id: prod-004
  slug: calendar
  title: "Paperlab Calendar"
  category: "Product"
  summary: "A connected calendar that syncs deadlines, meetings, and milestones."
  description: "See your projects on a timeline your whole team can access. Sync with Google Calendar and Outlook, connect deadlines to project boards, and never miss a milestone. Deadlines set in any Paperlab page automatically appear on your team calendar."
