- id: post-002
  slug: remote-teams-wikis
  title: "How remote teams use connected wikis to stay aligned"
  category: "Engineering"
  summary: "From onboarding docs to decision logs — wikis that actually get used by distributed teams."
  description: "When your team spans 6 time zones, documentation is not optional — it is the backbone of how you work. But most wikis turn into graveyards of stale pages and broken links. Paperlab Teams takes a different approach: automatic backlinks, nested pages that mirror how your team thinks, and search that finds what you need before you finish typing. We talked to 12 remote-first teams about how they keep knowledge alive."
