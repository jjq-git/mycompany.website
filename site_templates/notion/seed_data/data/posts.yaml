- id: post-003
  slug: design-system-calm
  title: "Design system case study: building a calm productivity UI"
  category: "Design"
  summary: "How we arrived at our type scale, spacing rhythm, and the single-blue-color principle."
  description: "Designing a productivity tool that reads as calm is harder than designing one that reads as powerful. Every pixel has to earn its place. This case study walks through our type scale (Inter, 700 weight for headings, tight negative tracking at display sizes), our spacing rhythm (8px base, generous section gaps), and why we enforce exactly one structural accent color — Notion Blue #0075de — reserving the sticker palette exclusively for decorative moments."
  cover: "https://images.unsplash.com/photo-1561070791-2526d30994b5?auto=format&fit=crop&w=1200&q=80"
