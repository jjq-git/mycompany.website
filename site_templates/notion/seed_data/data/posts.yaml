- id: post-001
  slug: why-we-built-paperlab
  title: "Why we built Paperlab — and why it looks like paper"
  category: "Product"
  summary: "The story behind our warm-tone, low-chrome design philosophy and why we think most productivity tools get it wrong."
  description: "Most productivity tools shout at you. They fill your screen with chrome, notifications, and color-coded labels that compete for attention. We wanted something different: a tool that feels like a well-organized desk in good daylight. Warm paper tones, a single blue for actions, and a type system that reads like a confident statement. Here is the full story of how we built it — and why we think you will love working in it."
