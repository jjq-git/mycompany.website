  - Editing
  meta_label: Feature
  date: '2024-01-15'
- id: feat-002
  slug: connected-knowledge-graph
  title: Connected knowledge graph
  category: Knowledge
  summary: Automatic backlinks and a visual knowledge graph that maps how your pages
    connect.
  description: Every page you create in Paperlab automatically links to related content
    through bidirectional backlinks. The visual knowledge graph renders these connections
    as an interactive map — click any node to jump directly to that page. No folders,
    no manual categorization, no broken hierarchies. The graph grows organically with
    your team's work, making it easy to rediscover old notes, find related projects,
    and understand how your organization's knowledge fits together.
  cover: https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&w=1200&q=80
  images:
  - url: https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&w=1400&q=86
  icon: share-2
  tags:
  - Knowledge
  - Graph
  - Backlinks
  meta_label: Feature
  date: '2024-03-01'
- id: feat-003
  slug: instant-full-text-search
  title: Instant full-text search
  category: Productivity
  summary: Fuzzy search across every doc, comment, and attachment with sub-50ms results.
  description: Paperlab's search engine indexes every word in every document, comment,
    file attachment, and page title across your entire workspace. Fuzzy matching catches
    typos, scoped filters narrow results by team or date range, and results appear
    in under 50 milliseconds. The keyboard-first design means you can open search
    with Ctrl+K, type a few characters, and jump to any page without ever touching
    your mouse. It's the fastest way to navigate a growing knowledge base.
  cover: https://images.unsplash.com/photo-1488190211105-8b0e65b80b4e?auto=format&fit=crop&w=1200&q=80
  images:
  - url: https://images.unsplash.com/photo-1488190211105-8b0e65b80b4e?auto=format&fit=crop&w=1400&q=86
  icon: search
  tags:
  - Search
  - Productivity
  - Keyboard
  meta_label: Feature
  date: '2024-06-10'
- id: feat-004
  slug: flexible-database-views
  title: Flexible database views
  category: Productivity
  summary: Switch any database between table, board, timeline, calendar, and gallery
    views.
  description: Paperlab databases adapt to how your team needs to see information.
    Switch any collection of pages between table view (for spreadsheets), board view
    (for kanban), timeline view (for Gantt charts), calendar view (for scheduling),
    and gallery view (for visual browsing) — all with one click. Each view saves its
    own filters, sorts, and display properties, so your engineering team can see a
    board while your marketing team sees a calendar, both looking at the same data.
  cover: https://images.unsplash.com/photo-1551288049-bebda4e38f71?auto=format&fit=crop&w=1200&q=80
  images:
  - url: https://images.unsplash.com/photo-1551288049-bebda4e38f71?auto=format&fit=crop&w=1400&q=86
  icon: database
  tags:
  - Database
  - Views
  - Flexibility
  meta_label: Feature
  date: '2024-09-20'
- id: feat-005
  slug: enterprise-security
  title: Enterprise security
  category: Security
  summary: SOC 2 Type II certified, SAML SSO, SCIM provisioning, and AES-256 encryption
    at rest.
  description: Security is not an afterthought at Paperlab — it's built into the foundation.
    Every customer workspace benefits from AES-256 encryption at rest and TLS 1.3
    in transit. Enterprise plans add SAML-based single sign-on (Okta, Azure AD, OneLogin),
    SCIM provisioning for automated user lifecycle management, and comprehensive audit
    logs that record every action. Paperlab is SOC 2 Type II certified, with annual
    third-party penetration tests and a public bug bounty program. Your data never
    leaves your control — export everything, anytime, in open formats.
  cover: https://images.unsplash.com/photo-1555066931-4365d14bab8c?auto=format&fit=crop&w=1200&q=80
  images:
  - url: https://images.unsplash.com/photo-1555066931-4365d14bab8c?auto=format&fit=crop&w=1400&q=86
  icon: shield
  tags:
  - Security
  - Enterprise
  - Compliance
  meta_label: Feature
  date: '2025-01-08'
- id: feat-006
  slug: fifty-plus-integrations
  title: 50+ integrations
  category: Integrations
  summary: Connect Paperlab to Slack, GitHub, Figma, Jira, Google Drive, and 50+ other
    tools.
  description: Paperlab connects to the tools your team already uses. Embed live Figma
    frames directly in design docs. See GitHub pull request status next to your engineering
    specs. Get Slack notifications when someone comments on your page. Sync Google
    Drive files as embedded previews. With 50+ native integrations and a public API,
    Paperlab becomes the central hub where all your team's information lives — not
    another silo to check.
  cover: https://images.unsplash.com/photo-1558494949-ef010cbdcc31?auto=format&fit=crop&w=1200&q=80
