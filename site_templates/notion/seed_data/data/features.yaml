- id: feat-001
  slug: real-time-collaboration
  title: Real-time collaboration
  category: Collaboration
  summary: Multiple team members can edit the same page simultaneously with sub-20ms
    sync latency.
  description: Real-time collaboration is the backbone of Paperlab. Multiple team
    members can edit the same page simultaneously — no locking, no merge conflicts,
    no waiting. Cursors appear in real time, inline comments thread naturally, and
    @mentions notify teammates instantly. Every change is saved automatically and
    versioned, so you never lose work. The sync engine operates at under 20 milliseconds,
    meaning edits from a colleague in Tokyo appear on your screen in San Francisco
    before you can blink.
  cover: https://images.unsplash.com/photo-1522071820081-009f0129c71c?auto=format&fit=crop&w=1200&q=80
