- id: post-002
  slug: remote-teams-wikis
  title: "遠端團隊如何使用互聯維基保持步調一致"
  category: "工程"
  summary: "從入職文件到決策日誌——分散式團隊真正使用的維基。"
  description: "當你的團隊跨越 6 個時區時，文件不是可選項——它是你工作方式的基石。但大多數維基變成了陳舊頁面和失效連結的墳墓。Paperlab 團隊採取了不同的方法：自動反向連結、反映團隊思維方式的分層頁面、以及在你完成輸入之前就找到內容的搜尋。我們與 12 個遠端優先的團隊交流了他們如何保持知識的生命力。"
  cover: "https://images.unsplash.com/photo-1522071820081-009f0129c71c?auto=format&fit=crop&w=1200&q=80"
  images:
    - url: "https://images.unsplash.com/photo-1522071820081-009f0129c71c?auto=format&fit=crop&w=1400&q=86"
  date: "2026-04-22"
  tags:
