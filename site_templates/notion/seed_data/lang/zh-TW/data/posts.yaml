    - "工程"
  meta_label: "部落格文章"

- id: post-003
  slug: design-system-calm
  title: "設計系統案例分析：建構一個「平靜」的生產力介面"
  category: "設計"
  summary: "我們如何形成字型層級、間距節奏和單一藍色原則。"
  description: "設計一個讀起來「平靜」的生產力工具比設計一個讀起來「強大」的工具更難。每個像素都必須證明其存在的價值。本案例分析詳細介紹了我們的字型層級（Inter 字體，700 字重用於標題，展示級緊湊負字距）、間距節奏（8px 基準，慷慨的段落間距），以及為什麼我們強制使用唯一的結構性強調色——Notion Blue #0075de——將 sticker 調色板保留用於裝飾性時刻。"
  cover: "https://images.unsplash.com/photo-1561070791-2526d30994b5?auto=format&fit=crop&w=1200&q=80"
  images:
    - url: "https://images.unsplash.com/photo-1561070791-2526d30994b5?auto=format&fit=crop&w=1400&q=86"
  date: "2026-03-10"
  tags:
