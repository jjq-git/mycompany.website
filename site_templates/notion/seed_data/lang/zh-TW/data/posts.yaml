- id: post-001
  slug: why-we-built-paperlab
  title: "為什麼我們創造了 Paperlab——以及為什麼它看起來像紙張"
  category: "產品"
  summary: "我們溫暖色調、低裝飾設計哲學背後的故事，以及為什麼我們認為大多數生產力工具都做錯了。"
  description: "大多數生產力工具對你大聲喊叫。它們用繁雜的介面、通知和彩色標籤爭奪你的注意力。我們想要不同的東西：一個感覺像良好日光下整潔書桌的工具。溫暖的紙張色調，操作使用單一藍色，排版系統讀起來像一個自信的陳述。這是我們如何建構它的完整故事——以及為什麼我們認為你會喜歡在其中工作。"
  cover: "https://images.unsplash.com/photo-1499750310107-5fef28a66643?auto=format&fit=crop&w=1200&q=80"
