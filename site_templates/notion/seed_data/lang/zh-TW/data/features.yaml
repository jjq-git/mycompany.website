- id: feat-004
  slug: flexible-database-views
  title: 靈活資料庫檢視
  category: 效率
  summary: 一鍵在表格、看板、時間線、日曆和畫廊檢視之間切換任何資料庫。
  description: Paperlab 資料庫適應團隊檢視資訊的方式。一鍵在表格檢視（試算表）、看板檢視（看板管理）、時間線檢視（甘特圖）、日曆檢視（排程）和畫廊檢視（視覺瀏覽）之間切換任何頁面集合。每個檢視保存自己的篩選條件、排序和顯示屬性，因此你的工程團隊可以看到看板，而行銷團隊可以看到日曆，兩者檢視的是同一批資料。
  cover: https://images.unsplash.com/photo-1551288049-bebda4e38f71?auto=format&fit=crop&w=1200&q=80
