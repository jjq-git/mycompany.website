- id: feat-005
  slug: enterprise-security
  title: 企業級安全
  category: 安全
  summary: SOC 2 Type II 認證，SAML SSO、SCIM 配置和靜態 AES-256 加密。
  description: 安全不是 Paperlab 的事後考慮——它建立在基礎架構中。每個客戶工作空間都受益於靜態 AES-256 加密和傳輸中 TLS 1.3
    加密。企業方案新增基於 SAML 的單一登入（Okta、Azure AD、OneLogin）、用於自動化使用者生命週期管理的 SCIM 配置，以及記錄每個操作的全面稽核日誌。Paperlab
    已通過 SOC 2 Type II 認證，每年進行第三方滲透測試，並設有公開的漏洞賞金計畫。你的資料永遠不會脫離你的控制——隨時以開放格式匯出全部內容。
  cover: https://images.unsplash.com/photo-1555066931-4365d14bab8c?auto=format&fit=crop&w=1200&q=80
  images:
  - url: https://images.unsplash.com/photo-1555066931-4365d14bab8c?auto=format&fit=crop&w=1400&q=86
  icon: shield
  tags:
  - 安全
  - 企業
  - 合規
  meta_label: 功能
  date: '2025-01-08'
- id: feat-006
  slug: fifty-plus-integrations
  title: 50+ 整合
  category: 整合
  summary: 將 Paperlab 連接到 Slack、GitHub、Figma、Jira、Google Drive 等 50+ 工具。
  description: Paperlab 連接到你團隊已經在使用的工具。在設計文件中嵌入即時 Figma 框架。在工程規範旁邊檢視 GitHub 拉取請求狀態。當有人評論你的頁面時收到
    Slack 通知。將 Google Drive 檔案同步為嵌入式預覽。擁有 50+ 原生整合和公共 API，Paperlab 成為你團隊所有資訊的中心樞紐——而不是另一個需要檢查的資訊孤島。
