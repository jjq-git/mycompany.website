- id: feat-002
  slug: connected-knowledge-graph
  title: 互聯知識圖譜
  category: 知識
  summary: 自動反向連結和視覺化知識圖譜，映射頁面之間的連接關係。
  description: 你在 Paperlab 中建立的每個頁面都透過雙向反向連結自動關聯到相關內容。視覺化知識圖譜將這些連接渲染為互動式地圖——點擊任意節點即可直接跳轉到對應頁面。無需資料夾，無需手動分類，沒有破壞的層級結構。圖譜隨團隊工作有機增長，讓你輕鬆重新發現舊筆記、找到相關專案，並理解組織知識如何融會貫通。
  cover: https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&w=1200&q=80
