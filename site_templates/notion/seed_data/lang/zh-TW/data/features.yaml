- id: feat-001
  slug: real-time-collaboration
  title: 即時協作
  category: 協作
  summary: 多個團隊成員可以同時編輯同一頁面，同步延遲低於 20ms。
  description: 即時協作是 Paperlab 的基石。多個團隊成員可以同時編輯同一頁面——無需鎖定，不會衝突，無需等待。游標即時顯示，行內評論自然串聯，@提及即時通知隊友。每次更改自動儲存並版本化，讓你永遠不會丟失工作。同步引擎以不到
    20 毫秒的延遲運行，意味著東京同事的編輯在你眨眼之前就會出現在舊金山的螢幕上。
