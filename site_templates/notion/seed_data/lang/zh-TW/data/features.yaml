- id: feat-003
  slug: instant-full-text-search
  title: 即時全文搜尋
  category: 效率
  summary: 模糊搜尋覆蓋工作空間中的每篇文件、評論和附件，亞 50ms 回應。
  description: Paperlab 的搜尋引擎索引整個工作空間中每個文件、評論、檔案附件和頁面標題的每一個詞。模糊匹配能捕捉拼寫錯誤，範圍篩選可按團隊或日期範圍縮小結果，結果在不到
    50 毫秒內顯示。鍵盤優先設計意味著你可以用 Ctrl+K 打開搜尋，輸入幾個字元，無需碰滑鼠就能跳轉到任何頁面。這是瀏覽不斷增長的知識庫最快捷的方式。
