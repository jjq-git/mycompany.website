title: "Paperlab — 團隊的互聯工作空間"
description: "一個溫暖、平靜的生產力系統，文件、維基和專案按照團隊思考的方式協同工作。追求速度，專注設計。"
modules:
  - type: hero_banner
    order: 1
    data:
      slides:
        - title: "認識夜間模式。"
          subtitle: "Paperlab 將團隊文件、專案和知識整合到一個溫暖平靜的工作空間中。沒有繁雜的裝飾——只有你需要的東西，在你需要的時候呈現。"
          primaryBtn: "免費使用 Paperlab"
          primaryBtnLink: "/pricing/"
          secondaryBtn: "預約展示"
          secondaryBtnLink: "/contact/"
        - title: "團隊的第二大腦。"
          subtitle: "互聯頁面、可搜尋維基和靈活的資料庫，適應你團隊真實的思考方式。無需培訓。"
          primaryBtn: "免費開始"
          primaryBtnLink: "/pricing/"
          secondaryBtn: "了解運作方式"
          secondaryBtnLink: "/portfolio/enterprise/"

  - type: section_title
    order: 2
    data:
      tag: "你所需的一切"
      title: "一個不打擾你的工作空間。"
      desc: "Paperlab 將文件、維基和輕量級資料庫整合在同一個畫布中。少切換，多做事。"
      btn_text: "探索產品"
      btn_url: "/products/"
      title_size: ""
      desc_size: ""

  - type: feature_grid
    order: 3
    data:
      title: "為團隊真實工作方式而建。"
      subtitle: "每個功能都為速度、清晰度和那種心流狀態而調校——人們會在意識到之前就注意到了。"
      features:
        - icon: "file-text"
          title: "即時文件"
          desc: "如同本機編輯器般快速的協作頁面，內建評論、@提及和版本歷史。"
        - icon: "book-open"
          title: "互聯維基"
          desc: "巢狀頁面、反向連結和隨團隊一起成長的知識圖譜——無需資料夾。"
        - icon: "database"
          title: "靈活資料庫"
          desc: "表格、看板、日曆和畫廊檢視，適配從產品路線圖到會議筆記的任何工作流程。"
        - icon: "search"
          title: "即時搜尋"
          desc: "在每一篇文件、評論和附件中快速找到任何內容——模糊搜尋、範圍篩選、鍵盤優先。"
        - icon: "users"
          title: "團隊權限"
          desc: "精細的共享設定、訪客帳戶和管理控制，從兩人團隊擴展到千人企業。"
        - icon: "zap"
          title: "整合生態"
          desc: "連接 Slack、GitHub、Figma 和 50+ 工具，讓你的工作空間成為唯一的資訊來源。"

  - type: highlight_card
    order: 4
    data:
      image_position: left
      tag: "專案"
      title: "一起規劃、追蹤和交付。"
      desc: "時間線檢視、看板和輕量級任務追蹤，讓每個人保持一致，沒有重型專案管理工具的負擔。"
      image: "https://images.unsplash.com/photo-1611224923853-80b023f02d71?auto=format&fit=crop&w=1500&q=86"
      features:
        - text: "時間線、看板、表格和日曆檢視"
        - text: "自訂屬性：狀態、優先級、負責人"
        - text: "與 Slack 和 GitHub 即時同步"
      primaryBtn: "試用專案"
      primaryLink: "/products/projects/"
      secondaryBtn: "了解更多"
      secondaryLink: "/products/projects/"

  - type: stat_counter
    order: 5
    data:
      title: "全球團隊的信賴之選。"
      subtitle: "這些數字代表了團隊每天依賴的規模、可靠性和速度。"
      stats:
        - number: 100
          suffix: "M+"
          label: "已建立文件"
          icon: "file-text"
        - number: 99.9
          suffix: "%"
          label: "運行時間 SLA"
          icon: "check-circle"
        - number: 150
          suffix: "+"
          label: "覆蓋國家和地區"
          icon: "globe"
        - number: 20
          suffix: "ms"
          label: "平均同步延遲"
          icon: "zap"

  - type: logo_cloud
    order: 6
    data:
      title: "這些公司的團隊已經在用 Paperlab 更好地工作。"
      subtitle: "從兩人的新創公司到上市公司——工作空間隨你擴展。"
      columns: "5"
      grayscale: "true"
      logos:
        - name: "Figma"
          image: "https://dummyimage.com/240x120/f6f5f4/615d59.png&text=Figma"
          link: "#"
        - name: "Stripe"
          image: "https://dummyimage.com/240x120/f6f5f4/615d59.png&text=Stripe"
          link: "#"
        - name: "Airbnb"
          image: "https://dummyimage.com/240x120/f6f5f4/615d59.png&text=Airbnb"
          link: "#"
        - name: "Spotify"
          image: "https://dummyimage.com/240x120/f6f5f4/615d59.png&text=Spotify"
          link: "#"
        - name: "Shopify"
          image: "https://dummyimage.com/240x120/f6f5f4/615d59.png&text=Shopify"
          link: "#"

  - type: product_grid
    order: 7
    data:
      dataset: products
      max_items: 4
      title: "用你的方式思考和工作的產品。"
      subtitle: "Paperlab 的每個工具都共享同一個平靜、快速、互聯的基礎。"

  - type: data_grid
    order: 8
    data:
      dataset: posts
      max_items: 3
      card_layout: image_top
      show_pagination: "false"
      title: "Paperlab 部落格精選"

  - type: process_steps
    order: 9
    data:
      title: "幾分鐘內開始，不需要幾天。"
      subtitle: "從第一篇文件到完整的團隊工作空間，只需三步。"
      direction: horizontal
      step_style: number
      steps:
        - title: "建立工作空間"
          desc: "取個名字，邀請團隊，開始寫作。無需設定精靈，無需配置。"
          icon: "plus-circle"
        - title: "新增內容"
          desc: "拖入現有文件，連接你的工具，或從範本開始——你的工作空間，你的方式。"
          icon: "edit"
        - title: "一起工作"
          desc: "即時批註、指派和追蹤進度。一切保持同步，無所不在。"
          icon: "users"

  - type: text_content
    order: 10
    data:
      title: "一個會消失的設計系統。"
      subtitle: "讓你的團隊看到工作本身，而不是工具。"
      body: "<p>Paperlab 建立在一個簡單的信念之上：最好的生產力工具是你忘記正在使用的那一個。溫暖的紙張色調，近黑色的 Inter 字體配上緊湊的展示級字距，以及一個自信的藍色用於最重要的操作。</p><p>沒有沉重的陰影。沒有霓虹漸變。只有一個平靜的、文件般的畫布，讓你的團隊想法可以自由呼吸——偶爾點綴一抹俏皮的色彩，提醒你工作也可以很美好。</p>"
      text_align: center
      columns: "1"
      inner_width: "820px"

  - type: contact_info
    order: 11
    data:
      title: "來訪我們。"
      subtitle: "歡迎來到舊金山辦公室，或者隨時聯絡我們——我們很樂意聽聽你在做什麼。"
      phone: "+1 (415) 555-0147"
      email: "hello@paperlab.example.com"
      address: "548 Market St, San Francisco, CA 94104"
      show_phone: "true"
      show_email: "true"
      show_address: "true"
      show_business_hours: "true"

  - type: contact_form
    order: 12
    data:
      title: "與團隊交流。"
      subtitle: "告訴我們你的團隊情況、工作流程和需求——我們將向你展示 Paperlab 如何融入。"
      form_action: "#"
      submit_text: "傳送訊息"

  - type: item_detail
    order: 13
    data:
      title: "Paperlab 文件"
      tags: "即時協作, 版本歷史, 評論, @提及"
      desc: "一個乾淨、快速的書寫介面，如同本機編輯器般流暢——同時內建即時協作、行內評論和即時搜尋的強大能力。"
      images:
        - url: "https://images.unsplash.com/photo-1512758017271-d7b84c2113f1?auto=format&fit=crop&w=1400&q=86"
        - url: "https://images.unsplash.com/photo-1531403009284-440f080d1e12?auto=format&fit=crop&w=1400&q=86"
      specs:
        - name: "即時同步"
          value: "延遲低於 20ms"
        - name: "版本歷史"
          value: "無限量，可搜尋"
        - name: "匯入格式"
          value: "Markdown、HTML、Word、CSV"

  - type: item_data
    order: 14
    data:
      title: "企業級可靠性"
      category: "基礎設施"
      summary: "SOC 2 Type II 認證，99.9% 運行時間 SLA，支援 SSO、SCIM 配置和每個操作的稽核日誌。"
      meta_label: "方案"
      price: "每位使用者每月 $15 起"
      tags:
        - "SAML SSO"
        - "SCIM"
        - "稽核日誌"
        - "SOC 2"
      specs:
        - name: "運行時間 SLA"
          value: "99.9%"
        - name: "資料駐留"
          value: "美國、歐洲、亞太"
        - name: "加密標準"
          value: "靜態 AES-256，傳輸 TLS 1.3"
