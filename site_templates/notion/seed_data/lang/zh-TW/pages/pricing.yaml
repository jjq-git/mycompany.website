title: "定價方案"
description: "從免費開始。團隊成長後升級。沒有意外，沒有隱藏費用。"
modules:
  - type: section_title
    order: 1
    data:
      tag: "定價"
      title: "適合各種規模團隊的方案。"
      desc: "免費開始。按使用者簡單的定價隨著你的成長而調整。每個方案都包含無限頁面、即時協作和版本歷史。"
      btn_text: "對比方案"
      btn_url: "#"

  - type: feature_grid
    order: 2
    data:
      title: "每個方案都包含"
      subtitle: "基本功能不受限制。每個團隊都能獲得這些，無論是免費還是付費。"
      features:
        - icon: "file-text"
          title: "無限頁面"
          desc: "建立你的團隊所需的任意數量的文件、維基和資料庫。永遠沒有頁面數量限制。"
        - icon: "clock"
          title: "30 天版本歷史"
          desc: "每個方案都可以回滾到過去 30 天內的任意版本。"
        - icon: "users"
          title: "訪客協作者"
          desc: "邀請客戶、承包商和合作夥伴到特定頁面——他們只能看到你分享的內容。"
        - icon: "globe"
          title: "多語言支援"
          desc: "支援英語、簡體中文、繁體中文等多種語言，持續增加中。"

  - type: process_steps
    order: 3
    data:
      title: "定價方式"
      subtitle: "簡單、透明、可預測。"
      direction: horizontal
      step_style: number
      steps:
        - title: "免費開始"
          desc: "建立你的工作空間並邀請團隊。不需要信用卡，沒有時間限制。"
          icon: "smile"
        - title: "按成長新增席位"
          desc: "只為活躍成員付費。訪客免費——需要多少就邀請多少客戶。"
          icon: "user-plus"
        - title: "隨時升級"
          desc: "需要 SSO、SCIM 或進階權限？一鍵切換到 Plus 或企業版。"
          icon: "arrow-up-circle"

  - type: text_content
    order: 4
    data:
      title: "常見問題"
      subtitle: ""
      body: "<p><strong>可以隨時更換方案嗎？</strong>可以——即時升級或降級。年度方案未使用的時間按比例返還為信用額度。</p><p><strong>什麼算是「成員」？</strong>任何可以在工作空間中建立或編輯頁面的人。只能檢視或評論特定頁面的訪客是免費的。</p><p><strong>有沒有非營利或教育折扣？</strong>有——聯絡我們的團隊，我們會為你設定折扣方案。</p>"
      text_align: left
      columns: "1"
      inner_width: "720px"
