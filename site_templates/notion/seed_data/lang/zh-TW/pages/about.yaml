title: "關於 Paperlab"
description: "我們相信最好的工具感覺像紙——溫暖、平靜，總在你需要的時候陪伴。"
modules:
  - type: section_title
    order: 1
    data:
      tag: "我們的故事"
      title: "因為工作應該讓人感覺良好。"
      desc: "Paperlab 始於 2021 年，當時一小群工程師和設計師厭倦了那些讓人感覺在與他們作對的工具。他們想要一個快速、安靜且友善的工作空間——於是他們自己造了一個。"
      btn_text: ""
      btn_url: ""

  - type: text_content
    order: 2
    data:
      title: "工具應該幫助你思考。"
      subtitle: ""
      body: "<p>大多數生產力軟體用繁雜的介面轟炸你的團隊——選單、彈窗、通知和爭奪注意力的設定。Paperlab 採取相反的方式：介面退後，讓你的內容走上前。</p><p>我們選擇溫暖的紙張色調而非純白。緊湊展示級字距的近黑 Inter 字體而非裝飾性排版。一個自信的藍色用於最重要的操作。其他一切都保持平靜。</p><p>我們的團隊總部設在舊金山，分布在全球 12 個國家，使用我們交付給客戶的同一個 Paperlab 工作空間。</p>"
      text_align: center
      columns: "1"
      inner_width: "820px"

  - type: stat_counter
    order: 3
    data:
      title: "Paperlab 數據一覽"
      subtitle: ""
      stats:
        - number: 80
          suffix: ""
          label: "全球團隊成員"
          icon: "users"
        - number: 12
          suffix: ""
          label: "國家"
          icon: "globe"
        - number: 100
          suffix: "M+"
          label: "Paperlab 上建立的文件"
          icon: "file-text"
        - number: 4
          suffix: ".9"
          label: "Glassdoor 評分"
          icon: "star"

  - type: process_steps
    order: 4
    data:
      title: "我們的價值觀"
      subtitle: "指導我們每一項決策的三個原則。"
      direction: horizontal
      step_style: number
      steps:
        - title: "平靜勝過繁雜"
          desc: "我們刪除一切不服務於工作的東西。每個像素、每個互動都要證明其存在的價值。"
          icon: "feather"
        - title: "速度即是尊重"
          desc: "慢的工具浪費團隊的注意力。每個操作都應在 100 毫秒內完成。"
          icon: "zap"
        - title: "品質優先於規模"
          desc: "我們寧願讓少數人愛上這個產品，也不願讓大多數人勉強忍受它。"
          icon: "heart"
