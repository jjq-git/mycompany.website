- id: feat-002
  slug: connected-knowledge-graph
  title: 互联知识图谱
  category: 知识
  summary: 自动反向链接和可视化知识图谱，映射页面之间的连接关系。
  description: 你在 Paperlab 中创建的每个页面都通过双向反向链接自动关联到相关内容。可视化知识图谱将这些连接渲染为交互式地图——点击任意节点即可直接跳转到对应页面。无需文件夹，无需手动分类，没有破坏的层级结构。图谱随团队工作有机增长，让你轻松重新发现旧笔记、找到相关项目，并理解组织知识如何融会贯通。
