- id: feat-005
  slug: enterprise-security
  title: 企业级安全
  category: 安全
  summary: SOC 2 Type II 认证，SAML SSO、SCIM 配置和静态 AES-256 加密。
  description: 安全不是 Paperlab 的事后考虑——它建立在基础架构中。每个客户工作空间都受益于静态 AES-256 加密和传输中 TLS 1.3
    加密。企业方案新增基于 SAML 的单点登录（Okta、Azure AD、OneLogin）、用于自动化用户生命周期管理的 SCIM 配置，以及记录每个操作的全面审计日志。Paperlab
    已通过 SOC 2 Type II 认证，每年进行第三方渗透测试，并设有公开的漏洞赏金计划。你的数据永远不会脱离你的控制——随时以开放格式导出全部内容。
  cover: https://images.unsplash.com/photo-1555066931-4365d14bab8c?auto=format&fit=crop&w=1200&q=80
