  title: 实时协作
  category: 协作
  summary: 多个团队成员可以同时编辑同一页面，同步延迟低于 20ms。
  description: 实时协作是 Paperlab 的基石。多个团队成员可以同时编辑同一页面——无需锁定，不会冲突，无需等待。光标实时显示，行内评论自然串联，@提及即时通知队友。每次更改自动保存并版本化，让你永远不会丢失工作。同步引擎以不到
    20 毫秒的延迟运行，意味着东京同事的编辑在你眨眼之前就会出现在旧金山的屏幕上。
