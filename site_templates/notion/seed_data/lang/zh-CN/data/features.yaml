- id: feat-004
  slug: flexible-database-views
  title: 灵活数据库视图
  category: 效率
  summary: 一键在表格、看板、时间线、日历和画廊视图之间切换任何数据库。
  description: Paperlab 数据库适应团队查看信息的方式。一键在表格视图（电子表格）、看板视图（看板管理）、时间线视图（甘特图）、日历视图（日程安排）和画廊视图（视觉浏览）之间切换任何页面集合。每个视图保存自己的筛选条件、排序和显示属性，因此你的工程团队可以看到看板，而市场团队可以看到日历，两者查看的是同一批数据。
