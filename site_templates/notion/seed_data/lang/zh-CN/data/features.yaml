- id: feat-003
  slug: instant-full-text-search
  title: 即时全文搜索
  category: 效率
  summary: 模糊搜索覆盖工作空间中的每篇文档、评论和附件，亚 50ms 响应。
  description: Paperlab 的搜索引擎索引整个工作空间中每个文档、评论、文件附件和页面标题的每一个词。模糊匹配能捕捉拼写错误，范围筛选可按团队或日期范围缩小结果，结果在不到
    50 毫秒内显示。键盘优先设计意味着你可以用 Ctrl+K 打开搜索，输入几个字符，无需碰鼠标就能跳转到任何页面。这是浏览不断增长的知识库最快捷的方式。
