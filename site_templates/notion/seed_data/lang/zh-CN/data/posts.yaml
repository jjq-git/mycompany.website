- id: post-002
  slug: remote-teams-wikis
  title: "远程团队如何使用互联维基保持步调一致"
  category: "工程"
  summary: "从入职文档到决策日志——分布式团队真正使用的维基。"
  description: "当你的团队跨越 6 个时区时，文档不是可选项——它是你工作方式的基石。但大多数维基变成了陈旧页面和失效链接的坟墓。Paperlab 团队采取了不同的方法：自动反向链接、反映团队思维方式的分层页面、以及在你完成输入之前就找到内容的搜索。我们与 12 个远程优先的团队交流了他们如何保持知识的生命力。"
  cover: "https://images.unsplash.com/photo-1522071820081-009f0129c71c?auto=format&fit=crop&w=1200&q=80"
  images:
