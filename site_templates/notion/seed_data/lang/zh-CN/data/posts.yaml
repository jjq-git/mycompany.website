- id: post-001
  slug: why-we-built-paperlab
  title: "为什么我们创造了 Paperlab——以及为什么它看起来像纸张"
  category: "产品"
  summary: "我们温暖色调、低装饰设计哲学背后的故事，以及为什么我们认为大多数生产力工具都做错了。"
  description: "大多数生产力工具对你大声喊叫。它们用繁杂的界面、通知和彩色标签争夺你的注意力。我们想要不同的东西：一个感觉像良好日光下整洁书桌的工具。温暖的纸张色调，操作使用单一蓝色，排版系统读起来像一个自信的陈述。这是我们如何构建它的完整故事——以及为什么我们认为你会喜欢在其中工作。"
  cover: "https://images.unsplash.com/photo-1499750310107-5fef28a66643?auto=format&fit=crop&w=1200&q=80"
  images:
