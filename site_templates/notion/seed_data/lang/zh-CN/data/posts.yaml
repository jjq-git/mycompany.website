  meta_label: "博客文章"

- id: post-003
  slug: design-system-calm
  title: "设计系统案例分析：构建一个「平静」的生产力界面"
  category: "设计"
  summary: "我们如何形成字号层级、间距节奏和单一蓝色原则。"
  description: "设计一个读起来「平静」的生产力工具比设计一个读起来「强大」的工具更难。每个像素都必须证明其存在的价值。本案例分析详细介绍了我们的字号层级（Inter 字体，700 字重用于标题，展示级紧凑负字距）、间距节奏（8px 基准，慷慨的段落间距），以及为什么我们强制使用唯一的结构性强调整色——Notion Blue #0075de——将 sticker 调色板保留用于装饰性时刻。"
  cover: "https://images.unsplash.com/photo-1561070791-2526d30994b5?auto=format&fit=crop&w=1200&q=80"
  images:
