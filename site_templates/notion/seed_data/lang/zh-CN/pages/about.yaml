title: "关于 Paperlab"
description: "我们相信最好的工具感觉像纸——温暖、平静，总在你需要的时候陪伴。"
modules:
  - type: section_title
    order: 1
    data:
      tag: "我们的故事"
      title: "因为工作应该让人感觉良好。"
      desc: "Paperlab 始于 2021 年，当时一小群工程师和设计师厌倦了那些让人感觉在与他们作对的工具。他们想要一个快速、安静且友善的工作空间——于是他们自己造了一个。"
      btn_text: ""
      btn_url: ""

  - type: text_content
    order: 2
    data:
      title: "工具应该帮助你思考。"
      subtitle: ""
      body: "<p>大多数生产力软件用繁杂的界面轰炸你的团队——菜单、弹窗、通知和争夺注意力的设置。Paperlab 采取相反的方式：界面退后，让你的内容走上前。</p><p>我们选择温暖的纸张色调而非纯白。紧凑展示级字距的近黑 Inter 字体而非装饰性排版。一个自信的蓝色用于最重要的操作。其他一切都保持平静。</p><p>我们的团队总部设在旧金山，分布在全球 12 个国家，使用我们交付给客户的同一个 Paperlab 工作空间。</p>"
      text_align: center
      columns: "1"
      inner_width: "820px"

  - type: stat_counter
    order: 3
    data:
      title: "Paperlab 数据一览"
      subtitle: ""
      stats:
        - number: 80
          suffix: ""
          label: "全球团队成员"
          icon: "users"
        - number: 12
          suffix: ""
          label: "国家"
          icon: "globe"
        - number: 100
          suffix: "M+"
          label: "Paperlab 上创建的文档"
          icon: "file-text"
        - number: 4
          suffix: ".9"
          label: "Glassdoor 评分"
          icon: "star"

  - type: process_steps
    order: 4
    data:
      title: "我们的价值观"
      subtitle: "指导我们每一项决策的三个原则。"
      direction: horizontal
      step_style: number
      steps:
        - title: "平静胜过繁杂"
          desc: "我们删除一切不服务于工作的东西。每个像素、每个交互都要证明其存在的价值。"
          icon: "feather"
        - title: "速度即是尊重"
          desc: "慢的工具浪费团队的注意力。每个操作都应在 100 毫秒内完成。"
          icon: "zap"
        - title: "品质优先于规模"
          desc: "我们宁愿让少数人爱上这个产品，也不愿让大多数人勉强忍受它。"
          icon: "heart"
