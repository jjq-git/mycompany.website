title: "Paperlab — 团队的互联工作空间"
description: "一个温暖、平静的生产力系统，文档、维基和项目按照团队思考的方式协同工作。追求速度，专注设计。"
modules:
  - type: hero_banner
    order: 1
    data:
      slides:
        - title: "认识夜间模式。"
          subtitle: "Paperlab 将团队文档、项目和知识整合到一个温暖平静的工作空间中。没有繁杂的装饰——只有你需要的东西，在你需要的时候呈现。"
          primaryBtn: "免费使用 Paperlab"
          primaryBtnLink: "/pricing/"
          secondaryBtn: "预约演示"
          secondaryBtnLink: "/contact/"
        - title: "团队的第二大脑。"
          subtitle: "互联页面、可搜索维基和灵活的数据库，适应你团队真实的思考方式。无需培训。"
          primaryBtn: "免费开始"
          primaryBtnLink: "/pricing/"
          secondaryBtn: "了解运作方式"
          secondaryBtnLink: "/portfolio/enterprise/"

  - type: section_title
    order: 2
    data:
      tag: "你所需的一切"
      title: "一个不打扰你的工作空间。"
      desc: "Paperlab 将文档、维基和轻量级数据库整合在同一个画布中。少切换，多做事。"
      btn_text: "探索产品"
      btn_url: "/products/"
      title_size: ""
      desc_size: ""

  - type: feature_grid
    order: 3
    data:
      title: "为团队真实工作方式而建。"
      subtitle: "每个功能都为速度、清晰度和那种心流状态而调校——人们会在意识到之前就注意到了。"
      features:
        - icon: "file-text"
          title: "实时文档"
          desc: "如同本地编辑器般快速的协作页面，内置评论、@提及和版本历史。"
        - icon: "book-open"
          title: "互联维基"
          desc: "嵌套页面、反向链接和随团队一起成长的知识图谱——无需文件夹。"
        - icon: "database"
          title: "灵活数据库"
          desc: "表格、看板、日历和画廊视图，适配从产品路线图到会议笔记的任何工作流。"
        - icon: "search"
          title: "即时搜索"
          desc: "在每一篇文档、评论和附件中快速找到任何内容——模糊搜索、范围筛选、键盘优先。"
        - icon: "users"
          title: "团队权限"
          desc: "精细的共享设置、访客账户和管理控制，从两人团队扩展到千人企业。"
        - icon: "zap"
          title: "集成生态"
          desc: "连接 Slack、GitHub、Figma 和 50+ 工具，让你的工作空间成为唯一的信息来源。"

  - type: highlight_card
    order: 4
    data:
      image_position: left
      tag: "项目"
      title: "一起规划、跟踪和交付。"
      desc: "时间线视图、看板和轻量级任务跟踪，让每个人保持一致，没有重型项目管理工具的负担。"
      image: "https://images.unsplash.com/photo-1611224923853-80b023f02d71?auto=format&fit=crop&w=1500&q=86"
      features:
        - text: "时间线、看板、表格和日历视图"
        - text: "自定义属性：状态、优先级、负责人"
        - text: "与 Slack 和 GitHub 实时同步"
      primaryBtn: "试用项目"
      primaryLink: "/products/projects/"
      secondaryBtn: "了解更多"
      secondaryLink: "/products/projects/"

  - type: stat_counter
    order: 5
    data:
      title: "全球团队的信赖之选。"
      subtitle: "这些数字代表了团队每天依赖的规模、可靠性和速度。"
      stats:
        - number: 100
          suffix: "M+"
          label: "已创建文档"
          icon: "file-text"
        - number: 99.9
          suffix: "%"
          label: "运行时间 SLA"
          icon: "check-circle"
        - number: 150
          suffix: "+"
          label: "覆盖国家和地区"
          icon: "globe"
        - number: 20
          suffix: "ms"
          label: "平均同步延迟"
          icon: "zap"

  - type: logo_cloud
    order: 6
    data:
      title: "这些公司的团队已经在用 Paperlab 更好地工作。"
      subtitle: "从两人的初创公司到上市公司——工作空间随你扩展。"
      columns: "5"
      grayscale: "true"
      logos:
        - name: "Figma"
          image: "https://dummyimage.com/240x120/f6f5f4/615d59.png&text=Figma"
          link: "#"
        - name: "Stripe"
          image: "https://dummyimage.com/240x120/f6f5f4/615d59.png&text=Stripe"
          link: "#"
        - name: "Airbnb"
          image: "https://dummyimage.com/240x120/f6f5f4/615d59.png&text=Airbnb"
          link: "#"
        - name: "Spotify"
          image: "https://dummyimage.com/240x120/f6f5f4/615d59.png&text=Spotify"
          link: "#"
        - name: "Shopify"
          image: "https://dummyimage.com/240x120/f6f5f4/615d59.png&text=Shopify"
          link: "#"

  - type: product_grid
    order: 7
    data:
      dataset: products
      max_items: 4
      title: "用你的方式思考和工作的产品。"
      subtitle: "Paperlab 的每个工具都共享同一个平静、快速、互联的基础。"

  - type: data_grid
    order: 8
    data:
      dataset: posts
      max_items: 3
      card_layout: image_top
      show_pagination: "false"
      title: "Paperlab 博客精选"

  - type: process_steps
    order: 9
    data:
      title: "几分钟内开始，不需要几天。"
      subtitle: "从第一篇文档到完整的团队工作空间，只需三步。"
      direction: horizontal
      step_style: number
      steps:
        - title: "创建工作空间"
          desc: "取个名字，邀请团队，开始写作。无需设置向导，无需配置。"
          icon: "plus-circle"
        - title: "添加内容"
          desc: "拖入现有文档，连接你的工具，或从模板开始——你的工作空间，你的方式。"
          icon: "edit"
        - title: "一起工作"
          desc: "实时批注、分配和跟踪进度。一切保持同步，无处不在。"
          icon: "users"

  - type: text_content
    order: 10
    data:
      title: "一个会消失的设计系统。"
      subtitle: "让你的团队看到工作本身，而不是工具。"
      body: "<p>Paperlab 建立在一个简单的信念之上：最好的生产力工具是你忘记正在使用的那一个。温暖的纸张色调，近黑色的 Inter 字体配上紧凑的展示级字距，以及一个自信的蓝色用于最重要的操作。</p><p>没有沉重的阴影。没有霓虹渐变。只有一个平静的、文档般的画布，让你的团队想法可以自由呼吸——偶尔点缀一抹俏皮的色彩，提醒你工作也可以很美好。</p>"
      text_align: center
      columns: "1"
      inner_width: "820px"

  - type: contact_info
    order: 11
    data:
      title: "来访我们。"
      subtitle: "欢迎来到旧金山办公室，或者随时联系我们——我们很想听听你在做什么。"
      phone: "+1 (415) 555-0147"
      email: "hello@paperlab.example.com"
      address: "548 Market St, San Francisco, CA 94104"
      show_phone: "true"
      show_email: "true"
      show_address: "true"
      show_business_hours: "true"

  - type: contact_form
    order: 12
    data:
      title: "与团队交流。"
      subtitle: "告诉我们你的团队情况、工作流程和需求——我们将向你展示 Paperlab 如何融入。"
      form_action: "#"
      submit_text: "发送消息"

  - type: item_detail
    order: 13
    data:
      title: "Paperlab 文档"
      tags: "实时协作, 版本历史, 评论, @提及"
      desc: "一个干净、快速的书写界面，如同本地编辑器般流畅——同时内置实时协作、行内评论和即时搜索的强大能力。"
      images:
        - url: "https://images.unsplash.com/photo-1512758017271-d7b84c2113f1?auto=format&fit=crop&w=1400&q=86"
        - url: "https://images.unsplash.com/photo-1531403009284-440f080d1e12?auto=format&fit=crop&w=1400&q=86"
      specs:
        - name: "实时同步"
          value: "延迟低于 20ms"
        - name: "版本历史"
          value: "无限量，可搜索"
        - name: "导入格式"
          value: "Markdown、HTML、Word、CSV"

  - type: item_data
    order: 14
    data:
      title: "企业级可靠性"
      category: "基础设施"
      summary: "SOC 2 Type II 认证，99.9% 运行时间 SLA，支持 SSO、SCIM 配置和每个操作的审计日志。"
      meta_label: "方案"
      price: "每位用户每月 $15 起"
      tags:
        - "SAML SSO"
        - "SCIM"
        - "审计日志"
        - "SOC 2"
      specs:
        - name: "运行时间 SLA"
          value: "99.9%"
        - name: "数据驻留"
          value: "美国、欧洲、亚太"
        - name: "加密标准"
          value: "静态 AES-256，传输 TLS 1.3"
