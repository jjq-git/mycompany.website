title: "定价方案"
description: "从免费开始。团队成长后升级。没有意外，没有隐藏费用。"
modules:
  - type: section_title
    order: 1
    data:
      tag: "定价"
      title: "适合各种规模团队的方案。"
      desc: "免费开始。按用户简单的定价随着你的增长而调整。每个方案都包含无限页面、实时协作和版本历史。"
      btn_text: "对比方案"
      btn_url: "#"

  - type: feature_grid
    order: 2
    data:
      title: "每个方案都包含"
      subtitle: "基本功能不受限制。每个团队都能获得这些，无论是免费还是付费。"
      features:
        - icon: "file-text"
          title: "无限页面"
          desc: "创建你的团队所需的任意数量的文档、维基和数据库。永远没有页面数量限制。"
        - icon: "clock"
          title: "30 天版本历史"
          desc: "每个方案都可以回滚到过去 30 天内的任意版本。"
        - icon: "users"
          title: "访客协作者"
          desc: "邀请客户、承包商和合作伙伴到特定页面——他们只能看到你分享的内容。"
        - icon: "globe"
          title: "多语言支持"
          desc: "支持英语、简体中文、繁体中文等多种语言，持续增加中。"

  - type: process_steps
    order: 3
    data:
      title: "定价方式"
      subtitle: "简单、透明、可预测。"
      direction: horizontal
      step_style: number
      steps:
        - title: "免费开始"
          desc: "创建你的工作空间并邀请团队。不需要信用卡，没有时间限制。"
          icon: "smile"
        - title: "按增长添加席位"
          desc: "只为活跃成员付费。访客免费——需要多少就邀请多少客户。"
          icon: "user-plus"
        - title: "随时升级"
          desc: "需要 SSO、SCIM 或高级权限？一键切换到 Plus 或企业版。"
          icon: "arrow-up-circle"

  - type: text_content
    order: 4
    data:
      title: "常见问题"
      subtitle: ""
      body: "<p><strong>可以随时更换方案吗？</strong>可以——即时升级或降级。年度方案未使用的时间按比例返还为信用额度。</p><p><strong>什么算是「成员」？</strong>任何可以在工作空间中创建或编辑页面的人。只能查看或评论特定页面的访客是免费的。</p><p><strong>有没有非营利或教育折扣？</strong>有——联系我们的团队，我们会为你设置折扣方案。</p>"
      text_align: left
      columns: "1"
      inner_width: "720px"
