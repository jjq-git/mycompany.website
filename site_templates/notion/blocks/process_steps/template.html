<!-- Process Steps — Notion 风格: 3 栏 + 圆形数字 -->
<section data-name="process_steps" data-type="group" data-hideable data-style="bg-color" class="section surface-white">
  <div class="container">
    <div class="section-header">
      <h2 data-name="title" data-type="text" class="section-header__title"></h2>
      <p data-name="subtitle" data-type="text" class="section-header__desc"></p>
    </div>
    <div data-name="steps" data-type="list" class="process-steps">
      <div data-name="step" data-type="group" class="process-step">
        <div data-name="icon" data-type="icon" class="process-step__icon"></div>
        <div class="process-step__number" data-name="number" data-type="text">1</div>
        <h3 data-name="title" data-type="text" class="process-step__title"></h3>
        <p data-name="desc" data-type="text" class="process-step__desc"></p>
      </div>
    </div>
  </div>
</section>
