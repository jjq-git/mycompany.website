<!-- Contact Form（class 同 dengtec） -->
<section data-name="contact_form" data-type="group" data-hideable class="section" data-style="dir,bg-color">
  <div class="container">
    <div class="section-header">
      <h2 data-name="title" data-type="text" class="section-title"></h2>
      <p data-name="subtitle" data-type="text" class="section-description"></p>
    </div>
    <span class="js-form-action" data-name="form_action" data-type="text" style="display:none"></span>
    <div class="cf-layout">
      <div data-name="form_panel" data-type="group" data-hideable class="cf-form-col">
        <form class="cf-form" method="POST">
          <div data-name="name_field" data-type="group" data-hideable class="cf-field">
            <label class="cf-label" data-i18n="contact.name">姓名</label>
            <input type="text" name="name" class="cf-input" required placeholder="姓名" data-i18n-placeholder="contact.name">
          </div>
          <div data-name="email_field" data-type="group" data-hideable class="cf-field">
            <label class="cf-label" data-i18n="contact.email">邮箱</label>
            <input type="email" name="email" class="cf-input" required placeholder="邮箱" data-i18n-placeholder="contact.email">
          </div>
          <div data-name="message_field" data-type="group" data-hideable class="cf-field">
            <label class="cf-label" data-i18n="contact.message">留言</label>
            <textarea name="message" class="cf-input cf-textarea" rows="4" required placeholder="留言" data-i18n-placeholder="contact.message"></textarea>
          </div>
          <div class="cf-actions">
            <button type="submit" class="cf-btn" data-name="submit_text" data-type="text">发送留言</button>
          </div>
        </form>
      </div>
    </div>
  </div>
  <script>
    (function() {
      var section = document.currentScript.parentElement;
      var actionEl = section.querySelector('.js-form-action');
      var form = section.querySelector('.cf-form');
      if (actionEl && form) {
        var v = (actionEl.textContent || '').trim();
        if (v) form.action = v;
      }
    })();
  </script>
</section>
