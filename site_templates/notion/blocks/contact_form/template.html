<!-- Contact Form — Notion 风格: 白色卡片 + 4px 输入框圆角 -->
<section data-name="contact_form" data-type="group" data-hideable data-style="bg-color" class="section surface-white">
  <div class="container container--narrow">
    <div class="section-header">
      <h2 data-name="title" data-type="text" class="section-header__title"></h2>
      <p data-name="subtitle" data-type="text" class="section-header__desc"></p>
    </div>
    <form data-name="form" data-type="group" class="contact-form">
      <div class="form-group">
        <label class="form-label" data-i18n="contact.name">Name</label>
        <input type="text" class="form-input" placeholder="Your name" required>
      </div>
      <div class="form-group">
        <label class="form-label" data-i18n="contact.email">Email</label>
        <input type="email" class="form-input" placeholder="you@example.com" required>
      </div>
      <div class="form-group">
        <label class="form-label" data-i18n="contact.message">Message</label>
        <textarea class="form-input form-textarea" placeholder="Tell us about your project..." required></textarea>
      </div>
      <button type="submit" class="btn btn-primary">
        <span data-name="submit_text" data-type="text">Send message</span>
      </button>
    </form>
  </div>
</section>
