<!-- Stat Counter — Notion 风格: 大号数字 + muted 标签 -->
<section data-name="stat_counter" data-type="group" data-hideable data-style="bg-color" class="section surface-white">
  <div class="container">
    <div class="section-header">
      <h2 data-name="title" data-type="text" class="section-header__title"></h2>
      <p data-name="subtitle" data-type="text" class="section-header__desc"></p>
    </div>
    <div data-name="stats" data-type="list" class="stat-grid">
      <div data-name="stat" data-type="group" class="stat-card">
        <div data-name="icon" data-type="icon" class="stat-card__icon"></div>
        <div class="stat-card__number">
          <span data-name="number" data-type="text">0</span><span data-name="suffix" data-type="text"></span>
        </div>
        <p data-name="label" data-type="text" class="stat-card__label"></p>
      </div>
    </div>
  </div>
</section>
