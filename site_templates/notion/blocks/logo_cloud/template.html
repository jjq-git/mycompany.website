<!-- Logo Cloud — Notion 风格: 灰度网格 -->
<section data-name="logo_cloud" data-type="group" data-hideable data-style="bg-color" class="section surface-canvas">
  <div class="container">
    <div class="section-header">
      <h2 data-name="title" data-type="text" class="section-header__title"></h2>
      <p data-name="subtitle" data-type="text" class="section-header__desc"></p>
    </div>
    <div data-name="logos" data-type="list" class="logo-grid logo-grid--5 logo-grid--grayscale">
      <a data-name="logo" data-type="group" data-href="link" class="logo-grid-item" target="_blank" rel="noopener">
        <img data-name="image" data-type="image" src="" alt="" loading="lazy">
      </a>
    </div>
  </div>
</section>
