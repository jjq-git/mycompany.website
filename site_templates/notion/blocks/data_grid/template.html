<!-- Data Grid（class 同 dengtec） -->
<section data-name="data_grid" data-type="group" data-hideable data-style="cols,bg,bg-color" class="section">
  <div class="container">
    <div class="section-header">
      <h2 data-name="title" data-type="text" class="section-title">数据列表</h2>
    </div>
    <div data-name="items" data-type="list" data-source="" class="dg-list">
      <a data-name="item" data-type="group" data-href-template="{base_url}/{lang}{current_path}{slug}/" class="dg-card">
        <div class="dg-card-image">
          <img data-name="cover" data-fallback="image,photo,logo" data-type="image" src="" alt="" loading="lazy">
          <span data-name="category" data-type="text" class="dg-card-category">分类</span>
        </div>
        <div class="dg-card-body">
          <h3 data-name="title" data-fallback="name" data-type="text" class="dg-card-title">标题</h3>
          <div data-name="date" data-type="text" class="dg-card-date">日期</div>
          <p data-name="summary" data-fallback="excerpt,description" data-type="text" class="dg-card-desc">简介</p>
          <div data-name="tags" data-type="list" class="dg-card-tags">
            <span data-name="tag" data-type="text" class="dg-card-tag">标签</span>
          </div>
        </div>
      </a>
    </div>
    <div data-name="pager" data-type="group" class="dg-pager" style="display:none">
      <span data-name="show_pagination" data-type="text" data-pager-key="show_pagination" hidden>true</span>
      <span data-name="pagination_style" data-type="text" data-pager-key="pagination_style" hidden>load_more</span>
      <span data-name="items_per_page" data-type="text" data-pager-key="items_per_page" hidden>6</span>
      <span data-name="pager_align" data-type="text" data-pager-key="pager_align" hidden>center</span>
      <button class="btn btn-outline-primary dg-load-more" style="display:none" onclick="loadMoreDataGrid(this)">加载更多 <span class="dg-remaining"></span></button>
      <div class="dg-page-numbers" style="display:none"></div>
    </div>
  </div>
</section>
