<!-- Feature Grid — Notion 风格: warm canvas + 3 栏 + 12px 圆角卡片 -->
<section data-name="feature_grid" data-type="group" data-hideable data-style="cols" class="section surface-canvas">
  <div class="container">
    <div class="section-header">
      <h2 data-name="title" data-type="text" class="section-header__title"></h2>
      <p data-name="subtitle" data-type="text" class="section-header__desc"></p>
    </div>
    <div data-name="features" data-type="list" class="grid grid--3">
      <div data-name="feature" data-type="group" class="card-feature">
        <div data-name="icon" data-type="icon" class="feature-icon"></div>
        <h3 data-name="title" data-type="text" class="text-heading-3 text-ink mb-sm"></h3>
        <p data-name="desc" data-type="text" class="text-body-md text-muted"></p>
      </div>
    </div>
  </div>
</section>
