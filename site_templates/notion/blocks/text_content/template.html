<!-- Text Content（class 同 dengtec） -->
<section data-name="text_content" data-type="group" data-hideable data-style="text-align" class="section">
  <div class="container">
    <div class="section-header">
      <h2 data-name="title" data-type="text" class="section-title">内容标题</h2>
      <p data-name="subtitle" data-type="text" class="section-description">内容副标题</p>
    </div>
    <div class="tc-block">
      <div data-name="body" data-type="richtext" class="tc-body">
        <p>正文内容，支持多段落与富文本格式。</p>
      </div>
    </div>
  </div>
</section>
