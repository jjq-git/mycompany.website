<!-- Text Content — Notion 风格: 窄栏文本区 -->
<section data-name="text_content" data-type="group" data-hideable data-style="bg-color" class="section surface-canvas">
  <div class="container">
    <div class="text-content-block text-content-block--center">
      <h2 data-name="title" data-type="text" class="text-content-block__title"></h2>
      <p data-name="subtitle" data-type="text" class="text-content-block__subtitle"></p>
      <div data-name="body" data-type="textarea" class="text-content-block__body"></div>
    </div>
  </div>
</section>
