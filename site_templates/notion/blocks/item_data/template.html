<!-- Item Data（class 同 dengtec） -->
<section data-name="item_data" data-type="group" data-hideable data-style="bg-color" class="section item-data-section">
  <div class="container">
    <article class="item-data-article">
      <h1 data-name="title" data-type="text" data-fallback="name" class="item-data-title">详情标题</h1>
      <div data-name="category" data-type="text" class="item-data-date">分类</div>
      <div data-name="tags" data-type="list" class="item-data-tags">
        <span data-name="tag" data-type="text" class="badge badge-primary item-data-tag">标签</span>
      </div>
      <p data-name="summary" data-type="textarea" class="item-data-desc">详情简述</p>
      <div class="item-data-meta">
        <span data-name="meta_label" data-type="text" class="item-data-meta-label"></span>
        <span data-name="price" data-type="text" class="item-data-meta-value"></span>
      </div>
      <div data-name="specs" data-type="list" class="item-data-specs">
        <div data-name="spec" data-type="group" class="item-data-spec-row">
          <span data-name="name" data-type="text" class="item-data-spec-name"></span>
          <span data-name="value" data-type="text" class="item-data-spec-value"></span>
        </div>
      </div>
    </article>
  </div>
</section>
