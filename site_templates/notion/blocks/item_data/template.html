<!-- Item Data — 结构化数据展示卡片 -->
<section data-name="item_data" data-type="group" data-hideable data-style="bg-color" class="section surface-white">
  <div class="container">
    <div class="section-header">
      <span data-name="category" data-type="text" class="badge badge-pill section-header__tag"></span>
      <h2 data-name="title" data-type="text" class="section-header__title"></h2>
      <p data-name="summary" data-type="text" class="section-header__desc"></p>
    </div>
    <div class="card-feature card-feature--elevated" style="max-width: var(--content-max-narrow); margin: 0 auto;">
      <div class="product-detail__meta mb-md">
        <span data-name="meta_label" data-type="text" class="text-body-sm text-muted"></span>
        <span data-name="price" data-type="text" class="text-title text-ink"></span>
      </div>
      <div data-name="tags" data-type="list" class="flex gap-xs flex-wrap mb-md">
        <span data-name="tag" data-type="text" class="badge badge-pill"></span>
      </div>
      <div data-name="specs" data-type="list">
        <li data-name="spec" data-type="group" style="display:flex;justify-content:space-between;padding:var(--space-xs) 0;font-size:var(--text-body-sm);color:var(--color-ink-secondary);border-bottom:1px solid var(--color-border)">
          <span data-name="name" data-type="text" style="font-weight:500;color:var(--color-ink)"></span>
          <span data-name="value" data-type="text"></span>
        </li>
      </div>
    </div>
  </div>
</section>
