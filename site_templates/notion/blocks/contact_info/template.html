<!-- Contact Info — Notion 风格: 联系信息列表 -->
<section data-name="contact_info" data-type="group" data-hideable data-style="bg-color" class="section surface-white">
  <div class="container">
    <div class="section-header">
      <h2 data-name="title" data-type="text" class="section-header__title"></h2>
      <p data-name="subtitle" data-type="text" class="section-header__desc"></p>
    </div>
    <div class="contact-grid" style="max-width: var(--content-max-narrow); margin: 0 auto;">
      <ul class="contact-list">
        <li data-if="show_phone" data-cond="show_phone">
          <span class="contact-list__icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
          </span>
          <div>
            <div class="text-eyebrow text-muted mb-xs" data-i18n="contact.phone">Phone</div>
            <div data-name="phone" data-type="text" class="text-body-md text-ink"></div>
          </div>
        </li>
        <li data-if="show_email" data-cond="show_email">
          <span class="contact-list__icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
          </span>
          <div>
            <div class="text-eyebrow text-muted mb-xs" data-i18n="contact.email">Email</div>
            <div data-name="email" data-type="text" class="text-body-md text-ink"></div>
          </div>
        </li>
        <li data-if="show_address" data-cond="show_address">
          <span class="contact-list__icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
          </span>
          <div>
            <div class="text-eyebrow text-muted mb-xs" data-i18n="contact.address">Address</div>
            <div data-name="address" data-type="text" class="text-body-md text-ink"></div>
          </div>
        </li>
        <li data-if="show_business_hours" data-cond="show_business_hours">
          <span class="contact-list__icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          </span>
          <div>
            <div class="text-eyebrow text-muted mb-xs" data-i18n="contact.businessHours">Business Hours</div>
            <div data-name="business_hours" data-type="text" class="text-body-md text-ink"></div>
          </div>
        </li>
      </ul>
    </div>
  </div>
</section>
