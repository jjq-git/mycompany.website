<!-- Highlight Card — Notion 风格: 16px 圆角 + 左右布局 + check 列表 -->
<section data-name="highlight_card" data-type="group" data-hideable data-style="bg-color" class="section surface-canvas">
  <div class="container">
    <div class="card-highlight">
      <img data-name="image" data-type="image" src="" alt="" loading="lazy" class="card-highlight__image">
      <div class="card-highlight__body">
        <span data-name="tag" data-type="text" class="badge badge-pill card-highlight__tag"></span>
        <h2 data-name="title" data-type="text" class="card-highlight__title"></h2>
        <p data-name="desc" data-type="text" class="card-highlight__desc"></p>
        <ul data-name="features" data-type="list" class="card-highlight__features">
          <li data-name="feature" data-type="group">
            <span data-name="text" data-type="text"></span>
          </li>
        </ul>
        <div class="card-highlight__actions">
          <a data-name="primaryBtn" data-type="text" data-href="primaryLink" class="btn btn-primary"></a>
          <a data-name="secondaryBtn" data-type="text" data-href="secondaryLink" class="btn btn-secondary"></a>
        </div>
      </div>
    </div>
  </div>
</section>
