<!-- Item Detail — Notion 风格: 多图轮播 + 缩略图 + 灯箱 -->
<section data-name="item_detail" data-type="group" data-hideable data-style="bg-color" class="section surface-canvas">
  <div class="container">
    <div class="product-detail__grid">
      <section class="item-detail-carousel">
        <div class="detail-carousel-stage">
          <div class="detail-images">
            <img data-name="images" data-type="list" data-list-item-key="url" data-list-item-type="image" class="detail-gallery-img" src="" alt="" loading="lazy">
          </div>
          <button class="detail-carousel-prev btn-icon-circular" aria-label="Previous image">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
          </button>
          <button class="detail-carousel-next btn-icon-circular" aria-label="Next image">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
          </button>
          <button class="detail-zoom-btn btn-icon-circular" aria-label="Zoom image">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
          </button>
        </div>
        <div class="detail-thumbs"></div>
      </section>
      <div class="product-detail__info">
        <div class="product-detail__tags">
          <span data-name="tags" data-type="text" class="badge badge-pill"></span>
        </div>
        <h1 data-name="title" data-type="text" class="product-detail__title"></h1>
        <p data-name="desc" data-type="textarea" class="product-detail__desc"></p>
        <div data-name="specs" data-type="list" class="product-detail__specs">
          <li data-name="spec" data-type="group">
            <span data-name="name" data-type="text"></span>
            <span data-name="value" data-type="text"></span>
          </li>
        </div>
      </div>
    </div>
  </div>
</section>
