{% if page.modules %}
  {% for module in page.modules | sort(attribute='order') %}
    {% if module.data is mapping or (module.type == 'hero_banner' and module.data is iterable and module.data is not string) %}
      <div class="builder-module" data-builder-module-index="{{ loop.index0 }}" data-builder-module-type="{{ module.type }}" data-builder-page-key="{{ page_key }}">
        {{- render_block(module) }}
      </div>
    {% endif %}
  {% endfor %}
{% endif %}
