{# 流程步骤 — 纵向时间轴变体 #}
<section data-name="process_steps" data-type="group" data-hideable class="section">
  <div class="container">
    <div class="section-header">
      <h2 data-name="heading" data-type="text" class="section-title">流程步骤</h2>
      <p data-name="subheading" data-type="text" class="section-description">区块副标题</p>
    </div>
    <div data-name="steps" data-type="list" class="ps-track ps-track--vertical">
      <div data-name="step" data-type="group" class="ps-step">
        <div class="ps-marker">
          <div data-name="icon" data-type="icon" class="ps-icon"></div>
        </div>
        <div class="ps-body">
          <h3 data-name="title" data-type="text" class="ps-title">步骤标题</h3>
          <p data-name="desc" data-type="textarea" class="ps-desc">步骤说明文字</p>
        </div>
      </div>
    </div>
  </div>
</section>
