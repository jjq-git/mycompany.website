name: 产品网格
category: data
icon: product_grid.svg
description: 从产品数据集自动拉取产品卡片，支持价格、筛选和分页
fields:
  - key: max_items
    label: 最大显示数量
    type: number
    group: 数据
    default: 12
  - key: show_filters
    label: 显示筛选
    type: select
    group: 筛选
    default: "true"
    options:
      - value: "true"
        label: 显示
      - value: "false"
        label: 隐藏
  - key: show_pagination
    label: 显示分页
    type: select
    group: 分页
    default: "true"
    options:
      - value: "true"
        label: 显示
      - value: "false"
        label: 隐藏
  - key: pagination_style
    label: 分页样式
    type: select
    group: 分页
    default: "load_more"
    options:
      - value: "load_more"
        label: 加载更多
      - value: "page_numbers"
        label: 页码导航
  - key: items_per_page
    label: 每页条数
    type: select
    group: 分页
    default: "6"
    options:
      - value: "3"
        label: 3 条/页
      - value: "4"
        label: 4 条/页
      - value: "6"
        label: 6 条/页
      - value: "8"
        label: 8 条/页
      - value: "10"
        label: 10 条/页
      - value: "12"
        label: 12 条/页
      - value: "18"
        label: 18 条/页
      - value: "24"
        label: 24 条/页
  - key: show_view_all
    label: 显示"查看全部"按钮
    type: select
    group: 分页
    default: "true"
    options:
      - value: "true"
        label: 显示
      - value: "false"
        label: 隐藏
  - key: pager_align
    label: 分页对齐
    type: select
    group: 分页
    default: "center"
    options:
      - value: "center"
        label: 居中
      - value: "left"
        label: 居左
      - value: "right"
        label: 居右
  - key: section_bg
    label: 外层背景色
    type: color
    group: 外层样式
    default: ""
    placeholder: 如 #f5f7fa
  - key: outer_width
    label: 外层宽度
    type: text
    group: 外层样式
    default: ""
  - key: inner_width
    label: 内层宽度
    type: text
    group: 外层样式
    default: ""
  - key: padding_top
    label: 上内边距
    type: text
    group: 外层样式
    default: "1rem"
  - key: padding_right
    label: 右内边距
    type: text
    group: 外层样式
    default: ""
  - key: padding_bottom
    label: 下内边距
    type: text
    group: 外层样式
    default: "1rem"
  - key: padding_left
    label: 左内边距
    type: text
    group: 外层样式
    default: ""
  - key: title
    label: 区块标题
    type: text
    group: 内容
    default: 产品展示
