name: 产品网格
category: data
icon: product_grid.svg
description: 从产品数据集自动拉取产品卡片展示
fields:
  - key: section_bg
    label: 外层背景色
    type: text
    default: ""
    placeholder: 如 #f5f7fa（留空=使用默认）
  - key: inner_width
    label: 内层内容区宽度
    type: text
    default: ""
    placeholder: 如 1200px（留空=全宽）
  - key: title
    label: 区块标题
    type: text
  - key: dataset
    label: 数据来源
    type: select
    options:
      - value: products
        label: 产品
