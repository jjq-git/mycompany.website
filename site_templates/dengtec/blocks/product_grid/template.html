<section data-name="product_grid" data-type="group" data-hideable class="section">
  <div class="container">
    <div class="section-header">
      <h2 data-name="title" data-type="text" class="section-title">产品展示</h2>
    </div>
    <div data-name="items" data-type="list" data-source="products" data-page-size="6" class="dg-list">
      <a data-name="item" data-type="group" data-href-template="{base_url}/{lang}/products/{slug}/" class="dg-card">
        <div class="dg-card-image">
          <img data-name="cover" data-type="image" src="" alt="" loading="lazy">
          <span data-name="category" data-type="text" class="dg-card-category">分类</span>
        </div>
        <div class="dg-card-body">
          <h3 data-name="name" data-type="text" class="dg-card-title">产品名称</h3>
          <p data-name="summary" data-type="text" class="dg-card-desc">产品简介</p>
        </div>
      </a>
    </div>
    <div class="text-center" style="margin-top: 2rem;">
      <a data-href-template="{base_url}/{lang}/products/" class="btn btn-primary">查看全部</a>
    </div>
  </div>
</section>
