name: 文本内容
category: content
icon: text_content.svg
description: 通用文本内容块，支持标题 + 多段落正文，适合公司介绍、团队介绍等大段文字
fields:
  - key: title
    label: 标题
    type: text
    group: 内容
    default: ""
  - key: subtitle
    label: 副标题
    type: text
    group: 内容
    default: ""
  - key: body
    label: 正文内容
    type: richtext
    group: 内容
    default: ""
  - key: text_align
    label: 文字排版
    type: select
    group: 文字排版
    default: "left"
    options:
      - value: "left"
        label: 居左
      - value: "center"
        label: 居中
      - value: "right"
        label: 居右
  - key: columns
    label: 分栏
    type: select
    group: 文字排版
    default: "1"
    options:
      - value: "1"
        label: 单栏
      - value: "2"
        label: 双栏
  - key: section_bg
    label: 外层背景色
    type: color
    group: 外层样式
    default: ""
    placeholder: 如 #f5f7fa（留空=透明）
  - key: outer_width
    label: 外层宽度
    type: text
    group: 外层样式
    default: ""
    placeholder: 如 1200px（留空使用全局宽度）
  - key: inner_width
    label: 内层内容区宽度
    type: text
    group: 外层样式
    default: ""
    placeholder: 如 800px（留空=全宽）
  - key: margin_top
    label: 上外边距
    type: text
    group: 外层样式
    default: ""
    placeholder: 如 2rem（留空=默认）
  - key: margin_right
    label: 右外边距
    type: text
    group: 外层样式
    default: ""
    placeholder: 如 2rem（留空=默认）
  - key: margin_bottom
    label: 下外边距
    type: text
    group: 外层样式
    default: ""
    placeholder: 如 2rem（留空=默认）
  - key: margin_left
    label: 左外边距
    type: text
    group: 外层样式
    default: ""
    placeholder: 如 2rem（留空=默认）
  - key: padding_top
    label: 上内边距
    type: text
    group: 内层样式
    default: "1rem"
    placeholder: 如 2rem（留空=默认）
  - key: padding_right
    label: 右内边距
    type: text
    group: 内层样式
    default: ""
    placeholder: 如 2rem（留空=默认）
  - key: padding_bottom
    label: 下内边距
    type: text
    group: 内层样式
    default: "1rem"
    placeholder: 如 2rem（留空=默认）
  - key: padding_left
    label: 左内边距
    type: text
    group: 内层样式
    default: ""
    placeholder: 如 2rem（留空=默认）
  - key: title_size
    label: 标题字号
    type: text
    group: 文字样式
    default: "1.75rem"
    placeholder: 如 2rem（留空=CSS 默认 1.75rem）
  - key: title_color
    label: 标题颜色
    type: color
    group: 文字样式
    default: "#1e293b"
    placeholder: 如 #1e293b（留空=CSS 默认深色）
  - key: body_size
    label: 正文字号
    type: text
    group: 文字样式
    default: "1rem"
    placeholder: 如 1rem（留空=CSS 默认 1rem）
  - key: body_color
    label: 正文字色
    type: color
    group: 文字样式
    default: "#475569"
    placeholder: 如 #475569（留空=CSS 默认灰色）
variants:
  - key: default
    label: 标准宽度
  - key: narrow
    label: 窄栏（适合阅读）
