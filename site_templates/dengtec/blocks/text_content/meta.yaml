name: 文本内容
category: content
icon: text_content.svg
description: 通用文本内容块，支持标题 + 多段落正文，适合公司介绍、团队介绍等大段文字
fields:
  - key: section_bg
    label: 外层背景色
    type: text
    default: ""
    placeholder: 如 #f5f7fa（留空=透明）
  - key: inner_width
    label: 内层内容区宽度
    type: text
    default: ""
    placeholder: 如 800px（留空=全宽）
  - key: text_align
    label: 文字排版
    type: select
    default: "left"
    options:
      - value: "left"
        label: 居左
      - value: "center"
        label: 居中
  - key: margin_top
    label: 上间距
    type: text
    default: ""
    placeholder: 如 2rem（留空=默认）
  - key: margin_bottom
    label: 下间距
    type: text
    default: ""
    placeholder: 如 2rem（留空=默认）
  - key: title
    label: 标题
    type: text
    default: ""
  - key: title_size
    label: 标题字号
    type: text
    default: ""
    placeholder: 如 2rem（留空=默认）
  - key: title_color
    label: 标题颜色
    type: text
    default: ""
    placeholder: 如 #1e293b（留空=默认深色）
  - key: body
    label: 正文内容
    type: textarea
    default: ""
  - key: body_size
    label: 正文字号
    type: text
    default: ""
    placeholder: 如 1rem（留空=默认）
  - key: body_color
    label: 正文字色
    type: text
    default: ""
    placeholder: 如 #475569（留空=默认灰色）
  - key: columns
    label: 分栏
    type: select
    default: "1"
    options:
      - value: "1"
        label: 单栏
      - value: "2"
        label: 双栏
variants:
  - key: default
    label: 标准宽度
  - key: narrow
    label: 窄栏（适合阅读）
