  <rect x="690" y="906" width="16" height="12" fill="#067a7a" rx="2"/>
  <text x="718" y="917" font-size="16" fill="#666">hl-tag / 按钮</text>
  <rect x="850" y="906" width="16" height="12" fill="none" stroke="#f1c40f" stroke-width="1"/>
