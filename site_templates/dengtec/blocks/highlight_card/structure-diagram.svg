  <text x="1210" y="712" font-size="15" fill="#555">text_bg / text_color</text>
  <text x="1210" y="729" font-size="15" fill="#555">text_padding / gap / align</text>
  <rect x="16" y="766" width="282" height="90" fill="#fff" stroke="#27ae60" stroke-width="1.2" rx="4"/>
