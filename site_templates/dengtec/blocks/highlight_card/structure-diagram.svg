  <text x="140" y="110" font-size="15" fill="#888">outer_width (max-width) / margin_top / margin_bottom</text>

  <!-- padding -->
  <rect x="15" y="98" width="1470" height="22" fill="rgba(231,76,60,0.13)" stroke="rgba(231,76,60,0.25)" stroke-width="0.5"/>
  <text x="750" y="115" text-anchor="middle" font-size="15" fill="#c0392b" font-weight="bold">padding_top</text>
  <rect x="15" y="632" width="1470" height="22" fill="rgba(231,76,60,0.13)" stroke="rgba(231,76,60,0.25)" stroke-width="0.5"/>
  <text x="750" y="649" text-anchor="middle" font-size="15" fill="#c0392b" font-weight="bold">padding_bottom</text>
  <rect x="15" y="120" width="22" height="512" fill="rgba(231,76,60,0.13)" stroke="rgba(231,76,60,0.25)" stroke-width="0.5"/>
  <text x="26" y="396" text-anchor="middle" font-size="15" fill="#c0392b" font-weight="bold" transform="rotate(-90, 26, 396)">padding_left</text>
  <rect x="1463" y="120" width="22" height="512" fill="rgba(231,76,60,0.13)" stroke="rgba(231,76,60,0.25)" stroke-width="0.5"/>
  <text x="1474" y="396" text-anchor="middle" font-size="15" fill="#c0392b" font-weight="bold" transform="rotate(90, 1474, 396)">padding_right</text>

