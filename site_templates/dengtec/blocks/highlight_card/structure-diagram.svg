  <text x="170" y="184" font-size="15" fill="#888">border_radius / grid_background</text>

  <rect x="700" y="170" width="165" height="22" fill="#fff" stroke="#e67e22" stroke-width="0.6" rx="3"/>
  <text x="782" y="186" text-anchor="middle" font-size="15" fill="#e67e22" font-weight="bold">image_position</text>

