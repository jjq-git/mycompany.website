<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 750" width="1500" height="750">
  <defs>
    <marker id="aD" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto"><path d="M0,1 L3.5,6 L7,1" fill="#e74c3c"/></marker>
    <marker id="aU" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto"><path d="M0,6 L3.5,1 L7,6" fill="#e74c3c"/></marker>
    <linearGradient id="imgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d5dbe3"/><stop offset="100%" stop-color="#bcc3cc"/>
    </linearGradient>
  </defs>

  <style>
    text { font-family: "Microsoft YaHei","PingFang SC",sans-serif; }
  </style>

  <!-- 画布 -->
  <rect x="0" y="0" width="1500" height="750" fill="#ffffff" rx="4"/>

  <!-- 标题栏 -->
  <rect x="0" y="0" width="1500" height="44" fill="#f0f2f5" rx="4"/>
  <text x="750" y="27" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a1a2e">highlight_card — HTML 骨架 与 属性映射</text>

  <!-- ============================================================ -->
  <!-- 左侧标注列 -->
  <!-- ============================================================ -->
  <rect x="5" y="52" width="183" height="668" fill="#f7f8fa" stroke="#d5d8de" stroke-width="0.8" rx="3"/>
  <text x="96" y="68" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">属性字段</text>
  <line x1="15" y1="76" x2="177" y2="76" stroke="#e0e3e8" stroke-width="0.5"/>

  <!-- 1. section -->
  <rect x="12" y="86" width="170" height="52" fill="#fff" stroke="#5b8def" stroke-width="1" rx="4"/>
  <text x="22" y="102" font-size="10" fill="#3b6fd4" font-weight="bold">section / container</text>
  <text x="22" y="116" font-size="9.5" fill="#555">section_bg : background</text>
  <text x="22" y="130" font-size="9.5" fill="#555">outer_width / inner_width</text>
  <text x="22" y="144" font-size="9.5" fill="#555">margin_top / margin_bottom</text>

  <!-- 2. padding -->
  <rect x="12" y="152" width="170" height="24" fill="#fff" stroke="#e74c3c" stroke-width="1" rx="4"/>
  <text x="22" y="169" font-size="9.5" fill="#c0392b" font-weight="bold">padding_top / right / bottom / left</text>

  <!-- 3. hl-grid -->
  <rect x="12" y="190" width="170" height="48" fill="#fff" stroke="#e67e22" stroke-width="1" rx="4"/>
  <text x="22" y="206" font-size="10" fill="#b8601f" font-weight="bold">.hl-grid 容器</text>
  <text x="22" y="220" font-size="9.5" fill="#555">image_position : 图文位置</text>
  <text x="22" y="234" font-size="9.5" fill="#555">content_gap / grid_background / radius</text>

  <!-- 4. hl-image -->
  <rect x="12" y="252" width="170" height="52" fill="#fff" stroke="#6c5ce7" stroke-width="1" rx="4"/>
  <text x="22" y="268" font-size="10" fill="#5b4bc4" font-weight="bold">.hl-image 图片侧</text>
  <text x="22" y="282" font-size="9.5" fill="#555">image_width / height / radius / bg</text>
  <text x="22" y="296" font-size="9.5" fill="#555">image_fit / aspect_ratio</text>
  <text x="22" y="310" font-size="9.5" fill="#555">image_opacity / position_obj</text>

  <!-- 5. hl-text -->
  <rect x="12" y="318" width="170" height="40" fill="#fff" stroke="#0984e3" stroke-width="1" rx="4"/>
  <text x="22" y="334" font-size="10" fill="#0767b3" font-weight="bold">.hl-text 文字侧</text>
  <text x="22" y="348" font-size="9.5" fill="#555">text_bg / text_color / padding / gap</text>
  <text x="22" y="362" font-size="9.5" fill="#555">text_align / text_justify</text>

  <!-- 6. hl-tag -->
  <rect x="12" y="372" width="170" height="36" fill="#fff" stroke="#27ae60" stroke-width="1" rx="4"/>
  <text x="22" y="388" font-size="10" fill="#1e7a45" font-weight="bold">.hl-tag 标签</text>
  <text x="22" y="402" font-size="9.5" fill="#555">tag_bg / color / size / weight / radius / padding</text>

  <!-- 7. hl-title -->
  <rect x="12" y="422" width="170" height="36" fill="#fff" stroke="#e85d5d" stroke-width="1" rx="4"/>
  <text x="22" y="438" font-size="10" fill="#c0392b" font-weight="bold">.hl-title 标题</text>
  <text x="22" y="452" font-size="9.5" fill="#555">title_size / color / weight / line_height</text>

  <!-- 8. hl-desc -->
  <rect x="12" y="472" width="170" height="36" fill="#fff" stroke="#e8963b" stroke-width="1" rx="4"/>
  <text x="22" y="488" font-size="10" fill="#b87020" font-weight="bold">.hl-desc 描述</text>
  <text x="22" y="502" font-size="9.5" fill="#555">desc_size / color / weight / line_height</text>

  <!-- 9. hl-features -->
  <rect x="12" y="522" width="170" height="36" fill="#fff" stroke="#f1c40f" stroke-width="1" rx="4"/>
  <text x="22" y="538" font-size="10" fill="#b8950e" font-weight="bold">.hl-features 功能列表</text>
  <text x="22" y="552" font-size="9.5" fill="#555">features_color / size / gap / icon_color</text>

  <!-- 10. hl-actions + btn -->
  <rect x="12" y="572" width="170" height="58" fill="#fff" stroke="#2ecc71" stroke-width="1" rx="4"/>
  <text x="22" y="588" font-size="10" fill="#1e7a45" font-weight="bold">.hl-actions + 按钮</text>
  <text x="22" y="602" font-size="9.5" fill="#555">actions_gap / align / wrap</text>
  <text x="22" y="616" font-size="9.5" fill="#555">btn_bg / color / size / weight</text>
  <text x="22" y="630" font-size="9.5" fill="#555">btn_radius / padding / hover_*</text>

  <!-- ============================================================ -->
  <!-- 右侧结构区 -->
  <!-- ============================================================ -->

  <!-- section -->
  <rect x="210" y="56" width="1260" height="640" fill="rgba(91,141,239,0.035)" stroke="#5b8def" stroke-width="2" stroke-dasharray="10 4" rx="4"/>
  <text x="222" y="106" font-size="10" fill="#3b6fd4" font-weight="bold">section_bg</text>
  <text x="320" y="106" font-size="9.5" fill="#888">outer_width (max-width)</text>

  <!-- margin 标注 -->
  <line x1="210" y1="60" x2="210" y2="52" stroke="#5b8def" stroke-width="1" marker-end="url(#aU)"/>
  <line x1="380" y1="64" x2="380" y2="76" stroke="#5b8def" stroke-width="0.8"/>
  <text x="270" y="62" font-size="9" fill="#3b6fd4">margin_top</text>
  <text x="285" y="72" font-size="8" fill="#888">margin_bottom</text>

  <!-- ==================== padding ==================== -->
  <rect x="210" y="98" width="1260" height="18" fill="rgba(231,76,60,0.13)" stroke="rgba(231,76,60,0.25)" stroke-width="0.5"/>
  <text x="840" y="111" text-anchor="middle" font-size="9" fill="#c0392b" font-weight="bold">padding_top</text>

  <rect x="210" y="678" width="1260" height="18" fill="rgba(231,76,60,0.13)" stroke="rgba(231,76,60,0.25)" stroke-width="0.5"/>
  <text x="840" y="691" text-anchor="middle" font-size="9" fill="#c0392b" font-weight="bold">padding_bottom</text>

  <rect x="210" y="116" width="18" height="562" fill="rgba(231,76,60,0.13)" stroke="rgba(231,76,60,0.25)" stroke-width="0.5"/>
  <text x="219" y="420" text-anchor="middle" font-size="9" fill="#c0392b" font-weight="bold" transform="rotate(-90, 219, 420)">padding_left</text>

  <rect x="1452" y="116" width="18" height="562" fill="rgba(231,76,60,0.13)" stroke="rgba(231,76,60,0.25)" stroke-width="0.5"/>
  <text x="1461" y="420" text-anchor="middle" font-size="9" fill="#c0392b" font-weight="bold" transform="rotate(90, 1461, 420)">padding_right</text>

  <!-- ==================== .container ==================== -->
  <rect x="240" y="124" width="1200" height="546" fill="none" stroke="#27ae60" stroke-width="1" stroke-dasharray="6 4" rx="3"/>
  <text x="252" y="140" font-size="11" fill="#1e7a45" font-weight="bold">.container</text>
  <text x="360" y="140" font-size="9.5" fill="#888">inner_width (max-width)</text>

  <!-- ==================== .hl-grid ==================== -->
  <rect x="252" y="150" width="1176" height="510" fill="none" stroke="#e67e22" stroke-width="1.3" rx="4"/>
  <text x="266" y="168" font-size="11" fill="#b8601f" font-weight="bold">.hl-grid</text>
  <text x="350" y="168" font-size="9" fill="#888">border_radius / grid_background</text>

  <!-- image_position 标注 -->
  <rect x="860" y="156" width="140" height="18" fill="#fff" stroke="#e67e22" stroke-width="0.6" rx="3"/>
  <text x="930" y="169" text-anchor="middle" font-size="9" fill="#e67e22" font-weight="bold">image_position</text>

  <!-- ===== 双栏分隔 ===== -->
  <line x1="870" y1="180" x2="870" y2="650" stroke="#ccc" stroke-width="1" stroke-dasharray="5 4"/>

  <!-- content_gap 标注 -->
  <line x1="835" y1="180" x2="835" y2="172" stroke="#e67e22" stroke-width="1" marker-end="url(#aU)"/>
  <line x1="905" y1="180" x2="905" y2="172" stroke="#e67e22" stroke-width="1" marker-end="url(#aU)"/>
  <text x="870" y="169" text-anchor="middle" font-size="9" fill="#e67e22" font-weight="bold">content_gap</text>

  <!-- ==================== 左栏：hl-image ==================== -->
  <rect x="262" y="182" width="565" height="468" fill="none" stroke="#6c5ce7" stroke-width="1" rx="3"/>
  <text x="276" y="200" font-size="10" fill="#5b4bc4" font-weight="bold">.hl-image</text>

  <!-- 图片 -->
  <rect x="282" y="212" width="530" height="420" fill="url(#imgGrad)" rx="5"/>
  <text x="547" y="415" text-anchor="middle" font-size="13" fill="rgba(0,0,0,0.22)">产品图片</text>
  <text x="547" y="432" text-anchor="middle" font-size="9" fill="rgba(0,0,0,0.15)">image_width / height / fit / radius / bg / opacity</text>

  <!-- aspect_ratio 标注 -->
  <text x="282" y="645" font-size="9" fill="#888">aspect_ratio / position_obj</text>

  <!-- ==================== 右栏：hl-text ==================== -->
  <rect x="910" y="182" width="510" height="468" fill="rgba(9,132,227,0.025)" stroke="#0984e3" stroke-width="1" rx="3"/>
  <text x="924" y="200" font-size="10" fill="#0767b3" font-weight="bold">.hl-text</text>
  <text x="990" y="200" font-size="9" fill="#888">text_bg / text_color / padding / gap / align / justify</text>

  <!-- hl-tag -->
  <rect x="924" y="218" width="100" height="22" fill="#067a7a" rx="4"/>
  <text x="974" y="233" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">分类标签</text>
  <text x="1035" y="233" font-size="8.5" fill="#888">.hl-tag</text>

  <!-- hl-title -->
  <rect x="924" y="252" width="482" height="48" fill="none" stroke="#f0d0d0" stroke-width="0.5" rx="2"/>
  <text x="1370" y="258" text-anchor="end" font-size="8" fill="#aaa">.hl-title</text>
  <text x="1406" y="280" text-anchor="end" font-size="16" fill="#1a1a2e" font-weight="bold">模块主标题</text>
  <text x="1406" y="296" text-anchor="end" font-size="9" fill="#888">title_size / color / weight / line_height</text>

  <!-- hl-desc -->
  <rect x="924" y="314" width="482" height="52" fill="none" stroke="#f0e0d0" stroke-width="0.5" rx="2"/>
  <text x="1370" y="320" text-anchor="end" font-size="8" fill="#aaa">.hl-desc</text>
  <text x="940" y="334" font-size="10" fill="#555">产品描述文字，补充说明标题内容，</text>
  <text x="940" y="350" font-size="10" fill="#555">展示更多细节和卖点。</text>

  <!-- hl-features -->
  <rect x="924" y="378" width="482" height="72" fill="none" stroke="#f8f0d0" stroke-width="0.5" rx="2"/>
  <text x="1370" y="384" text-anchor="end" font-size="8" fill="#aaa">.hl-features</text>
  <text x="940" y="399" font-size="10" fill="#333">✓ 功能特点 A</text>
  <text x="940" y="416" font-size="10" fill="#333">✓ 功能特点 B</text>
  <text x="940" y="433" font-size="10" fill="#333">✓ 功能特点 C</text>
  <text x="940" y="454" font-size="8" fill="#aaa">features_color / size / gap / icon_color / icon_size</text>

  <!-- hl-actions + buttons -->
  <rect x="924" y="462" width="482" height="52" fill="none" stroke="#d0f0d0" stroke-width="0.5" rx="2"/>
  <text x="1370" y="468" text-anchor="end" font-size="8" fill="#aaa">.hl-actions</text>

  <rect x="960" y="474" width="105" height="30" fill="#067a7a" rx="5"/>
  <text x="1012" y="494" text-anchor="middle" font-size="9.5" fill="#fff" font-weight="bold">主按钮</text>

  <rect x="1080" y="474" width="105" height="30" fill="none" stroke="#067a7a" stroke-width="1.5" rx="5"/>
  <text x="1132" y="494" text-anchor="middle" font-size="9.5" fill="#067a7a">副按钮</text>

  <text x="1200" y="494" font-size="8" fill="#aaa">.hl-btn--primary  .hl-btn--secondary</text>
  <text x="960" y="516" font-size="8" fill="#aaa">btn_bg / color / size / weight / radius / padding / hover_*</text>

  <!-- ============================================================ -->
  <!-- 图例 -->
  <!-- ============================================================ -->
  <rect x="210" y="706" width="1260" height="32" fill="#f0f2f5" stroke="#d5d8de" stroke-width="0.6" rx="4"/>
  <rect x="228" y="716" width="14" height="11" fill="rgba(231,76,60,0.18)" stroke="#e74c3c" stroke-width="0.5"/>
  <text x="248" y="726" font-size="10" fill="#666">padding</text>
  <rect x="320" y="716" width="14" height="11" fill="none" stroke="#5b8def" stroke-width="1.5"/>
  <text x="340" y="726" font-size="10" fill="#666">section</text>
  <rect x="430" y="716" width="14" height="11" fill="none" stroke="#e67e22" stroke-width="1.3"/>
  <text x="450" y="726" font-size="10" fill="#666">hl-grid</text>
  <rect x="540" y="716" width="14" height="11" fill="none" stroke="#6c5ce7" stroke-width="1.2"/>
  <text x="560" y="726" font-size="10" fill="#666">hl-image</text>
  <rect x="660" y="716" width="14" height="11" fill="none" stroke="#0984e3" stroke-width="1.2"/>
  <text x="680" y="726" font-size="10" fill="#666">hl-text</text>
  <rect x="780" y="716" width="14" height="11" fill="#067a7a" rx="2"/>
  <text x="800" y="726" font-size="10" fill="#666">hl-tag / 按钮</text>
  <rect x="920" y="716" width="14" height="11" fill="none" stroke="#f1c40f" stroke-width="1"/>
  <text x="940" y="726" font-size="10" fill="#666">hl-features</text>
</svg>