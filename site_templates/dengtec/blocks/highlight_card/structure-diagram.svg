  <text x="322" y="788" font-size="16" fill="#c0392b" font-weight="bold">.hl-title 标题</text>
  <text x="322" y="808" font-size="15" fill="#555">title_size / color</text>
  <text x="322" y="825" font-size="15" fill="#555">title_weight / line_height</text>
  <rect x="608" y="766" width="282" height="90" fill="#fff" stroke="#e8963b" stroke-width="1.2" rx="4"/>
  <text x="618" y="788" font-size="16" fill="#b87020" font-weight="bold">.hl-desc 描述</text>
  <text x="618" y="808" font-size="15" fill="#555">desc_size / color</text>
  <text x="618" y="825" font-size="15" fill="#555">desc_weight / line_height</text>
  <rect x="904" y="766" width="282" height="90" fill="#fff" stroke="#f1c40f" stroke-width="1.2" rx="4"/>
  <text x="914" y="788" font-size="16" fill="#b8950e" font-weight="bold">.hl-features 功能列表</text>
  <text x="914" y="808" font-size="15" fill="#555">features_color / size</text>
  <text x="914" y="825" font-size="15" fill="#555">features_gap / icon_color</text>
