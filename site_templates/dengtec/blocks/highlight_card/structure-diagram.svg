<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 940" width="1500" height="940">
  <defs>
    <marker id="aD" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto"><path d="M0,1 L3.5,6 L7,1" fill="#e74c3c"/></marker>
    <marker id="aU" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto"><path d="M0,6 L3.5,1 L7,6" fill="#e74c3c"/></marker>
    <linearGradient id="imgG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d5dbe3"/><stop offset="100%" stop-color="#bcc3cc"/>
    </linearGradient>
  </defs>
  <style>text{font-family:"Microsoft YaHei","PingFang SC",sans-serif}</style>

  <rect x="0" y="0" width="1500" height="900" fill="#fff" rx="4"/>
  <rect x="0" y="0" width="1500" height="50" fill="#f0f2f5" rx="4"/>
  <text x="750" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a1a2e">highlight_card — HTML 骨架 与 属性映射</text>

  <!-- section -->
  <rect x="15" y="58" width="1470" height="596" fill="rgba(91,141,239,0.035)" stroke="#5b8def" stroke-width="2" stroke-dasharray="10 4" rx="4"/>
