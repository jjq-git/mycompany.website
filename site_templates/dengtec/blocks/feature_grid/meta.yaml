name: 功能特色网格
category: content
description: 展示服务/功能亮点，图标+标题+描述。功能卡片在模块编辑器中直接管理。
fields:
  - key: title
    label: 区块标题
    type: text
    group: 内容
    default: ""
  - key: subtitle
    label: 区块副标题
    type: text
    group: 内容
  - key: section_bg
    label: 外层背景色
    type: color
    group: 外层样式
    default: ""
    placeholder: 如 #f5f7fa（留空=使用默认）
  - key: outer_width
    label: 外层宽度
    type: text
    group: 外层样式
    default: ""
    placeholder: 如 1200px（留空使用全局宽度）
  - key: inner_width
    label: 内层内容区宽度
    type: text
    group: 内层样式
    default: ""
    placeholder: 如 1200px（留空=全宽）
  - key: padding_top
    label: 上内边距
    type: text
    group: 外层样式
    default: "1rem"
    placeholder: 如 2rem（留空=默认）
  - key: padding_right
    label: 右内边距
    type: text
    group: 外层样式
    default: ""
    placeholder: 如 2rem（留空=默认）
  - key: padding_bottom
    label: 下内边距
    type: text
    group: 外层样式
    default: "1rem"
    placeholder: 如 2rem（留空=默认）
  - key: padding_left
    label: 左内边距
    type: text
    group: 外层样式
    default: ""
    placeholder: 如 2rem（留空=默认）
  - key: margin_top
    label: 外层上外边距
    type: text
    group: 外层样式
    default: ""
    placeholder: 如 40px
  - key: margin_right
    label: 外层右外边距
    type: text
    group: 外层样式
    default: ""
    placeholder: 如 40px
  - key: margin_bottom
    label: 外层下外边距
    type: text
    group: 外层样式
    default: ""
    placeholder: 如 40px
  - key: margin_left
    label: 外层左外边距
    type: text
    group: 外层样式
    default: ""
    placeholder: 如 40px
  - key: card_show_border
    label: 显示卡片边框
    type: select
    group: 卡片样式
    default: ""
    options:
      - value: ""
        label: 默认（显示）
      - value: "0"
        label: 隐藏边框
  - key: card_padding_top
    label: 卡片上内边距
    type: text
    group: 卡片样式
    default: ""
    placeholder: 如 24px
  - key: card_padding_right
    label: 卡片右内边距
    type: text
    group: 卡片样式
    default: ""
    placeholder: 如 24px
  - key: card_padding_bottom
    label: 卡片下内边距
    type: text
    group: 卡片样式
    default: ""
    placeholder: 如 24px
  - key: card_padding_left
    label: 卡片左内边距
    type: text
    group: 卡片样式
    default: ""
    placeholder: 如 24px
  - key: card_radius_top_left
    label: 卡片左上圆角
    type: text
    group: 卡片样式
    default: ""
    placeholder: 如 12px
  - key: card_radius_top_right
    label: 卡片右上圆角
    type: text
    group: 卡片样式
    default: ""
    placeholder: 如 12px
  - key: card_radius_bottom_right
    label: 卡片右下圆角
    type: text
    group: 卡片样式
    default: ""
    placeholder: 如 12px
  - key: card_radius_bottom_left
    label: 卡片左下圆角
    type: text
    group: 卡片样式
    default: ""
    placeholder: 如 12px
  - key: features
    label: 功能卡片列表
    type: list
    group: 功能卡片
    item_label: 功能卡片
    item_fields:
      - key: icon
        label: 图标
        type: icon
      - key: title
        label: 标题
        type: text
      - key: desc
        label: 描述
        type: textarea
