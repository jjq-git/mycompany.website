<text x="1006" y="1133" font-size="14" fill="#555">icon → 图标 (20种可选)</text>
<text x="1006" y="1150" font-size="14" fill="#555">title → 卡片标题</text>
<text x="1006" y="1167" font-size="14" fill="#555">desc → 卡片描述</text>
<text x="1006" y="1184" font-size="13" fill="#999">显示条件: features 非空时渲染 .services-grid</text>
