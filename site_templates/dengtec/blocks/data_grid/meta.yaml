name: 数据网格
category: data
icon: data_grid.svg
description: 通用数据列表模块，从数据集拉取条目展示为卡片
fields:
  - key: title
    label: 区块标题
    type: text
  - key: dataset
    label: 数据来源
    type: select
    options:
      - value: portfolio
        label: 项目案例
      - value: posts
        label: 博客文章
      - value: products
        label: 产品
  - key: max_items
    label: 最大显示数量
    type: number
    default: 6
  - key: columns
    label: 每行列数
    type: select
    options:
      - value: "3"
        label: "3列"
      - value: "4"
        label: "4列"
  - key: show_view_all
    label: 显示"查看全部"按钮
    type: boolean
    default: true
variants:
  - key: grid_3
    label: 三列网格（标准）
  - key: grid_4
    label: 四列网格
  - key: cards_row
    label: 横向卡片