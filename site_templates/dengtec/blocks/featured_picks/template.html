<!-- 精选推荐模块 - 轮播布局，参考图片轮播模块实现 -->
<section data-name="featured_picks" data-type="group" data-hideable
  data-style="cols,dir,card-gap,card-bg,card-radius,badge-bg,badge-color,bg,bg-color"
  class="section fp-section">
  <div class="container">
    <div class="section-header">
      <h2 data-name="title" data-type="text" class="section-title">精选推荐</h2>
      <p data-name="desc" data-type="textarea" class="section-description"></p>
    </div>

    <div class="fp-viewport">
      <div data-name="items" data-type="list" class="fp-track">
        <a data-name="item" data-type="group" data-href="link" class="fp-card" target="_blank" rel="noopener">
          <div class="fp-card-img-wrap">
            <img data-name="image" data-type="image" src="" alt="" loading="lazy" class="fp-card-img">
          </div>
          <div class="fp-card-body">
            <span data-name="badge" data-type="text" class="fp-badge"></span>
            <span data-name="badge_color" data-type="text" class="fp-badge-color-val" hidden></span>
            <span data-name="badge_bg" data-type="text" class="fp-badge-bg-val" hidden></span>
            <h3 data-name="title" data-type="text" class="fp-card-title">卡片标题</h3>
            <p data-name="desc" data-type="textarea" class="fp-card-desc">卡片描述文字，简要介绍推荐内容</p>
            <span data-name="link" data-type="url" class="fp-link-val" hidden></span>
            <span class="fp-card-link-text"><span data-i18n="actions.learnMore">了解更多</span><span aria-hidden="true">→</span></span>
          </div>
        </a>
      </div>
    </div>

    <div class="fp-dots"></div>
    <div class="fp-config" hidden>
      <span data-name="auto_scroll" data-type="text" class="fp-cfg-auto">true</span>
      <span data-name="scroll_interval" data-type="text" class="fp-cfg-interval">4</span>
      <span data-name="show_dots" data-type="text" class="fp-cfg-dots">true</span>
    </div>
  </div>

  <script>
    (function(){
      var section = document.currentScript.parentElement;

      function applyLayout() {
        var style = section.getAttribute('style') || '';
        var layout = 'column';
        var m = style.match(/--dir:\s*(\S+?)(?:;|$)/);
        if (m) {
          var raw = m[1].replace(/['"]/g, '').replace(/;.*$/, '').trim();
          if (raw) layout = raw;
        }
        section.querySelectorAll('.fp-card').forEach(function(card) {
          card.classList.toggle('fp-card--left', layout === 'row');
          card.classList.toggle('fp-card--right', layout === 'row-reverse');
        });
      }

      function applyBadgeOverrides() {
        section.querySelectorAll('.fp-card').forEach(function(card) {
          var badge = card.querySelector('.fp-badge');
          var colorEl = card.querySelector('.fp-badge-color-val');
          var bgEl = card.querySelector('.fp-badge-bg-val');
          if (!badge) return;
          var text = (badge.textContent || '').trim();
          if (!text) { badge.style.display = 'none'; return; }
          badge.style.display = '';
          if (colorEl && colorEl.textContent.trim()) badge.style.color = colorEl.textContent.trim();
          if (bgEl && bgEl.textContent.trim()) badge.style.background = bgEl.textContent.trim();
          if (colorEl) colorEl.remove();
          if (bgEl) bgEl.remove();
        });
      }

      section.querySelectorAll('.fp-card').forEach(function(card) {
        var href = card.getAttribute('href');
        if (!href || href === '#' || href === '/') {
          card.removeAttribute('href'); card.removeAttribute('target'); card.style.cursor = 'default';
        }
      });

      var readCfg = function(cls, def) {
        var el = section.querySelector('.fp-cfg-' + cls);
        var v = el ? (el.textContent || '').trim() : '';
        return v || def;
      };

      // 每行张数：从 data-style --cols 读取，兜底 3
      var perRow = 3;
      var styleAttr = section.getAttribute('style') || '';
      var cm = styleAttr.match(/--cols:\s*(\S+?)(?:;|$)/);
      if (cm) {
        var rawCols = parseInt(cm[1].replace(/['"]/g, '').trim());
        if (rawCols >= 1 && rawCols <= 6) perRow = rawCols;
      }
      var autoScroll = readCfg('auto', 'true') !== 'false';
      var intervalMs = (parseInt(readCfg('interval', '4')) || 4) * 1000;
      var showDots = readCfg('dots', 'true') !== 'false';

      var track = section.querySelector('.fp-track');
      var cards = track.querySelectorAll('.fp-card');
      var dotsContainer = section.querySelector('.fp-dots');
      var arrowLeft = section.querySelector('.fp-arrow--left');
      var arrowRight = section.querySelector('.fp-arrow--right');
      var total = cards.length;
      if (!total) { applyLayout(); applyBadgeOverrides(); return; }

      perRow = Math.min(perRow, total);
      var totalPages = Math.max(1, total - perRow + 1);
      var current = 0;
      var autoTimer = null;

      // ── CSS gap 值（dengtec: 1.5rem = 24px 默认，与 CSS --fp-card-gap 一致）──
      var gapPx = 24;

      // 每张卡片 = 均分视口宽度并扣除 gap 占位
      var basisExpr = 'calc(' + (100/perRow).toFixed(4) + '% - ' + ((perRow-1)*gapPx/perRow) + 'px)';
      for (var i = 0; i < cards.length; i++) {
        cards[i].style.flex = '0 0 ' + basisExpr;
      }

      // 每次滑动 = 一张卡 + 一个 gap
      var stepPercent = (100/perRow).toFixed(4);
      var stepGap = (gapPx/perRow);

      if (showDots && totalPages > 1) {
        for (var i = 0; i < totalPages; i++) {
          var dot = document.createElement('button');
          dot.className = 'fp-dot';
          dot.setAttribute('aria-label', '第' + (i + 1) + '页');
          dot.addEventListener('click', (function(idx){ return function(){ goTo(idx); resetAutoScroll(); }; })(i));
          dotsContainer.appendChild(dot);
        }
      } else {
        dotsContainer.style.display = 'none';
      }

      if (totalPages <= 1) {
        if (arrowLeft) arrowLeft.style.display = 'none';
        if (arrowRight) arrowRight.style.display = 'none';
      }

      if (arrowLeft) arrowLeft.addEventListener('click', function(){ goTo(current > 0 ? current - 1 : totalPages - 1); resetAutoScroll(); });
      if (arrowRight) arrowRight.addEventListener('click', function(){ goTo(current < totalPages - 1 ? current + 1 : 0); resetAutoScroll(); });

      function updateUI() {
        track.style.transform = 'translateX(calc(' + (-current) + ' * (' + stepPercent + '% + ' + stepGap + 'px)))';
        dotsContainer.querySelectorAll('.fp-dot').forEach(function(d, i){ d.classList.toggle('fp-dot--active', i === current); });
        if (arrowLeft) arrowLeft.style.opacity = current === 0 ? '0.25' : '';
        if (arrowRight) arrowRight.style.opacity = current === totalPages - 1 ? '0.25' : '';
      }
      function goTo(i) { current = Math.max(0, Math.min(i, totalPages - 1)); updateUI(); }
      function next() { goTo(current < totalPages - 1 ? current + 1 : 0); }
      function startAutoScroll() { if (!autoScroll || totalPages <= 1) return; stopAutoScroll(); autoTimer = setInterval(next, intervalMs); }
      function stopAutoScroll() { if (autoTimer) { clearInterval(autoTimer); autoTimer = null; } }
      function resetAutoScroll() { stopAutoScroll(); startAutoScroll(); }

      var touchStartX = 0, touchStartY = 0;
      track.addEventListener('touchstart', function(e){
        touchStartX = e.touches[0].clientX; touchStartY = e.touches[0].clientY;
      }, {passive: true});
      track.addEventListener('touchend', function(e){
        var dx = e.changedTouches[0].clientX - touchStartX;
        var dy = e.changedTouches[0].clientY - touchStartY;
        if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 40) {
          if (dx < 0) goTo(Math.min(current + 1, totalPages - 1));
          else goTo(Math.max(current - 1, 0));
          resetAutoScroll();
        }
      });

      applyLayout();
      applyBadgeOverrides();
      updateUI();
      startAutoScroll();
    })();
  </script>
</section>
