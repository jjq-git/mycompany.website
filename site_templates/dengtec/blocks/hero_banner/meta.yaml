name: Hero Banner
category: content
icon: hero_banner.svg
description: 首页轮播大图模块，支持图片/视频，可配置标题、副标题、按钮
fields:
  - key: hero_width
    label: Banner 整体宽度
    type: text
    default: ""
    placeholder: 如 100%（留空=全宽）
  - key: hero_height
    label: Banner 整体高度
    type: text
    default: ""
    placeholder: 如 500px 或 77vh（留空=默认 77vh）
  - key: banner_align
    label: Banner 排版
    type: select
    options:
      - value: ""
        label: 默认（全宽）
      - value: center
        label: 居中
      - value: left
        label: 居左
      - value: right
        label: 居右
  - key: inner_width
    label: 内层内容区宽度
    type: text
    default: ""
    placeholder: 如 1200px（留空=全宽）
  - key: type
    label: 媒体类型
    type: select
    options:
      - value: image
        label: 图片
      - value: video
        label: 视频
  - key: media
    label: 媒体地址
    type: url
  - key: title
    label: 主标题
    type: text
  - key: subtitle
    label: 副标题
    type: text
  - key: primaryBtn
    label: 主按钮文字
    type: text
  - key: primaryBtnLink
    label: 主按钮链接
    type: url
  - key: primaryBtnLinkTarget
    label: 主按钮打开方式
    type: select
    options:
      - value: ""
        label: 当前页
      - value: _blank
        label: 新标签页
  - key: secondaryBtn
    label: 副按钮文字
    type: text
  - key: secondaryBtnLink
    label: 副按钮链接
    type: url
variants:
  - key: text_overlay
    label: 文字叠加（全宽）
  - key: split_left
    label: 左文右图（50:50）
  - key: split_right
    label: 左图右文（50:50）