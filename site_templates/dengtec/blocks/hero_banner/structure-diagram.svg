<text x="25" y="740" font-size="14" fill="#555">hero_width → max-width</text>
<text x="25" y="757" font-size="14" fill="#555">hero_height → height</text>
<text x="25" y="774" font-size="14" fill="#555">section_bg → background</text>
<text x="25" y="791" font-size="14" fill="#555">banner_align → 文字排版</text>
<text x="25" y="808" font-size="14" fill="#555">padding_top → padding-top</text>
<text x="25" y="825" font-size="14" fill="#555">padding_right → padding-right</text>
<text x="25" y="842" font-size="14" fill="#555">padding_bottom → padding-bottom</text>
<text x="25" y="859" font-size="14" fill="#555">padding_left → padding-left</text>
    <rect x="532" y="698" width="476" height="168" fill="#fff" stroke="#6b7d8e" stroke-width="1.2" rx="4"/>
<text x="542" y="720" font-size="16" fill="#6b7d8e" font-weight="bold">overlay 遮罩层 .hero-banner-overlay</text>
<text x="542" y="740" font-size="14" fill="#555">overlay_enabled → true / false (是否渲染)</text>
<text x="542" y="757" font-size="14" fill="#555">overlay_color → background</text>
<text x="542" y="774" font-size="14" fill="#555">overlay_opacity → opacity</text>
    <rect x="1049" y="698" width="476" height="168" fill="#fff" stroke="#e67e22" stroke-width="1.2" rx="4"/>
<text x="1059" y="720" font-size="16" fill="#e67e22" font-weight="bold">content 内容区 .hero-banner-content</text>
<text x="1059" y="740" font-size="14" fill="#555">content_width → max-width</text>
<text x="1059" y="757" font-size="14" fill="#555">content_max_width → max-width</text>
<text x="1059" y="774" font-size="14" fill="#555">content_padding → padding</text>
<text x="1059" y="791" font-size="14" fill="#555">content_bg → background</text>
<text x="1059" y="808" font-size="14" fill="#555">content_radius → border-radius</text>
    <rect x="15" y="882" width="476" height="168" fill="#fff" stroke="#e85d5d" stroke-width="1.2" rx="4"/>
