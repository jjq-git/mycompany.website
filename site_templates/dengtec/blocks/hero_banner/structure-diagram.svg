<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 840" width="1500" height="840">
  <defs>
    <marker id="aD" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto"><path d="M0,1 L3.5,6 L7,1" fill="#e74c3c"/></marker>
    <marker id="aU" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto"><path d="M0,6 L3.5,1 L7,6" fill="#e74c3c"/></marker>
    <marker id="aRb" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto"><path d="M1,0 L6,3.5 L1,7" fill="#888"/></marker>
    <linearGradient id="mg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c8cdd4"/><stop offset="100%" stop-color="#a8aeb6"/>
    </linearGradient>
  </defs>
  <style>text{font-family:"Microsoft YaHei","PingFang SC",sans-serif}</style>

  <rect x="0" y="0" width="1500" height="840" fill="#fff" rx="4"/>
  <rect x="0" y="0" width="1500" height="46" fill="#f0f2f5" rx="4"/>
  <text x="750" y="31" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a1a2e">hero_banner — HTML 骨架 与 属性映射</text>

  <rect x="15" y="58" width="1470" height="556" fill="rgba(91,141,239,0.035)" stroke="#5b8def" stroke-width="2" stroke-dasharray="10 4" rx="4"/>

  <line x1="15" y1="76" x2="6" y2="76" stroke="#5b8def" stroke-width="1"/>
  <line x1="1485" y1="76" x2="1494" y2="76" stroke="#5b8def" stroke-width="1" marker-end="url(#aRb)"/>
  <text x="750" y="74" text-anchor="middle" font-size="14" fill="#3b6fd4" font-weight="bold">hero_width (max-width)</text>

  <text x="6" y="345" text-anchor="middle" font-size="14" fill="#3b6fd4" font-weight="bold" transform="rotate(-90, 6, 345)">hero_height</text>
  <text x="30" y="110" font-size="14" fill="#3b6fd4" font-weight="bold">section_bg (background)</text>

  <!-- padding -->
  <rect x="15" y="98" width="1470" height="24" fill="rgba(231,76,60,0.15)" stroke="rgba(231,76,60,0.3)" stroke-width="0.5"/>
  <text x="750" y="116" text-anchor="middle" font-size="14" fill="#c0392b" font-weight="bold">padding_top</text>
  <rect x="15" y="590" width="1470" height="24" fill="rgba(231,76,60,0.15)" stroke="rgba(231,76,60,0.3)" stroke-width="0.5"/>
  <text x="750" y="608" text-anchor="middle" font-size="14" fill="#c0392b" font-weight="bold">padding_bottom</text>
  <rect x="15" y="122" width="24" height="468" fill="rgba(231,76,60,0.15)" stroke="rgba(231,76,60,0.3)" stroke-width="0.5"/>
  <text x="27" y="375" text-anchor="middle" font-size="14" fill="#c0392b" font-weight="bold" transform="rotate(-90, 27, 375)">padding_left</text>
  <rect x="1461" y="122" width="24" height="468" fill="rgba(231,76,60,0.15)" stroke="rgba(231,76,60,0.3)" stroke-width="0.5"/>
  <text x="1473" y="375" text-anchor="middle" font-size="14" fill="#c0392b" font-weight="bold" transform="rotate(90, 1473, 375)">padding_right</text>

  <!-- container -->
  <rect x="44" y="130" width="1412" height="458" fill="none" stroke="#27ae60" stroke-width="1.2" stroke-dasharray="6 4" rx="3"/>
  <text x="58" y="151" font-size="15" fill="#1e7a45" font-weight="bold">.container (height: 100%)</text>

  <!-- slides -->
  <rect x="58" y="160" width="1384" height="418" fill="none" stroke="#d4a017" stroke-width="1" stroke-dasharray="5 3" rx="3"/>
  <text x="72" y="180" font-size="14" fill="#9a760e" font-weight="bold">.hero-banner-slides</text>

  <!-- slide -->
  <rect x="75" y="188" width="1350" height="380" fill="none" stroke="#8b5cf6" stroke-width="1.2" rx="3"/>
  <text x="90" y="208" font-size="14" fill="#6d3fd6" font-weight="bold">.hero-banner-slide.active</text>

  <!-- media -->
  <rect x="90" y="216" width="1320" height="250" fill="url(#mg)" rx="5"/>
  <text x="106" y="240" font-size="16" fill="#1a1a2e" font-weight="bold">.hero-banner-media</text>
  <text x="106" y="258" font-size="13" fill="rgba(0,0,0,0.45)">.hero-banner-image {background-image: url(...)}  /  .hero-banner-video</text>

  <rect x="500" y="278" width="400" height="148" fill="rgba(255,255,255,0.35)" rx="4"/>
  <text x="700" y="360" text-anchor="middle" font-size="17" fill="rgba(0,0,0,0.25)">背景图 / 视频</text>
  <text x="700" y="382" text-anchor="middle" font-size="13" fill="rgba(0,0,0,0.18)">slides[].media</text>

  <!-- overlay -->
  <rect x="90" y="318" width="1320" height="150" fill="rgba(0,0,0,0.3)" rx="5"/>
  <text x="106" y="342" font-size="16" fill="#fff" font-weight="bold">.hero-banner-overlay</text>
  <text x="106" y="362" font-size="14" fill="rgba(255,255,255,0.7)">overlay_color (background)  ·  overlay_opacity</text>

  <!-- content -->
  <rect x="330" y="336" width="840" height="116" fill="none" stroke="rgba(255,255,255,0.55)" stroke-width="1.5" rx="5"/>
  <text x="346" y="357" font-size="14" fill="rgba(255,255,255,0.7)">.hero-banner-content</text>

  <line x1="330" y1="332" x2="330" y2="322" stroke="#e67e22" stroke-width="1.2" marker-end="url(#aU)"/>
  <line x1="1170" y1="332" x2="1170" y2="322" stroke="#e67e22" stroke-width="1.2" marker-end="url(#aU)"/>
  <rect x="590" y="312" width="400" height="18" fill="#e67e22" rx="3"/>
  <text x="790" y="326" text-anchor="middle" font-size="14" fill="#fff" font-weight="bold">content_width (max-width) — 内容区最大宽度</text>

  <text x="346" y="375" font-size="13" fill="#c8a0ff" font-weight="bold">banner_align 控制排版位置 →</text>

  <!-- 标题 -->
  <rect x="380" y="354" width="740" height="36" fill="rgba(255,255,255,0.12)" rx="3"/>
  <text x="750" y="378" text-anchor="middle" font-size="21" fill="#fff" font-weight="bold">主标题 — slides[].title</text>
  <text x="750" y="390" text-anchor="middle" font-size="12" fill="rgba(255,255,255,0.5)">.hero-banner-title (h1)</text>

  <!-- 副标题 -->
  <rect x="430" y="400" width="640" height="24" fill="rgba(255,255,255,0.06)" rx="3"/>
  <text x="750" y="418" text-anchor="middle" font-size="15" fill="rgba(255,255,255,0.8)">副标题 — slides[].subtitle ( .hero-banner-subtitle )</text>

  <!-- 按钮区 -->
  <rect x="500" y="434" width="500" height="38" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="0.5" rx="3"/>
  <rect x="545" y="440" width="130" height="26" fill="#067a7a" rx="5"/>
  <text x="610" y="458" text-anchor="middle" font-size="14" fill="#fff" font-weight="bold">主按钮</text>
  <rect x="695" y="440" width="130" height="26" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="1.2" rx="5"/>
  <text x="760" y="458" text-anchor="middle" font-size="14" fill="rgba(255,255,255,0.65)">副按钮</text>
  <text x="880" y="458" font-size="12" fill="rgba(255,255,255,0.3)">.hero-banner-actions · .btn</text>

  <!-- dots -->
  <circle cx="705" cy="584" r="8" fill="#067a7a"/>
  <circle cx="742" cy="584" r="8" fill="#ccc"/>
  <circle cx="779" cy="584" r="8" fill="#ccc"/>
  <text x="742" y="564" text-anchor="middle" font-size="13" fill="#888">.hero-banner-dots</text>
  <text x="640" y="592" font-size="19" fill="#999">◀</text>
  <text x="820" y="592" font-size="19" fill="#999">▶</text>
  <text x="742" y="610" text-anchor="middle" font-size="13" fill="#888">.hero-banner-nav (prev / next)</text>

  <!-- 底部属性字段 -->
  <rect x="10" y="624" width="1480" height="218" fill="#f7f8fa" stroke="#d5d8de" stroke-width="0.8" rx="4"/>
  <text x="750" y="644" text-anchor="middle" font-size="14" fill="#888" font-weight="bold">属性字段</text>
  <rect x="16" y="630" width="282" height="86" fill="#fff" stroke="#5b8def" stroke-width="1.2" rx="4"/>
  <text x="26" y="652" font-size="14" fill="#3b6fd4" font-weight="bold">section 属性</text>
  <text x="26" y="672" font-size="13" fill="#555">hero_width : max-width</text>
  <text x="26" y="689" font-size="13" fill="#555">hero_height : height</text>
  <text x="26" y="706" font-size="13" fill="#555">section_bg : background</text>
  <rect x="312" y="630" width="282" height="86" fill="#fff" stroke="#e74c3c" stroke-width="1.2" rx="4"/>
  <text x="322" y="652" font-size="14" fill="#c0392b" font-weight="bold">padding 四边</text>
  <text x="322" y="672" font-size="13" fill="#555">padding_top / right</text>
  <text x="322" y="689" font-size="13" fill="#555">padding_bottom / left</text>
  <rect x="608" y="630" width="282" height="86" fill="#fff" stroke="#6b7d8e" stroke-width="1.2" rx="4"/>
  <text x="618" y="652" font-size="14" fill="#4a5a6a" font-weight="bold">overlay 遮罩</text>
  <text x="618" y="672" font-size="13" fill="#555">overlay_color : background</text>
  <text x="618" y="689" font-size="13" fill="#555">overlay_opacity</text>
  <rect x="904" y="630" width="282" height="86" fill="#fff" stroke="#e67e22" stroke-width="1.2" rx="4"/>
  <text x="914" y="652" font-size="14" fill="#b8601f" font-weight="bold">content 内容区</text>
  <text x="914" y="672" font-size="13" fill="#555">content_width : max-width</text>
  <text x="914" y="689" font-size="13" fill="#555">banner_align : 排版对齐</text>
  <rect x="1200" y="630" width="282" height="86" fill="#fff" stroke="#e85d5d" stroke-width="1.2" rx="4"/>
  <text x="1210" y="652" font-size="14" fill="#c0392b" font-weight="bold">标题 .hero-banner-title</text>
  <text x="1210" y="672" font-size="13" fill="#555">title_font_size / color</text>
  <text x="1210" y="689" font-size="13" fill="#555">weight / line_height</text>
  <text x="1210" y="706" font-size="13" fill="#555">text_shadow</text>
  <rect x="16" y="730" width="282" height="86" fill="#fff" stroke="#e8963b" stroke-width="1.2" rx="4"/>
  <text x="26" y="752" font-size="14" fill="#b87020" font-weight="bold">副标题 .hero-banner-subtitle</text>
  <text x="26" y="772" font-size="13" fill="#555">subtitle_font_size / color</text>
  <text x="26" y="789" font-size="13" fill="#555">weight / line_height</text>
  <text x="26" y="806" font-size="13" fill="#555">max_width</text>
  <rect x="312" y="730" width="282" height="86" fill="#fff" stroke="#27ae60" stroke-width="1.2" rx="4"/>
  <text x="322" y="752" font-size="14" fill="#1e7a45" font-weight="bold">按钮 .btn</text>
  <text x="322" y="772" font-size="13" fill="#555">btn_bg / text_color</text>
  <text x="322" y="789" font-size="13" fill="#555">font_size / radius</text>
  <text x="322" y="806" font-size="13" fill="#555">padding / weight</text>
  <rect x="608" y="730" width="282" height="86" fill="#fff" stroke="#5bbf7e" stroke-width="1.2" rx="4"/>
  <text x="618" y="752" font-size="14" fill="#2d6a47" font-weight="bold">导航控件</text>
  <text x="618" y="772" font-size="13" fill="#555">dot_color / active_color</text>
  <text x="618" y="789" font-size="13" fill="#555">nav_color / nav_bg</text>
  <rect x="904" y="730" width="282" height="86" fill="#fff" stroke="#8b5cf6" stroke-width="1.2" rx="4"/>
  <text x="914" y="752" font-size="14" fill="#6d3fd6" font-weight="bold">slides[] 数据</text>
  <text x="914" y="772" font-size="13" fill="#555">type / media</text>
  <text x="914" y="789" font-size="13" fill="#555">title / subtitle</text>
  <text x="914" y="806" font-size="13" fill="#555">primaryBtn / secondaryBtn</text>

  <!-- 图例 -->
  <rect x="15" y="846" width="1470" height="36" fill="#f0f2f5" stroke="#d5d8de" stroke-width="0.6" rx="4"/>
  <rect x="35" y="856" width="16" height="12" fill="rgba(231,76,60,0.2)" stroke="#e74c3c" stroke-width="0.5"/>
  <text x="60" y="867" font-size="14" fill="#666">padding</text>
  <rect x="160" y="856" width="16" height="12" fill="none" stroke="#5b8def" stroke-width="1.5"/>
  <text x="188" y="867" font-size="14" fill="#666">section</text>
  <rect x="290" y="856" width="16" height="12" fill="rgba(0,0,0,0.3)" stroke="#999" stroke-width="0.5"/>
  <text x="318" y="867" font-size="14" fill="#666">overlay</text>
  <rect x="420" y="856" width="16" height="12" fill="#e67e22" rx="2"/>
  <text x="448" y="867" font-size="14" fill="#666">content</text>
  <rect x="560" y="856" width="16" height="12" fill="#e85d5d" rx="2"/>
  <text x="588" y="867" font-size="14" fill="#666">标题/副标题</text>
  <rect x="720" y="856" width="16" height="12" fill="#067a7a" rx="2"/>
  <text x="748" y="867" font-size="14" fill="#666">按钮</text>
  <rect x="840" y="856" width="16" height="12" fill="#5bbf7e" rx="2"/>
  <text x="868" y="867" font-size="14" fill="#666">导航</text>
  <rect x="960" y="856" width="16" height="12" fill="#8b5cf6" rx="2"/>
  <text x="988" y="867" font-size="14" fill="#666">数据字段</text>
</svg>