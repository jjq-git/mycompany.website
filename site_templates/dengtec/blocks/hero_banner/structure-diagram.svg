<text x="25" y="1108" font-size="14" fill="#555">btn_font_size → font-size</text>
<text x="25" y="1125" font-size="14" fill="#555">btn_text_color → color</text>
<text x="25" y="1142" font-size="14" fill="#555">btn_bg → background / border-color</text>
<text x="25" y="1159" font-size="14" fill="#555">btn_radius → border-radius</text>
<text x="25" y="1176" font-size="14" fill="#555">btn_padding → padding</text>
<text x="25" y="1193" font-size="14" fill="#555">btn_weight → font-weight</text>
<text x="25" y="1210" font-size="14" fill="#555">btn_hover_bg → hover 背景</text>
<text x="25" y="1227" font-size="14" fill="#555">btn_hover_color → hover 字体色</text>
<text x="25" y="1244" font-size="14" fill="#555">btn_transition → transition</text>
<text x="25" y="1261" font-size="14" fill="#555">显示条件 → slides[].primaryBtn 非空</text>
    <rect x="532" y="1066" width="476" height="202" fill="#fff" stroke="#27ae60" stroke-width="1.2" rx="4"/>
<text x="542" y="1088" font-size="16" fill="#27ae60" font-weight="bold">副按钮 .btn.btn-secondary</text>
<text x="542" y="1108" font-size="14" fill="#555">btn_font_size → font-size</text>
<text x="542" y="1125" font-size="14" fill="#555">btn_text_color → color</text>
<text x="542" y="1142" font-size="14" fill="#555">btn_bg → background / border-color</text>
<text x="542" y="1159" font-size="14" fill="#555">btn_radius → border-radius</text>
<text x="542" y="1176" font-size="14" fill="#555">btn_padding → padding</text>
<text x="542" y="1193" font-size="14" fill="#555">btn_weight → font-weight</text>
<text x="542" y="1210" font-size="14" fill="#555">btn_hover_bg → hover 背景</text>
<text x="542" y="1227" font-size="14" fill="#555">btn_hover_color → hover 字体色</text>
<text x="542" y="1244" font-size="14" fill="#555">btn_transition → transition</text>
<text x="542" y="1261" font-size="14" fill="#555">显示条件 → slides[].secondaryBtn 非空</text>
    <rect x="1049" y="1066" width="476" height="202" fill="#fff" stroke="#8b5cf6" stroke-width="1.2" rx="4"/>
<text x="1059" y="1088" font-size="16" fill="#8b5cf6" font-weight="bold">slides[] 数据字段</text>
<text x="1059" y="1108" font-size="14" fill="#555">type → 媒体类型 (image / video)</text>
<text x="1059" y="1125" font-size="14" fill="#555">media → 媒体地址</text>
<text x="1059" y="1142" font-size="14" fill="#555">title → 主标题</text>
<text x="1059" y="1159" font-size="14" fill="#555">subtitle → 副标题</text>
<text x="1059" y="1176" font-size="14" fill="#555">primaryBtn → 主按钮文字</text>
<text x="1059" y="1193" font-size="14" fill="#555">primaryBtnLink → 主按钮链接</text>
<text x="1059" y="1210" font-size="14" fill="#555">secondaryBtn → 副按钮文字</text>
<text x="1059" y="1227" font-size="14" fill="#555">secondaryBtnLink → 副按钮链接</text>
