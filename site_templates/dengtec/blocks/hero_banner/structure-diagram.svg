<text x="1059" y="924" font-size="14" fill="#555">dot_color → 导航点颜色</text>
<text x="1059" y="941" font-size="14" fill="#555">dot_active_color → 激活点颜色</text>
<text x="1059" y="958" font-size="14" fill="#555">nav_color → 箭头颜色</text>
<text x="1059" y="975" font-size="14" fill="#555">nav_bg → 箭头背景</text>
<text x="1059" y="992" font-size="14" fill="#555">autoplay → 自动播放</text>
<text x="1059" y="1009" font-size="14" fill="#555">autoplay_interval → 轮播间隔</text>
<text x="1059" y="1026" font-size="14" fill="#555">显示条件 → slides 数量 > 1 时显示</text>
    <rect x="15" y="1066" width="476" height="202" fill="#fff" stroke="#27ae60" stroke-width="1.2" rx="4"/>
