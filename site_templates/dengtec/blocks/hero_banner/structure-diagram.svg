<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 720" width="1500" height="720">
  <defs>
    <marker id="aD" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto"><path d="M0,1 L3.5,6 L7,1" fill="#e74c3c"/></marker>
    <marker id="aU" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto"><path d="M0,6 L3.5,1 L7,6" fill="#e74c3c"/></marker>
    <marker id="aR" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto"><path d="M1,0 L6,3.5 L1,7" fill="#888"/></marker>
    <linearGradient id="mediaGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c8cdd4"/><stop offset="100%" stop-color="#a8aeb6"/>
    </linearGradient>
  </defs>

  <style>
    text { font-family: "Microsoft YaHei","PingFang SC",sans-serif; }
  </style>

  <!-- 画布背景 -->
  <rect x="0" y="0" width="1500" height="720" fill="#ffffff" rx="4"/>

  <!-- 标题栏 -->
  <rect x="0" y="0" width="1500" height="44" fill="#f0f2f5" rx="4"/>
  <text x="750" y="27" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a1a2e">hero_banner — HTML 骨架 与 属性映射</text>

  <!-- ============================================================ -->
  <!-- 左侧标注列 -->
  <!-- ============================================================ -->
  <rect x="5" y="52" width="183" height="638" fill="#f7f8fa" stroke="#d5d8de" stroke-width="0.8" rx="3"/>
  <text x="96" y="68" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">属性字段</text>
  <line x1="15" y1="76" x2="177" y2="76" stroke="#e0e3e8" stroke-width="0.5"/>

  <!-- 1. section -->
  <rect x="12" y="86" width="170" height="48" fill="#fff" stroke="#5b8def" stroke-width="1" rx="4"/>
  <text x="22" y="102" font-size="10" fill="#3b6fd4" font-weight="bold">section 属性</text>
  <text x="22" y="116" font-size="9.5" fill="#555">hero_width : max-width</text>
  <text x="22" y="130" font-size="9.5" fill="#555">hero_height : height</text>

  <!-- 2. padding -->
  <rect x="12" y="148" width="170" height="34" fill="#fff" stroke="#e74c3c" stroke-width="1" rx="4"/>
  <text x="22" y="164" font-size="10" fill="#c0392b" font-weight="bold">padding 四边</text>
  <text x="22" y="178" font-size="9.5" fill="#555">padding_top / right / bottom / left</text>

  <!-- 3. overlay -->
  <rect x="12" y="196" width="170" height="34" fill="#fff" stroke="#6b7d8e" stroke-width="1" rx="4"/>
  <text x="22" y="212" font-size="10" fill="#4a5a6a" font-weight="bold">overlay 遮罩</text>
  <text x="22" y="226" font-size="9.5" fill="#555">overlay_color / overlay_opacity</text>

  <!-- 4. content -->
  <rect x="12" y="246" width="170" height="34" fill="#fff" stroke="#e67e22" stroke-width="1" rx="4"/>
  <text x="22" y="262" font-size="10" fill="#b8601f" font-weight="bold">content 内容区</text>
  <text x="22" y="276" font-size="9.5" fill="#555">content_width / banner_align</text>

  <!-- 5. 标题 -->
  <rect x="12" y="296" width="170" height="48" fill="#fff" stroke="#e85d5d" stroke-width="1" rx="4"/>
  <text x="22" y="312" font-size="10" fill="#c0392b" font-weight="bold">标题 .hero-banner-title</text>
  <text x="22" y="326" font-size="9.5" fill="#555">title_font_size / color</text>
  <text x="22" y="340" font-size="9.5" fill="#555">weight / line_height / text_shadow</text>

  <!-- 6. 副标题 -->
  <rect x="12" y="358" width="170" height="48" fill="#fff" stroke="#e8963b" stroke-width="1" rx="4"/>
  <text x="22" y="374" font-size="10" fill="#b87020" font-weight="bold">副标题 .hero-banner-subtitle</text>
  <text x="22" y="388" font-size="9.5" fill="#555">subtitle_font_size / color</text>
  <text x="22" y="402" font-size="9.5" fill="#555">weight / line_height / max_width</text>

  <!-- 7. 按钮 -->
  <rect x="12" y="420" width="170" height="60" fill="#fff" stroke="#27ae60" stroke-width="1" rx="4"/>
  <text x="22" y="436" font-size="10" fill="#1e7a45" font-weight="bold">按钮 .btn</text>
  <text x="22" y="450" font-size="9.5" fill="#555">btn_bg / btn_text_color</text>
  <text x="22" y="464" font-size="9.5" fill="#555">btn_font_size / radius</text>
  <text x="22" y="478" font-size="9.5" fill="#555">btn_padding / weight</text>

  <!-- 8. 导航 -->
  <rect x="12" y="494" width="170" height="48" fill="#fff" stroke="#5bbf7e" stroke-width="1" rx="4"/>
  <text x="22" y="510" font-size="10" fill="#2d6a47" font-weight="bold">导航控件</text>
  <text x="22" y="524" font-size="9.5" fill="#555">dot_color / dot_active_color</text>
  <text x="22" y="538" font-size="9.5" fill="#555">nav_color / nav_bg</text>

  <!-- 9. 数据 -->
  <rect x="12" y="556" width="170" height="60" fill="#fff" stroke="#8b5cf6" stroke-width="1" rx="4"/>
  <text x="22" y="572" font-size="10" fill="#6d3fd6" font-weight="bold">slides[] 数据</text>
  <text x="22" y="586" font-size="9.5" fill="#555">type / media</text>
  <text x="22" y="600" font-size="9.5" fill="#555">title / subtitle</text>
  <text x="22" y="614" font-size="9.5" fill="#555">primaryBtn / secondaryBtn</text>

  <!-- ============================================================ -->
  <!-- 右侧结构区 -->
  <!-- ============================================================ -->

  <!-- section 层 -->
  <rect x="210" y="56" width="1260" height="610" fill="rgba(91,141,239,0.04)" stroke="#5b8def" stroke-width="2" stroke-dasharray="10 4" rx="4"/>

  <!-- hero_width -->
  <line x1="210" y1="74" x2="190" y2="74" stroke="#5b8def" stroke-width="1"/>
  <line x1="1470" y1="74" x2="1490" y2="74" stroke="#5b8def" stroke-width="1" marker-end="url(#aR)"/>
  <text x="840" y="72" text-anchor="middle" font-size="10" fill="#3b6fd4" font-weight="bold">hero_width (max-width)</text>

  <!-- hero_height -->
  <text x="198" y="370" text-anchor="middle" font-size="10" fill="#3b6fd4" font-weight="bold" transform="rotate(-90, 198, 370)">hero_height</text>

  <!-- section_bg -->
  <text x="222" y="106" font-size="10" fill="#3b6fd4" font-weight="bold">section_bg (background)</text>

  <!-- ==================== padding ==================== -->
  <rect x="210" y="96" width="1260" height="22" fill="rgba(231,76,60,0.15)" stroke="rgba(231,76,60,0.3)" stroke-width="0.5"/>
  <text x="840" y="112" text-anchor="middle" font-size="10" fill="#c0392b" font-weight="bold">padding_top</text>

  <rect x="210" y="644" width="1260" height="22" fill="rgba(231,76,60,0.15)" stroke="rgba(231,76,60,0.3)" stroke-width="0.5"/>
  <text x="840" y="660" text-anchor="middle" font-size="10" fill="#c0392b" font-weight="bold">padding_bottom</text>

  <rect x="210" y="118" width="22" height="526" fill="rgba(231,76,60,0.15)" stroke="rgba(231,76,60,0.3)" stroke-width="0.5"/>
  <text x="221" y="400" text-anchor="middle" font-size="10" fill="#c0392b" font-weight="bold" transform="rotate(-90, 221, 400)">padding_left</text>

  <rect x="1448" y="118" width="22" height="526" fill="rgba(231,76,60,0.15)" stroke="rgba(231,76,60,0.3)" stroke-width="0.5"/>
  <text x="1459" y="400" text-anchor="middle" font-size="10" fill="#c0392b" font-weight="bold" transform="rotate(90, 1459, 400)">padding_right</text>

  <!-- ==================== .container ==================== -->
  <rect x="240" y="126" width="1200" height="516" fill="none" stroke="#27ae60" stroke-width="1.2" stroke-dasharray="6 4" rx="3"/>
  <text x="252" y="144" font-size="11" fill="#1e7a45" font-weight="bold">.container (height: 100%)</text>

  <!-- ==================== .hero-banner-slides ==================== -->
  <rect x="252" y="152" width="1176" height="480" fill="none" stroke="#d4a017" stroke-width="1" stroke-dasharray="5 3" rx="3"/>
  <text x="264" y="168" font-size="10" fill="#9a760e" font-weight="bold">.hero-banner-slides</text>

  <!-- ==================== .hero-banner-slide ==================== -->
  <rect x="268" y="176" width="1144" height="446" fill="none" stroke="#8b5cf6" stroke-width="1.2" rx="3"/>
  <text x="282" y="193" font-size="10" fill="#6d3fd6" font-weight="bold">.hero-banner-slide.active</text>

  <!-- ===== 媒体层 ===== -->
  <rect x="282" y="200" width="1116" height="292" fill="url(#mediaGrad)" rx="5"/>
  <text x="296" y="220" font-size="12" fill="#1a1a2e" font-weight="bold">.hero-banner-media</text>
  <text x="296" y="234" font-size="9.5" fill="rgba(0,0,0,0.45)">.hero-banner-image { background-image: url(...) }  /  .hero-banner-video</text>

  <!-- 示意图片 -->
  <rect x="520" y="258" width="360" height="180" fill="rgba(255,255,255,0.35)" rx="4"/>
  <text x="700" y="355" text-anchor="middle" font-size="13" fill="rgba(0,0,0,0.25)">背景图 / 视频</text>
  <text x="700" y="372" text-anchor="middle" font-size="9" fill="rgba(0,0,0,0.18)">slides[].media</text>

  <!-- ===== 遮罩层 ===== -->
  <rect x="282" y="304" width="1116" height="190" fill="rgba(0,0,0,0.3)" rx="5"/>
  <text x="296" y="324" font-size="12" fill="#fff" font-weight="bold">.hero-banner-overlay</text>
  <text x="296" y="340" font-size="10" fill="rgba(255,255,255,0.7)">overlay_color (background)  ·  overlay_opacity</text>

  <!-- ===== 内容区 ===== -->
  <rect x="480" y="320" width="720" height="150" fill="none" stroke="rgba(255,255,255,0.55)" stroke-width="1.5" rx="5"/>
  <text x="494" y="338" font-size="10" fill="rgba(255,255,255,0.7)">.hero-banner-content</text>

  <!-- content_width -->
  <line x1="480" y1="316" x2="480" y2="308" stroke="#e67e22" stroke-width="1.2" marker-end="url(#aU)"/>
  <line x1="1200" y1="316" x2="1200" y2="308" stroke="#e67e22" stroke-width="1.2" marker-end="url(#aU)"/>
  <rect x="660" y="298" width="360" height="15" fill="#e67e22" rx="3"/>
  <text x="840" y="310" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">content_width (max-width) — 内容区最大宽度</text>

  <!-- banner_align -->
  <text x="494" y="354" font-size="9.5" fill="#c8a0ff" font-weight="bold">banner_align 控制排版位置 →</text>

  <!-- 标题 -->
  <rect x="530" y="338" width="620" height="36" fill="rgba(255,255,255,0.12)" rx="3"/>
  <text x="840" y="360" text-anchor="middle" font-size="17" fill="#fff" font-weight="bold">主标题 —  slides[].title</text>
  <text x="840" y="371" text-anchor="middle" font-size="8" fill="rgba(255,255,255,0.5)">.hero-banner-title (h1)</text>

  <!-- 副标题 -->
  <rect x="570" y="382" width="540" height="22" fill="rgba(255,255,255,0.06)" rx="3"/>
  <text x="840" y="397" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.8)">副标题 —  slides[].subtitle  ( .hero-banner-subtitle )</text>

  <!-- 按钮区 -->
  <rect x="620" y="414" width="440" height="38" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="0.5" rx="3"/>
  <rect x="660" y="420" width="110" height="26" fill="#067a7a" rx="5"/>
  <text x="715" y="438" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">主按钮</text>
  <rect x="785" y="420" width="110" height="26" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="1.2" rx="5"/>
  <text x="840" y="438" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.65)">副按钮</text>
  <text x="840" y="458" text-anchor="middle" font-size="8" fill="rgba(255,255,255,0.3)">.hero-banner-actions  ·  .btn.btn-primary  ·  .btn.btn-secondary</text>

  <!-- ===== 导航 ===== -->
  <circle cx="810" cy="635" r="7" fill="#067a7a"/>
  <circle cx="842" cy="635" r="7" fill="#ccc"/>
  <circle cx="874" cy="635" r="7" fill="#ccc"/>
  <text x="842" y="618" text-anchor="middle" font-size="9.5" fill="#888">.hero-banner-dots</text>
  <text x="762" y="641" font-size="15" fill="#999">◀</text>
  <text x="906" y="641" font-size="15" fill="#999">▶</text>
  <text x="842" y="656" text-anchor="middle" font-size="9.5" fill="#888">.hero-banner-nav (prev / next)</text>

  <!-- ============================================================ -->
  <!-- 图例 -->
  <!-- ============================================================ -->
  <rect x="210" y="678" width="1260" height="32" fill="#f0f2f5" stroke="#d5d8de" stroke-width="0.6" rx="4"/>
  <rect x="228" y="688" width="14" height="11" fill="rgba(231,76,60,0.2)" stroke="#e74c3c" stroke-width="0.5"/>
  <text x="248" y="698" font-size="10" fill="#666">padding</text>
  <rect x="320" y="688" width="14" height="11" fill="none" stroke="#5b8def" stroke-width="1.5"/>
  <text x="340" y="698" font-size="10" fill="#666">section</text>
  <rect x="430" y="688" width="14" height="11" fill="rgba(0,0,0,0.3)" stroke="#999" stroke-width="0.5"/>
  <text x="450" y="698" font-size="10" fill="#666">overlay</text>
  <rect x="540" y="688" width="14" height="11" fill="#e67e22" rx="2"/>
  <text x="560" y="698" font-size="10" fill="#666">content</text>
  <rect x="650" y="688" width="14" height="11" fill="#e85d5d" rx="2"/>
  <text x="670" y="698" font-size="10" fill="#666">标题/副标题</text>
  <rect x="780" y="688" width="14" height="11" fill="#067a7a" rx="2"/>
  <text x="800" y="698" font-size="10" fill="#666">按钮</text>
  <rect x="880" y="688" width="14" height="11" fill="#5bbf7e" rx="2"/>
  <text x="900" y="698" font-size="10" fill="#666">导航控件</text>
  <rect x="1000" y="688" width="14" height="11" fill="#8b5cf6" rx="2"/>
  <text x="1020" y="698" font-size="10" fill="#666">数据字段</text>
</svg>