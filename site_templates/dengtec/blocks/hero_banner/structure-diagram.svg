<text x="542" y="924" font-size="14" fill="#555">subtitle_font_size → font-size</text>
<text x="542" y="941" font-size="14" fill="#555">subtitle_color → color</text>
<text x="542" y="958" font-size="14" fill="#555">subtitle_weight → font-weight</text>
<text x="542" y="975" font-size="14" fill="#555">subtitle_line_height → line-height</text>
<text x="542" y="992" font-size="14" fill="#555">subtitle_max_width → max-width</text>
<text x="542" y="1009" font-size="14" fill="#555">显示条件 → slides[].subtitle 非空时渲染</text>
    <rect x="1049" y="882" width="476" height="168" fill="#fff" stroke="#5bbf7e" stroke-width="1.2" rx="4"/>
