<text x="25" y="924" font-size="14" fill="#555">title_font_size → font-size</text>
<text x="25" y="941" font-size="14" fill="#555">title_color → color</text>
<text x="25" y="958" font-size="14" fill="#555">title_weight → font-weight</text>
<text x="25" y="975" font-size="14" fill="#555">title_line_height → line-height</text>
<text x="25" y="992" font-size="14" fill="#555">title_text_shadow → text-shadow</text>
<text x="25" y="1009" font-size="14" fill="#555">显示条件 → slides[].title 非空时渲染</text>
