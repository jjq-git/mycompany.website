display_name: 登腾科技-企业官网版
industry: manufacturing
description: 适合电子制造 / 展示道具行业企业官网。多语言（简中/英文/繁中），支持产品展示、项目案例、博客、Banner轮播、核心亮点模块。
cover_image: ""
version: 0.1.0
is_public: true

datasets:
  - products
  - portfolio
  - posts

# 默认菜单 (多语言 key，模板中根据当前语言取对应翻译)
default_menu:
  - {label: 首页, type: home}
  - label: 产品
    type: list
    target: products
    dropdown_style: horizontal
    children:
      - {label: 静音仓, type: link, url: /products/silent-booth/}
      - {label: 产品展示, type: link, url: /products/props-display/}
      - {label: 干冰机, type: link, url: /products/dry-ice-machine/}
  - {label: 近期项目, type: list, target: portfolio}
  - {label: 关于我们, type: page, target: about}
  - {label: 联系, type: page, target: contact}
  - {label: 博客, type: list, target: posts}

# 主题色 (店主可以在 settings.yaml.theme 里覆盖)
# --color-primary: #067a7a 青色，--color-secondary: #f97316 橙色 (沿用 dengtec 设计令牌)
default_theme:
  color-primary: "#067a7a"
  color-primary-hover: "#056060"
  color-primary-light: "#0d9488"
  color-secondary: "#f97316"
  color-text: "#1a1a1a"
  color-text-inverse: "#ffffff"
  color-bg: "#ffffff"
  color-bg-secondary: "#f5f7fa"
  color-border: "#e5e7eb"
  color-muted: "#6b7280"
  shadow-sm: "0 1px 2px rgba(0,0,0,0.05)"
  shadow-md: "0 4px 12px rgba(0,0,0,0.1)"
  shadow-lg: "0 10px 40px rgba(0,0,0,0.15)"
  radius-sm: "6px"
  radius-md: "12px"
  radius-lg: "16px"
  font-sans: "'Inter', 'Noto Sans SC', 'Noto Sans TC', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"

# 支持的语言列表
languages:
  - {code: zh-CN, name: 简体中文, flag: 🇨🇳}
  - {code: zh-TW, name: 繁體中文, flag: 🇹🇼}
  - {code: en, name: English, flag: 🇺🇸}
default_language: zh-CN
