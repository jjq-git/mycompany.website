  data:
    title: Company Profile
    subtitle: ''
    body: Kunshan D&G Electronic Technology Co., Ltd. was established in 2014, located
      in the Kunshan Development Zone, Jiangsu Province. It is a high-tech enterprise
      specializing in the R&D and manufacturing of electronic products for the display
      prop industry. The company has a complete R&D team and production workshop,
      covering customized development and production of smart display cabinets, silent
      display pods, stage special effects equipment, LED display systems, interactive
      information terminals, and more. We have served various clients including museums,
      large shopping malls, chain brands, exhibition companies, and university laboratories,
      accumulating rich industry experience. Whether it's standard products or customized
      solutions, we can tailor the most suitable solution.
    _hidden: 'true'
