    tag: Star Product
    title: Silent Booth V2 — Let Displays Return to Quiet
    desc: Designed for high-demand scenarios such as museums and art galleries. Multi-layer
      soundproofing structure combined with intelligent fresh air system isolates
      external noise while maintaining a comfortable viewing environment. Supports
      custom appearance and size.
    primaryBtn: Learn More
    primaryLink: /products/silent-booth/
    secondaryBtn: ''
    secondaryLink: ''
    _hidden: 'false'
