    features:
    - text: Soundproofing level ≥ 35dB, meeting first-class museum exhibition hall
        standards
    - text: Intelligent constant temperature and humidity, automatically adjusts internal
        environment parameters
    - text: Supports remote monitoring and fault warning, reducing operation and maintenance
