- type: stat_counter
  order: 3
  variant: cols_5
  data:
    heading: Faster One-Stop Electronics Manufacturing
    subheading: Founded in 2006, JLCPCB is committed to building a one-stop industrial
      electronics platform. By integrating PCB manufacturing, component sourcing,
      and PCB assembly services, it enables digital PCBA processing. With continuous
      investment in innovation and digital systems, the company has grown rapidly
      and become a global leader in PCB and PCBA manufacturing, capable of quickly
      producing high-reliability, cost-effective products.
    _hidden: 'false'
    style_cols: 5
    stats:
    - number: 700
      suffix: +
      label: Customers
    - number: 1700万
      suffix: +
      label: Orders per Year
    - number: 290
      suffix: + Acres
      label: Factory Area
    - number: 1000万
      suffix: +㎡
      label: Annual Capacity
    - number: 180
      suffix: +
