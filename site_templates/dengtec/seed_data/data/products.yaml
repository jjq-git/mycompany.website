  - slug: led-strips
    category: led-strips
    title: LED 灯条
    description: 多规格可编程 LED 灯条，适用于各类展示场景
    image: https://cdn.dengtec.com/images/products/led-strips.jpg
    specs:
      led_types: [2835, 3528, 3014, 335, 5050单色, 5050彩色, 5630, WS2812, WS2811, 4020]
      board_widths: [5mm, 6mm, 8mm, 10mm, 12mm, 20mm, S型]
      led_densities: [60灯/米, 72灯/米, 90灯/米, 96灯/米, 100灯/米, 120灯/米]
      voltages: [5V, 12V, 24V]
    body: |
      提供多种规格的可编程 LED 灯条产品，适用于展示道具、氛围照明、商业展示等场景。

