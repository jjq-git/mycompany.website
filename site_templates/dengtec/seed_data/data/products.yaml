    body: |
      各类电源产品，为电子展示道具提供稳定的供电解决方案。

  - slug: silent-booth
    category: silent-booth
    title: 智能静音仓
    description: 德恩基智能静音仓，集成物联网技术，提供安静独立的智能空间解决方案
    image: https://images.unsplash.com/photo-1497366216548-37526070297c?w=1920&h=1080&fit=crop
    body: |
      智能静音仓采用一主机多节点的架构设计，通过 CANOpen 总线实现稳定可靠的工业级通信。
      内置多种传感器节点，实时监测舱内环境数据（温度、湿度、噪音、PM2.5、人体感应、门磁状态）。
      支持钉钉会议预约系统，智能会议室预约与管理体验。
      多种规格满足不同需求：单人静音仓 S1、双人静音仓 S2、会议静音仓 S4。

  - slug: props-display
    category: props-display
    title: 智能道具展示解决方案
    description: 为零售、展览和品牌展示提供定制化的智能道具展示解决方案，集成LED照明、传感器和无线控制技术
    image: https://images.unsplash.com/photo-1558618666-fcd25c85cd64?w=1920&h=1080&fit=crop
    body: |
      提供全方位的智能道具展示解决方案，满足不同场景的需求。
      核心特点：定制化设计、智能LED照明、无线控制、智能感应。
      三大核心产品系列：主机控制系统、LED照明系统、铝槽结构系统。

  - slug: dry-ice-machine
    category: dry-ice-machine
    title: 干冰机
    description: 德恩基干冰机，高效环保的干冰制造设备，适用于食品保鲜、舞台效果、工业清洗等多种场景
    image: https://images.unsplash.com/photo-1581091226825-a6a2a5aee158?w=1920&h=1080&fit=crop
    body: |
      德恩基干冰机采用先进的制冷技术，能够快速高效地制造干冰，适用于食品保鲜、舞台效果、工业清洗等多种场景。
      每小时可生产 10-50kg 干冰，干冰纯度高达 99.9%，颗粒均匀，升华缓慢。
      采用进口压缩机，确保设备稳定可靠，多重安全保护，自动报警系统。

