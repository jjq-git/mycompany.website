    - 近期项目
  specs:
    - {name: 屏幕, value: 4.3英寸触摸屏}
    - {name: 连接方式, value: 磁铁和卡扣结构}
    - {name: 特点, value: 模块化设计，快速装配}
  body: |
    RIMU 是一个模块化的电子设备，它帮助那些不擅长硬件和编程的人轻松使用各种类型的电子设备。
    主机和模块之间采用了磁铁和卡扣的结构，能够非常轻易地进行装配和卸载。
    4.3英寸的触摸屏，能够非常容易的实现和设备进行信息交互。

