who_we_are: |
  昆山德恩基电子科技有限公司成立于2010年，是一家专注于零售展示道具电子产品研发、生产和销售的高新技术企业。

  我们拥有一支经验丰富的研发团队，擅长电路设计、嵌入式软件开发、结构设计和传感器应用，能够为客户提供从概念设计到量产交付的一站式解决方案。

  我们的产品广泛应用于化妆品展示、服装零售、电子产品展示等多个领域，服务客户包括兰蔻、雅诗兰黛、小米等多个国际知名品牌。

