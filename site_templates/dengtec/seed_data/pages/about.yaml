# 关于我们页面
modules:
  - type: section_title
    order: 1
    variant: default
    data:
      tag: 关于我们
      title: 专注展示道具电子化
      desc: 从方案设计到产品交付，一站式展示道具智能解决方案提供商

  - type: text_content
    order: 2
    variant: default
    data:
      title: 公司简介
      body: |
        昆山德恩基电子科技有限公司成立于2014年，位于江苏省昆山市开发区，是一家专注于展示道具行业电子产品研发与制造的高新技术企业。

        公司拥有完整的研发团队与生产车间，业务涵盖智能展示柜、静音展示仓、舞台特效设备、LED显示系统、互动信息终端等产品的定制开发与生产。

        我们服务过博物馆、大型商场、连锁品牌、展览公司、高校实验室等各类客户，积累了丰富的行业经验。无论是标准产品还是定制方案，我们都能量身打造最合适的解决方案。
      text_align: left
      columns: "1"

  - type: stat_counter
    order: 3
    variant: grid_4
    data:
      title: 公司实力
      subtitle: 用数字说话
      columns: "4"
      stats:
        - number: 10
          suffix: 年+
          label: 行业经验
          icon: clock
        - number: 200
          suffix: 个+
          label: 服务客户
          icon: users
        - number: 50
          suffix: 项+
          label: 技术专利
          icon: shield
        - number: 5000
          suffix: ㎡
          label: 生产基地
          icon: building

  - type: highlight_card
    order: 4
    variant: bento
    data:
      tag: 我们的理念
      title: 让每一件展品都被看见
      desc: 好的展示道具不只是承载展品，更是展品与观众之间的桥梁。我们相信，技术应该服务于展示本身——不喧宾夺主，但无处不在。
      image: ""
      image_position: right
      features:
        - text: 以客户需求为起点，而非以现有产品为起点
        - text: 坚持自主研发，核心部件全部自研自产
        - text: 售前方案咨询 + 售后技术支持，全程陪伴
