name: Hero Banner
category: content
icon: hero_banner.svg
description: 首屏大图/视频模块，支持标题、副标题、CTA 按钮、徽章
fields:
  - key: type
    label: 媒体类型
    type: select
    options:
      - value: image
        label: 图片
      - value: video
        label: 视频
  - key: media
    label: 媒体地址
    type: url
  - key: title
    label: 主标题
    type: text
  - key: subtitle
    label: 副标题
    type: text
  - key: badge
    label: 徽章文字
    type: text
  - key: cta_text
    label: 按钮文字
    type: text
  - key: cta_url
    label: 按钮链接
    type: url
variants:
  - key: text_overlay
    label: 文字叠加（全宽）
  - key: split_left
    label: 左文右图（50:50）
  - key: split_right
    label: 左图右文（50:50）