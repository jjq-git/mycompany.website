display_name: 科技产品-暗色版
industry: tech-product
description: 适合硬件创业 / 模块化产品 / 极客向项目。深色主题，支持视频 hero、产品矩阵、功能亮点、博客。
cover_image: ""
version: 0.1.0
is_public: true

# 这个模板用到的数据集 (店主后台侧栏会按这个显示对应入口)
datasets:
  - products
  - features
  - posts

# 默认菜单 (店主可以在 settings.yaml 里覆盖)
default_menu:
  - {label: Host, url: /products/host}
  - {label: Modules, url: /products}
  - {label: Functions, url: /functions}
  - {label: Community, url: /community}
  - {label: Blog, url: /blog}

# 主题色 (店主可以在 settings.yaml.theme 里覆盖)
default_theme:
  bg: "#0a0a0f"
  surface: "#15151d"
  text: "#e8e8f0"
  text_muted: "#8a8aa0"
  accent: "#22c55e"
  border: "#2a2a35"
