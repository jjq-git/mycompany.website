display_name: 科技产品-暗色版
industry: tech-product
description: 适合硬件创业 / 模块化产品 / 极客向项目。深色主题，支持视频 hero、产品矩阵、功能亮点、博客。
cover_image: ""
version: 0.1.0
is_public: true

datasets:
  - products
  - features
  - posts

# 默认菜单 (新格式: type + target)
default_menu:
  - {label: 首页, type: home}
  - {label: 产品, type: list, target: products}
  - {label: 博客, type: list, target: posts}
  - {label: 关于, type: page, target: about}

# 主题色 (店主可以在 settings.yaml.theme 里覆盖)
default_theme:
  bg: "#0a0a0f"
  surface: "#15151d"
  text: "#e8e8f0"
  text_muted: "#8a8aa0"
  accent: "#22c55e"
  border: "#2a2a35"

# 支持的语言列表
languages:
  - {code: zh-CN, name: 简体中文, flag: 🇨🇳}
default_language: zh-CN