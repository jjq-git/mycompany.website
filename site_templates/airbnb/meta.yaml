name: airbnb
display_name: "Airbnb - Stay Marketplace"
industry: travel-marketplace
description: "A warm photography-led marketplace template with Rausch red actions, pill search, rounded property cards, and complete bilingual seed data."
cover_image: "https://images.unsplash.com/photo-1564013799919-ab600027ffc6?auto=format&fit=crop&w=1200&q=80"
version: 0.1.0
is_public: true

datasets:
  - products
  - portfolio
  - posts
  - features

default_menu:
  - {label: Homes, type: home}
  - label: Stays
    type: list
    target: products
    dropdown_style: cards
  - {label: Experiences, type: list, target: portfolio}
  - {label: Services, type: page, target: support}
  - {label: About, type: page, target: about}
  - {label: Stories, type: list, target: posts}

default_theme:
  color-primary: "#ff385c"
  color-bg: "#ffffff"
  color-surface: "#f7f7f7"
  color-text: "#222222"
  color-text-secondary: "#6a6a6a"
  color-border: "#dddddd"
  font-display: "Airbnb Cereal VF, Circular, -apple-system, BlinkMacSystemFont, 'Inter', system-ui, sans-serif"
  font-sans: "Airbnb Cereal VF, Circular, -apple-system, BlinkMacSystemFont, 'Inter', system-ui, sans-serif"
  font-mono: "SFMono-Regular, Consolas, 'Liberation Mono', monospace"
  radius-xs: "4px"
  radius-sm: "8px"
  radius-md: "14px"
  radius-lg: "20px"
  radius-xl: "32px"
  radius-pill: "9999px"
  shadow-sm: "0 0 0 1px rgba(0,0,0,0.02), 0 2px 6px rgba(0,0,0,0.04), 0 4px 8px rgba(0,0,0,0.10)"

languages:
  - {code: en, name: English, flag: EN}
  - {code: zh-CN, name: "简体中文", flag: CN}
default_language: en

header_variants:
  - {key: logo_left_menu_right, label: "Marketplace nav", description: "Logo, centered product tabs, and account actions"}
  - {key: logo_center_menu_below, label: "Search led", description: "Centered navigation with search emphasis"}
  - {key: minimal_hamburger, label: "Mobile first", description: "Compact mobile-friendly navigation"}

footer_variants:
  - {key: columns, label: "Support columns", description: "Airbnb-style directory footer"}
  - {key: minimal, label: "Minimal", description: "Legal and language row"}
  - {key: columns_social, label: "Directory + social", description: "Directory columns with social links"}
