<!-- Contact Info — List Variant: 纵向列表, 图标左文字右 -->
<section data-name="contact_info" data-type="group" data-hideable data-from="settings:contact" class="section surface-canvas">
  <div class="container container--narrow">
    <div class="section-header">
      <h2 data-name="title" data-type="text" class="section-header__title"></h2>
      <p data-name="subtitle" data-type="text" class="section-header__desc"></p>
    </div>
    <div class="contact-list">
      <div data-name="phone_card" data-type="group" data-hideable class="contact-list-row flex items-center gap-md mb-md">
        <div class="contact-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72 12.84 12.84 0 00.7 2.81 2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45 12.84 12.84 0 002.81.7A2 2 0 0122 16.92z"/></svg></div>
        <div>
          <div class="text-body-sm font-medium text-body-strong">Phone</div>
          <a data-name="phone" data-type="text" data-href-template="tel:{phone}" class="text-body-md text-muted"></a>
        </div>
      </div>
      <div data-name="mobile_card" data-type="group" data-hideable class="contact-list-row flex items-center gap-md mb-md">
        <div class="contact-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><rect x="5" y="2" width="14" height="20" rx="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg></div>
        <div>
          <div class="text-body-sm font-medium text-body-strong">Mobile</div>
          <a data-name="mobile" data-type="text" data-href-template="tel:{mobile}" class="text-body-md text-muted"></a>
        </div>
      </div>
      <div data-name="email_card" data-type="group" data-hideable class="contact-list-row flex items-center gap-md mb-md">
        <div class="contact-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg></div>
        <div>
          <div class="text-body-sm font-medium text-body-strong">Email</div>
          <a data-name="email" data-type="text" data-href-template="mailto:{email}" class="text-body-md text-muted"></a>
        </div>
      </div>
      <div data-name="address_card" data-type="group" data-hideable class="contact-list-row flex items-center gap-md mb-md">
        <div class="contact-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg></div>
        <div>
          <div class="text-body-sm font-medium text-body-strong">Address</div>
          <div data-name="address" data-type="text" class="text-body-md text-muted"></div>
        </div>
      </div>
      <div data-name="hours_card" data-type="group" data-hideable class="contact-list-row flex items-center gap-md mb-md">
        <div class="contact-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></div>
        <div>
          <div class="text-body-sm font-medium text-body-strong">Hours</div>
          <div data-name="business_hours" data-type="text" class="text-body-md text-muted"></div>
        </div>
      </div>
    </div>
  </div>
</section>
