<!-- Process Steps — Vertical Variant: 纵向时间轴 -->
<section data-name="process_steps" data-type="group" data-hideable class="section surface-canvas">
  <div class="container container--narrow">
    <div class="section-header">
      <h2 data-name="title" data-type="text" class="section-header__title"></h2>
      <p data-name="subtitle" data-type="text" class="section-header__desc"></p>
    </div>
    <div data-name="steps" data-type="list" class="process-track process-track--vertical">
      <div data-name="step" data-type="group" class="process-step process-step--vertical">
        <div class="process-marker">
          <span data-name="icon" data-type="icon" class="process-icon"></span>
          <span class="process-number"></span>
        </div>
        <div class="process-text">
          <h3 data-name="title" data-type="text" class="text-title-sm text-ink mb-xs"></h3>
          <p data-name="desc" data-type="textarea" class="text-body-sm text-muted"></p>
        </div>
      </div>
    </div>
  </div>
</section>
