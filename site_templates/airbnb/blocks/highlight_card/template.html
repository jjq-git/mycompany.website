<!-- Highlight Card -->
<section data-name="highlight_card" data-type="group" data-hideable data-style="dir,bg-color" class="section surface-canvas">
  <div class="container">
    <div class="highlight-grid">
      <div class="highlight-image">
        <img data-name="image" data-type="image" src="" alt="" loading="lazy" class="highlight-img">
      </div>
      <div class="highlight-text">
        <span data-name="tag" data-type="text" class="badge badge-coral mb-sm"></span>
        <h2 data-name="title" data-type="text" class="text-display-md text-ink mb-md"></h2>
        <p data-name="desc" data-type="textarea" class="text-body-md text-body mb-lg"></p>
        <ul data-name="features" data-type="list" class="highlight-features mb-lg">
          <li data-name="text" data-type="text" class="highlight-feature text-body-md"></li>
        </ul>
        <div class="highlight-actions flex gap-sm">
          <a data-name="primaryBtn" data-type="text" data-href="primaryLink" class="btn btn-primary"></a>
          <a data-name="secondaryBtn" data-type="text" data-href="secondaryLink" class="btn btn-secondary"></a>
        </div>
      </div>
    </div>
  </div>
</section>
