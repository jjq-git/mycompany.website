<!-- Item Detail -->
<section data-name="item_detail" data-type="group" data-hideable class="section surface-canvas item-detail-carousel">
  <div class="container">
    <div class="detail-grid">
      <div class="detail-gallery">
        <div class="detail-carousel-stage">
          <div data-name="images" data-type="list" class="detail-images">
            <img data-name="url" data-type="image" src="" alt="" loading="lazy" class="detail-gallery-img">
          </div>
          <button type="button" class="detail-carousel-btn detail-carousel-prev" aria-label="Previous image">
            <span aria-hidden="true">&#8249;</span>
          </button>
          <button type="button" class="detail-carousel-btn detail-carousel-next" aria-label="Next image">
            <span aria-hidden="true">&#8250;</span>
          </button>
          <button type="button" class="detail-zoom-btn" aria-label="Zoom image">
            <span aria-hidden="true">+</span>
          </button>
        </div>
        <div class="detail-thumbs" aria-label="Image thumbnails"></div>
      </div>
      <div class="detail-info">
        <h1 data-name="title" data-type="text" class="text-display-md text-ink mb-sm"></h1>
        <div data-name="tags" data-type="text" class="detail-tags mb-md"></div>
        <p data-name="desc" data-type="textarea" class="text-body-md text-body mb-lg"></p>
        <div data-name="specs" data-type="list" class="detail-specs">
          <div data-name="spec" data-type="group" class="detail-spec-row flex justify-between">
            <span data-name="name" data-type="text" class="text-body-sm text-muted"></span>
            <span data-name="value" data-type="text" class="text-body-sm text-body-strong"></span>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
