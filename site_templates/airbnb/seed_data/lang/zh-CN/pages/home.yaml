title: "Staynest"
description: "面向房源、体验和本地服务的温暖型市场首页。"
modules:
  - type: hero_banner
    order: 1
    data:
      slides:
        - media: "https://images.unsplash.com/photo-1564013799919-ab600027ffc6?auto=format&fit=crop&w=1800&q=86"
          title: "找到适合你的那间房。"
          subtitle: "预订房源、体验和本地服务，让每一次旅行都更有个人感。"
          primaryBtn: "开始搜索"
          primaryBtnLink: "/products/"
          secondaryBtn: "探索体验"
          secondaryBtnLink: "/portfolio/"
        - media: "https://images.unsplash.com/photo-1505693416388-ac5ce068fe85?auto=format&fit=crop&w=1800&q=86"
          title: "能装下真实生活的房源。"
          subtitle: "从海边阁楼到庭院小屋，发现兼具舒适、个性和房东用心的地方。"
          primaryBtn: "浏览房源"
          primaryBtnLink: "/products/"
          secondaryBtn: "了解房东"
          secondaryBtnLink: "/about/"

  - type: section_title
    order: 2
    data:
      tag: "旅行市场"
      title: "围绕真实地点构建的预订体验。"
      desc: "以图片为先的卡片、简洁信息和明确操作，让访客快速选择，同时保留探索感。"
      btn_text: "查看热门房源"
      btn_url: "/products/"
      title_size: "28px"
      desc_size: "16px"

  - type: feature_grid
    order: 3
    data:
      title: "预订前需要的信息都在这里。"
      subtitle: "这个模板适合民宿短租、本地体验、服务式公寓、营地和旅行市场。"
      features:
        - icon: "search"
          title: "胶囊式发现入口"
          desc: "把访客从目的地和日期自然带入精选集合。"
        - icon: "heart"
          title: "高口碑房源卡片"
          desc: "突出评分、设施和让房源更有记忆点的小细节。"
        - icon: "shield"
          title: "可信任的房东叙事"
          desc: "支持政策、入住规则和联系方式始终容易找到。"
        - icon: "globe"
          title: "默认双语完整"
          desc: "英文和简体中文种子数据从首次预览起就完整可用。"

  - type: highlight_card
    order: 4
    data:
      image_position: right
      tag: "住客喜爱"
      title: "以照片为核心，也保留人的细节。"
      desc: "干净白底、圆角房源图片和 Rausch 红操作色，让注意力始终落在住宿本身。"
      image: "https://images.unsplash.com/photo-1512917774080-9991f1c4c750?auto=format&fit=crop&w=1500&q=86"
      features:
        - text: "每个房源都有大图图库"
        - text: "用简洁摘要支持快速比较"
        - text: "清晰展示价格、位置和设施信号"
      primaryBtn: "查看阁楼"
      primaryLink: "/products/seaside-loft-lisbon/"
      secondaryBtn: "浏览更多"
      secondaryLink: "/products/"

  - type: stat_counter
    order: 5
    data:
      title: "让旅行品牌更有生活感。"
      subtitle: "用紧凑的信任信息替代夸张口号。"
      stats:
        - number: 220
          suffix: "+"
          label: "城市拥有精选房源"
          icon: "map-pin"
        - number: 4.9
          suffix: ""
          label: "平均住客评分"
          icon: "star"
        - number: 12
          suffix: "k"
          label: "独立房东"
          icon: "home"
        - number: 24
          suffix: "/7"
          label: "住客支持"
          icon: "message-circle"

  - type: logo_cloud
    order: 6
    data:
      title: "按旅行方式探索。"
      subtitle: "这些位置可用于目的地、合作伙伴标识或旅行分类。"
      columns: "5"
      grayscale: "false"
      logos:
        - name: "海边"
          image: "https://dummyimage.com/240x120/ffffff/222222.png&text=Beach"
          link: "/products/"
        - name: "木屋"
          image: "https://dummyimage.com/240x120/ffffff/222222.png&text=Cabins"
          link: "/products/"
        - name: "设计感"
          image: "https://dummyimage.com/240x120/ffffff/222222.png&text=Design"
          link: "/products/"
        - name: "美食"
          image: "https://dummyimage.com/240x120/ffffff/222222.png&text=Food"
          link: "/portfolio/"
        - name: "长住"
          image: "https://dummyimage.com/240x120/ffffff/222222.png&text=Long+stays"
          link: "/products/"

  - type: product_grid
    order: 7
    data:
      dataset: products
      max_items: 4
      title: "住客喜爱的房源"
      subtitle: "圆角照片卡片、有效摘要和清晰的详情入口。"

  - type: data_grid
    order: 8
    data:
      dataset: portfolio
      max_items: 3
      card_layout: image_top
      show_pagination: "false"
      title: "接下来可以预订的体验"

  - type: process_steps
    order: 9
    data:
      title: "从想法到预订。"
      subtitle: "面向住客和房东的三步流程。"
      direction: horizontal
      step_style: number
      steps:
        - title: "搜索"
          desc: "从目的地、日期、人数或旅行氛围开始。"
          icon: "search"
        - title: "选择"
          desc: "比较照片、房东说明、价格、设施和街区信息。"
          icon: "sliders"
        - title: "预订"
          desc: "发送请求、确认细节，并在旅途中随时获得支持。"
          icon: "check-circle"

  - type: text_content
    order: 10
    data:
      title: "为反复浏览而设计。"
      subtitle: "界面应该好用，而不是像活动页。"
      body: "<p>Airbnb 风格页面成立的原因，是产品本身就是那个地点。这个模板保持紧凑排版、熟悉操作和充足图片，让访客可以低摩擦浏览大量选择。</p><p>同一套结构也可以支持房源、服务、目的地、活动或房东精选集合，并带有完整双语种子内容。</p>"
      text_align: center
      columns: "1"
      inner_width: "820px"

  - type: contact_info
    order: 11
    data:
      title: "需要帮你选择吗？"
      subtitle: "预订前可以和 Staynest 行程顾问聊一聊。"
      phone: "+1 (415) 555-0188"
      email: "hello@staynest.example.com"
      address: "美国加州旧金山 Brannan Street 888 号"
      show_phone: "true"
      show_email: "true"
      show_address: "true"
      show_business_hours: "true"

  - type: contact_form
    order: 12
    data:
      title: "咨询一次旅行。"
      subtitle: "告诉我们目的地、日期和旅行偏好，我们会推荐适合的房源。"
      form_action: "#"
      submit_text: "发送需求"

  - type: item_detail
    order: 13
    data:
      title: "里斯本海景阁楼"
      tags: "海景，2 位住客，住客喜爱"
      desc: "一间位于瓷砖街巷上方的明亮公寓，清晨采光很好，带小厨房，步行即可到达咖啡馆、观景点和滨水区。"
      images:
        - url: "https://images.unsplash.com/photo-1505693416388-ac5ce068fe85?auto=format&fit=crop&w=1400&q=86"
        - url: "https://images.unsplash.com/photo-1522708323590-d24dbb6b0267?auto=format&fit=crop&w=1400&q=86"
        - url: "https://images.unsplash.com/photo-1484154218962-a197022b5858?auto=format&fit=crop&w=1400&q=86"
      specs:
        - name: "住客"
          value: "2 位住客"
        - name: "卧室"
          value: "1 间卧室"
        - name: "评分"
          value: "128 条评价，4.96 分"

  - type: item_data
    order: 14
    data:
      title: "结构化房源数据"
      category: "房源数据集"
      summary: "用于房源、体验、目的地和服务记录的紧凑详情面板。"
      meta_label: "每晚价格"
      price: "$214 / 晚"
      tags:
        - "海景"
        - "自助入住"
        - "房东接待"
      specs:
        - name: "主数据集"
          value: "products.yaml"
        - name: "详情字段"
          value: "图片、标签、设施、价格"
        - name: "语言"
          value: "英文和简体中文"
