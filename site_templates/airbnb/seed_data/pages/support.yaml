title: "Support"
description: "Help for guests and hosts before, during, and after a Staynest booking."
modules:
  - type: section_title
    order: 1
    data:
      tag: "Support"
      title: "Support should be easy to find."
      desc: "Use clear sections for booking questions, host help, safety expectations, and post-trip follow-up."
      btn_text: "Contact support"
      btn_url: "/contact/"
  - type: process_steps
    order: 2
    data:
      title: "How we handle requests"
      subtitle: "Simple steps reduce uncertainty."
      direction: horizontal
      step_style: number
      steps:
        - title: "Tell us the context"
          desc: "Share the listing, date, and what you need help with."
          icon: "message-circle"
        - title: "Get a clear answer"
          desc: "We route the question to guest support, host support, or local partners."
          icon: "send"
        - title: "Keep the trip moving"
          desc: "Follow-up notes stay concise and useful until the issue is resolved."
          icon: "check-circle"
  - type: contact_info
    order: 3
    data:
      title: "Direct support"
      subtitle: "For urgent travel help, use phone or email."
      phone: "+1 (415) 555-0188"
      email: "support@staynest.example.com"
      address: "888 Brannan Street, San Francisco, CA 94103"
      show_phone: "true"
      show_email: "true"
      show_address: "true"
      show_business_hours: "true"
