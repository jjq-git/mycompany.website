title: "Staynest"
description: "A warm marketplace homepage for homes, experiences, and local services."
modules:
  - type: hero_banner
    order: 1
    data:
      slides:
        - media: "https://images.unsplash.com/photo-1564013799919-ab600027ffc6?auto=format&fit=crop&w=1800&q=86"
          title: "Find your kind of stay."
          subtitle: "Book homes, experiences, and local services that make every trip feel personal."
          primaryBtn: "Start searching"
          primaryBtnLink: "/products/"
          secondaryBtn: "Explore experiences"
          secondaryBtnLink: "/portfolio/"
        - media: "https://images.unsplash.com/photo-1505693416388-ac5ce068fe85?auto=format&fit=crop&w=1800&q=86"
          title: "Homes with room for real life."
          subtitle: "From seaside lofts to garden houses, discover places chosen for comfort, character, and host care."
          primaryBtn: "Browse homes"
          primaryBtnLink: "/products/"
          secondaryBtn: "Meet hosts"
          secondaryBtnLink: "/about/"

  - type: section_title
    order: 2
    data:
      tag: "Marketplace"
      title: "A booking experience built around real places."
      desc: "Photo-first cards, concise details, and clear calls to action help guests choose quickly without losing the feeling of discovery."
      btn_text: "See popular stays"
      btn_url: "/products/"
      title_size: "28px"
      desc_size: "16px"

  - type: feature_grid
    order: 3
    data:
      title: "Everything guests need before they book."
      subtitle: "Use this template for home rentals, local experiences, serviced apartments, retreats, and travel marketplaces."
      features:
        - icon: "search"
          title: "Pill-style discovery"
          desc: "Guide visitors from destination and dates into focused collections."
        - icon: "heart"
          title: "Guest favorite cards"
          desc: "Highlight ratings, amenities, and the small details that make a listing memorable."
        - icon: "shield"
          title: "Trusted host story"
          desc: "Support policies, house rules, and contact paths stay easy to find."
        - icon: "globe"
          title: "Bilingual by default"
          desc: "English and Simplified Chinese seed data are complete from the first preview."

  - type: highlight_card
    order: 4
    data:
      image_position: right
      tag: "Guest favorite"
      title: "Photo-first listings with human details."
      desc: "A calm white canvas, rounded property imagery, and Rausch red actions keep attention on the stay."
      image: "https://images.unsplash.com/photo-1512917774080-9991f1c4c750?auto=format&fit=crop&w=1500&q=86"
      features:
        - text: "Large galleries for every listing"
        - text: "Concise summaries for quick comparison"
        - text: "Clear price, location, and amenity signals"
      primaryBtn: "View the loft"
      primaryLink: "/products/seaside-loft-lisbon/"
      secondaryBtn: "Browse more"
      secondaryLink: "/products/"

  - type: stat_counter
    order: 5
    data:
      title: "A travel brand that feels alive."
      subtitle: "Use compact trust signals instead of loud claims."
      stats:
        - number: 220
          suffix: "+"
          label: "cities with curated homes"
          icon: "map-pin"
        - number: 4.9
          suffix: ""
          label: "average guest rating"
          icon: "star"
        - number: 12
          suffix: "k"
          label: "independent hosts"
          icon: "home"
        - number: 24
          suffix: "/7"
          label: "guest support"
          icon: "message-circle"

  - type: logo_cloud
    order: 6
    data:
      title: "Explore by kind of trip."
      subtitle: "Flexible logo slots work well for destinations, partner marks, or travel categories."
      columns: "5"
      grayscale: "false"
      logos:
        - name: "Beach"
          image: "https://dummyimage.com/240x120/ffffff/222222.png&text=Beach"
          link: "/products/"
        - name: "Cabins"
          image: "https://dummyimage.com/240x120/ffffff/222222.png&text=Cabins"
          link: "/products/"
        - name: "Design"
          image: "https://dummyimage.com/240x120/ffffff/222222.png&text=Design"
          link: "/products/"
        - name: "Food"
          image: "https://dummyimage.com/240x120/ffffff/222222.png&text=Food"
          link: "/portfolio/"
        - name: "Long stays"
          image: "https://dummyimage.com/240x120/ffffff/222222.png&text=Long+stays"
          link: "/products/"

  - type: product_grid
    order: 7
    data:
      dataset: products
      max_items: 4
      title: "Homes guests love"
      subtitle: "Rounded photo cards, useful summaries, and direct paths into each stay."

  - type: data_grid
    order: 8
    data:
      dataset: portfolio
      max_items: 3
      card_layout: image_top
      show_pagination: "false"
      title: "Experiences to book next"

  - type: process_steps
    order: 9
    data:
      title: "From idea to booked."
      subtitle: "A simple three-step journey for guests and hosts."
      direction: horizontal
      step_style: number
      steps:
        - title: "Search"
          desc: "Start with destination, date, guest count, or trip mood."
          icon: "search"
        - title: "Choose"
          desc: "Compare photos, host notes, prices, amenities, and neighborhood context."
          icon: "sliders"
        - title: "Reserve"
          desc: "Send a request, confirm details, and keep support close during the trip."
          icon: "check-circle"

  - type: text_content
    order: 10
    data:
      title: "Designed for repeated browsing."
      subtitle: "The interface should feel useful, not like a campaign page."
      body: "<p>Airbnb-inspired pages work because the product is the place. This template keeps typography compact, actions familiar, and imagery generous so visitors can scan many choices without friction.</p><p>The same structure can support stays, services, destinations, activities, or host-led collections with complete bilingual seed content.</p>"
      text_align: center
      columns: "1"
      inner_width: "820px"

  - type: contact_info
    order: 11
    data:
      title: "Need help choosing?"
      subtitle: "Talk with a Staynest trip specialist before you book."
      phone: "+1 (415) 555-0188"
      email: "hello@staynest.example.com"
      address: "888 Brannan Street, San Francisco, CA 94103"
      show_phone: "true"
      show_email: "true"
      show_address: "true"
      show_business_hours: "true"

  - type: contact_form
    order: 12
    data:
      title: "Ask about a trip."
      subtitle: "Share your destination, dates, and travel style. We will suggest stays that fit."
      form_action: "#"
      submit_text: "Send request"

  - type: item_detail
    order: 13
    data:
      title: "Seaside Loft in Lisbon"
      tags: "Ocean view, 2 guests, Guest favorite"
      desc: "A bright apartment above tiled streets with morning light, a compact kitchen, and an easy walk to cafes, viewpoints, and the waterfront."
      images:
        - url: "https://images.unsplash.com/photo-1505693416388-ac5ce068fe85?auto=format&fit=crop&w=1400&q=86"
        - url: "https://images.unsplash.com/photo-1522708323590-d24dbb6b0267?auto=format&fit=crop&w=1400&q=86"
        - url: "https://images.unsplash.com/photo-1484154218962-a197022b5858?auto=format&fit=crop&w=1400&q=86"
      specs:
        - name: "Guests"
          value: "2 guests"
        - name: "Bedrooms"
          value: "1 bedroom"
        - name: "Rating"
          value: "4.96 from 128 reviews"

  - type: item_data
    order: 14
    data:
      title: "Structured stay data"
      category: "Listing dataset"
      summary: "A compact detail panel for stays, experiences, destinations, and service records."
      meta_label: "Nightly rate"
      price: "$214 night"
      tags:
        - "Ocean view"
        - "Self check-in"
        - "Hosted stay"
      specs:
        - name: "Primary dataset"
          value: "products.yaml"
        - name: "Detail fields"
          value: "Images, tags, amenities, rate"
        - name: "Languages"
          value: "English and Simplified Chinese"
