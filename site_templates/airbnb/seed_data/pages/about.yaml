title: "About Staynest"
description: "A marketplace for homes and experiences with host care at the center."
modules:
  - type: section_title
    order: 1
    data:
      tag: "About"
      title: "Travel works better when the stay feels personal."
      desc: "Staynest connects guests with curated homes, local experiences, and service teams that keep the trip simple from search to checkout."
      btn_text: "Browse homes"
      btn_url: "/products/"
  - type: highlight_card
    order: 2
    data:
      image_position: left
      tag: "Host care"
      title: "We design around confidence."
      desc: "Every listing should answer the questions guests ask first: where it is, what it feels like, what is included, and who is there to help."
      image: "https://images.unsplash.com/photo-1513694203232-719a280e022f?auto=format&fit=crop&w=1500&q=86"
      features:
        - text: "Verified listing content"
        - text: "Local support before and during trips"
        - text: "Clear expectations for every stay"
      primaryBtn: "Meet the homes"
      primaryLink: "/products/"
      secondaryBtn: "Read stories"
      secondaryLink: "/posts/"
  - type: stat_counter
    order: 3
    data:
      title: "Built for guests and hosts."
      subtitle: "A balanced marketplace needs trust on both sides."
      stats:
        - number: 98
          suffix: "%"
          label: "host response rate"
          icon: "message-circle"
        - number: 36
          suffix: "hr"
          label: "average request window"
          icon: "clock"
        - number: 42
          suffix: "%"
          label: "repeat guest share"
          icon: "heart"
        - number: 18
          suffix: ""
          label: "local service partners"
          icon: "users"
