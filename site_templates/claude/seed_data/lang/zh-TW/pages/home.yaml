title: 首頁
description: Nova AI 模板預覽，包含完整模組、圖片、資料集和繁體中文內容。
modules:
- type: hero_banner
  variant: null
  order: 1
  data:
    slides:
    - type: image
      media: /static/img/hero-collaboration.svg
      title: 遇見你的思考夥伴
      subtitle: Nova AI 將進階推理、程式碼生成與創意協作整合到一個專注的產品體驗中。
      primaryBtn: 試用 Nova
      primaryBtnLink: /pricing/
      secondaryBtn: 瞭解更多
      secondaryBtnLink: /about/
    - type: image
      media: /static/img/hero-agents.svg
      title: 打造真正有用的 AI 智慧代理
      subtitle: 把模型、工具、評測與人工複核串接成團隊可以信任的工作流程。
      primaryBtn: 檢視產品
      primaryBtnLink: /products/
      secondaryBtn: 檢視案例
      secondaryBtnLink: /portfolio/
- type: section_title
  variant: null
  order: 2
  data:
    tag: 平台
    title: 面向真實工作的模型家族
    desc: 為每一種工作流程選擇合適的智慧程度、回應速度與治理能力。
    btn_text: 檢視產品
    btn_url: /products/
- type: feature_grid
  variant: null
  order: 3
  data:
    title: Nova 能做什麼
    subtitle: 為產品團隊、開發者與企業營運場景設計的 AI 能力。
    features:
    - icon: brain
      title: 進階推理
      desc: 處理複雜分析、多步驟規劃和需要細緻判斷的決策。
    - icon: code
      title: 程式碼生成
      desc: 在現代技術棧中生成、除錯和重構生產代碼。
    - icon: eye
      title: 多模態理解
      desc: 同時理解圖片、文件、圖表、截圖和文字內容。
- type: data_grid
  variant: null
  order: 4
  data:
    title: 產品
    dataset: products
    max_items: 12
    show_filters: 'true'
    show_pagination: 'true'
    pagination_style: load_more
    items_per_page: '3'
    pager_align: center
- type: data_grid
  variant: null
  order: 5
  data:
    dataset: posts
    max_items: 6
    card_layout: image_top
    show_pagination: 'true'
    pagination_style: page_numbers
    items_per_page: '3'
    pager_align: center
    title: 最新文章
- type: highlight_card
  variant: null
  order: 6
  data:
    image_position: left
    tag: Nova Code
    title: 會與你一起思考的編輯器
    desc: 借助理解程式碼倉庫與開發流程的 AI，更快編寫、偵錯並交付生產程式碼。
    image: /static/img/highlight-code.svg
    features:
    - text: 理解代碼仓库上下文的建议
    - text: 用自然語言實现功能
    - text: 支持測試、重構和文件補全
    primaryBtn: 試用 Nova Code
    primaryLink: '#'
    secondaryBtn: 閱讀文件
    secondaryLink: '#'
    btn_bg: '#cc785c'
- type: stat_counter
  variant: null
  order: 7
  data:
    title: 關鍵數據
    subtitle: 為需要穩定、可治理 AI 能力的團隊而打造。
    stats:
    - number: 500
      suffix: K+
      label: 活躍開發者
      icon: users
    - number: 99
      suffix: .9%
      label: 可用性 SLA
      icon: check-circle
    - number: 90
      suffix: +
      label: 支援語言
      icon: globe
    - number: 3
      suffix: x
      label: 交付加速
      icon: zap
- type: process_steps
  variant: null
  order: 8
  data:
    title: 從想法到生產
    subtitle: 團隊導入 AI 工作流程的一條務實路徑。
    steps:
    - icon: search
      title: 梳理工作流
      desc: 識別高價值任務、风险、資料来源和成功指標。
    - icon: settings
      title: 安全原型驗證
      desc: 用代表性样本測試提示词、工具調用和模型選擇。
    - icon: rocket
      title: 上線並持續監控
      desc: 結合評測、日志、預算控制和反馈閉環完成發布。
- type: logo_cloud
  variant: null
  order: 9
  data:
    title: 受到產品團隊信任
    subtitle: Claude 模板中的示例合作夥伴展示牆。
    logos:
    - name: Northstar
      image: /static/img/logo-northstar.svg
    - name: Helio
      image: /static/img/logo-helio.svg
    - name: SignalForge
      image: /static/img/logo-signalforge.svg
    - name: Atlas Labs
      image: /static/img/logo-atlas.svg
- type: contact_info
  variant: null
  order: 10
  data:
    title: 聯絡團隊
    subtitle: 聯絡方式來自網站設定，可在後台集中維護。
    phone: +1 (415) 555-0172
    email: hello@nova-ai.example.com
    address: 548 Market St, San Francisco, CA 94104
- type: contact_form
  variant: null
  order: 11
  data:
    title: 開始溝通
    subtitle: 告訴我們你正在打造什麼，我們會把需求轉給合適的團隊成員。
    form_action: ''
    show_name: 'true'
    show_email: 'true'
    show_phone: 'true'
    show_company: 'true'
    show_message: 'true'
    show_form: 'true'
    show_map: 'true'
    map_src: https://maps.google.com/maps?hl=en&region=US&q=No.%2015%20Guoze%20Road%2C%20Kunshan%20City%2C%20Jiangsu%2C%20China&t=m&z=10&output=embed&iwloc=near
    layout: form_right
    map_width_ratio: '45'
    map_height: 420px
    submit_text: 傳送訊息
- type: text_content
  variant: null
  order: 12
  data:
    title: 以更平靜的方式打造 AI 產品
    subtitle: 這個模板支援長文內容，而不會把所有敘事都塞進卡片。
    body: <p>Nova AI 面向需要審慎、可檢查 AI 體驗的團隊。你可以用這個內容模組承載產品故事、實作說明、政策解釋或編輯型章節。</p><p>排版保持可讀性，周圍的模組則提供導覽、佐證、資料和轉換入口。</p>
- type: item_detail
  variant: null
  order: 13
  data:
    title: Claude Sonnet
    tags: 均衡, 生產, 通用
    desc: 用於突出產品、案例研究或資料項目的詳情模組。
    images:
    - url: /static/img/product-model.svg
    - url: /static/img/highlight-code.svg
    specs:
    - name: 分類
      value: AI 模型
    - name: 適合場景
      value: 生產工作負載
    - name: 價格
      value: 每百萬輸入 token 起價 $3
- type: item_data
  variant: null
  order: 14
  data:
    tag: 資料
    title: 結構化產品快照
    desc: 用於在列表頁或详情頁展示键值事實的紧凑資料模块。
    fields:
    - label: 資料集
      value: products
    - label: 篩選欄位
      value: category, tags
    - label: 分頁
      value: 共享 data-grid 分頁器
    - label: 可重用
      value: 可以迁移到其它模板中使用
