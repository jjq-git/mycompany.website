- slug: theater-dryice
  title: 大劇院乾冰煙霧系統
  cover: /static/img/product-enterprise.svg
  image: /static/img/product-enterprise.svg
  summary: 為 1200 座劇院安裝永久乾冰煙霧系統，每年服務 80+ 場演出。
  description: 設計隱藏式舞台下方乾冰輸送系統，支援可程式化煙霧密度控制，透過 DMX 協議與燈光控制台聯動。
