  - 互動
- slug: school-lab
  title: 大學實驗室靜音艙交付
  cover: /static/img/case-health.svg
  image: /static/img/case-health.svg
  summary: 為某高校研究中心交付 24 台模組化靜音艙，實現個人專注工作空間。
