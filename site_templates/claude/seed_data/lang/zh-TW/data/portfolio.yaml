- slug: mall-led-2024
  title: 萬達廣場戶外 LED 顯示屏工程
  cover: /static/img/case-design.svg
  image: /static/img/case-design.svg
  summary: 為某大型購物中心設計安裝 120 平方公尺戶外 LED 顯示屏，日夜可視效果出色。
  description: 德恩基為萬達廣場主入口打造了防水等級 IP65 的 P5 LED 顯示牆，完成結構設計、電氣佈線和遠端內容管理系統全流程。
  date: '2024-11-20'
  tags:
  - LED
  - 商業
  - 戶外
- slug: museum-2024
  title: 市博物館互動展覽設計
  cover: /static/img/case-migration.svg
  image: /static/img/case-migration.svg
  summary: 為 3000 平方公尺歷史博物館改造提供客製展示櫃和互動查詢機。
  description: 涵蓋展示櫃、多媒體互動終端、燈光系統和導覽標識的全套展覽設計服務，覆蓋六個常設展廳。
  date: '2024-08-15'
  tags:
