title: "首页"
description: "Nova AI 模板预览，包含完整模块、图片、数据集和中文内容。"
modules:
  - type: hero_banner
    variant: null
    order: 1
    data:
      slides:
        - type: image
          media: "/static/img/hero-collaboration.svg"
          title: "遇见你的思考伙伴"
          subtitle: "Nova AI 将高级推理、代码生成和创意协作整合到一个清晰、可靠的产品体验中。"
          primaryBtn: "试用 Nova"
          primaryBtnLink: "/pricing/"
          secondaryBtn: "了解更多"
          secondaryBtnLink: "/about/"
        - type: image
          media: "/static/img/hero-agents.svg"
          title: "构建真正可用的 AI 智能体"
          subtitle: "把模型、工具、评估和人工复核连接成团队可以信任的工作流。"
          primaryBtn: "查看产品"
          primaryBtnLink: "/products/"
          secondaryBtn: "查看案例"
          secondaryBtnLink: "/portfolio/"

  - type: section_title
    variant: null
    order: 2
    data:
      tag: "平台"
      title: "一个模型家族，覆盖真实工作"
      desc: "为每个工作流选择合适的智能水平、速度和治理能力。"
      btn_text: "查看产品"
      btn_url: "/products/"

  - type: feature_grid
    variant: null
    order: 3
    data:
      title: "Nova 能做什么"
      subtitle: "面向产品团队、开发者和企业运营者的核心能力。"
      features:
        - icon: "brain"
          title: "高级推理"
          desc: "处理复杂分析、多步骤计划和需要细致判断的任务。"
        - icon: "code"
          title: "代码生成"
          desc: "在现代技术栈中生成、调试和重构生产代码。"
        - icon: "eye"
          title: "多模态理解"
          desc: "同时理解图片、文档、图表、截图和文本。"

  - type: product_grid
    variant: null
    order: 4
    data:
      title: "产品"
      dataset: products
      max_items: 12
      show_filters: "true"
      show_pagination: "true"
      pagination_style: "load_more"
      items_per_page: "3"
      pager_align: "center"

  - type: data_grid
    variant: null
    order: 5
    data:
      dataset: posts
      max_items: 6
      card_layout: image_top
      show_pagination: "true"
      pagination_style: "page_numbers"
      items_per_page: "3"
      pager_align: "center"
      title: "最新文章"

  - type: highlight_card
    variant: null
    order: 6
    data:
      image_position: left
      tag: "Nova Code"
      title: "和你一起思考的编辑器"
      desc: "让 AI 理解你的代码库和开发流程，帮助你更快编写、调试和交付生产代码。"
      image: "/static/img/highlight-code.svg"
      features:
        - text: "理解代码库上下文的建议"
        - text: "用自然语言描述功能并生成实现"
        - text: "支持测试、重构和文档补全"
      primaryBtn: "试用 Nova Code"
      primaryLink: "#"
      secondaryBtn: "阅读文档"
      secondaryLink: "#"
      btn_bg: "#cc785c"

  - type: stat_counter
    variant: null
    order: 7
    data:
      title: "关键数字"
      subtitle: "为需要稳定 AI 能力的团队而构建。"
      stats:
        - number: 500
          suffix: "K+"
          label: "活跃开发者"
          icon: "users"
        - number: 99
          suffix: ".9%"
          label: "可用性 SLA"
          icon: "check-circle"
        - number: 90
          suffix: "+"
          label: "支持语言"
          icon: "globe"
        - number: 3
          suffix: "x"
          label: "交付效率提升"
          icon: "zap"

  - type: process_steps
    variant: null
    order: 8
    data:
      title: "从想法到生产"
      subtitle: "团队采用 AI 工作流的一条实用路径。"
      steps:
        - icon: "search"
          title: "梳理工作流"
          desc: "识别高价值任务、风险、数据来源和成功指标。"
        - icon: "settings"
          title: "安全原型"
          desc: "用代表性样本测试提示词、工具和模型选择。"
        - icon: "rocket"
          title: "上线并监控"
          desc: "带着评估、日志、预算控制和反馈回路发布。"

  - type: logo_cloud
    variant: null
    order: 9
    data:
      title: "被产品团队信任"
      subtitle: "Claude 模板中的示例合作伙伴墙。"
      logos:
        - name: "Northstar"
          image: "/static/img/logo-northstar.svg"
        - name: "Helio"
          image: "/static/img/logo-helio.svg"
        - name: "SignalForge"
          image: "/static/img/logo-signalforge.svg"
        - name: "Atlas Labs"
          image: "/static/img/logo-atlas.svg"

  - type: contact_info
    variant: null
    order: 10
    data:
      title: "联系团队"
      subtitle: "联系方式来自站点设置，可在后台集中编辑。"
      phone: "+1 (415) 555-0172"
      email: "hello@nova-ai.example.com"
      address: "548 Market St, San Francisco, CA 94104"

  - type: contact_form
    variant: null
    order: 11
    data:
      title: "开始沟通"
      subtitle: "告诉我们你在构建什么，我们会把消息转给合适的团队。"
      form_action: ""
      show_name: "true"
      show_email: "true"
      show_phone: "true"
      show_company: "true"
      show_message: "true"
      show_form: "true"
      submit_text: "发送消息"

  - type: text_content
    variant: null
    order: 12
    data:
      title: "一种更从容的 AI 构建方式"
      subtitle: "这个模板支持长文内容，不必把所有信息都塞进卡片。"
      body: "<p>Nova AI 面向需要可理解、可检查 AI 体验的团队。你可以用这个内容模块展示产品故事、实施说明、政策解释或编辑型内容。</p><p>周围的模块负责导航、证明、数据和转化，正文区域保持阅读舒适。</p>"

  - type: item_detail
    variant: null
    order: 13
    data:
      title: "Claude Sonnet"
      tags: "均衡, 生产, 通用"
      desc: "用于展示重点产品、案例或数据条目的详情模块。"
      images:
        - url: "/static/img/product-model.svg"
        - url: "/static/img/highlight-code.svg"
      specs:
        - name: "分类"
          value: "AI 模型"
        - name: "适合场景"
          value: "生产工作负载"
        - name: "价格"
          value: "每百万输入 token 起价 $3"

  - type: item_data
    variant: null
    order: 14
    data:
      tag: "数据"
      title: "结构化产品快照"
      desc: "用于列表页或详情页展示关键字段的紧凑数据模块。"
      fields:
        - label: "数据集"
          value: "products"
        - label: "筛选字段"
          value: "category, tags"
        - label: "分页"
          value: "共享 data-grid 分页器"
        - label: "复用性"
          value: "可迁移到其他模板"
