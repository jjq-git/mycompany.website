title: 首页
description: 昆山德恩基电子科技有限公司 — 专业静音仓、干冰机、展示道具制造商。
modules:
- type: hero_banner
  variant: default
  order: 1
  data:
    slides:
    - image: /assets/uploads/hero_banner-image-1-20260610064955-08ec0517.webp
      title: '专业电子制造

        与展示解决方案'
      subtitle: 静音仓 · 干冰机 · 展示道具 — 自 2010 年起为亚洲品牌和场馆提供服务。
      primaryBtn: 查看产品
      primaryBtnLink: /products/
      secondaryBtn: 项目案例
      secondaryBtnLink: /portfolio/
    - image: /assets/uploads/hero_banner-image-2-20260610110813-e7b6f061.webp
      title: '从设计到交付

        — 我们全程负责'
      subtitle: 自有研发、模块化生产、现场支持，为商业展示和舞台设备项目提供一站式服务。
      primaryBtn: 了解更多
      primaryBtnLink: /about/
      secondaryBtn: 联系我们
      secondaryBtnLink: /contact/
- type: section_title
  variant: default
  order: 2
  data:
    tag: 关于德恩基
    title: 展示、隔音、舞台 — 一站式解决方案
    desc: 从零售展示道具到专业舞台设备，我们提供从制造到安装的全流程服务。
    btn_text: 了解我们
    btn_url: /about/
- type: feature_grid
  variant: default
  order: 3
  data:
    title: 为什么选择德恩基
    subtitle: 十余年行业经验，服务品牌、场馆和机构客户。
    features:
    - icon: settings
      title: 自主制造
      desc: 5000 平方米昆山工厂，全流程品控，交期成本可控。
    - icon: check-circle
      title: 认证品质
      desc: ISO 9001 认证流程，CE/RoHS 合规材料，满足国际市场标准。
    - icon: truck
      title: 全球物流
      desc: 出口级包装与物流体系，覆盖亚欧美 20 余个国家和地区。
- type: data_grid
  variant: default
  order: 4
  data:
    title: 产品线
    dataset: products
    max_items: 12
    show_filters: 'true'
    show_pagination: 'true'
    pagination_style: load_more
    items_per_page: '6'
    pager_align: center
- type: data_grid
  variant: default
  order: 5
  data:
    dataset: portfolio
    max_items: 6
    show_pagination: 'true'
    pagination_style: load_more
    items_per_page: '3'
    pager_align: center
    title: 近期项目
- type: highlight_card
  variant: default
  order: 6
  data:
    image_position: left
    tag: 静音仓
    title: 在任何空间创建安静角落
    desc: 模块化隔音舱，数小时即可组装完成 — 适合开放办公区、录音室和客服中心。
    image: /static/img/highlight-code.svg
    features:
    - text: 隔音 ≥30dB，经第三方检测认证
    - text: 内置通风、照明和电源系统
    - text: 支持定制尺寸、颜色和内饰
    primaryBtn: 了解详情
    primaryLink: /products/silent-booth/
    secondaryBtn: 全部产品
    secondaryLink: /products/
    btn_bg: '#067a7a'
- type: stat_counter
  variant: default
  order: 7
  data:
    title: 德恩基数据一览
    subtitle: 服务超过 500 家客户，跨行业跨区域。
    stats:
    - number: 14
      suffix: +
      label: 行业经验(年)
      icon: clock
    - number: 500
      suffix: +
      label: 完成项目
      icon: check-circle
    - number: 5000
      suffix: ㎡
      label: 工厂面积
      icon: home
    - number: 20
      suffix: +
      label: 出口国家
      icon: globe
- type: process_steps
  variant: default
  order: 8
  data:
    title: 合作流程
    subtitle: 从需求咨询到售后支持，全程透明高效。
    steps:
    - icon: mail
      title: 需求沟通
      desc: 告诉我们您的需求 — 48 小时内提供设计方案、材料选项和报价。
    - icon: edit
      title: 设计打样
      desc: 工程团队出具 3D 效果图并制作实物样品，确认后进入量产。
    - icon: package
      title: 生产交付
      desc: 全流程品控、出口级包装，灵活选择海运、空运或铁路运输。
- type: logo_cloud
  variant: default
  order: 9
  data:
    title: 合作客户
    subtitle: 以下是我们服务过的部分品牌和机构。
    logos:
    - name: 万达集团
      image: /static/img/logo-northstar.svg
    - name: 中国移动
      image: /static/img/logo-helio.svg
    - name: 华为
      image: /static/img/logo-signalforge.svg
    - name: 苏宁
      image: /static/img/logo-atlas.svg
- type: data_grid
  variant: default
  order: 10
  data:
    dataset: posts
    max_items: 6
    card_layout: image_top
    show_pagination: 'true'
    pagination_style: page_numbers
    items_per_page: '3'
    pager_align: center
    title: 新闻动态
- type: contact_info
  variant: default
  order: 11
  data:
    title: 联系我们
    subtitle: 联系方式由站点设置统一管理，可在后台集中维护。
    phone: 0512-57721234
    email: info@dengtec.com
    address: 江苏省昆山市国泽路15号
- type: contact_form
  variant: default
  order: 12
