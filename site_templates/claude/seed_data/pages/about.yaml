title: "About"
description: "Learn how Nova AI builds calm, useful, and secure AI products."
modules:
  - type: section_title
    variant: null
    order: 1
    data:
      tag: "About Us"
      title: "Building the future of human-AI collaboration"
      desc: "We believe AI should be a partner in thinking, not a replacement for it. That belief shapes every product decision we make."
      btn_text: ""
      btn_url: ""

  - type: text_content
    variant: null
    order: 2
    data:
      title: "Our Story"
      subtitle: "Founded with a simple mission"
      body: "<p>Nova AI was founded by researchers and engineers who believe the best AI amplifies human judgment. Raw capability matters, but the experience around that capability matters just as much: speed, reliability, safety, and genuine usefulness in everyday work.</p><p>Today, Nova supports product teams, developers, and enterprise operators building AI into real workflows. Our work centers on trustworthy defaults, clear controls, and measurable outcomes.</p>"

  - type: highlight_card
    variant: null
    order: 3
    data:
      image_position: right
      tag: "Operating Principles"
      title: "Designed for trust and momentum"
      desc: "Every product decision starts with a practical question: will this help a team move faster while staying in control?"
      image: "/static/img/highlight-enterprise.svg"
      features:
        - text: "Human review paths for high-impact actions"
        - text: "Evaluation workflows before and after launch"
        - text: "Clear controls for data, permissions, and cost"
      primaryBtn: "See Products"
      primaryLink: "/products/"
      secondaryBtn: "Contact Us"
      secondaryLink: "/contact/"

  - type: stat_counter
    variant: null
    order: 4
    data:
      title: "A small team with global reach"
      subtitle: "The numbers here are seed data for the template preview."
      stats:
        - number: 50
          suffix: "+"
          label: "Team Members"
          icon: "users"
        - number: 7
          suffix: ""
          label: "Products"
          icon: "cpu"
        - number: 12
          suffix: ""
          label: "Countries"
          icon: "map-pin"

  - type: process_steps
    variant: null
    order: 5
    data:
      title: "How We Work"
      subtitle: "Our approach to building AI that serves people."
      steps:
        - icon: "search"
          title: "Research"
          desc: "Understand the workflow, risk, and measurable user outcome before writing code."
        - icon: "pen-tool"
          title: "Design"
          desc: "Create calm, inspectable interfaces with clear handoffs and reversible actions."
        - icon: "rocket"
          title: "Ship and learn"
          desc: "Launch with evaluations, monitoring, and feedback loops that improve the system."
