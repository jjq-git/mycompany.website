    data:
      title: "Our Story"
      subtitle: "Founded in 2024 with a simple mission"
      body: "<p>Nova AI was founded by a team of researchers and engineers who believed that the best AI isn't the one that replaces human thinking — it's the one that amplifies it.</p><p>We started with a simple observation: the most powerful AI models were becoming commodities. What mattered wasn't just raw capability — it was how that capability was delivered. Speed, reliability, safety, and genuine usefulness in everyday work.</p><p>Today, Nova powers millions of interactions daily — from solo developers debugging at 2am to enterprise teams shipping production code at scale. Our models are among the most trusted in the industry for their safety, reliability, and thoughtful design.</p>"

