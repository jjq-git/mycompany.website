title: Home
description: Kunshan Dengtec Electronic Technology — professional manufacturer of silent booths, dry ice machines, and display
  props.
modules:
- type: hero_banner
  variant: default
  order: 1
  data:
    slides:
    - image: /assets/uploads/hero_banner-image-1-20260610064955-08ec0517.webp
      title: 'Professional Electronic Manufacturing

        & Display Solutions'
      subtitle: Silent booths, dry ice machines, display props — serving brands and venues across Asia since 2010.
      primaryBtn: Explore Products
      primaryBtnLink: /products/
      secondaryBtn: View Projects
      secondaryBtnLink: /portfolio/
    - image: /assets/uploads/hero_banner-image-2-20260610111617-4e02be9e.webp
      title: 'From Design to Installation

        — We Deliver'
      subtitle: In-house R&D, modular production, and on-site support for commercial display and stage equipment projects.
      primaryBtn: Learn More
      primaryBtnLink: /about/
      secondaryBtn: Contact Us
      secondaryBtnLink: /contact/
- type: section_title
  variant: default
  order: 2
  data:
    tag: About Dengtec
    title: One Partner for Display, Sound, and Stage
    desc: From retail display fixtures to professional stage equipment, we provide end-to-end manufacturing and installation
      services.
    btn_text: About Us
    btn_url: /about/
- type: feature_grid
  variant: default
  order: 3
  data:
    title: Why Choose Dengtec
    subtitle: Over a decade of experience serving brands, venues, and institutions.
    features:
    - icon: settings
      title: In-House Manufacturing
      desc: Full control over quality, timeline, and cost with our 5,000sqm factory in Kunshan.
    - icon: check-circle
      title: Certified Quality
      desc: ISO 9001 certified processes, CE/RoHS compliant materials for international markets.
    - icon: truck
      title: Global Shipping
      desc: Export-ready packaging and logistics to over 20 countries across Asia, Europe, and the Americas.
- type: data_grid
  variant: default
  order: 4
  data:
    title: Product Lines
    dataset: products
    max_items: 12
    show_filters: 'true'
    show_pagination: 'true'
    pagination_style: load_more
    items_per_page: '6'
    pager_align: center
- type: data_grid
  variant: default
  order: 5
  data:
    dataset: portfolio
    max_items: 6
    show_pagination: 'true'
    pagination_style: load_more
    items_per_page: '3'
    pager_align: center
    title: Recent Projects
- type: highlight_card
  variant: default
  order: 6
  data:
    image_position: left
    tag: Silent Booth
    title: Create quiet spaces anywhere
    desc: Modular soundproof pods that assemble in hours — ideal for open offices, recording studios, and call centers.
    image: /static/img/highlight-code.svg
    features:
    - text: Noise reduction ≥30dB, independently tested
    - text: Ventilation, lighting, and power built in
    - text: Custom sizes, colors, and interior finishes
    primaryBtn: Learn More
    primaryLink: /products/silent-booth/
    secondaryBtn: View All Products
    secondaryLink: /products/
    btn_bg: '#067a7a'
- type: stat_counter
  variant: default
  order: 7
  data:
    title: Dengtec by the Numbers
    subtitle: Trusted by over 500 clients across industries and regions.
    stats:
    - number: 14
      suffix: +
      label: Years Experience
      icon: clock
    - number: 500
      suffix: +
      label: Completed Projects
      icon: check-circle
    - number: 5000
      suffix: sqm
      label: Factory Area
      icon: home
    - number: 20
      suffix: +
      label: Export Countries
      icon: globe
- type: process_steps
  variant: default
  order: 8
  data:
    title: How We Work
    subtitle: A transparent process from inquiry to after-sales support.
    steps:
    - icon: mail
      title: Consultation
      desc: Share your requirements — we provide design suggestions, material options, and a quote within 48 hours.
    - icon: edit
      title: Design & Prototype
      desc: Our engineering team creates 3D renders and a physical sample for your approval before mass production.
    - icon: package
      title: Production & Delivery
      desc: Rigorous QC at every stage, export-grade packaging, and flexible shipping by sea, air, or rail.
