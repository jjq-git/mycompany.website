# 首页模块: 演示奶油 → 深色节奏
modules:
  - type: hero_banner
    variant: null
    order: 1
    data:
      slides:
        - type: image
          media: ""
          title: "Meet your thinking partner"
          subtitle: "Nova AI brings together advanced reasoning, code generation, and creative collaboration — all in one warm, human-centered experience."
          primaryBtn: "Try Nova"
          primaryBtnLink: "/pricing/"
          secondaryBtn: "Learn More"
          secondaryBtnLink: "/about/"

  - type: feature_grid
    variant: null
    order: 2
    data:
      title: "What Nova can do"
      subtitle: "Purpose-built models for every task, from creative writing to enterprise-grade code generation."
      features:
        - icon: "brain"
          title: "Advanced Reasoning"
          desc: "Tackle complex analysis, multi-step planning, and nuanced decision-making with state-of-the-art reasoning capabilities."
        - icon: "code"
          title: "Code Generation"
          desc: "Generate, debug, and refactor production-quality code across dozens of languages and frameworks."
        - icon: "eye"
          title: "Multimodal Understanding"
          desc: "Process images, documents, and text together — extract insights from PDFs, analyze charts, and describe visual content."
        - icon: "shield"
          title: "Enterprise Security"
          desc: "SOC 2 compliant, data encryption at rest and in transit, zero data retention for API customers."
        - icon: "zap"
          title: "Lightning Fast"
          desc: "Sub-second response times for real-time applications. Haiku delivers speed without sacrificing quality."
        - icon: "globe"
          title: "Multilingual"
          desc: "Fluent in 90+ languages with native-level understanding of cultural context and nuance."

  - type: highlight_card
    variant: null
    order: 3
    data:
      image_position: left
      tag: "Nova Code"
      title: "The editor that thinks with you"
      desc: "Write, debug, and ship production code faster with AI that understands your entire codebase. Nova Code runs natively in your terminal and IDE."
      image: ""
      features:
        - text: "Full codebase understanding with context-aware suggestions"
        - text: "Generate entire features from plain-English descriptions"
        - text: "Automated testing, refactoring, and documentation"
      primaryBtn: "Try Nova Code"
      primaryLink: "#"
      secondaryBtn: "Read Docs"
      secondaryLink: "#"
      btn_bg: "#cc785c"
      text_bg: ""

  - type: stat_counter
    variant: null
    order: 4
    data:
      title: "By the numbers"
      subtitle: "Trusted by developers and enterprises worldwide"
      stats:
        - number: 500
          suffix: "K+"
          label: "Active Developers"
          icon: "users"
        - number: 99
          suffix: ".9%"
          label: "Uptime SLA"
          icon: "check-circle"
        - number: 90
          suffix: "+"
          label: "Languages Supported"
          icon: "globe"
        - number: 3
          suffix: "x"
          label: "Faster Development"
          icon: "zap"

  - type: data_grid
    variant: null
    order: 5
    data:
      dataset: posts
      max_items: 3
      card_layout: image_top
      show_pagination: "false"
      title: "Latest from the blog"

  - type: highlight_card
    variant: null
    order: 6
    data:
      image_position: right
      tag: ""
      title: "Start building with Nova today"
      desc: "From solo developers to Fortune 500 teams, Nova scales with you. Pay only for what you use — no monthly minimums, no hidden fees."
      image: ""
      features: []
      primaryBtn: "Get Started Free"
      primaryLink: "/pricing/"
      secondaryBtn: ""
      secondaryLink: ""
      btn_bg: "#252320"
      text_bg: "#cc785c"
      text_color: "#ffffff"
