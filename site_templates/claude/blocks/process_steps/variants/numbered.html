<!-- Process Steps — Numbered Variant: CSS counter 自增编号 -->
<section data-name="process_steps" data-type="group" data-hideable class="section surface-canvas">
  <div class="container">
    <div class="section-header">
      <h2 data-name="title" data-type="text" class="section-header__title"></h2>
      <p data-name="subtitle" data-type="text" class="section-header__desc"></p>
    </div>
    <div data-name="steps" data-type="list" class="process-track process-track--numbered">
      <div data-name="step" data-type="group" class="process-step">
        <div class="process-marker process-marker--numbered">
          <span class="process-number"></span>
        </div>
        <h3 data-name="title" data-type="text" class="text-title-sm text-ink mb-xs"></h3>
        <p data-name="desc" data-type="text" class="text-body-sm text-muted"></p>
      </div>
    </div>
  </div>
</section>
