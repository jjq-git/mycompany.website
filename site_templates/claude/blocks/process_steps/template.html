<!-- Process Steps - Claude 风格: 水平步骤条, 衬线编号 -->
<section data-name="process_steps" data-type="group" data-hideable class="section surface-canvas">
  <div class="container">
    <h2 data-name="title" data-type="text" class="section-header__title text-center mb-sm"></h2>
    <p data-name="subtitle" data-type="text" class="section-header__desc mb-xl"></p>
    <div data-name="steps" data-type="list" class="process-track">
      <div data-name="step" data-type="group" class="process-step">
        <div class="process-marker">
          <span data-name="icon" data-type="icon" class="process-icon"></span>
          <span class="process-number"></span>
        </div>
        <div class="process-text">
          <h4 data-name="title" data-type="text" class="text-title-sm text-ink mb-xs"></h4>
          <p data-name="desc" data-type="textarea" class="text-body-sm text-muted"></p>
        </div>
      </div>
    </div>
  </div>
</section>
