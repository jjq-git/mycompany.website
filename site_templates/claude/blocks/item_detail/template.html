<!-- Item Detail - Claude 风格: 双栏详情展示 -->
<section data-name="item_detail" data-type="group" data-hideable class="section surface-canvas">
  <div class="container">
    <div class="detail-grid">
      <div class="detail-gallery">
        <div data-name="images" data-type="list" class="detail-images">
          <img data-name="url" data-type="image" src="" alt="" loading="lazy" class="detail-gallery-img">
        </div>
      </div>
      <div class="detail-info">
        <h1 data-name="title" data-type="text" class="text-display-md text-ink mb-sm"></h1>
        <div data-name="tags" data-type="text" class="detail-tags mb-md"></div>
        <p data-name="desc" data-type="textarea" class="text-body-md text-body mb-lg"></p>
        <div data-name="specs" data-type="list" class="detail-specs">
          <div data-name="spec" data-type="group" class="detail-spec-row flex justify-between">
            <span data-name="name" data-type="text" class="text-body-sm text-muted"></span>
            <span data-name="value" data-type="text" class="text-body-sm text-body-strong"></span>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
