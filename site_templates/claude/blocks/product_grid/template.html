<!-- Product Grid - Claude 风格: 产品卡片网格 -->
<section data-name="product_grid" data-type="group" data-hideable class="section surface-canvas">
  <div class="container">
    <div class="section-header">
      <h2 data-name="title" data-type="text" class="section-header__title">Products</h2>
    </div>
    <div data-name="items" data-type="list" data-source="products" data-page-size="6" class="dg-list grid grid--3">
      <a data-name="item" data-type="group" data-href-template="{base_url}/{lang}/products/{slug}/" class="dg-card card-feature">
        <div class="dg-card-image">
          <img data-name="cover" data-fallback="image" data-type="image" src="" alt="" loading="lazy" class="dg-card-img">
          <span data-name="category" data-type="text" class="badge badge-pill dg-card-category"></span>
        </div>
        <div class="dg-card-body">
          <h3 data-name="name" data-fallback="title" data-type="text" class="text-title-sm text-ink mb-xs"></h3>
          <p data-name="summary" data-fallback="description" data-type="text" class="text-body-sm text-muted"></p>
        </div>
      </a>
    </div>
    <div class="text-center mt-xl">
      <a data-href-template="{base_url}/{lang}/products/" class="btn btn-secondary">View All Products</a>
    </div>
  </div>
</section>
