name: Product Grid
category: data
icon: product_grid.svg
description: Render product cards from the products dataset, with price, linked filters, and pagination.
fields:
  - key: dataset
    label: Data Source
    type: select
    group: Data
    default: products
    options:
      - value: products
        label: Products
  - key: max_items
    label: Maximum Items
    type: number
    group: Data
    default: 12
  - key: show_filters
    label: Show Filters
    type: select
    group: Filters
    default: "true"
    options:
      - value: "true"
        label: Show
      - value: "false"
        label: Hide
  - key: show_pagination
    label: Show Pagination
    type: select
    group: Pagination
    default: "true"
    options:
      - value: "true"
        label: Show
      - value: "false"
        label: Hide
  - key: pagination_style
    label: Pagination Style
    type: select
    group: Pagination
    default: "load_more"
    options:
      - value: "load_more"
        label: Load More
      - value: "page_numbers"
        label: Page Numbers
  - key: items_per_page
    label: Items Per Page
    type: select
    group: Pagination
    default: "6"
    options:
      - value: "3"
        label: 3 per page
      - value: "4"
        label: 4 per page
      - value: "6"
        label: 6 per page
      - value: "8"
        label: 8 per page
      - value: "10"
        label: 10 per page
      - value: "12"
        label: 12 per page
      - value: "18"
        label: 18 per page
      - value: "24"
        label: 24 per page
  - key: show_view_all
    label: Show View All Button
    type: select
    group: Pagination
    default: "true"
    options:
      - value: "true"
        label: Show
      - value: "false"
        label: Hide
  - key: pager_align
    label: Pager Align
    type: select
    group: Pagination
    default: "center"
    options:
      - value: "left"
        label: Left
      - value: "center"
        label: Center
      - value: "right"
        label: Right
  - key: section_bg
    label: Section Background
    type: color
    group: Outer Style
    default: ""
  - key: outer_width
    label: Outer Width
    type: text
    group: Outer Style
    default: ""
  - key: inner_width
    label: Inner Width
    type: text
    group: Outer Style
    default: ""
  - key: padding_top
    label: Padding Top
    type: text
    group: Outer Style
    default: "1rem"
  - key: padding_right
    label: Padding Right
    type: text
    group: Outer Style
    default: ""
  - key: padding_bottom
    label: Padding Bottom
    type: text
    group: Outer Style
    default: "1rem"
  - key: padding_left
    label: Padding Left
    type: text
    group: Outer Style
    default: ""
  - key: title
    label: Title
    type: text
    group: Content
    default: Products
