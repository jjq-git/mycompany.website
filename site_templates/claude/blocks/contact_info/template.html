<!-- Contact Info - Claude 风格: 图标卡片网格 -->
<section data-name="contact_info" data-type="group" data-hideable class="section surface-canvas">
  <div class="container">
    <h2 data-name="title" data-type="text" class="section-header__title text-center mb-sm"></h2>
    <p data-name="subtitle" data-type="text" class="section-header__desc mb-xl"></p>
    <div class="grid grid--3">
      <div class="card-connector text-center">
        <div class="contact-icon mb-sm">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.8 19.8 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.12 4.2 2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.12.91.33 1.8.62 2.65a2 2 0 0 1-.45 2.11L8 9.76a16 16 0 0 0 6.24 6.24l1.27-1.27a2 2 0 0 1 2.11-.45c.85.29 1.74.5 2.65.62A2 2 0 0 1 22 16.92z"/></svg>
        </div>
        <h4 class="text-title-sm text-ink mb-xs">Phone</h4>
        <p data-from="settings:contact.phone" class="text-body-md text-muted"></p>
      </div>
      <div class="card-connector text-center">
        <div class="contact-icon mb-sm">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
        </div>
        <h4 class="text-title-sm text-ink mb-xs">Email</h4>
        <p data-from="settings:contact.email" class="text-body-md text-muted"></p>
      </div>
      <div class="card-connector text-center">
        <div class="contact-icon mb-sm">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M20 10c0 5-8 12-8 12S4 15 4 10a8 8 0 1 1 16 0z"/><circle cx="12" cy="10" r="3"/></svg>
        </div>
        <h4 class="text-title-sm text-ink mb-xs">Address</h4>
        <p data-from="settings:contact.address" class="text-body-md text-muted"></p>
      </div>
    </div>
  </div>
</section>
