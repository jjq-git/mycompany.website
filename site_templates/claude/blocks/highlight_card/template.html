<!-- 图文卡片模块 - 左/右图文布局（结构对齐 dengtec） -->
<section data-name="highlight_card" data-type="group" data-hideable data-style="dir,bg-color,bg" class="section">
  <div class="container">
    <div class="hl-grid">
      <div data-name="image_area" data-type="group" data-hideable class="hl-image">
        <img data-name="image" data-type="image" data-show-when="media_type:image" src="" alt="" loading="lazy">
        <video data-name="video" data-type="video" data-show-when="media_type:video" src="" controls playsinline preload="metadata"></video>
        <iframe data-name="embed_url" data-type="embed" data-show-when="media_type:embed" src="" title="Embedded content" loading="lazy" allowfullscreen></iframe>
      </div>
      <div data-name="text_area" data-type="group" data-hideable class="hl-text">
        <span data-name="tag" data-type="text" class="hl-tag">模块标签</span>
        <h3 data-name="title" data-type="text" class="hl-title">图文模块标题</h3>
        <p data-name="desc" data-type="textarea" class="hl-desc">这里是图文模块的描述文字，介绍产品或服务的核心卖点。</p>
        <ul data-name="features" data-type="list" class="hl-features">
          <li data-name="text" data-type="text" class="hl-feature">功能点文字</li>
        </ul>
        <div class="hl-actions">
          <a data-name="primaryBtn" data-type="text" data-href="primaryLink" class="hl-btn hl-btn--primary">了解更多</a>
          <a data-name="secondaryBtn" data-type="text" data-href="secondaryLink" class="hl-btn hl-btn--secondary">联系我们</a>
        </div>
      </div>
    </div>
  </div>
</section>
