<!-- Section Title - Claude 风格: 居中, 可选珊瑚 badge-pill -->
<section data-name="section_title" data-type="group" data-hideable data-style="bg-color,text-align" class="section surface-canvas">
  <div class="container container--narrow">
    <div class="section-header">
      <span data-name="tag" data-type="text" class="badge badge-coral section-header__tag"></span>
      <h2 data-name="title" data-type="text" class="section-header__title"></h2>
      <p data-name="desc" data-type="textarea" class="section-header__desc"></p>
      <div class="mt-lg">
        <a data-name="btn_text" data-type="text" data-href="btn_url" class="btn btn-primary"></a>
      </div>
    </div>
  </div>
</section>
