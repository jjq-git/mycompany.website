display_name: "Claude - 科技公司·人文编辑风"
industry: technology
description: "暖奶油色画布 + 衬线标题字体 + 珊瑚色CTA + 深海军蓝产品面板。适合 AI 初创公司、SaaS 产品和设计驱动的科技企业。"
cover_image: ""
version: 0.1.0
is_public: true

datasets:
  - products
  - portfolio
  - posts

# 默认菜单 (英文，匹配 Claude 风格导航)
default_menu:
  - {label: Home, type: home}
  - label: Products
    type: list
    target: products
    dropdown_style: horizontal
  - {label: Solutions, type: list, target: portfolio}
  - {label: Pricing, type: page, target: pricing}
  - {label: About, type: page, target: about}
  - {label: Blog, type: list, target: posts}

# Claude 设计系统主题令牌
default_theme:
  # --- 面板 6 色（管理员可改，默认值为 Claude 暖奶油色系） ---
  color-primary: "#cc785c"
  color-bg: "#faf9f5"
  color-surface: "#efe9de"
  color-text: "#141413"
  color-text-secondary: "#6c6a64"
  color-border: "#e6dfd8"
  # --- Typography fallback ---
  font-display: "'Cormorant Garamond', 'EB Garamond', 'Times New Roman', serif"
  font-sans: "'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
  font-mono: "'JetBrains Mono', ui-monospace, monospace"
  # --- Radii ---
  radius-xs: "4px"
  radius-sm: "6px"
  radius-md: "8px"
  radius-lg: "12px"
  radius-xl: "16px"
  radius-pill: "9999px"
  # --- Shadows (minimal per Claude design system) ---
  shadow-sm: "0 1px 2px rgba(20,20,19,0.06)"
  shadow-md: "0 1px 3px rgba(20,20,19,0.08)"
  shadow-lg: "0 2px 8px rgba(20,20,19,0.10)"

# 支持的语言
languages:
  - {code: en, name: English, flag: 🇺🇸}
  - {code: zh-CN, name: "简体中文", flag: 🇨🇳}
default_language: en
