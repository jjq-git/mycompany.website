display_name: "科技公司 / 人文编辑风"
industry: technology
description: "暖奶油色画布、衬线标题、珊瑚色 CTA 和深色产品面板。适合初创公司、SaaS 产品和设计驱动的科技企业。"
cover_image: "/static/template-previews/claude.webp"
version: 0.1.0
is_public: true

datasets:
  - products
  - portfolio
  - posts

default_menu:
  - {label: Home, type: home}
  - label: Products
    type: list
    target: products
  - {label: Solutions, type: list, target: portfolio}
  - {label: Pricing, type: page, target: pricing}
  - {label: About, type: page, target: about}
  - {label: Blog, type: list, target: posts}
  - {label: Contact, type: page, target: contact}

default_theme:
  color-primary: "#cc785c"
  color-bg: "#faf9f5"
  color-surface: "#efe9de"
  color-text: "#141413"
  color-text-secondary: "#6c6a64"
  color-border: "#e6dfd8"
  font-display: "'Cormorant Garamond', 'EB Garamond', 'Times New Roman', serif"
  font-sans: "'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
  font-mono: "'JetBrains Mono', ui-monospace, monospace"
  radius-xs: "4px"
  radius-sm: "6px"
  radius-md: "8px"
  radius-lg: "12px"
  radius-xl: "16px"
  radius-pill: "9999px"
  shadow-sm: "0 1px 2px rgba(20,20,19,0.06)"
  shadow-md: "0 1px 3px rgba(20,20,19,0.08)"
  shadow-lg: "0 2px 8px rgba(20,20,19,0.10)"

languages:
  - {code: zh-CN, name: "简体中文", flag: "CN"}
